/* ===== v2.6 · sistema visual: un juego de tokens y componentes (z-) ===== */
:root{
  --ink:#17181A; --ink2:#565B61; --ink3:#7D838A; --rule:#E4E6E9; --line:#CDD1D6; --line2:#CDD1D6; --rule2:#CDD1D6;
  --bg:#F4F5F6; --paper:#F4F5F6; --card:#FFFFFF; --surface:#FFFFFF; --hover:#F7F8F9;
  --accent:#FD9C10; --accent-soft:#FEF0D8;
  --z-crit:#B3261E; --z-crit-s:#F8E7E5; --z-warn:#9A5B00; --z-warn-s:#FCEFD9; --z-ok:#2E6E5A; --z-ok-s:#E3F1EC;
  --z-info:#2B5C9E; --z-info-s:#E6EEF8; --z-idle:#6A7077; --z-idle-s:#EEF0F2;
  --z-r1:4px; --z-r2:8px; --z-sh:0 12px 32px -12px rgba(23,24,26,.30);
}
.z-tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;line-height:1;padding:4px 8px;border-radius:var(--z-r1);white-space:nowrap}
.z-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.z-tag.crit{background:var(--z-crit-s);color:var(--z-crit)}.z-tag.warn{background:var(--z-warn-s);color:var(--z-warn)}.z-tag.ok{background:var(--z-ok-s);color:var(--z-ok)}
.z-tag.info{background:var(--z-info-s);color:var(--z-info)}.z-tag.idle{background:var(--z-idle-s);color:var(--z-idle)}
.z-tag.out{background:transparent;color:var(--z-crit);box-shadow:inset 0 0 0 1px var(--z-crit)}
.z-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--z-r1);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.z-btn:hover{background:var(--hover)}
.z-btn:focus-visible,.z-cell:focus-visible,.z-nm:focus-visible{outline:2px solid var(--z-info);outline-offset:1px}
.z-btn.pri{background:var(--accent);border-color:var(--accent);color:#17181A;font-weight:600}
.z-btn.pri:hover{background:#F28C00}
.z-btn.q{border-color:transparent;background:transparent;color:var(--z-info)}
.z-btn.dng{border-color:var(--z-crit);color:var(--z-crit)}
.z-btn.sm{height:28px;padding:0 10px;font-size:13px}
.z-btn[disabled]{opacity:.45;cursor:default}
.z-seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--z-r1);overflow:hidden;background:var(--card)}
.z-seg button{height:32px;padding:0 12px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink2);font:inherit;font-size:14px;cursor:pointer}
.z-seg button:last-child{border-right:0}
.z-seg button.on{background:var(--ink);color:#fff;font-weight:600}
.z-in{height:32px;border:1px solid var(--line);border-radius:var(--z-r1);background:#fff;color:var(--ink);font:inherit;font-size:14px;padding:0 8px;min-width:0}
.z-in.n{text-align:right;font-variant-numeric:tabular-nums}
.z-in:focus{outline:2px solid var(--z-info);outline-offset:0;border-color:var(--z-info)}
.z-cap{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}

table.z-t tr.kid td:first-child{padding-left:28px;color:var(--ink2)}

table.z-t td.clk:hover{background:var(--hover)}
table.z-t td.on{box-shadow:inset 0 0 0 2px var(--z-info);background:var(--z-info-s)}
table.z-t .cp b{font-weight:600}
table.z-t .cp small{display:block;font-size:13px;color:var(--ink3);font-weight:400}
.z-nm{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.z-nm:hover b{text-decoration:underline}
.z-cell{background:none;border:0;padding:0;font:inherit;color:inherit;width:100%;text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}

/* tira de cifras */

.z-strip a.z-go{color:inherit;text-decoration:none}.z-strip a.z-go:hover .v{text-decoration:underline}
.z-ages{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--rule);margin:4px 0}

.z-bancos{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 16px;margin:-6px 0 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--z-r2)}

/* panel lateral (cronograma) */
.z-drawer{position:fixed;top:0;right:0;bottom:0;width:580px;max-width:100vw;z-index:80;background:var(--card);border-left:1px solid var(--rule);box-shadow:var(--z-sh);display:flex;flex-direction:column}
