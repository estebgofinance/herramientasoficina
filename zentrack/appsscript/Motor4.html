<style>
/* ===== v0.22 · Precios por grupo y pestaña Sinosure ===== */
.g4wrap{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
@media(max-width:980px){.g4wrap{grid-template-columns:1fr}}
.g4list{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.g4item{padding:12px 14px;border-bottom:1px solid var(--rule);cursor:pointer}
.g4item:last-child{border-bottom:none}
.g4item:hover{background:#FBFBFC}
.g4item.on{background:var(--ink);color:#fff}
.g4item .n{font-size:13px;font-weight:600}
.g4item .m{font-size:11px;color:var(--ink3);margin-top:1px}
.g4item.on .m{color:rgba(255,255,255,.62)}
.g4item .v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;float:right}
.g4card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.g4h{padding:18px 22px;border-bottom:1px solid var(--rule)}
.g4h .t{font-size:18px;font-weight:700;letter-spacing:-.02em}
.g4sec{font-size:10.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;
  padding:14px 22px 8px;background:#FBFBFC;border-bottom:1px solid var(--rule);border-top:1px solid var(--rule)}
.g4b{padding:16px 22px}
.g4grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g4f{display:flex;flex-direction:column;gap:4px;min-width:0}
.g4f label{font-size:11px;color:var(--ink2);font-weight:500}
.g4f input,.g4f select{border:1px solid var(--rule2);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13px;width:100%}
.g4f input:focus,.g4f select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,24,26,.07)}
.g4f input.n{text-align:right;font-variant-numeric:tabular-nums}
.g4f .h{font-size:10.5px;color:var(--ink3);min-height:13px;font-variant-numeric:tabular-nums}
table.g4t{width:100%;border-collapse:collapse}
table.g4t th{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.g4t th.r,table.g4t td.r{text-align:right;font-variant-numeric:tabular-nums}
table.g4t td{padding:9px 10px;border-bottom:1px solid var(--rule);font-size:12.5px;vertical-align:middle}
table.g4t tr:last-child td{border-bottom:none}
table.g4t tr.tt td{background:#FBFBFC;font-weight:700;border-top:1px solid var(--rule2)}
table.g4t input.n{width:104px;border:1px solid var(--rule2);border-radius:6px;padding:4px 7px;font-size:12.5px;
  text-align:right;font-variant-numeric:tabular-nums}
.g4chk{width:15px;height:15px;cursor:pointer;accent-color:#17181A}
.g4tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--rule);color:var(--ink2)}
.g4tag.ok{background:#E7F1EC;color:#2E6E5A} .g4tag.mal{background:var(--danger-soft);color:var(--danger)}
.g4tag.avi{background:var(--accent-soft);color:#8a5300}
.g4em{background:var(--surface);border:1px dashed var(--rule2);border-radius:12px;padding:44px 28px;text-align:center}
.g4em h3{font-size:16px;font-weight:600;margin-bottom:5px}
.g4em p{font-size:13px;color:var(--ink2);max-width:460px;margin:0 auto 16px}
.g4av{font-size:12px;color:#8a5300;background:var(--accent-soft);border:1px solid #F2D9A8;border-radius:9px;
  padding:11px 14px;margin:14px 22px;line-height:1.65}
.g4av b{color:#6b4612}
.g4cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.g4cmp>div{border:1px solid var(--rule);border-radius:9px;padding:11px 13px;background:var(--surface)}
.g4cmp .l{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.g4cmp .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.g4acts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--rule);background:#FBFBFC}

/* --- la hoja Sinosure tal cual --- */
.sncols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:1080px){.sncols{grid-template-columns:1fr}}
.snhoja{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.snht{padding:12px 16px;background:#FBFBFC;border-bottom:1px solid var(--rule);font-size:14px;font-weight:700}
.snht span{float:right;font-size:11px;font-weight:400;color:var(--ink3);padding-top:3px}
table.snt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.snt td{padding:7px 10px;border-bottom:1px solid var(--rule);font-size:12.5px;vertical-align:top}
table.snt td.c{width:42px;color:var(--ink3);font-size:10.5px;font-family:ui-monospace,Menlo,monospace;padding-top:9px}
table.snt td.r{text-align:right;font-weight:600;white-space:nowrap;width:108px}
table.snt td.r.neg{color:var(--danger)}
table.snt td.p{width:40%;font-size:12px;color:var(--ink2)}
table.snt .snm{font-size:10.5px;color:var(--ink3);margin-top:1px;line-height:1.4}
table.snt tr.snzona td{background:#F4F5F6;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink2);padding:7px 10px}
table.snt tr.snzona .snzh{float:right;font-weight:400;text-transform:none;letter-spacing:0;
  font-size:10.5px;color:var(--ink3)}
table.snt tr.sntot td{background:#FBFBFC;font-weight:700;border-top:1px solid var(--rule2)}
table.snt tr.difr td{background:var(--danger-soft)}
table.snt tr.dupr td{background:var(--accent-soft)}
table.snt tr.suelr td{background:var(--accent-soft)}
table.snt tr.falta td{background:#F2F4F7}
.snleyenda{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:10px 0 14px;font-size:11.5px;color:var(--ink2)}
.snleyenda .lg{display:flex;align-items:center;gap:6px}
.snleyenda .lg i{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid var(--rule2)}
.snleyenda i.difr{background:var(--danger-soft)} .snleyenda i.dupr{background:var(--accent-soft)}
.snleyenda i.falta{background:#F2F4F7}
.snsim{padding:12px 16px;border-top:1px solid var(--rule);background:#FBFBFC;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.snsim input{width:118px;border:1px solid var(--rule2);border-radius:7px;padding:5px 9px;font-size:12.5px;
  text-align:right;font-variant-numeric:tabular-nums;background:var(--surface)}
.snsim .simr{font-size:12.5px;color:var(--ink2)}
.snsim .simr b{color:var(--ink)}

/* --- sinosure --- */
.snkpis{display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:24px;flex-wrap:wrap}
.snk{flex:1 1 180px;padding:15px 22px 15px 0;border-right:1px solid var(--rule)}
.snk:last-child{border-right:none} .snk:not(:first-child){padding-left:22px}
.snk .l{font-size:11.5px;color:var(--ink2)}
.snk .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.02em}
.snk .v.mal{color:var(--danger)} .snk .v.ok{color:var(--ok)}
.snk .d{font-size:11.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.sndif{font-variant-numeric:tabular-nums;font-weight:600}
.sndif.mas{color:var(--danger)} .sndif.menos{color:var(--ok)}
.snsel{border:1px solid var(--rule2);border-radius:6px;padding:3px 6px;font-size:11.5px;background:var(--surface)}
.snsel.si{border-color:#B7D4C9;background:#E7F1EC} .snsel.no{border-color:#f0c4c0;background:#fdeceb}
.snfil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
</style>
<script>
/* =========================================================================
   MOTOR 4 · v0.22
   Todo lo nuevo vive aquí para no tener que volver a pegar Motor1/2/3.
   Se engancha reemplazando funciones que ya existen (precioVenta,
   serializeState, applyState, refreshAll), nunca editándolas.
   ========================================================================= */

/* =============== GRUPOS DE PRECIO ===============
   Un grupo es una factura (o una futura factura): varios pedidos bajo UN
   precio total escrito a mano, que se reparte entre ellos. Si un pedido no
   está en ningún grupo, todo sigue exactamente como antes. */
let GPRE=[];
let GSEL=null;
let GQ='';

function gpNuevo(){
  const g={id:'gp'+Date.now().toString(36)+Math.floor(Math.random()*1000),
    nombre:'', cliente:(CLIENTES[0]||''), total:0, base:'costo',
    eqRefs:[], partes:{}, fecha:'', nota:'',
    facNum:null, facTotal:null, facFecha:null};
  GPRE.push(g); GSEL=g.id; pintarPrecios(); guardar4();
  toast('Grupo nuevo · ponle el cliente, el total y marca los pedidos que cubre');
}
const gpDe=id=>GPRE.find(g=>g.id===id);
/* el grupo que cubre a un pedido (un pedido no puede estar en dos) */
const gpDeEq=e=>GPRE.find(g=>(g.eqRefs||[]).indexOf(e.derrame)>=0);
const gpEquipos=g=>EQ.filter(e=>(g.eqRefs||[]).indexOf(e.derrame)>=0);

/* --- el reparto del total entre los pedidos del grupo --- */
function gpPesos(g){
  const eqs=gpEquipos(g);
  if(!eqs.length) return {eqs,pesos:[],aviso:''};
  let pesos, aviso='';
  if(g.base==='equipos') pesos=eqs.map(e=>Math.max(1,+e.qty||1));
  else if(g.base==='manual') pesos=eqs.map(e=>+((g.partes||{})[e.derrame])||0);
  else pesos=eqs.map(e=>+e.cupoMonto||+e.mfgAmt||0);
  const suma=pesos.reduce((s,x)=>s+x,0);
  if(suma<=0){
    pesos=eqs.map(()=>1);
    aviso=g.base==='manual'
      ? 'Todavía no has repartido nada a mano: por ahora se divide en partes iguales.'
      : 'No hay valores para repartir con esa base, así que se divide en partes iguales.';
  }
  const t=pesos.reduce((s,x)=>s+x,0);
  return {eqs, pesos:pesos.map(x=>x/t), aviso};
}
/* cuánto le toca a un pedido del total del grupo */
function gpParte(g,e){
  if(g.base==='manual') return +((g.partes||{})[e.derrame])||0;
  const {eqs,pesos}=gpPesos(g);
  const i=eqs.indexOf(e); if(i<0) return 0;
  const T=+g.total||0;
  /* la última parte absorbe el redondeo para que las partes sumen el total exacto */
  if(i===eqs.length-1){
    let acum=0; for(let k=0;k<eqs.length-1;k++) acum+=Math.round(T*pesos[k]*100)/100;
    return Math.round((T-acum)*100)/100;
  }
  return Math.round(T*pesos[i]*100)/100;
}
const gpRepartido=g=>g.base==='manual'
  ? Object.values(g.partes||{}).reduce((s,x)=>s+(+x||0),0)
  : gpEquipos(g).reduce((s,e)=>s+gpParte(g,e),0);

/* ---- EL ENGANCHE: el precio de venta de un pedido ----
   Si está en un grupo, manda el grupo. Si no, lo de siempre. */
const _precioVentaOrig=precioVenta;
precioVenta=function(e){
  const g=gpDeEq(e);
  if(g) return gpParte(g,e);
  return _precioVentaOrig(e);
};

/* ---- EL ENGANCHE: guardar y recuperar ---- */
const _serOrig=serializeState;
serializeState=function(){
  const o=JSON.parse(_serOrig());
  o.GPRE=GPRE;
  return JSON.stringify(o);
};
const _appOrig=applyState;
applyState=function(s){
  _appOrig(s);
  GPRE=Array.isArray(s.GPRE)?s.GPRE:[];
  GPRE.forEach(g=>{g.eqRefs=g.eqRefs||[];g.partes=g.partes||{};});
  if(GSEL&&!gpDe(GSEL))GSEL=null;
};
function guardar4(){ if(typeof saveToServer==='function') saveToServer(); }

/* ---- EL ENGANCHE: repintar también las pestañas nuevas ---- */
const _refOrig=refreshAll;
refreshAll=function(){ _refOrig(); try{pintarPrecios();pintarSino();}catch(e){} };

/* =============== PESTAÑA PRECIOS =============== */
function pintarPrecios(){
  const cont=document.getElementById('v-precios'); if(!cont) return;
  const sinGrupo=EQ.filter(e=>!gpDeEq(e));
  const sinPrecio=sinGrupo.filter(e=>!(+e.precioVenta>0));
  const totGrupos=GPRE.reduce((s,g)=>s+(+g.total||0),0);

  if(!EQ.length){
    cont.innerHTML=`<div class="g4em"><h3>Primero carga tus pedidos</h3>
      <p>Esta pestaña arma precios sobre los pedidos del order report. Carga los datos y vuelve.</p>
      <button class="btn" onclick="verifyOpen()">Cargar datos</button></div>`;
    return;
  }
  if(GSEL&&!gpDe(GSEL))GSEL=null;
  if(!GSEL&&GPRE.length)GSEL=GPRE[0].id;

  cont.innerHTML=`
    <div class="snkpis">
      <div class="snk"><div class="l">Grupos de precio</div><div class="v">${GPRE.length}</div>
        <div class="d">cubren <b>${EQ.length-sinGrupo.length}</b> de ${EQ.length} pedidos</div></div>
      <div class="snk"><div class="l">Valor de los grupos</div><div class="v">US$ ${fmtUSDs(totGrupos)}</div>
        <div class="d">precio a clientes, escrito a mano</div></div>
      <div class="snk"><div class="l">Pedidos sueltos con precio</div><div class="v">${sinGrupo.length-sinPrecio.length}</div>
        <div class="d">con su precio individual de siempre</div></div>
      <div class="snk"><div class="l">Pedidos sin precio</div>
        <div class="v ${sinPrecio.length?'mal':'ok'}">${sinPrecio.length}</div>
        <div class="d">${sinPrecio.length?'no entran al estado de cuenta':'todos tienen precio'}</div></div>
    </div>
    <div class="sec" style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <h2 style="font-size:16px;font-weight:600">Precios por grupo</h2>
      <div style="font-size:12.5px;color:var(--ink2)">cuando facturas varios proyectos juntos, un total y la herramienta lo reparte</div>
      <div style="flex:1"></div>
      <button class="btn primary" onclick="gpNuevo()">+ Nuevo grupo</button>
    </div>
    <div class="g4wrap">
      <div>
        <div class="g4list">${GPRE.length?GPRE.map(g=>{
          const n=(g.eqRefs||[]).length;
          return `<div class="g4item ${g.id===GSEL?'on':''}" onclick="GSEL='${g.id}';pintarPrecios()">
            <span class="v">${fmtUSDs(g.total)}</span>
            <div class="n">${esc4(g.nombre||g.facNum||'Grupo sin nombre')}</div>
            <div class="m">${esc4(g.cliente||'sin cliente')} · ${n} pedido(s)${g.facNum?' · '+esc4(g.facNum):''}</div></div>`;
        }).join(''):'<div style="padding:18px;font-size:12.5px;color:var(--ink3)">Todavía no has creado ningún grupo.</div>'}</div>
        ${sinPrecio.length?`<div class="g4av" style="margin:14px 0 0">
          <b>${sinPrecio.length} pedido(s) sin precio.</b> No suman al estado de cuenta.
          <div style="margin-top:8px"><button class="btn" onclick="gpDesdeSinPrecio()">Crear un grupo con ellos</button></div>
        </div>`:''}
      </div>
      <div>${GSEL?editorGrupo(gpDe(GSEL)):`<div class="g4em">
        <h3>Crea tu primer grupo de precio</h3>
        <p>Un grupo es una factura (o una que todavía no existe): escoges los pedidos que van juntos,
           escribes <b>un solo total</b>, y la herramienta lo reparte entre ellos para el estado de cuenta.</p>
        <button class="btn primary" onclick="gpNuevo()">+ Nuevo grupo</button></div>`}</div>
    </div>`;
}
const esc4=s=>(''+(s==null?'':s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function editorGrupo(g){
  if(!g) return '';
  const {eqs,aviso}=gpPesos(g);
  const rep=gpRepartido(g), dif=Math.round(((+g.total||0)-rep)*100)/100;
  const q=(GQ||'').toLowerCase().trim();
  const cands=EQ.filter(e=>{const o=gpDeEq(e);return !o||o.id===g.id;})
    .filter(e=>!g.cliente||e.cliente===g.cliente||gpDeEq(e))
    .filter(e=>{ if(!q) return true;
      if((g.eqRefs||[]).indexOf(e.derrame)>=0) return true;      /* los marcados nunca se esconden */
      return ((e.derrame||'')+' '+(projOf(e)||'')+' '+(e.cliente||'')).toLowerCase().indexOf(q)>=0; })
    /* primero los que ya están en el grupo: son los que estás tocando */
    .sort((x,y)=>{const a=(g.eqRefs||[]).indexOf(x.derrame)>=0?0:1,
                        bb=(g.eqRefs||[]).indexOf(y.derrame)>=0?0:1;return a-bb;});
  const fac=g.facNum?FACT.find(f=>f.num===g.facNum):null;
  const sug=!fac?FACT.filter(f=>(f.eqRefs||[]).some(d=>(g.eqRefs||[]).indexOf(d)>=0)&&!GPRE.some(x=>x.facNum===f.num)):[];

  return `<div class="g4card">
    <div class="g4h">
      <div class="t">${esc4(g.nombre||'Grupo sin nombre')}</div>
      <div style="font-size:12.5px;color:var(--ink2);margin-top:2px">
        ${eqs.length} pedido(s) · reparto por ${({costo:'costo del pedido',equipos:'# de equipos',manual:'lo que yo escriba'})[g.base]}</div>
    </div>

    <div class="g4b"><div class="g4grid">
      <div class="g4f"><label>Nombre del grupo</label>
        <input value="${esc4(g.nombre)}" placeholder="Factura Mompox" oninput="gpSet('${g.id}','nombre',this.value)">
        <div class="h">para reconocerlo en la lista</div></div>
      <div class="g4f"><label>Cliente</label>
        <select onchange="gpSet('${g.id}','cliente',this.value,true)">
          <option value="">— sin cliente —</option>
          ${CLIENTES.map(c=>`<option value="${esc4(c)}" ${c===g.cliente?'selected':''}>${esc4(c)}</option>`).join('')}
        </select><div class="h">solo salen sus pedidos</div></div>
      <div class="g4f"><label>Precio total del grupo (USD)</label>
        <input class="n" type="number" step="any" value="${g.total||''}" placeholder="0"
          oninput="gpSet('${g.id}','total',this.value)">
        <div class="h">lo que le cobras al cliente por todo junto</div></div>
      <div class="g4f"><label>Repartirlo por</label>
        <select onchange="gpSet('${g.id}','base',this.value,true)">
          <option value="costo" ${g.base==='costo'?'selected':''}>Costo de cada pedido</option>
          <option value="equipos" ${g.base==='equipos'?'selected':''}># de equipos</option>
          <option value="manual" ${g.base==='manual'?'selected':''}>A mano, pedido por pedido</option>
        </select><div class="h">cambia solo el reparto, no el total</div></div>
      <div class="g4f"><label>Fecha</label>
        <input type="date" value="${esc4(g.fecha)}" onchange="gpSet('${g.id}','fecha',this.value)"><div class="h"></div></div>
      <div class="g4f"><label>Nota</label>
        <input value="${esc4(g.nota)}" placeholder="…" oninput="gpSet('${g.id}','nota',this.value)"><div class="h"></div></div>
    </div></div>

    ${aviso?`<div class="g4av">${aviso}</div>`:''}
    ${g.base==='manual'&&Math.abs(dif)>0.5?`<div class="g4av">
      Repartiste <b>${fmtUSDs(rep)}</b> de <b>${fmtUSDs(g.total)}</b>:
      ${dif>0?`te faltan <b>${fmtUSDs(dif)}</b>`:`te pasaste por <b>${fmtUSDs(-dif)}</b>`}.
      <button class="btn" style="margin-left:8px" onclick="gpCuadrar('${g.id}')">Cuadrar en la última fila</button>
    </div>`:''}

    <div class="g4sec" style="display:flex;align-items:center;gap:10px">
      <span>Pedidos que cubre este grupo</span>
      <span style="flex:1"></span>
      <input id="gq" value="${esc4(GQ)}" placeholder="filtrar por pedido, proyecto o cliente…"
        oninput="GQ=this.value;pintarPrecios();setTimeout(()=>{const i=document.getElementById('gq');
          if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},0)"
        style="text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;border:1px solid var(--rule2);
               border-radius:16px;padding:4px 11px;width:260px;background:var(--surface)">
    </div>
    <div style="max-height:420px;overflow:auto"><table class="g4t"><thead><tr>
      <th style="width:34px"></th><th>Pedido</th><th>Proyecto</th>
      <th class="r">Costo</th><th class="r">Equipos</th><th class="r">Le toca</th>
    </tr></thead><tbody>
      ${cands.length?cands.map(e=>{
        const dentro=(g.eqRefs||[]).indexOf(e.derrame)>=0;
        return `<tr style="${dentro?'':'opacity:.5'}">
          <td><input type="checkbox" class="g4chk" ${dentro?'checked':''}
            onchange="gpToggle('${g.id}','${e.derrame}',this.checked)"></td>
          <td><b>${esc4(e.derrame)}</b><div style="font-size:11px;color:var(--ink3)">${esc4(e.cliente)}</div></td>
          <td>${esc4(projOf(e)||'—')}</td>
          <td class="r">${fmtUSDs(+e.cupoMonto||+e.mfgAmt||0)}</td>
          <td class="r">${e.qty||1}</td>
          <td class="r">${dentro?(g.base==='manual'
            ? `<input class="n" type="number" step="any" value="${(g.partes||{})[e.derrame]||''}"
                 placeholder="0" oninput="gpParteSet('${g.id}','${e.derrame}',this.value)">`
            : `<b>${fmtUSDs(gpParte(g,e))}</b>`):'<span style="color:var(--ink3)">—</span>'}</td>
        </tr>`;}).join(''):`<tr><td colspan="6" style="padding:16px;color:var(--ink3)">
          ${g.cliente?'Ese cliente no tiene pedidos libres.':'Escoge un cliente para ver sus pedidos.'}</td></tr>`}
      <tr class="tt"><td colspan="5">Total repartido</td>
        <td class="r">${fmtUSDs(rep)}${Math.abs(dif)>0.5?` <span class="g4tag mal">faltan ${fmtUSDs(dif)}</span>`:''}</td></tr>
    </tbody></table></div>

    <div class="g4sec">Factura real</div>
    <div class="g4b">
      ${fac?`<div style="font-size:13px"><b>${esc4(fac.num)}</b> · ${fmtD(fac.fecha)} ·
          total <b>${fmtUSDs(totalFac(fac))}</b>
          <button class="btn" style="margin-left:10px" onclick="gpDesligar('${g.id}')">Desligar</button></div>
        ${Math.abs(totalFac(fac)-(+g.total||0))>1?`<div class="g4av" style="margin:12px 0 0">
          <b>El total de la factura no coincide con el que escribiste a mano.</b>
          <div class="g4cmp">
            <div><div class="l">Tu precio manual</div><div class="v">${fmtUSD(g.total)}</div>
              <button class="btn" style="margin-top:9px" onclick="toast('Se deja tu precio manual')">Dejar el mío</button></div>
            <div><div class="l">La factura ${esc4(fac.num)}</div><div class="v">${fmtUSD(totalFac(fac))}</div>
              <button class="btn" style="margin-top:9px" onclick="gpTomarFac('${g.id}')">Usar el de la factura</button></div>
          </div></div>`:`<div class="g4av" style="margin:12px 0 0;background:#E7F1EC;border-color:#B7D4C9;color:#2E6E5A">
            Cuadra con tu precio manual.</div>`}`
      :`<div style="font-size:12.5px;color:var(--ink2)">
          Todavía no hay factura real enganchada. Cárgala con <b>Cargar facturas</b> y vuelve aquí,
          o engánchala si ya está cargada.</div>
        ${sug.length?`<div style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap">
          ${sug.map(f=>`<button class="btn" onclick="gpLigar('${g.id}','${esc4(f.num)}')">
            Enganchar ${esc4(f.num)} · ${fmtUSDs(totalFac(f))}</button>`).join('')}</div>`:''}`}
    </div>

    <div class="g4acts">
      <button class="btn" onclick="navTo('clientes')">Ver el estado de cuenta</button>
      <div style="flex:1"></div>
      <button class="btn" style="color:var(--danger);border-color:#e8c9c5" onclick="gpBorrar('${g.id}')">Eliminar grupo</button>
    </div>
  </div>`;
}

function gpSet(id,f,v,recarga){
  const g=gpDe(id); if(!g) return;
  g[f]=(f==='total')?(+v||0):v;
  if(f==='cliente'){ /* un pedido de otro cliente no puede quedarse en el grupo */
    g.eqRefs=(g.eqRefs||[]).filter(d=>{const e=EQ.find(x=>x.derrame===d);return e&&(!v||e.cliente===v);});
  }
  refreshAll(); renderLedger(); guardar4();
  if(recarga||f==='cliente') pintarPrecios();
}
function gpToggle(id,derrame,on){
  const g=gpDe(id); if(!g) return;
  g.eqRefs=g.eqRefs||[];
  const i=g.eqRefs.indexOf(derrame);
  if(on&&i<0) g.eqRefs.push(derrame);
  if(!on&&i>=0){ g.eqRefs.splice(i,1); if(g.partes) delete g.partes[derrame]; }
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
}
function gpParteSet(id,derrame,v){
  const g=gpDe(id); if(!g) return;
  g.partes=g.partes||{}; g.partes[derrame]=+v||0;
  refreshAll(); renderLedger(); guardar4();
  const el=document.querySelector('.g4t tr.tt td.r'); if(el) el.innerHTML=fmtUSDs(gpRepartido(g));
}
function gpCuadrar(id){
  const g=gpDe(id); if(!g) return;
  const eqs=gpEquipos(g); if(!eqs.length) return;
  const ult=eqs[eqs.length-1];
  let otros=0; eqs.slice(0,-1).forEach(e=>otros+=(+(g.partes||{})[e.derrame]||0));
  g.partes=g.partes||{};
  g.partes[ult.derrame]=Math.round(((+g.total||0)-otros)*100)/100;
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
  toast(`<b>${esc4(ult.derrame)}</b> ajustado a ${fmtUSDs(g.partes[ult.derrame])} para cuadrar el total`);
}
function gpBorrar(id){
  const g=gpDe(id); if(!g) return;
  if(!confirm('¿Eliminar el grupo "'+(g.nombre||'sin nombre')+'"? Los pedidos vuelven a su precio individual.')) return;
  GPRE.splice(GPRE.indexOf(g),1); GSEL=null;
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
  toast('Grupo eliminado');
}
function gpDesdeSinPrecio(){
  const sin=EQ.filter(e=>!gpDeEq(e)&&!(+e.precioVenta>0));
  if(!sin.length) return;
  const cli=sin[0].cliente;
  const mismos=sin.filter(e=>e.cliente===cli);
  gpNuevo();
  const g=GPRE[GPRE.length-1];
  g.cliente=cli; g.eqRefs=mismos.map(e=>e.derrame);
  g.nombre='Sin facturar · '+cli;
  pintarPrecios(); guardar4();
  toast(`Grupo con los ${mismos.length} pedido(s) sin precio de <b>${esc4(cli)}</b> · ponle el total`);
}
function gpLigar(id,num){
  const g=gpDe(id), f=FACT.find(x=>x.num===num); if(!g||!f) return;
  g.facNum=f.num; g.facTotal=totalFac(f); g.facFecha=f.fecha||null;
  if(!g.nombre) g.nombre=f.num;
  pintarPrecios(); guardar4();
  toast(Math.abs(totalFac(f)-(+g.total||0))>1
    ? `<b>${esc4(f.num)}</b> enganchada · los totales no coinciden, decide cuál queda`
    : `<b>${esc4(f.num)}</b> enganchada · cuadra con tu precio manual`);
}
function gpDesligar(id){
  const g=gpDe(id); if(!g) return;
  g.facNum=null; g.facTotal=null; g.facFecha=null;
  pintarPrecios(); guardar4(); toast('Factura desligada · tu precio manual queda igual');
}
function gpTomarFac(id){
  const g=gpDe(id), f=g&&g.facNum?FACT.find(x=>x.num===g.facNum):null; if(!g||!f) return;
  const antes=+g.total||0;
  g.total=totalFac(f);
  if(f.fecha) g.fecha=isoW(f.fecha);
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
  toast(`Total del grupo: ${fmtUSDs(antes)} → <b>${fmtUSDs(g.total)}</b>, según ${esc4(f.num)}`);
}

/* =============== PESTAÑA SINOSURE ===============
   La hoja de Andrés tal como se ve en el detailed, celda por celda, con el
   pedido al que apunta cada fórmula al lado. Más las tres decisiones que
   de verdad se toman con ella: si cabe el próximo pedido, cuándo se libera
   cupo, y qué hacer con lo que está en el aire. */

/* Reconstruye los renglones de la hoja a partir de lo que ya quedó guardado:
   cada línea de sinoDetalle es una celda de la hoja apuntando a un pedido. */
function hojaSino(){
  const C=CONCILIA; if(!C) return [];
  const porCelda={};
  Object.entries(C.sinoDetalle||{}).forEach(([clave,lineas])=>{
    (lineas||[]).forEach(l=>{
      const r=porCelda[l.celda]||(porCelda[l.celda]={celda:l.celda,etiqueta:l.etiqueta,
        total:l.total,ref:l.ref,que:l.que,claves:[],conjunto:l.conjunto});
      if(r.claves.indexOf(clave)<0) r.claves.push(clave);
    });
  });
  (C.sinoDup||[]).forEach(d=>{porCelda[d.celda]={celda:d.celda,etiqueta:d.etiqueta,total:d.valor,
    ref:d.ref,que:'',claves:[],dup:true,yaEn:d.yaEn,lado:d.lado,derrames:d.derrames||[]};});
  (C.sinoSueltosL||[]).forEach(s=>{porCelda[s.celda]={celda:s.celda,etiqueta:s.etiqueta,total:s.valor,
    ref:null,que:'',claves:[],suelto:true,lado:s.lado};});
  const filas=Object.values(porCelda).map(r=>{
    const col=(r.celda.match(/^[A-Z]+/)||['B'])[0], fil=+((r.celda.match(/\d+$/)||[0])[0]);
    r.col=col; r.fil=fil; r.lado=r.lado||(col==='B'?'Singsun':'Eaglerise');
    r.eqs=r.claves.map(k=>EQ.find(e=>kOf(e)===k)).filter(Boolean);
    return r;
  }).sort((a,b)=>a.fil-b.fil||a.col.localeCompare(b.col));

  /* Andrés parte algunos pedidos en DOS renglones: uno por el anticipo y otro
     por el balance (CFM 3.4 está en E10 y en E14). Comparar renglón contra
     renglón marcaría las dos mitades como errores. La comparación se hace
     contra el pedido completo, que es lo que sinoPorDerrame ya suma. */
  const mapa=(C.sinoPorDerrame||{});
  const hermanas={};
  filas.forEach(r=>{ if(r.dup||r.suelto) return;
    r.claves.forEach(k=>{ (hermanas[k]=hermanas[k]||[]).push(r.celda); }); });
  filas.forEach(r=>{
    if(r.dup||r.suelto){ r.mio=0; r.dif=0; r.cuadra=true; return; }
    r.hojaPed=r.claves.reduce((s,k)=>s+(mapa[k]||0),0);
    r.mio=r.eqs.reduce((s,e)=>s+consumoEq(e,e.mfg),0);
    r.dif=Math.round((r.mio-r.hojaPed)*100)/100;
    r.cuadra=Math.abs(r.dif)<=2;
    /* las otras celdas del mismo pedido, para poder decirlo en la fila */
    const otras=[...new Set(r.claves.flatMap(k=>hermanas[k]||[]))].filter(c=>c!==r.celda);
    r.hermanas=otras;
  });
  return filas;
}
/* los pedidos vivos que la hoja no lista: no son renglones, pero sí plata */
const fueraDeHoja=mfg=>EQ.filter(e=>e.mfg===mfg&&(+e.cupoSaldo||0)>0.5
  &&((CONCILIA&&CONCILIA.sinoPorDerrame)||{})[kOf(e)]==null);

let SNSIM={Singsun:'',Eaglerise:''};

  const cont=document.getElementById('v-sinosure'); if(!cont) return;

  }
  const filas=hojaSino();

  const col=mfg=>{
    const fs=filas.filter(r=>r.lado===mfg);
    const ents=(S.cuposPorEntidad||{})[mfg]||{};
    const techo=+S.cupos[mfg]||0;
    const declara=mfg==='Singsun'?S.totalSingsun:S.totalEagle;
    const dispHoja=mfg==='Singsun'?S.dispSingsun:S.dispEagle;
    const mio=EQ.filter(e=>e.mfg===mfg).reduce((s,e)=>s+consumoEq(e,e.mfg),0);

      <div class="snht">${mfg==='Singsun'?'Singsun':'Eagle'}<span>columna ${mfg==='Singsun'?'A–B':'D–E'} de la hoja</span></div>
      <table class="snt">
        <tr class="snzona"><td colspan="4">Cupos</td></tr>
        ${Object.entries(ents).map(([k,v])=>`<tr><td class="c"></td><td>${esc4(k)}</td>
          <td class="r">${fmtUSDs(v)}</td><td></td></tr>`).join('')}
        <tr class="sntot"><td class="c"></td><td>Total</td><td class="r">${fmtUSDs(techo)}</td><td></td></tr>
        <tr class="snzona"><td colspan="4">Consumo<span class="snzh">celda · lo que dice Andrés · a qué pedido apunta</span></td></tr>
        ${fs.map(r=>{
          const cls=r.dup?'dupr':(r.suelto?'suelr':(!r.cuadra?'difr':''));
          return `<tr class="${cls}">
            <td class="c" title="${esc4(r.ref||'sin fórmula')}">${esc4(r.celda)}</td>
            <td>${esc4(r.etiqueta)}
              <div class="snm">${r.dup?`<b>repite ${esc4(r.yaEn)}</b> · ${esc4(r.ref||'')}`
                :r.suelto?'<b>no cae en ningún pedido</b>'
                :`${esc4(r.ref||'escrito a mano')}${r.que?' · '+esc4(r.que):''}`}</div></td>
            <td class="r">${fmtUSDs(r.total)}</td>
            <td class="p">${r.dup?`<span class="g4tag avi">no suma</span>`
              :r.suelto?`<span class="g4tag mal">suelto</span>`
              :r.eqs.length?`${r.eqs.map(e=>esc4(e.derrame)).join(', ')}
                 ${(r.hermanas&&r.hermanas.length)
                   ? `<div class="snm">+ ${r.hermanas.map(esc4).join(', ')} · entre todas <b>${fmtUSDs(r.hojaPed)}</b></div>`:''}
                 ${!r.cuadra?`<div class="snm" style="color:var(--danger)">yo cuento ${fmtUSDs(r.mio)}
                   · ${r.dif>0?'+':''}${fmtUSDs(r.dif)}</div>`:'<div class="snm">cuadra</div>'}`
              :'<span class="g4tag mal">sin pedido</span>'}</td></tr>`;}).join('')}
        <tr class="sntot"><td class="c"></td><td>Consumo total</td>
          <td class="r">${fmtUSDs(declara)}</td>
          <td class="p">${Math.abs(mio-declara)>2
            ? `<span style="color:var(--danger)">yo cuento ${fmtUSDs(mio)}</span>`:'<span style="color:var(--ok)">cuadra</span>'}</td></tr>
        <tr class="sntot"><td class="c"></td><td>Cupo disponible</td>
          <td class="r ${dispHoja<0?'neg':''}">${fmtUSDs(dispHoja)}</td>
          <td class="p">${Math.abs((techo-mio)-dispHoja)>2
            ? `<span style="color:var(--danger)">yo: ${fmtUSDs(techo-mio)}</span>`:''}</td></tr>
        ${fuera.length?`<tr class="snzona"><td colspan="4">Lo que la hoja todavía no lista
            <span class="snzh">no está en el archivo de Andrés, pero es plata comprometida</span></td></tr>
          ${fuera.map(e=>`<tr class="falta"><td class="c">—</td>
            <td>${esc4(e.derrame)}<div class="snm">${esc4(projOf(e)||'')}</div></td>
            <td class="r">${fmtUSDs(consumoEq(e,e.mfg,'andres'))}</td>
            <td class="p">${selSino(e)}</td></tr>`).join('')}
          <tr class="sntot"><td class="c"></td><td>Si Andrés los carga, quedarías en</td>
            <td class="r ${(techo-mio-fuera.reduce((s,e)=>s+consumoEq(e,e.mfg,'andres'),0))<0?'neg':''}">${
              fmtUSDs(techo-mio-fuera.reduce((s,e)=>s+(consumoEq(e,e.mfg)>0?0:consumoEq(e,e.mfg,'andres')),0))}</td>
            <td></td></tr>`:''}
      </table>
      <div class="snsim">
        <label>¿Me cabe un pedido de</label>
        <input type="number" placeholder="0" value="${SNSIM[mfg]}"
          oninput="SNSIM['${mfg}']=this.value;simSino('${mfg}')">
        <label>USD?</label>
        <span id="sim${mfg}" class="simr">${simTexto(mfg)}</span>

  };

  cont.innerHTML=`
    <div class="sec" style="display:flex;align-items:baseline;gap:12px;margin-bottom:6px">
      <h2 style="font-size:16px;font-weight:600">La hoja Sinosure</h2>
      <div style="font-size:12.5px;color:var(--ink2)">como la ves en el detailed, con el pedido al que apunta cada fórmula</div>
      <div style="flex:1"></div>
      <button class="btn" onclick="exportarSino()">Copiar para Andrés</button>
    </div>
    <div class="snleyenda">
      <span class="lg"><i class="difr"></i>el pedido no cuadra con lo que cuento</span>
      <span class="lg"><i class="dupr"></i>renglón repetido</span>
      <span class="lg"><i class="falta"></i>pedido que la hoja no lista</span>
      <span class="lg" style="margin-left:auto">${CONFIG.contarDupSino?'los repetidos <b>sí</b> suman':'los repetidos <b>no</b> suman'}
        · <a href="#" onclick="setDupSino('${CONFIG.contarDupSino?'no':'si'}');pintarSino();return false">cambiarlo</a></span>
    </div>
    <div class="sncols">${col('Singsun')}${col('Eaglerise')}</div>
    ${timelineSino()}`;
}
const selSino=e=>`<select class="snsel ${e.sinoManual==='si'?'si':e.sinoManual==='no'?'no':''}"
  onchange="setSinoManual('${esc4(e.derrame)}','${e.mfg}',this.value);pintarSino()">
  ${[['','pendiente'],['si','cuéntalo ya'],['no','déjalo fuera']]
    .map(o=>`<option value="${o[0]}" ${o[0]===(e.sinoManual||'')?'selected':''}>${o[1]}</option>`).join('')}</select>`;

/* --- ¿me cabe? --- */
function simTexto(mfg){
  const v=+SNSIM[mfg]||0;
  const techo=+CUPO[mfg]||0, usado=EQ.filter(e=>e.mfg===mfg).reduce((s,e)=>s+consumoEq(e,e.mfg),0);
  const libre=techo-usado;
  if(!v) return `te quedan <b>${fmtUSDs(libre)}</b>`;
  const queda=libre-v;
  if(queda>=0) return `<b style="color:var(--ok)">sí cabe</b> · quedarías con ${fmtUSDs(queda)}`;
  /* qué tendrías que girar primero para que quepa */
  const cand=EQ.filter(e=>e.mfg===mfg&&consumoEq(e,e.mfg)>0)
    .map(e=>({e,libera:consumoEq(e,e.mfg),saldo:+e.cupoSaldo||0,
              f:e.limitePago?new Date(e.limitePago):null}))
    .sort((a,b)=>b.libera-a.libera);
  let falta=-queda, girar=0, cuales=[];
  for(const c of cand){ if(falta<=0) break; cuales.push(c); girar+=c.saldo; falta-=c.libera; }
  return `<b style="color:var(--danger)">no cabe por ${fmtUSDs(-queda)}</b>`+
    (cuales.length?` · girando ${fmtUSDs(girar)} de ${cuales.map(c=>esc4(c.e.derrame)).join(', ')} sí cabría`:'');
}
function simSino(mfg){const el=document.getElementById('sim'+mfg); if(el) el.innerHTML=simTexto(mfg);}

/* --- cuándo se libera cupo --- */
function timelineSino(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const items=EQ.filter(e=>e.limitePago&&consumoEq(e,e.mfg)>0.5)
    .map(e=>({e,f:new Date(e.limitePago),libera:consumoEq(e,e.mfg),girar:+e.cupoSaldo||0}))
    .sort((a,b)=>a.f-b.f);
  if(!items.length) return '';
  const acum={Singsun:0,Eaglerise:0};
  const libre=m=>(+CUPO[m]||0)-EQ.filter(e=>e.mfg===m).reduce((s,e)=>s+consumoEq(e,e.mfg),0);
  const base={Singsun:libre('Singsun'),Eaglerise:libre('Eaglerise')};
  return `<div class="sec" style="display:flex;align-items:baseline;gap:12px;margin:30px 0 10px">
      <h2 style="font-size:16px;font-weight:600">Cuándo se te libera cupo</h2>
      <div style="font-size:12.5px;color:var(--ink2)">el cupo se suelta el día que gires el saldo de cada pedido</div></div>
    <div class="tblwrap"><table class="g4t"><thead><tr>
      <th>Fecha límite</th><th>Pedido</th><th>Fabricante</th>
      <th class="r">Tienes que girar</th><th class="r">Se libera</th><th class="r">Cupo libre después</th>
    </tr></thead><tbody>
      ${items.map(it=>{
        acum[it.e.mfg]+=it.libera;
        const d=Math.round((it.f-hoy)/86400000);
        return `<tr>
          <td>${fmtD(it.f)}<div class="snm" style="${d<0?'color:var(--danger);font-weight:600':''}">${
            d<0?`vencida hace ${-d} d`:d===0?'es hoy':`en ${d} días`}</div></td>
          <td><b>${esc4(it.e.derrame)}</b><div class="snm">${esc4(projOf(it.e)||'')}</div></td>
          <td>${it.e.mfg}</td>
          <td class="r">${fmtUSDs(it.girar)}</td>
          <td class="r">${fmtUSDs(it.libera)}</td>
          <td class="r"><b>${fmtUSDs(base[it.e.mfg]+acum[it.e.mfg])}</b></td></tr>`;}).join('')}
    </tbody></table></div>`;
}

/* El cuadro que le puedes mandar al dueño del detailed */
function exportarSino(){
  const filas=hojaSino();
  const l=['Celda\tLo que dice la hoja\tValor\tFórmula\tPedido\tLo que cuento yo\tDesfase\tObservación'];
  filas.forEach(r=>l.push([r.celda,r.etiqueta,Math.round(r.total),r.ref||'sin fórmula',
    r.eqs.map(e=>e.derrame).join(' + ')||'—',
    r.dup||r.suelto?'':Math.round(r.mio), r.dup||r.suelto?'':(r.cuadra?0:Math.round(r.dif)),
    r.dup?('repite '+r.yaEn+': cuenta dos veces la misma celda'):
    r.suelto?'no cae en ningún pedido':
    ((r.hermanas&&r.hermanas.length?'con '+r.hermanas.join(', ')+' suma '+Math.round(r.hojaPed)+' · ':'')
      +(r.cuadra?'ok':'no cuadra'))].join('\t')));
  ['Singsun','Eaglerise'].forEach(m=>fueraDeHoja(m).forEach(e=>
    l.push(['—',e.derrame,Math.round(consumoEq(e,m,'andres')),'','','','','falta en la hoja'])));
  const txt=l.join('\n');
  const ta=document.createElement('textarea'); ta.value=txt;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  toast(ok?`Copiada la hoja con <b>${filas.length}</b> renglón(es) y su mapeo · pégala en un correo`
          :'No se pudo copiar solo · está en la consola del navegador');
  if(!ok) console.log(txt);
}

/* =============== NO DEJAR DOS PRECIOS PELEANDO ===============
   En "Editar cliente" hay una casilla de precio por pedido. Si ese pedido
   ya está en un grupo, el grupo manda y lo que se escriba ahí no se usa.
   En vez de ignorarlo en silencio, se bloquea la casilla y se dice dónde
   está el precio de verdad. */
if(typeof renderEditCliente==='function'){
  const _recOrig=renderEditCliente;
  renderEditCliente=function(){
    _recOrig.apply(this,arguments);
    try{ marcarPreciosDeGrupo(); }catch(e){}
  };
}
function marcarPreciosDeGrupo(){
  document.querySelectorAll('#editCliBody input.ec-num, .ec-tbl input.ec-num').forEach(inp=>{
    const oc=inp.getAttribute('onchange')||'';
    if(oc.indexOf("'precioVenta'")<0) return;
    const m=oc.match(/setEqField\((\d+)/); if(!m) return;
    const e=EQ[+m[1]]; if(!e) return;
    const g=gpDeEq(e); if(!g) return;
    const td=inp.parentElement; if(!td||td.dataset.gp) return;
    td.dataset.gp='1';
    td.innerHTML=`<div style="font-variant-numeric:tabular-nums;font-weight:600">${fmtUSDs(gpParte(g,e))}</div>
      <small style="display:block;font-size:10px;color:var(--ink3);line-height:1.35">
        del grupo <b>${esc4(g.nombre||'sin nombre')}</b><br>
        <a href="#" onclick="navTo('precios');GSEL='${g.id}';pintarPrecios();return false"
           style="color:var(--accent)">editarlo ahí</a></small>`;
  });
}
