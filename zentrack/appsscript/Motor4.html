<script>

/* ================= CONFIG CUPO ================= */
EQ.forEach((e,i)=>e._i=i);
function stageOpts(sel){return ['confirm','prod','finished','booked','shipping'].map(s=>`<option value="${s}" ${s===sel?'selected':''}>${STAGE[s]}</option>`).join('');}
function setCfg(mfg,f,v){CONFIG[mfg][f]=(f==='antPct')?Math.max(0,Math.min(1,parseFloat(v)||0)):(f==='dias'?(+v||0):v);if(f==='dias')recalcVenceChina();refreshCupo();}
function setCupo(mfg,v){CUPO[mfg]=Math.max(0,+v||0);refreshCupo();}
function setOverride(i,v){EQ[i].pctOverride=(v==='auto')?null:parseFloat(v);refreshCupo();}
function setDupSino(v){CONFIG.contarDupSino=(v==='si');refreshAll();renderLedger();if(typeof saveToServer==='function')saveToServer();toast(CONFIG.contarDupSino?'Los renglones repetidos vuelven a sumar':'Cada celda de la hoja Sinosure cuenta una sola vez');}
function setCupoRegla(v){CONFIG.cupoRegla=v;refreshAll();renderLedger();if(typeof saveToServer==='function')saveToServer();toast('Cupo contado por: <b>'+CUPO_REGLAS[v]+'</b>');}
function setTrmProy(v){CONFIG.trmProy=+v||4050;renderConfig();}
function setCliTerm(c,v){if(CLI[c]){CLI[c].term=+v||0;recalcVence();}refreshCupo();if(document.getElementById('v-clientes').classList.contains('on'))renderClientes();}
function setCliFifo(c,v){if(CLI[c])CLI[c].fifo=(v==='fifo');}
function recalcVence(){/* en el nuevo modelo los vencimientos son por hito y se resuelven en vivo */}
function recalcVenceChina(){EQ.forEach(e=>{if(isShipped(e)&&e.bl)e.vence=addD(e.bl,CONFIG[e.mfg].dias);});}
function delCliente(c){
  if(!CLI[c])return;
  const eqs=EQ.filter(e=>e.cliente===c).length;
  const facs=FACT.filter(f=>f.cliente===c).length;
  const pag=PAGOS.filter(p=>p.cliente===c).length;
  if(eqs||facs||pag){toast('No se puede eliminar <b>'+c+'</b>: tiene '+(eqs?eqs+' equipo(s) ':'')+(facs?facs+' factura(s) ':'')+(pag?pag+' pago(s)':'')+'. Reasígnalos primero.');return;}
  if(!confirm('¿Eliminar el cliente '+c+'? Esta acción no se puede deshacer.'))return;
  delete CLI[c];CLIENTES=Object.keys(CLI);
  renderConfig();if(document.getElementById('v-clientes').classList.contains('on'))renderClientes();
  toast('Cliente <b>'+c+'</b> eliminado');
  if(typeof saveToServer==='function')saveToServer();
}
function addClienteUI(){const n=document.getElementById('ncName').value,t=document.getElementById('ncTerm').value,f=document.getElementById('ncFifo').value==='fifo';if(addCliente(n,t,f)){renderConfig();if(typeof renderClientes==='function')renderClientes();toast('Cliente <b>'+n.trim()+'</b> agregado · '+(+t||60)+' días');}else toast('Nombre vacío o cliente ya existe');}
function refreshCupo(){renderHoy();renderConfig();if(document.getElementById('v-pagos').classList.contains('on'))renderPagos();}
function stageOpts(sel){return ['confirm','prod','finished','booked','shipping'].map(s=>`<option value="${s}" ${s===sel?'selected':''}>${STAGE[s]}</option>`).join('');}
function renderHistCargas(){
  const el=document.getElementById('cfgHist');if(!el)return;
  if(!HIST.length){el.innerHTML='<div style="color:var(--ink3);font-size:13px;padding:6px 0">Aún no hay cargas archivadas — la primera queda al aprobar el asistente.</div>';return;}
  const rows=HIST.slice().reverse().map((h,i)=>{
    const last=i===0, prev=HIST[HIST.length-1-i-1];
    const delta=prev?(h.nEq-prev.nEq):h.nEq;const dS=prev?(h.cupoS-prev.cupoS):0;const dE=prev?(h.cupoE-prev.cupoE):0;
    return `<div class="hist-row ${last?'last':''}">
      <div class="h-meta"><b>${h.id}</b><small>${fmtD(h.ts)} · ${h.autor}</small></div>
      <div class="h-nums">${h.nEq} equipos${prev?` (${delta>=0?'+':''}${delta})`:''} · cupo Singsun ${fmtUSDs(h.cupoS)}${dS?` (${dS>=0?'+':''}${fmtUSDs(dS)})`:''} · Eaglerise ${fmtUSDs(h.cupoE)}${dE?` (${dE>=0?'+':''}${fmtUSDs(dE)})`:''}</div>
      <div class="h-actions">${last?`<button class="hbtn" onclick="corregirUltima()" title="Reabrir esta carga en el asistente para modificarla">Corregir</button><button class="hbtn danger" onclick="revertCarga()" title="Volver al estado ANTES de esta carga">Revertir</button>`:'<span class="h-tag">archivada</span>'}</div>
    </div>`;
  }).join('');
  el.innerHTML=rows;
}
function revertCarga(){
  if(!HIST.length){return;}
  const last=HIST[HIST.length-1];
  if(!last.snapPrev){toast('No hay estado previo para revertir esta carga');return;}
  if(!confirm('Revertir la carga '+last.id+'? Esto vuelve al estado ANTES de esa carga. Los pagos y cambios que hiciste después se perderán si dependían de ella.'))return;
  hydrateSnap(last.snapPrev);HIST.pop();
  renderHoy();renderLedger();renderClientes();renderConfig();renderPagos();
  toast('Carga '+last.id+' revertida');
  if(typeof saveToServer==='function')saveToServer();
}
function corregirUltima(){
  if(!HIST.length){toast('No hay cargas para corregir');return;}
  /* reabrir el asistente con lo cargado hoy (todos los campos: montos M…U, detailed, etc.) */
  WIZ={step:2,work:null,prev:null,err:0,filter:'todos',loaded:true,totals:{},corte:new Date(),orNombre:'corrección de la última carga'};
  WIZ.work=EQ.map(e=>{const w={...e};w.antPend=e.antSaldo;w.antPaid=e.antSaldo<1;if(w.cupoMonto==null)w.cupoMonto=e.mfgAmt;if(w.cupoSaldo==null)w.cupoSaldo=consumoEq(e,e.mfg);if(w.totalSaldo==null)w.totalSaldo=w.cupoSaldo+(+e.otrosSaldo||0);return w;});
  WIZ.prev=prevDe();
  _prevSnap=snapNow();
  document.getElementById('reconScrim').classList.add('on');renderWiz();
}

function renderConfig(){
  renderHistCargas();
  const pm=document.getElementById('cfgPagoMin');if(pm)pm.value=CONFIG.pagoMinDias||15;
  const ld=document.getElementById('cfgLogDias');if(ld)ld.value=CONFIG.logDias||30;
  document.getElementById('cfgBody').innerHTML=['Singsun','Eaglerise'].map(mfg=>{
    const cfg=CONFIG[mfg],cover=Math.round((1-cfg.antPct)*100),comp=Math.round(cargaViva(mfg)),disp=Math.round(disponible(mfg)),cupo=CUPO[mfg];
    return `<div class="cfgcard">
      <h3>${mfg==='Singsun'?'Trackers · Singsun (se le paga a Nexus)':'Shelters · Eaglerise (pago directo)'}</h3>
      <div class="cfgrow"><label>Techo de cupo con Sinosure (USD)</label><input class="cfgmini wide" type="number" min="0" value="${cupo}" onchange="setCupo('${mfg}',this.value)"></div>
      <div class="cfgrow"><label>Desde qué estado del ORDER REPORT empieza a pesar en el cupo</label><select onchange="setCfg('${mfg}','reserveFrom',this.value)">${stageOpts(cfg.reserveFrom)}</select></div>
      <div class="cfgrow"><label>Anticipo</label><div class="cfgpct"><input type="number" value="${Math.round(cfg.antPct*100)}" min="0" max="100" onchange="setCfg('${mfg}','antPct',this.value/100)">%</div></div>
      <div class="cfgrow"><label>Días que te da China desde el BL</label><input class="cfgmini" type="number" value="${cfg.dias}" min="0" onchange="setCfg('${mfg}','dias',this.value)"></div>
      <div class="cfgnote">Con el anticipo pagado queda comprometido el <b>${cover}%</b> del pedido, y el cupo se libera cuando pagas el balance. El giro va a <b>${cfg.receptor}</b>.</div>
      <div class="cfgstate">Ahora: comprometido <b>${fmtUSDs(comp)}</b> · ${disp<0?`<span style="color:var(--danger)">sobregirado ${fmtUSDs(-disp)}</span>`:`disponible ${fmtUSDs(disp)}`}</div>
    </div>`;
  }).join('');
  const cr=document.getElementById('cfgReglaCupo');
  if(cr) cr.innerHTML=`<div class="cfgrow" style="max-width:760px"><label>Qué consume cupo Sinosure</label>
      <select onchange="setCupoRegla(this.value)">${Object.keys(CUPO_REGLAS).map(r=>`<option value="${r}" ${CONFIG.cupoRegla===r?'selected':''}>${CUPO_REGLAS[r]}</option>`).join('')}</select></div>
    <div class="cfgrow" style="max-width:760px"><label>Renglones repetidos de la hoja Sinosure</label>
      <select onchange="setDupSino(this.value)"><option value="no" ${!CONFIG.contarDupSino?'selected':''}>Contar una sola vez (correcto)</option><option value="si" ${CONFIG.contarDupSino?'selected':''}>Contarlos como los suma Andrés</option></select></div>
    <div class="cfgnote2">Manda en el treemap, en los KPIs del tablero y en el disponible. <b>Como la hoja de Andrés</b> es la que más se acerca a lo que él reporta; <b>saldo por pagar</b> es el 90% del tracker (o el 80% del shelter) una vez pagado el anticipo.</div>`;
  document.getElementById('cfgTrm').innerHTML=`<div class="cfgrow" style="max-width:520px"><label>TRM para embarques de prueba (lo que aún no tiene factura)</label><input class="cfgmini" type="number" value="${CONFIG.trmProy}" onchange="setTrmProy(this.value)"></div><div class="cfgnote2">Lo ya facturado usa la TRM fija de cada factura. Solo lo hipotético (probar embarque) usa esta TRM, salvo que pongas otra en el propio embarque.</div>`;
  document.getElementById('cfgClientes').innerHTML=`<table class="excT"><thead><tr><th>Cliente</th><th class="r">Plazo (días)</th><th>Aplicación de pagos</th></tr></thead><tbody>
    ${CLIENTES.map(c=>`<tr><td><b>${c}</b></td><td class="r"><input class="cfgmini" type="number" value="${CLI[c].term}" min="0" onchange="setCliTerm('${c}',this.value)"></td>
      <td><select onchange="setCliFifo('${c}',this.value)"><option value="fifo" ${CLI[c].fifo?'selected':''}>FIFO (más viejo primero)</option><option value="manual" ${!CLI[c].fifo?'selected':''}>Manual (a mano)</option></select></td><td class="r"><button class="act del" title="Eliminar cliente" onclick="delCliente('${c}')">×</button></td></tr>`).join('')}
    </tbody></table>
    <div class="addcli"><input id="ncName" placeholder="Nombre del cliente nuevo"><input id="ncTerm" type="number" placeholder="días" value="60" style="width:90px"><select id="ncFifo"><option value="manual">Manual</option><option value="fifo">FIFO</option></select><button class="prbtn" onclick="addClienteUI()">Agregar cliente</button></div>`;
  const cand=EQ.filter(e=>e.pctOverride!=null || (!e.antPaid && consumoEq(e,e.mfg)>0)).slice(0,10);
  document.getElementById('cfgExc').innerHTML=`<table class="excT"><thead><tr><th>Equipo</th><th>Orden</th><th>Estado</th><th class="r">Consume hoy</th><th>Regla de cupo</th></tr></thead><tbody>
    ${cand.map(e=>{const cover=Math.round(cov(e.mfg)*100);const cur=e.pctOverride==null?'auto':(e.pctOverride===1?'1':String(cov(e.mfg)));
      return `<tr><td>${e.proj}</td><td>${e.ordenId}</td><td class="stage">${STAGE[e.st]}</td><td class="r num">${fmtUSDs(consumoEq(e,e.mfg))}</td>
      <td><select onchange="setOverride(${e._i},this.value)"><option value="auto" ${cur==='auto'?'selected':''}>Automática</option><option value="1" ${cur==='1'?'selected':''}>Forzar 100%</option><option value="${cov(e.mfg)}" ${cur===String(cov(e.mfg))?'selected':''}>Forzar ${cover}%</option></select></td></tr>`;}).join('')||'<tr><td colspan="5" style="color:var(--ink3)">Sin excepciones activas</td></tr>'}
  </tbody></table>`;
}
function recalcularSaldos(){
  if(!EQ.length){toast('No hay equipos cargados. Carga primero un order report.');return;}
  const viejos=EQ.filter(e=>e.cupoSaldo==null||e.lector!=='v2').length;
  if(viejos){toast('<b>'+viejos+'</b> equipo(s) vienen de una versión vieja del lector. Vuelve a cargar el ORDER REPORT + detailed: recalcular no puede inventar la columna O.');return;}
  if(!confirm('Re-repartir el saldo del cupo (columna O) entre anticipo y balance según el último cruce con el detailed. No cambia ningún monto del ORDER REPORT ni borra precios, logística o clientes. ¿Continuar?'))return;
  EQ.forEach(function(e){
    const O=+e.cupoSaldo||0;
    const ant=e.antPaid?0:Math.min(O,(+e.antSaldo>0?+e.antSaldo:(+e.antTot||0)));
    e.antSaldo=ant; e.balSaldo=Math.max(0,O-ant);
  });
  refreshAll();renderLedger();
  if(typeof saveToServer==='function')saveToServer();
  toast('Saldos re-repartidos desde la columna O en '+EQ.length+' equipo(s)');
}
function genEC(cli,fmt){
  const rows=carteraCliente(cli);
  const usdSal=rows.reduce((s,f)=>s+f.saldo,0), usdTot=rows.reduce((s,f)=>s+f.total,0);
  if(fmt==='xlsx'){
    let csv='Estado de cuenta;'+cli+';corte '+fmtD(TODAY)+';USD\n\nFactura;Fecha;Plazo;TRM ref;Concepto;Monto USD;Hito;Vence;Saldo USD\n';
    rows.forEach(f=>{
      f.lineas.forEach(l=>{csv+=[f.num,fmtD(f.fecha),f.plazo+'d',f.trmRef,l.desc+(l.pass?' (pass-through)':''),l.usd,'','',''].join(';')+'\n';});
      f.hitosR.forEach(h=>{csv+=[f.num,'','','','',h.monto,h.etiq+' '+h.pct+'%',h.fecha?fmtD(h.fecha):'—',h.pend].join(';')+'\n';});
    });
    csv+=';;;;;'+Math.round(usdTot)+';Saldo total;;'+Math.round(usdSal)+'\n';
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='EstadoCuenta_'+cli+'.csv';document.body.appendChild(a);a.click();a.remove();
    toast('Estado de cuenta de <b>'+cli+'</b> descargado (Excel/CSV)');
  } else {
    const w=window.open('','_blank'); if(!w){toast('El navegador bloqueó la ventana');return;}
    const body=rows.map(f=>`<h3 style="margin-top:24px">Factura ${f.num} · ${fmtD(f.fecha)} · plazo ${f.plazo}d · TRM ref ${f.trmRef}</h3>
      <table><thead><tr><th>Concepto</th><th style="text-align:right">USD</th></tr></thead><tbody>${f.lineas.map(l=>`<tr><td>${l.desc}${l.pass?' <em>(pass-through)</em>':''}</td><td style="text-align:right">${fmtUSDs(l.usd)}</td></tr>`).join('')}<tr style="font-weight:700"><td>Total factura</td><td style="text-align:right">${fmtUSDs(f.total)}</td></tr></tbody></table>
      <table style="margin-top:8px"><thead><tr><th>Hito</th><th>Fecha</th><th style="text-align:right">Monto</th><th style="text-align:right">Saldo</th></tr></thead><tbody>${f.hitosR.map(h=>`<tr><td>${h.etiq} ${h.pct}%</td><td>${h.fecha?fmtD(h.fecha):'—'}</td><td style="text-align:right">${fmtUSDs(h.monto)}</td><td style="text-align:right">${h.pend>0.01?fmtUSDs(h.pend):'pagado'}</td></tr>`).join('')}</tbody></table>`).join('');
    w.document.write(`<html><head><title>EC ${cli}</title><style>body{font-family:Arial,sans-serif;color:#17181A;padding:32px}h2{margin:0}p{color:#666;margin:4px 0 20px}h3{color:#17181A;margin:20px 0 6px;font-size:14px}table{border-collapse:collapse;width:100%;font-size:11px;margin-bottom:8px}th,td{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#f4f5f6;font-size:10px;text-transform:uppercase}.tot{font-weight:700;font-size:15px;margin-top:18px}em{color:#999;font-style:italic}
</style></head><body><h2>Zentrack · Estado de cuenta</h2><p>${cli} · corte ${fmtD(TODAY)} · USD</p>${body}<p class="tot">Saldo total: US$ ${fmtUSDs(usdSal)}</p></body></html>`);
    w.document.close();setTimeout(()=>w.print(),300);
  }
}

let FWIZ={step:1, files:[], parsed:[], idx:0, links:{}};

function facWizOpen(){
  FWIZ={step:1, files:[], parsed:[], idx:0, links:{}, _prevSnap:snapNow()};
  document.getElementById('reconScrim').classList.add('on');
  renderFacWiz();
}

function parseInvoiceText(t){
  const tc=t.replace(/\n(?=\w)/g,' ');
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  const text=lines.join(' ');
  const inv={_health:[]};
  let m;
  m=text.match(/\b(ZEFV\d+)\b/); inv.num=m?m[1]:null; if(!inv.num)inv._health.push('num');
  m=text.match(/NIT:\s*(\d[\d\-]*)/); inv.nit=m?m[1]:null;
  inv.cliente=lines[0]||null; if(!inv.cliente)inv._health.push('cliente');
  const fs=[...text.matchAll(/(\d{2})-(\d{2})-(\d{4})/g)].map(x=>({d:x[1],m:x[2],y:x[3]}));
  inv.fecha=fs[0]?new Date(+fs[0].y, +fs[0].m-1, +fs[0].d):null; if(!inv.fecha)inv._health.push('fecha');
  inv.limite=fs[1]?new Date(+fs[1].y, +fs[1].m-1, +fs[1].d):null;
  m=text.match(/Términos de pago:\s*(\d+)\s*d/); inv.plazo=m?parseInt(m[1],10):null;
  if(!inv.plazo && inv.fecha && inv.limite) inv.plazo=Math.round((inv.limite-inv.fecha)/86400000);
  if(!inv.plazo)inv._health.push('plazo');
  m=text.match(/TRM DEL DIA[:\s]*(\d+[.,]?\d*)/); inv.trm=m?parseFloat(m[1].replace(',','.')):null; if(!inv.trm)inv._health.push('trm');
  inv.hitos=[];
  const hitosRe=/(Anticipo \d+|Balance):\s*(\d+)\s*%\s*([^.\n]+?)(?=(?:Anticipo|Balance|TRM|$))/g;
  let hm;
  while((hm=hitosRe.exec(text))!==null){
    const etiq=hm[1],pct=parseInt(hm[2],10),disp=hm[3].trim(),d=disp.toLowerCase();
    let trigger='manual';
    if(d.includes('confirmar'))trigger='confirm';
    else if(d.includes('despacho')||d.includes('despacha'))trigger='despacho';
    else if(d.includes('bl')){const dm=disp.match(/(\d+)\s*d[íi]as?\s*(?:del|desde|después)?\s*(?:del\s*)?BL/i);trigger=dm?'bl+'+dm[1]+'d':'bl';}
    inv.hitos.push({etiq,pct,trigger,desc:disp,pagado:0});
  }
  if(!inv.hitos.length){inv.hitos=[{etiq:'Único',pct:100,trigger:'manual',desc:'monto único',pagado:0}];inv._health.push('hitos');}
  inv.lineas=[];
  const linRe=/\[([A-Za-z0-9\-]+)\]\s+([^\[]+?)\s+USD\s+([\d\.,]+)/g;
  let lm;
  while((lm=linRe.exec(tc))!==null){
    const cod=lm[1],mid=lm[2],importe=lm[3];
    const desc=mid.replace(/\s+1,00.*?Unidades?.*?[\d\.,]+\s*$/,'').trim();
    const usd=parseFloat(importe.replace(/\./g,'').replace(',','.'));
    if(isNaN(usd))continue;
    const pass=cod.startsWith('INGRETER')||cod.startsWith('INGTERC')||desc.includes('Terceros');
    inv.lineas.push({cod,desc,usd,pass});
  }
  if(!inv.lineas.length)inv._health.push('lineas');
  m=tc.match(/Total\s+(?:Total\s+)?USD\s+(?:USD\s+)?([\d\.,]+)/);
  inv.total=m?parseFloat(m[1].replace(/\./g,'').replace(',','.')):null;
  inv._ok=inv._health.length===0;
  return inv;
}

async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error('pdf.js no disponible');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    text+=tc.items.map(it=>it.str).join('\n')+'\n';
  }
  return text;
}

async function onFacFiles(files){
  const el=document.getElementById('facWizBody');
  if(el)el.innerHTML='<div style="padding:26px;color:var(--ink2)">Leyendo '+files.length+' factura(s)…</div>';
  FWIZ.parsed=[];
  for(const f of files){
    try{
      const txt=await extractPdfText(f);
      const inv=parseInvoiceText(txt);
      inv._file=f.name;
      FWIZ.parsed.push(inv);
    }catch(err){FWIZ.parsed.push({_file:f.name,_error:err.message,_ok:false,_health:['error']});}
  }
  FWIZ.idx=0;FWIZ.step=2;renderFacWiz();
}

function facWizGo(s){if(s>=1&&s<=4){FWIZ.step=s;renderFacWiz();}}
function facSetField(field,val){
  const inv=FWIZ.parsed[FWIZ.idx];if(!inv)return;
  if(field==='fecha') inv.fecha=val?new Date(val+'T00:00:00'):null;
  else if(field==='plazo'||field==='trm') inv[field]=parseFloat(val)||null;
  else inv[field]=val;
  renderFacWiz();
}
function facSetLinea(i,field,val){
  const inv=FWIZ.parsed[FWIZ.idx];if(!inv||!inv.lineas[i])return;
  if(field==='usd') inv.lineas[i].usd=parseFloat(val)||0;
  else if(field==='pass') inv.lineas[i].pass=val;
  else inv.lineas[i][field]=val;
  renderFacWiz();
}
function facAddLinea(){const inv=FWIZ.parsed[FWIZ.idx];if(!inv)return;(inv.lineas=inv.lineas||[]).push({cod:'',desc:'',usd:0,pass:false});renderFacWiz();}
function facDelLinea(i){const inv=FWIZ.parsed[FWIZ.idx];if(!inv)return;inv.lineas.splice(i,1);renderFacWiz();}
function facSetHito(i,field,val){
  const inv=FWIZ.parsed[FWIZ.idx];if(!inv||!inv.hitos[i])return;
  if(field==='pct') inv.hitos[i].pct=parseFloat(val)||0;
  else if(field==='fecha') inv.hitos[i].fecha=val?new Date(val+'T00:00:00'):null;
  else inv.hitos[i][field]=val;
  renderFacWiz();
}
function facAddHito(){const inv=FWIZ.parsed[FWIZ.idx];if(!inv)return;(inv.hitos=inv.hitos||[]).push({etiq:'Hito '+(inv.hitos.length+1),pct:0,trigger:'manual',desc:'',pagado:0});renderFacWiz();}
function facDelHito(i){const inv=FWIZ.parsed[FWIZ.idx];if(!inv)return;inv.hitos.splice(i,1);renderFacWiz();}

function facWizApprove(){
  let _deltas=[];
  FWIZ.parsed.forEach(inv=>{
    if(FACT.find(x=>x.num===inv.num)){toast('Factura '+inv.num+' ya existía — sobrescrita');FACT=FACT.filter(x=>x.num!==inv.num);}
    const eqRefs=FWIZ.links[inv.num]||[];
    /* Detectar reemplazo de estimado: si algún equipo vinculado tenía precioVenta+logística estimados */
    eqRefs.forEach(d=>{const e=EQ.find(x=>x.derrame===d);if(e){
      const estim=(+e.precioVenta||0)+logisticaTotal(e);
      const real=(inv.lineas||[]).reduce((s,l)=>s+l.usd,0);
      if(estim>0){const delta=real-estim;_deltas.push({eq:e,inv:inv.num,estim,real,delta});}
    }});
    const proj=eqRefs.length?eqRefs.map(d=>{const e=EQ.find(x=>x.derrame===d);return e?e.proj:d;}).join(' · '):(inv._file||'sin vincular');
    FACT.push({num:inv.num,cliente:inv.cliente,nit:inv.nit,fecha:inv.fecha,plazo:inv.plazo,trmRef:inv.trm,lineas:inv.lineas||[],hitos:inv.hitos||[],eqRefs,proj});
    if(!CLI[inv.cliente]){CLI[inv.cliente]={term:inv.plazo||60,fifo:true};}
  });
  CLIENTES=Object.keys(CLI);
  const nEqPrev=(HIST.length?HIST[HIST.length-1].nEq:0);
  pushHistoria(nEqPrev);HIST[HIST.length-1].snapPrev=FWIZ._prevSnap||null;HIST[HIST.length-1].nFac=FWIZ.parsed.length;HIST[HIST.length-1].tipo='facturas';
  if(_deltas.length){
    const msg=_deltas.map(d=>`${d.eq.derrame} · ${d.inv}: estimado US$${fmtUSDs(d.estim)} → real US$${fmtUSDs(d.real)} (Δ ${d.delta>=0?'+':''}${fmtUSDs(d.delta)})`).join('<br>');
    setTimeout(()=>toast('Estimados reemplazados por facturas reales:<br>'+msg),400);
  }
  toast(FWIZ.parsed.length+' factura(s) cargadas · US$ '+fmtUSDs(FWIZ.parsed.reduce((s,i)=>s+(i.lineas||[]).reduce((a,l)=>a+l.usd,0),0)));
  closeRecon();
  renderHoy();renderClientes();renderConfig();renderPagos();
  if(typeof saveToServer==='function')saveToServer();
}

function _rev(v){ return v ? new Date(v) : v; }
/* Si lo guardado viene de un lector anterior a v0.18, lo decimos en pantalla en vez de mostrar cifras viejas como buenas */
function avisoLectorViejo(){

}
function hydrateDates(s){
  (s.ORD||[]).forEach(function(o){ (o.equipos||[]).forEach(function(e){
    ['bl','etd','eta','vence','prodFin','corte','limitePago'].forEach(function(k){ if(e[k]) e[k]=_rev(e[k]); });
  });});
  (s.FACT||[]).forEach(function(f){
    ['fecha','limite'].forEach(function(k){ if(f[k]) f[k]=_rev(f[k]); });
    (f.hitos||[]).forEach(function(h){ if(h.fecha) h.fecha=_rev(h.fecha); });
  });
  (s.PAGOS||[]).forEach(function(p){ ['fecha','ts'].forEach(function(k){ if(p[k]) p[k]=_rev(p[k]); }); });
  (s.HIST||[]).forEach(function(h){ if(h.ts) h.ts=_rev(h.ts); });
  if(s.CONCILIA){ if(s.CONCILIA.ts) s.CONCILIA.ts=_rev(s.CONCILIA.ts); if(s.CONCILIA.tsNuevo) s.CONCILIA.tsNuevo=_rev(s.CONCILIA.tsNuevo); }
}
function serializeState(){
  return JSON.stringify({ v:'1.0', ORD:ORD, FACT:FACT, PAGOS:PAGOS, CONFIG:CONFIG, CLI:CLI, HIST:HIST, CUPO:CUPO, CONCILIA:CONCILIA });
}
function applyState(s){
  if(s.ORD){ ORD.length=0; s.ORD.forEach(function(o){ORD.push(o);}); }
  if(s.FACT){ FACT.length=0; s.FACT.forEach(function(f){FACT.push(f);}); }
  if(s.PAGOS){ PAGOS.length=0; s.PAGOS.forEach(function(p){PAGOS.push(p);}); }
  if(s.CONFIG) Object.assign(CONFIG, s.CONFIG);
  if(s.CUPO) Object.assign(CUPO, s.CUPO);
  CONCILIA = s.CONCILIA || null;
  if(s.CLI){ Object.keys(CLI).forEach(function(k){delete CLI[k];}); Object.assign(CLI, s.CLI); }
  if(s.HIST){ HIST.length=0; s.HIST.forEach(function(h){HIST.push(h);}); }
  PID = PAGOS.reduce(function(m,p){ return Math.max(m, p.id||0); }, 0) + 1;
  hydrateDates(s);
  EQ.length=0; ORD.flatMap(function(o){ return o.equipos; }).forEach(function(e,i){e._i=i;EQ.push(e);});
  CLIENTES = Object.keys(CLI);
  Object.keys(CLI).forEach(function(k){ if(/solenium|sol[ée]/i.test(k) && CLI[k].interno===undefined) CLI[k].interno=true; });
  if(typeof syncFlags==='function') syncFlags();
}
var _saveTimer=null;
function saveToServer(){
  if (typeof google==='undefined' || !google.script) return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(function(){
    google.script.run
      .withFailureHandler(function(err){ if(typeof toast==='function') toast('No se pudo guardar: '+err.message); })
      .saveState(serializeState());
  }, 600);
}
function loadFromServer(){
  function pintar(){
    Object.keys(CLI).forEach(function(k){ if(/solenium|sol[ée]/i.test(k) && CLI[k].interno===undefined) CLI[k].interno=true; });
    renderHoy();renderLedger();renderClientes();renderConfig();renderPagos();
    avisoLectorViejo();
  }
  if (typeof google==='undefined' || !google.script){ pintar(); return; }
  google.script.run
    .withSuccessHandler(function(json){
      if (json && json.length){
        try { applyState(JSON.parse(json)); if(typeof toast==='function') toast('Datos cargados del servidor'); }
        catch(e){ console.error('Estado corrupto:', e); }
      } else { saveToServer(); }
      pintar();
    })
    .withFailureHandler(function(err){
      if(typeof toast==='function') toast('Backend no disponible, trabajando en memoria');
      pintar();
    })
    .loadState();
}

/* el grupo que cubre a un pedido (un pedido no puede estar en dos) */
const gpDeEq=e=>GPRE.find(g=>(g.eqRefs||[]).indexOf(e.derrame)>=0);
const gpEquipos=g=>EQ.filter(e=>(g.eqRefs||[]).indexOf(e.derrame)>=0);

/* --- el reparto del total entre los pedidos del grupo --- */
function gpPesos(g){
  const eqs=gpEquipos(g);
  if(!eqs.length) return {eqs,pesos:[],aviso:''};
  let pesos, aviso='';
  if(g.base==='equipos') pesos=eqs.map(e=>Math.max(1,+e.qty||1));
  else if(g.base==='manual') pesos=eqs.map(e=>+((g.partes||{})[e.derrame])||0);
  else pesos=eqs.map(e=>+e.cupoMonto||+e.mfgAmt||0);
  const suma=pesos.reduce((s,x)=>s+x,0);
  if(suma<=0){
    pesos=eqs.map(()=>1);
    aviso=g.base==='manual'
      ? 'Todavía no has repartido nada a mano: por ahora se divide en partes iguales.'
      : 'No hay valores para repartir con esa base, así que se divide en partes iguales.';
  }
  const t=pesos.reduce((s,x)=>s+x,0);
  return {eqs, pesos:pesos.map(x=>x/t), aviso};
}
/* cuánto le toca a un pedido del total del grupo */
function gpParte(g,e){
  if(g.base==='manual') return +((g.partes||{})[e.derrame])||0;
  const {eqs,pesos}=gpPesos(g);
  const i=eqs.indexOf(e); if(i<0) return 0;
  const T=+g.total||0;
  /* la última parte absorbe el redondeo para que las partes sumen el total exacto */
  if(i===eqs.length-1){
    let acum=0; for(let k=0;k<eqs.length-1;k++) acum+=Math.round(T*pesos[k]*100)/100;
    return Math.round((T-acum)*100)/100;
  }
  return Math.round(T*pesos[i]*100)/100;
}
const gpRepartido=g=>g.base==='manual'
  ? Object.values(g.partes||{}).reduce((s,x)=>s+(+x||0),0)
  : gpEquipos(g).reduce((s,e)=>s+gpParte(g,e),0);

/* ---- EL ENGANCHE: el precio de venta de un pedido ----
   Si está en un grupo, manda el grupo. Si no, lo de siempre. */
const _precioVentaOrig=precioVenta;
precioVenta=function(e){
  const g=gpDeEq(e);
  if(g) return gpParte(g,e);
  return _precioVentaOrig(e);
};

/* ---- EL ENGANCHE: guardar y recuperar ---- */
const _serOrig=serializeState;
serializeState=function(){
  const o=JSON.parse(_serOrig());
  o.GPRE=GPRE;
  return JSON.stringify(o);
};
const _appOrig=applyState;
applyState=function(s){
  _appOrig(s);
  GPRE=Array.isArray(s.GPRE)?s.GPRE:[];
  GPRE.forEach(g=>{g.eqRefs=g.eqRefs||[];g.partes=g.partes||{};});
  if(GSEL&&!gpDe(GSEL))GSEL=null;
  if(typeof sincronizarPrecios==='function') sincronizarPrecios();
};
function guardar4(){ if(typeof saveToServer==='function') saveToServer(); }

/* ---- EL ENGANCHE: repintar también las pestañas nuevas ---- */
const _refOrig=refreshAll;
refreshAll=function(){ _refOrig(); try{pintarPrecios();pintarSino();}catch(e){} };

/* =============== PESTAÑA PRECIOS =============== */
function pintarPrecios(){
  const cont=document.getElementById('v-precios'); if(!cont) return;
  const sinGrupo=EQ.filter(e=>!gpDeEq(e));
  const sinPrecio=sinGrupo.filter(e=>!(+e.precioVenta>0));
  const totGrupos=GPRE.reduce((s,g)=>s+(+g.total||0),0);

  if(!EQ.length){
    cont.innerHTML=`<div class="g4em"><h3>Primero carga tus pedidos</h3>
      <p>Esta pestaña arma precios sobre los pedidos del order report. Carga los datos y vuelve.</p>
      <button class="btn" onclick="verifyOpen()">Cargar datos</button></div>`;
    return;
  }
  if(GSEL&&!gpDe(GSEL))GSEL=null;
  if(!GSEL&&GPRE.length)GSEL=GPRE[0].id;

  cont.innerHTML=`
    <div class="snkpis">
      <div class="snk"><div class="l">Grupos de precio</div><div class="v">${GPRE.length}</div>
        <div class="d">cubren <b>${EQ.length-sinGrupo.length}</b> de ${EQ.length} pedidos</div></div>
      <div class="snk"><div class="l">Valor de los grupos</div><div class="v">US$ ${fmtUSDs(totGrupos)}</div>
        <div class="d">precio a clientes, escrito a mano</div></div>
      <div class="snk"><div class="l">Pedidos sueltos con precio</div><div class="v">${sinGrupo.length-sinPrecio.length}</div>
        <div class="d">con su precio individual de siempre</div></div>
      <div class="snk"><div class="l">Pedidos sin precio</div>
        <div class="v ${sinPrecio.length?'mal':'ok'}">${sinPrecio.length}</div>
        <div class="d">${sinPrecio.length?'no entran al estado de cuenta':'todos tienen precio'}</div></div>
    </div>
    <div class="sec" style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <h2 style="font-size:16px;font-weight:600">Precios por grupo</h2>
      <div style="font-size:12.5px;color:var(--ink2)">cuando facturas varios proyectos juntos, un total y la herramienta lo reparte</div>
      <div style="flex:1"></div>
      <button class="btn primary" onclick="gpNuevo()">+ Nuevo grupo</button>
    </div>
    <div class="g4wrap">
      <div>
        <div class="g4list">${GPRE.length?GPRE.map(g=>{
          const n=(g.eqRefs||[]).length;
          return `<div class="g4item ${g.id===GSEL?'on':''}" onclick="GSEL='${g.id}';pintarPrecios()">
            <span class="v">${fmtUSDs(g.total)}</span>
            <div class="n">${esc4(g.nombre||g.facNum||'Grupo sin nombre')}</div>
            <div class="m">${esc4(g.cliente||'sin cliente')} · ${n} pedido(s)${g.facNum?' · '+esc4(g.facNum):''}</div></div>`;
        }).join(''):'<div style="padding:18px;font-size:12.5px;color:var(--ink3)">Todavía no has creado ningún grupo.</div>'}</div>
        ${sinPrecio.length?`<div class="g4av" style="margin:14px 0 0">
          <b>${sinPrecio.length} pedido(s) sin precio.</b> No suman al estado de cuenta.
          <div style="margin-top:8px"><button class="btn" onclick="gpDesdeSinPrecio()">Crear un grupo con ellos</button></div>
        </div>`:''}
      </div>
      <div>${GSEL?editorGrupo(gpDe(GSEL)):`<div class="g4em">
        <h3>Crea tu primer grupo de precio</h3>
        <p>Un grupo es una factura (o una que todavía no existe): escoges los pedidos que van juntos,
           escribes <b>un solo total</b>, y la herramienta lo reparte entre ellos para el estado de cuenta.</p>
        <button class="btn primary" onclick="gpNuevo()">+ Nuevo grupo</button></div>`}</div>
    </div>`;
}
const esc4=s=>(''+(s==null?'':s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function editorGrupo(g){
  if(!g) return '';
  const {eqs,aviso}=gpPesos(g);
  const rep=gpRepartido(g), dif=Math.round(((+g.total||0)-rep)*100)/100;
  const q=(GQ||'').toLowerCase().trim();
  const cands=EQ.filter(e=>{const o=gpDeEq(e);return !o||o.id===g.id;})
    .filter(e=>!g.cliente||e.cliente===g.cliente||gpDeEq(e))
    .filter(e=>{ if(!q) return true;
      if((g.eqRefs||[]).indexOf(e.derrame)>=0) return true;      /* los marcados nunca se esconden */
      return ((e.derrame||'')+' '+(projOf(e)||'')+' '+(e.cliente||'')).toLowerCase().indexOf(q)>=0; })
    /* primero los que ya están en el grupo: son los que estás tocando */
    .sort((x,y)=>{const a=(g.eqRefs||[]).indexOf(x.derrame)>=0?0:1,
                        bb=(g.eqRefs||[]).indexOf(y.derrame)>=0?0:1;return a-bb;});
  const fac=g.facNum?FACT.find(f=>f.num===g.facNum):null;
  const sug=!fac?FACT.filter(f=>(f.eqRefs||[]).some(d=>(g.eqRefs||[]).indexOf(d)>=0)&&!GPRE.some(x=>x.facNum===f.num)):[];

  return `<div class="g4card">
    <div class="g4h">
      <div class="t">${esc4(g.nombre||'Grupo sin nombre')}</div>
      <div style="font-size:12.5px;color:var(--ink2);margin-top:2px">
        ${eqs.length} pedido(s) · reparto por ${({costo:'costo del pedido',equipos:'# de equipos',manual:'lo que yo escriba'})[g.base]}</div>
    </div>

    <div class="g4b"><div class="g4grid">
      <div class="g4f"><label>Nombre del grupo</label>
        <input value="${esc4(g.nombre)}" placeholder="Factura Mompox" oninput="gpSet('${g.id}','nombre',this.value)">
        <div class="h">para reconocerlo en la lista</div></div>
      <div class="g4f"><label>Cliente</label>
        <select onchange="gpSet('${g.id}','cliente',this.value,true)">
          <option value="">— sin cliente —</option>
          ${CLIENTES.map(c=>`<option value="${esc4(c)}" ${c===g.cliente?'selected':''}>${esc4(c)}</option>`).join('')}
        </select><div class="h">solo salen sus pedidos</div></div>
      <div class="g4f"><label>Precio total del grupo (USD)</label>
        <input class="n" type="number" step="any" value="${g.total||''}" placeholder="0"
          oninput="gpSet('${g.id}','total',this.value)">
        <div class="h">lo que le cobras al cliente por todo junto</div></div>
      <div class="g4f"><label>Repartirlo por</label>
        <select onchange="gpSet('${g.id}','base',this.value,true)">
          <option value="costo" ${g.base==='costo'?'selected':''}>Costo de cada pedido</option>
          <option value="equipos" ${g.base==='equipos'?'selected':''}># de equipos</option>
          <option value="manual" ${g.base==='manual'?'selected':''}>A mano, pedido por pedido</option>
        </select><div class="h">cambia solo el reparto, no el total</div></div>
      <div class="g4f"><label>Fecha</label>
        <input type="date" value="${esc4(g.fecha)}" onchange="gpSet('${g.id}','fecha',this.value)"><div class="h"></div></div>
      <div class="g4f"><label>Nota</label>
        <input value="${esc4(g.nota)}" placeholder="…" oninput="gpSet('${g.id}','nota',this.value)"><div class="h"></div></div>
    </div></div>

    ${aviso?`<div class="g4av">${aviso}</div>`:''}
    ${g.base==='manual'&&Math.abs(dif)>0.5?`<div class="g4av">
      Repartiste <b>${fmtUSDs(rep)}</b> de <b>${fmtUSDs(g.total)}</b>:
      ${dif>0?`te faltan <b>${fmtUSDs(dif)}</b>`:`te pasaste por <b>${fmtUSDs(-dif)}</b>`}.
      <button class="btn" style="margin-left:8px" onclick="gpCuadrar('${g.id}')">Cuadrar en la última fila</button>
    </div>`:''}

    <div class="g4sec" style="display:flex;align-items:center;gap:10px">
      <span>Pedidos que cubre este grupo</span>
      <span style="flex:1"></span>
      <input id="gq" value="${esc4(GQ)}" placeholder="filtrar por pedido, proyecto o cliente…"
        oninput="GQ=this.value;pintarPrecios();setTimeout(()=>{const i=document.getElementById('gq');
          if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},0)"
        style="text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;border:1px solid var(--rule2);
               border-radius:16px;padding:4px 11px;width:260px;background:var(--surface)">
    </div>
    <div style="max-height:420px;overflow:auto"><table class="g4t"><thead><tr>
      <th style="width:34px"></th><th>Pedido</th><th>Proyecto</th>
      <th class="r">Costo</th><th class="r">Equipos</th><th class="r">Le toca</th>
    </tr></thead><tbody>
      ${cands.length?cands.map(e=>{
        const dentro=(g.eqRefs||[]).indexOf(e.derrame)>=0;
        return `<tr style="${dentro?'':'opacity:.5'}">
          <td><input type="checkbox" class="g4chk" ${dentro?'checked':''}
            onchange="gpToggle('${g.id}','${e.derrame}',this.checked)"></td>
          <td><b>${esc4(e.derrame)}</b><div style="font-size:11px;color:var(--ink3)">${esc4(e.cliente)}</div></td>
          <td>${esc4(projOf(e)||'—')}</td>
          <td class="r">${fmtUSDs(+e.cupoMonto||+e.mfgAmt||0)}</td>
          <td class="r">${e.qty||1}</td>
          <td class="r">${dentro?(g.base==='manual'
            ? `<input class="n" type="number" step="any" value="${(g.partes||{})[e.derrame]||''}"
                 placeholder="0" oninput="gpParteSet('${g.id}','${e.derrame}',this.value)">`
            : `<b>${fmtUSDs(gpParte(g,e))}</b>`):'<span style="color:var(--ink3)">—</span>'}</td>
        </tr>`;}).join(''):`<tr><td colspan="6" style="padding:16px;color:var(--ink3)">
          ${g.cliente?'Ese cliente no tiene pedidos libres.':'Escoge un cliente para ver sus pedidos.'}</td></tr>`}
      <tr class="tt"><td colspan="5">Total repartido</td>
        <td class="r">${fmtUSDs(rep)}${Math.abs(dif)>0.5?` <span class="g4tag mal">faltan ${fmtUSDs(dif)}</span>`:''}</td></tr>
    </tbody></table></div>

    <div class="g4sec">Factura real</div>
    <div class="g4b">
      ${fac?`<div style="font-size:13px"><b>${esc4(fac.num)}</b> · ${fmtD(fac.fecha)} ·
          total <b>${fmtUSDs(totalFac(fac))}</b>
          <button class="btn" style="margin-left:10px" onclick="gpDesligar('${g.id}')">Desligar</button></div>
        ${Math.abs(totalFac(fac)-(+g.total||0))>1?`<div class="g4av" style="margin:12px 0 0">
          <b>El total de la factura no coincide con el que escribiste a mano.</b>
          <div class="g4cmp">
            <div><div class="l">Tu precio manual</div><div class="v">${fmtUSD(g.total)}</div>
              <button class="btn" style="margin-top:9px" onclick="toast('Se deja tu precio manual')">Dejar el mío</button></div>
            <div><div class="l">La factura ${esc4(fac.num)}</div><div class="v">${fmtUSD(totalFac(fac))}</div>
              <button class="btn" style="margin-top:9px" onclick="gpTomarFac('${g.id}')">Usar el de la factura</button></div>
          </div></div>`:`<div class="g4av" style="margin:12px 0 0;background:#E7F1EC;border-color:#B7D4C9;color:#2E6E5A">
            Cuadra con tu precio manual.</div>`}`
      :`<div style="font-size:12.5px;color:var(--ink2)">
          Todavía no hay factura real enganchada. Cárgala con <b>Cargar facturas</b> y vuelve aquí,
          o engánchala si ya está cargada.</div>
        ${sug.length?`<div style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap">
          ${sug.map(f=>`<button class="btn" onclick="gpLigar('${g.id}','${esc4(f.num)}')">
            Enganchar ${esc4(f.num)} · ${fmtUSDs(totalFac(f))}</button>`).join('')}</div>`:''}`}
    </div>

    <div class="g4acts">
      <button class="btn" onclick="navTo('clientes')">Ver el estado de cuenta</button>
      <div style="flex:1"></div>
      <button class="btn" style="color:var(--danger);border-color:#e8c9c5" onclick="gpBorrar('${g.id}')">Eliminar grupo</button>
    </div>
  </div>`;
}

function gpSet(id,f,v,recarga){
  const g=gpDe(id); if(!g) return;
  g[f]=(f==='total')?(+v||0):v;
  if(f==='cliente'){ /* un pedido de otro cliente no puede quedarse en el grupo */
    g.eqRefs=(g.eqRefs||[]).filter(d=>{const e=EQ.find(x=>x.derrame===d);return e&&(!v||e.cliente===v);});
  }
  refreshAll(); renderLedger(); guardar4();
  if(recarga||f==='cliente') pintarPrecios();
}
function gpToggle(id,derrame,on){
  const g=gpDe(id); if(!g) return;
  g.eqRefs=g.eqRefs||[];
  const i=g.eqRefs.indexOf(derrame);
  if(on&&i<0) g.eqRefs.push(derrame);
  if(!on&&i>=0){ g.eqRefs.splice(i,1); if(g.partes) delete g.partes[derrame]; }
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
}
function gpParteSet(id,derrame,v){
  const g=gpDe(id); if(!g) return;
  g.partes=g.partes||{}; g.partes[derrame]=+v||0;
  refreshAll(); renderLedger(); guardar4();
  const el=document.querySelector('.g4t tr.tt td.r'); if(el) el.innerHTML=fmtUSDs(gpRepartido(g));
}
function gpCuadrar(id){
  const g=gpDe(id); if(!g) return;
  const eqs=gpEquipos(g); if(!eqs.length) return;
  const ult=eqs[eqs.length-1];
  let otros=0; eqs.slice(0,-1).forEach(e=>otros+=(+(g.partes||{})[e.derrame]||0));
  g.partes=g.partes||{};
  g.partes[ult.derrame]=Math.round(((+g.total||0)-otros)*100)/100;
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
  toast(`<b>${esc4(ult.derrame)}</b> ajustado a ${fmtUSDs(g.partes[ult.derrame])} para cuadrar el total`);
}
function gpBorrar(id){
  const g=gpDe(id); if(!g) return;
  if(!confirm('¿Eliminar el grupo "'+(g.nombre||'sin nombre')+'"? Los pedidos vuelven a su precio individual.')) return;
  GPRE.splice(GPRE.indexOf(g),1); GSEL=null;
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
  toast('Grupo eliminado');
}
function gpDesdeSinPrecio(){
  const sin=EQ.filter(e=>!gpDeEq(e)&&!(+e.precioVenta>0));
  if(!sin.length) return;
  const cli=sin[0].cliente;
  const mismos=sin.filter(e=>e.cliente===cli);
  gpNuevo();
  const g=GPRE[GPRE.length-1];
  g.cliente=cli; g.eqRefs=mismos.map(e=>e.derrame);
  g.nombre='Sin facturar · '+cli;
  pintarPrecios(); guardar4();
  toast(`Grupo con los ${mismos.length} pedido(s) sin precio de <b>${esc4(cli)}</b> · ponle el total`);
}
function gpLigar(id,num){
  const g=gpDe(id), f=FACT.find(x=>x.num===num); if(!g||!f) return;
  g.facNum=f.num; g.facTotal=totalFac(f); g.facFecha=f.fecha||null;
  if(!g.nombre) g.nombre=f.num;
  pintarPrecios(); guardar4();
  toast(Math.abs(totalFac(f)-(+g.total||0))>1
    ? `<b>${esc4(f.num)}</b> enganchada · los totales no coinciden, decide cuál queda`
    : `<b>${esc4(f.num)}</b> enganchada · cuadra con tu precio manual`);
}
function gpDesligar(id){
  const g=gpDe(id); if(!g) return;
  g.facNum=null; g.facTotal=null; g.facFecha=null;
  pintarPrecios(); guardar4(); toast('Factura desligada · tu precio manual queda igual');
}
function gpTomarFac(id){
  const g=gpDe(id), f=g&&g.facNum?FACT.find(x=>x.num===g.facNum):null; if(!g||!f) return;
  const antes=+g.total||0;
  g.total=totalFac(f);
  if(f.fecha) g.fecha=isoW(f.fecha);
  pintarPrecios(); refreshAll(); renderLedger(); guardar4();
  toast(`Total del grupo: ${fmtUSDs(antes)} → <b>${fmtUSDs(g.total)}</b>, según ${esc4(f.num)}`);
}

</script>
