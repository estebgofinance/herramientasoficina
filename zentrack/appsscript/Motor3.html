<script>

/* ================================================================
   LECTOR PRINCIPAL — TODO SALE DEL DETAILED
   Hoja Summary: un bloque por pedido, con la fila del fabricante (identidad,
   fechas, monto y todos sus pagos) y debajo las filas de otros componentes.
   Hoja Sinosure: el cupo que consume cada pedido, leído por sus fórmulas.
   El ORDER REPORT queda opcional y solo aporta el cliente de cada pedido.
   ================================================================ */
const _ST_DET=[['shipped','shipped'],['shipping','shipping'],['arranging shipment','booked'],
  ['shipment booked','booked'],['shipment pending','booked'],['production finished','finished'],
  ['shelters testing','finished'],['in production','prod'],['production','prod'],
  ['under confirmation','confirm'],['pending confirmation','confirm']];
const _mapStDet=v=>{const t=_txt(v); if(!t) return null;
  for(const [k,x] of _ST_DET) if(t.indexOf(k)>=0) return x; return null;};
/* una descripción técnica no es un proyecto */
const _esSpec=t=>/\d+\s*units?|kva|kv\b|transformer|shelter|natural oil|dry-?type|abb|\blv\b|\brmu\b/i.test(t||'');
const _esFecha=v=>!!(v&&typeof v==='object'&&typeof v.getTime==='function');
function _fechaDet(v){ if(_esFecha(v)){const t=v.getTime(); if(isNaN(t))return null;
    const d=new Date(t); return d.getFullYear()<1990?null:d; }                 /* Andrés escribe 1899 por "pendiente" */
  const s=(''+(v==null?'':v)).trim(); if(!/^\d{4}-\d{2}-\d{2}/.test(s)) return null;
  const d=new Date(s); return (isNaN(d)||d.getFullYear()<1990)?null:d; }

/* Filas agregadas: un bloque cuyo monto es la suma de sus hermanos consecutivos
   (el PO#7-5 de 293.698 que en realidad son el 7-5 al 7-9). No es un pedido. */
function _marcarAgregados(det){
  const porClave={}; det.orden.forEach(k=>det.bloques[k].forEach(b=>{(porClave[_bKey(b.mfg,b.key)]=porClave[_bKey(b.mfg,b.key)]||[]).push(b);}));
  det.orden.forEach(k=>det.bloques[k].forEach(b=>{
    const m=b.key.match(/^(CFM)?(\d+)-(\d+)$/); if(!m||!(b.fab.monto>0)) return;
    let suma=0, hermanos=[];
    for(let n=+m[3], t=0; t<20; n++, t++){
      const cand=(porClave[_bKey(b.mfg,(m[1]||'')+m[2]+'-'+n)]||[]).filter(x=>x!==b&&x.fab.monto>0);
      if(!cand.length){
        /* Una fila madre SIEMPRE repite su propio número: el "PO#7-5" de 293.699 vive
           al lado del "PO#7-5" de 70.937, que es el pedido de verdad. Si no existe otro
           bloque con su mismo número, no es una fila madre, es un pedido cuyo monto
           coincide de casualidad con la suma de los siguientes (le pasa al CFM3-1 de
           257.600, que da lo mismo que CFM3-2 + CFM3-3 y sí es un pedido real). */
        if(n===+m[3]) return;
        break;
      }
      const x=cand[0]; suma+=x.fab.monto; hermanos.push(x.key);
      if(hermanos.length>=2 && Math.abs(suma-b.fab.monto)<=Math.max(2,b.fab.monto*0.005)){ b.agregado=hermanos.slice(); return; }
      if(suma>b.fab.monto) return;
    }
  }));
}

/* Dos bloques del MISMO fabricante con la misma designación son pedidos distintos
   cuando el sufijo de entidad difiere: "PO CFM3-2" (CFM Shelter, Solenium) y
   "PO CFM3-2 INGEV2" (INGEV2 Shelter) no son el mismo pedido aunque el número
   coincida. Solo en ese caso se le pega el sufijo a la clave, para no moverle la
   identidad a los pedidos que no tienen gemelo (y no perder lo que ya está guardado). */
function _separarGemelos(det){
  const porDesig={};
  det.orden.forEach(k=>det.bloques[k].forEach(b=>{
    const d=_bKey(b.mfg,b.key);(porDesig[d]=porDesig[d]||[]).push(b);}));
  let hubo=false;
  Object.values(porDesig).forEach(g=>{
    if(g.length<2) return;
    const vars=g.map(b=>_poVar(b.poRaw));
    if(new Set(vars).size<2) return;          /* mismo nombre: no son gemelos (p.ej. la fila agregada) */
    g.forEach((b,i)=>{ if(vars[i]){ b.key=b.key+'#'+vars[i].replace(/\s+/g,''); hubo=true; } });
  });
  if(!hubo) return;
  const bloques={}, orden=[];
  det.orden.forEach(k=>det.bloques[k].forEach(b=>{
    const nk=_bKey(b.mfg,b.key);
    if(!bloques[nk]){bloques[nk]=[];orden.push(nk);}
    bloques[nk].push(b);}));
  det.bloques=bloques; det.orden=orden;
}

/* Un renglón de la hoja cuya fórmula repite una celda ya contada NO siempre es un
   error de copia. Cuando existe otro pedido con la misma designación y distinto
   sufijo de entidad ("PO CFM3-2" de Solenium y "PO CFM3-2 INGEV2"), lo que pasó es
   que Andrés rotuló el renglón pensando en el gemelo y dejó pegada la fórmula vieja.
   En ese caso el renglón NO se descarta: se le atribuye al gemelo y ese pedido entra
   a la lista para que tú decidas qué hace con el cupo. */
function _gemelosDeDup(det,sino){
  const out={};
  if(!det||!sino||!sino.entradas) return out;
  const bloques=[];
  det.orden.forEach(k=>det.bloques[k].forEach(b=>bloques.push(b)));
  const tomadas={};
  sino.entradas.forEach(e=>{ if(e.ref&&!e.duplicado) tomadas[e.ref.fila]=true; });
  sino.entradas.forEach(e=>{
    if(!e.duplicado) return;
    const des=_poKey(e.etiqueta);
    const cand=bloques.filter(b=>b.mfg===e.lado
      && b.key.split('#')[0]===des
      && !tomadas[b.fila]
      && !b.agregado);
    if(cand.length===1){ out[e.celda]=cand[0]; tomadas[cand[0].fila]=true; }
  });
  return out;
}

/* Construye los pedidos desde el detailed */
function equiposDesdeDetailed(det, sino){
  _separarGemelos(det);
  _marcarAgregados(det);
  const enSino={};
  if(sino) sino.entradas.forEach(e=>{ if(e.ref) enSino[e.ref.fila]=true; });
  /* el gemelo de un renglón duplicado queda VIVO aunque no tenga saldo:
     si no, el pedido se omitiría como cerrado y el renglón se perdería igual */
  const _gd=_gemelosDeDup(det,sino);
  Object.keys(_gd).forEach(function(c){ enSino[_gd[c].fila]=true; });
  const equipos=[], omitidos=[], agregados=[]; let idx=0;
  det.orden.forEach(k=>det.bloques[k].forEach(b=>{
    if(b.agregado){ agregados.push({poRaw:b.poRaw,fila:b.fila,monto:b.fab.monto,cubre:b.agregado}); return; }
    const id=b.id||{};
    const mfg=b.mfg==='Eaglerise'?'Eaglerise':(b.mfg==='Singsun'?'Singsun':null);
    const propio=_numC(id.total);
    const cupoMonto=Math.round(b.fab.monto||0);
    const otrosMonto=Math.round(b.otros.monto||0);
    const cupoSaldo=Math.round(b.fab.pendiente||0), otrosSaldo=Math.round(b.otros.pendiente||0);
    const vivo=(cupoSaldo+otrosSaldo)>0.5 || enSino[b.fila];
    if(!mfg || (!cupoMonto && !otrosMonto)){ omitidos.push({poRaw:b.poRaw,fila:b.fila,motivo:'sin fabricante ni montos'}); return; }
    if(!vivo){ omitidos.push({poRaw:b.poRaw,fila:b.fila,motivo:'sin saldo y fuera de la hoja Sinosure · pedido cerrado',monto:cupoMonto}); return; }
    const base=b.key.split('#')[0], ent=b.key.split('#')[1]||'';
    const mc=base.match(/^CFM(\d+)(?:-(\d+))?/);
    const ordenId = mc? 'CFM'+mc[1] : base.replace(/-\d+$/,'');
    const derrame = (mc? 'CFM '+mc[1]+(mc[2]?'-'+mc[2]:'') : base)+(ent?' '+ent:'');
    const prod=(''+(id.prod||'')).replace(/[\r\n]+/g,' ').trim();
    const desc=(''+(id.desc||'')).replace(/[\r\n]+/g,' ').trim();
    const tipo = /tracker/i.test(prod)?'Tracker' : (/shelter/i.test(prod)?'Shelter' : (mfg==='Singsun'?'Tracker':'Shelter'));
    /* el proyecto está unas veces en Product description y otras en Product */
    let proj = (!_esSpec(desc) && desc && !/^\d+(-\d+)?$/.test(desc)) ? desc
             : ((!_esSpec(prod) && !/tracker|shelter|spare/i.test(prod)) ? prod : '');
    /* la columna Quantity a veces viene vacía y el número queda en la descripción
       ("8 units", "6 units 1100/13.8 oil shelters"): ahí lo buscamos de respaldo */
    let _qty=_qtyC(id.qty);
    if(_qty.n===1 && !_qty.txt){
      for(const alt of [id.desc,id.prod]){
        const s=(''+(alt==null?'':alt)).replace(/[\r\n]+/g,' ').trim();
        if(/^\d+\s*(units?|sets?|pcs|shelters?|trackers?|pilot)/i.test(s)){const q=_qtyC(s);if(q.n>1){_qty=q;break;}}
      }
    }
    const st=_mapStDet(id.st) || (cupoSaldo>0.5?'prod':'shipped');
    const etd=_fechaDet(id.etd), blf=_fechaDet(id.bl);
    const pagosFab=b.lineas.filter(l=>l.esFab).flatMap(l=>l.pagos);
    const pend=pagosFab.filter(p=>p.estado==='pending'&&p.monto>0.5);
    const limite=pend.map(p=>p.fecha).filter(Boolean).sort((x,y)=>x-y)[0]||null;
    const antPct=CONFIG[mfg]?CONFIG[mfg].antPct:0.1;
    const antTot=Math.round(cupoMonto*antPct);
    const antPend=(b.antStatus==='paid')?0:Math.min(cupoSaldo, b.fab.antPend>0.5?b.fab.antPend:antTot);
    equipos.push({
      _i:idx++, ordenId, derrame, fila:b.fila, bloqueDet:b.poRaw,
      proj, st, stRaw:(''+(id.st||'')).replace(/[\r\n]+/g,' ').trim(), dudoso:!_mapStDet(id.st),
      mfg, tipo, cliente:'Por asignar', qty:_qty.n, qtyRaw:_qty.txt,
      sinoManual:null,
      mfgAmt:cupoMonto, cupoMonto, cupoPagado:Math.round(b.fab.pagado||0), cupoSaldo, cupoSaldo0:cupoSaldo,
      otrosMonto, otrosPagado:Math.round(b.otros.pagado||0), otrosSaldo,
      otrosDesglose:b.otros.proveedores.length?b.otros.proveedores.map(x=>({nombre:x.nombre,monto:x.monto,pagado:x.pagado,saldo:x.saldo})):null,
      totalChina:(propio!=null?Math.round(propio):cupoMonto+otrosMonto),
      totalPagado:Math.round((b.fab.pagado||0)+(b.otros.pagado||0)),
      totalSaldo:cupoSaldo+otrosSaldo,
      antTot, antPaid:(b.antStatus==='paid'), antPend, antPaid0:(b.antStatus==='paid'), antPend0:antPend,
      antFuente:'detailed', antStatus:b.antStatus,
      pagosChina:pagosFab.map(p=>({slot:p.slot,tipo:p.tipo,monto:Math.round(p.monto||0),estado:p.estado||'—',implicito:!!p.implicito,fecha:p.fecha||null})),
      balPaid:cupoSaldo<=0.5,
      bl:(st==='shipped'||st==='shipping')?(blf||etd||null):null,
      etd, eta:_fechaDet(id.eta), prodFin:_fechaDet(id.prodFin),
      blNo:null, telex:null, limitePago:limite, limiteFuente:limite?'detailed · fecha del pago pendiente':null,
      integ:[], nota:'', pctOverride:null, lector:'v2',
    });
  }));
  const totals={Singsun:0,Eaglerise:0}, totalsU={Singsun:0,Eaglerise:0}, totalsM={Singsun:0,Eaglerise:0};
  equipos.forEach(e=>{ if(totals[e.mfg]!=null){totals[e.mfg]+=e.cupoSaldo;totalsU[e.mfg]+=e.totalSaldo;totalsM[e.mfg]+=e.cupoMonto;} });
  return {equipos, ordenes:[...new Set(equipos.map(e=>e.ordenId))], totals, totalsU, totalsM,
          omitidos, agregados, avisos:[], sourceHoja:'Summary del detailed'};
}

/* La hoja Simplified Summary aporta el número de BL y el telex */
function parseSimplificado(wb){
  const ws=_sheet(wb,'Simplified Summary'); if(!ws) return {};
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,cellDates:true,defval:null});
  let hr=-1; for(let i=0;i<8;i++){const r=(rows[i]||[]).map(_txt); if(r.indexOf('po')>=0){hr=i;break;}}
  if(hr<0) return {};
  const H=(rows[hr]||[]).map(_txt);
  const ix=(re)=>H.findIndex(h=>re.test(h));
  const cBL=ix(/bl no/), cTx=ix(/telex/), cSt=ix(/^status/);
  const out={};
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]||[]; if(!r[0]) continue;
    const k=_poKey(r[0]);
    const bl=cBL>=0?(''+(r[cBL]||'')).replace(/[\r\n]+/g,' ').trim():'';
    out[k]={blNo:(bl&&!/^pending$/i.test(bl))?bl:null,
            telex:cTx>=0?(''+(r[cTx]||'')).replace(/[\r\n]+/g,' ').trim():null,
            st:cSt>=0?r[cSt]:null};
  }
  return out;
}

/* ---------- Casar la hoja Sinosure con los pedidos ----------
   Con la fórmula sabemos la fila exacta del Summary, y por la fila, el pedido.
   Solo cuando un renglón no trae fórmula se cae a emparejar por la etiqueta. */
function casarSinosure(equipos, sino, det){
  const mapa={}, sueltos=[], duplicados=[], reatribuidos=[], detalle={};
  if(!sino) return {mapa,sueltos,duplicados,reatribuidos,detalle};
  const _GEMDUP=_gemelosDeDup(det,sino);
  /* fila del Summary → pedido: la fila de cada línea del bloque (fabricante y proveedores) */
  const filaAClave={}, filaABloque={};
  if(det) det.orden.forEach(k=>det.bloques[k].forEach(b=>b.lineas.forEach(l=>{filaAClave[l.fila]=_bKey(b.mfg,b.key);filaABloque[l.fila]=b;})));
  /* la clave lleva el sufijo de entidad: si no, los gemelos se mezclan otra vez */
  const porClave={}; equipos.forEach(e=>{const k=kOf(e);(porClave[k]=porClave[k]||[]).push(e);});
  const porEtiqueta={}; equipos.forEach(e=>{const k=kOf(e);(porEtiqueta[k]=porEtiqueta[k]||[]).push(e);});
  /* Casa la etiqueta de un renglón de la hoja contra los pedidos. En orden:
     1) la designación con su sufijo de entidad ("CFM 3.2 INGEV2");
     2) la designación sola ("CFM 3.2" → CFM3-2, da igual el punto o el guion);
     3) el prefijo más largo de la secuencia de números, porque la hoja a veces le
        agrega la especificación detrás ("PO 15 13.2 3200 m" es el PO#15). */
  const candEtq=(lado,etq)=>{
    const out=[], v=_poVarK(etq);
    if(v) out.push(lado+'|'+_poKey(etq)+v);
    out.push(lado+'|'+_poKey(etq));
    const q=_poNums(etq), cfm=/CFM/.test(_poNorm(etq))?'CFM':'';
    for(let n=q.length-1;n>0;n--) out.push(lado+'|'+cfm+q.slice(0,n).join('-'));
    return out;
  };
  const resuelveEtq=(lado,etq)=>{
    for(const k of candEtq(lado,etq)){ const g=porEtiqueta[k]; if(g&&g.length) return g; }
    return [];
  };
  const tomadosEtq=new Set();
  const asigna=(grupo,ent)=>{
    const totM=grupo.reduce((s,e)=>s+(+e.cupoMonto||0),0);
    grupo.forEach(e=>{
      const parte=totM?ent.valor*((+e.cupoMonto||0)/totM):ent.valor/grupo.length;
      const kk=kOf(e);
      const m=mapa[kk]||(mapa[kk]={sino:0,lineas:[]});
      m.sino+=parte;
      m.lineas.push({celda:ent.celda, etiqueta:ent.etiqueta, valor:parte, total:ent.valor,
        ref:ent.ref?ent.ref.hoja+'!'+ent.ref.addr:null,
        que:ent.ref?(_SINO_QUE[ent.ref.col]||('columna '+ent.ref.col)):'sin fórmula',
        conjunto:grupo.length>1?grupo.map(x=>x.derrame):null});
    });
  };
  const dupPorDerrame={};
  sino.entradas.forEach(ent=>{
    if(ent.duplicado){
      /* ¿hay un pedido gemelo al que este renglón le corresponde de verdad? */
      const gb=_GEMDUP[ent.celda];
      if(gb){
        const grupo=(porClave[_bKey(gb.mfg,gb.key)]||[]).slice();
        if(grupo.length){
          ent.via='gemelo'; ent.reatribuido={poRaw:gb.poRaw,fila:gb.fila};
          ent.derrames=grupo.map(x=>x.derrame);
          reatribuidos.push(ent);
          asigna(grupo,ent);
          return;
        }
      }
      const g=resuelveEtq(ent.lado,ent.etiqueta);
      ent.derrames=g.map(e=>e.derrame);
      /* Si existe un pedido con la misma designación pero otro sufijo de entidad,
         lo más probable es que la fórmula esté apuntando a la fila equivocada:
         Andrés rotuló el renglón pensando en el gemelo. Se lo decimos. */
      ent.gemelo=null;
      if(det) det.orden.forEach(k2=>det.bloques[k2].forEach(bl=>{
        if(bl.mfg===ent.lado && bl.key.split('#')[0]===_poKey(ent.etiqueta) && bl.key.indexOf('#')>0)
          ent.gemelo={poRaw:bl.poRaw, fila:bl.fila};}));
      const tot=g.reduce((s,e)=>s+(+e.cupoMonto||0),0);
      g.forEach(e=>{dupPorDerrame[kOf(e)]=(dupPorDerrame[kOf(e)]||0)+(tot?ent.valor*((+e.cupoMonto||0)/tot):ent.valor/g.length);});
      duplicados.push(ent); return; }
    let grupo=null, via=null;
    if(ent.ref && filaAClave[ent.ref.fila]){
      const clave=filaAClave[ent.ref.fila];
      grupo=(porClave[clave]||[]).slice(); via='fórmula';
      /* la fórmula puede apuntar a una fila del Summary que agrupa varios pedidos
         (el "Pedido 7.5" de Andrés cubre 7-5 … 7-9): se reparte entre los hermanos */
      const bl=filaABloque[ent.ref.fila];
      const sum=()=>grupo.reduce((x,e)=>x+(+e.cupoMonto||0),0);
      const m=clave.match(/^(.+\|)(CFM)?(\d+)-(\d+)$/);
      if(bl && m && bl.fab.monto>sum()*1.2){
        let n=+m[4]+1;
        for(let t=0;t<20 && sum()<bl.fab.monto*0.97;t++,n++){
          const sib=porClave[m[1]+(m[2]||'')+m[3]+'-'+n];
          if(!sib||!sib.length) break;
          grupo=grupo.concat(sib);
        }
        ent.agrupa=grupo.length>1;
      }
    }
    if((!grupo||!grupo.length)){
      grupo=resuelveEtq(ent.lado,ent.etiqueta).filter(e=>!tomadosEtq.has(e)); via='etiqueta';
      if(grupo.length) grupo.forEach(e=>tomadosEtq.add(e));
    }
    if(!grupo||!grupo.length){ sueltos.push(ent); return; }
    ent.via=via;
    asigna(grupo,ent);
  });
  Object.keys(mapa).forEach(d=>{detalle[d]=mapa[d].lineas;});
  const plano={}; Object.keys(mapa).forEach(d=>{plano[d]=mapa[d].sino;});
  return {mapa:plano, detalle, sueltos, duplicados, reatribuidos, dupPorDerrame};
}

/* ---------- Cruce con la hoja Sinosure del propio detailed ----------
   El Summary dice cuánto vale cada pedido y qué se pagó; la hoja Sinosure dice
   cuánto de eso está cargado al cupo. Esta función las junta y levanta las alarmas. */
function aplicarSinosure(equipos, det, sino){
  const cas=casarSinosure(equipos, sino, det);
  equipos.forEach(e=>{ e.sinoDet=cas.detalle[kOf(e)]||null; });
  const sinConfirmar=equipos.filter(e=>cas.mapa[kOf(e)]==null && (+e.cupoSaldo||0)>0.5)
    .map(e=>({derrame:e.derrame, proj:e.proj, mfg:e.mfg, st:e.st, monto:+e.cupoMonto||0}));
  const filas=equipos.filter(e=>cas.mapa[kOf(e)]!=null).map(e=>{
    const sinoRef=cas.mapa[kOf(e)], lin=cas.detalle[kOf(e)]||[];
    const M=+e.cupoMonto||0, O=+e.cupoSaldo||0;
    const tol=Math.max(2,Math.abs(sinoRef)*0.005);
    const base = Math.abs(M-sinoRef)<=tol ? 'monto del pedido'
               : (Math.abs(O-sinoRef)<=tol ? 'saldo por pagar' : null);
    return {derrame:e.derrame, mfg:e.mfg, M, O, sino:sinoRef, base,
      celdas:lin.map(l=>l.celda+' → '+(l.ref||l.etiqueta)+(l.conjunto?' (repartido entre '+l.conjunto.join(', ')+')':'')).join(' · '),
      que:[...new Set(lin.map(l=>l.que))].join(' + ')};
  }).sort((a,b)=>(a.base?1:0)-(b.base?1:0)||(''+a.derrame).localeCompare(''+b.derrame,undefined,{numeric:true}));
  return {filas, sinConfirmar,
    reatribuidos:(cas.reatribuidos||[]).map(d=>({celda:d.celda,etiqueta:d.etiqueta,valor:d.valor,lado:d.lado,
      ref:d.ref?d.ref.hoja+'!'+d.ref.addr:null,aPedido:d.derrames||[],gemelo:d.reatribuido||null})),
    duplicados:cas.duplicados.map(d=>({celda:d.celda,etiqueta:d.etiqueta,valor:d.valor,lado:d.lado,
      ref:d.ref?d.ref.hoja+'!'+d.ref.addr:null,yaEn:d.duplicado,derrames:d.derrames||null,gemelo:d.gemelo||null})),
    sueltos:cas.sueltos.map(d=>({celda:d.celda,etiqueta:d.etiqueta,valor:d.valor,lado:d.lado})),
    sinoPorDerrame:cas.mapa, sinoDetalle:cas.detalle, sinoDupPorDerrame:cas.dupPorDerrame,
    sino, ranuras:det.ranuras, posicional:det.posicional};
}

/* ---------- ORDER REPORT (fuente de verdad) ---------- */
function parseReportV2(wb){
  const ws=_sheet(wb,'ORDER REPORT');
  if(!ws) return null;
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,cellDates:true,defval:null});
  let hr=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=(rows[i]||[]).map(_txt);
    if(r.some(c=>c==='id_pedido'||c==='id pedido'||c.startsWith('id_ped'))){hr=i;break;}
  }
  if(hr<0) return {error:'La hoja ORDER REPORT no tiene la columna ID_PEDIDO en las primeras 15 filas.'};
  /* Posiciones conocidas A…U; si el encabezado dice otra cosa, manda el encabezado */
  const H=(rows[hr]||[]).map(_txt);
  const byName=(re,def)=>{const i=H.findIndex(h=>re.test(h));return i>=0?i:def;};
  const C={
    po:byName(/^id.?ped/,0), equipo:byName(/^equipo/,1), empresa:byName(/empresa|cliente/,2), proj:byName(/proyecto/,3), qty:byName(/cantidad|qty|quantity/,4),
    st:byName(/^estado|^status/,5), prodFin:byName(/fin.*prod|prod.*fin/,6), etd:byName(/^etd/,7), eta:byName(/^eta/,8), bl:byName(/^bl/,9), telex:byName(/telex/,10), mfg:byName(/fabricante|manufacturer/,11),
    cupoMonto:byName(/monto fab/,12), cupoPag:byName(/pagado fab/,13), cupoSaldo:byName(/saldo fab/,14),
    otrosMonto:byName(/monto otros/,15), otrosPag:byName(/pagado otros/,16), otrosSaldo:byName(/saldo otros/,17),
    totalMonto:byName(/costo total|monto total/,18), totalPag:byName(/pagado total/,19), totalSaldo:byName(/saldo total/,20)
  };
  const _mapSt=(v)=>{if(!v)return null;const s=_txt(v);
    if(s.indexOf('shipped')===0||s.indexOf('embarcado')===0)return 'shipped';
    if(s.indexOf('shipping')===0||s.indexOf('embarcando')===0)return 'shipping';
    if(s.indexOf('shipment')===0||s.indexOf('booked')===0||s.indexOf('arranging')===0)return 'booked';
    if(s.indexOf('finished')===0||s.indexOf('production finished')===0||s.indexOf('terminad')>=0||s.indexOf('testing')>=0)return 'finished';
    if(s.indexOf('production')===0||s.indexOf('prod')===0||s.indexOf('produc')===0)return 'prod';
    if(s.indexOf('confirm')>=0)return 'confirm';
    return null;
  };
  const _toDate=v=>{if(v==null||v==='')return null;if(v&&typeof v==='object'&&typeof v.getTime==='function'){const t=v.getTime();return isNaN(t)?null:new Date(t);}const s=(''+v).trim();if(!/^\d{4}-\d{2}-\d{2}/.test(s))return null;const d=new Date(s);return isNaN(d)?null:d;};
  const _n=v=>{const x=_numC(v);return x==null?0:x;};
  const _has=v=>_numC(v)!=null;

  const equipos=[]; const ordSet={}; let idx=0; const avisos=[]; let finTabla=rows.length;
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]||[];
    const po=r[C.po];
    if(!po) continue;
    const poStr=(''+po).replace(/[\r\n]+/g,' ').trim();
    if(/pagos priorit|id_pedido|^total/i.test(poStr)){finTabla=i;break;}
    const key=_poKey(poStr);
    const mc=key.match(/^CFM(\d+)(?:-(\d+))?/);
    let ordenId, derrame;
    if(mc){ordenId='CFM'+mc[1];derrame='CFM '+mc[1]+(mc[2]?'-'+mc[2]:'');}
    else {const mn=key.match(/^(\d+)(?:-(\d+))?([A-Z])?$/); if(mn){ordenId=mn[1];derrame=mn[1]+(mn[2]?'-'+mn[2]:'')+(mn[3]||'');} else {ordenId=poStr;derrame=poStr;}}
    ordSet[ordenId]=true;
    const stRaw=r[C.st]; const st=_mapSt(stRaw);
    let mfg=(''+(r[C.mfg]||'')).trim();
    if(/singsun/i.test(mfg))mfg='Singsun'; else if(/eagle/i.test(mfg))mfg='Eaglerise';

    const cupoMonto=_n(r[C.cupoMonto]), cupoPagado=_n(r[C.cupoPag]);
    const cupoSaldo=_has(r[C.cupoSaldo])?_n(r[C.cupoSaldo]):Math.max(0,cupoMonto-cupoPagado);
    const otrosMonto=_n(r[C.otrosMonto]), otrosPagado=_n(r[C.otrosPag]);
    const otrosSaldo=_has(r[C.otrosSaldo])?_n(r[C.otrosSaldo]):Math.max(0,otrosMonto-otrosPagado);
    const totalMonto=_has(r[C.totalMonto])?_n(r[C.totalMonto]):(cupoMonto+otrosMonto);
    const totalPagado=_has(r[C.totalPag])?_n(r[C.totalPag]):(cupoPagado+otrosPagado);
    const totalSaldo=_has(r[C.totalSaldo])?_n(r[C.totalSaldo]):(cupoSaldo+otrosSaldo);
    /* integridad de la propia fila del ORDER REPORT */
    const integ=[];
    if(Math.abs(cupoMonto-cupoPagado-cupoSaldo)>2) integ.push('M−N≠O');
    if(Math.abs(otrosMonto-otrosPagado-otrosSaldo)>2) integ.push('P−Q≠R');
    if(Math.abs(cupoPagado+otrosPagado-totalPagado)>2) integ.push('N+Q≠T');
    if(Math.abs(cupoSaldo+otrosSaldo-totalSaldo)>2) integ.push('O+R≠U');
    if(integ.length) avisos.push(derrame+': '+integ.join(', '));

    /* Anticipo SIN detailed (respaldo): lo pagado al fabricante cubre ~el % de anticipo. El detailed lo reemplaza. */
    const antPct=CONFIG[mfg]?CONFIG[mfg].antPct:(mfg==='Eaglerise'?0.2:0.1);
    const antTot=Math.round(cupoMonto*antPct);
    const antPaid=cupoPagado>=antTot*0.95-0.01;
    const antPend=antPaid?0:Math.min(cupoSaldo,Math.max(0,antTot-cupoPagado));

    const equipo=(''+(r[C.equipo]||'')).trim();
    const tipo=/tracker/i.test(equipo)?'Tracker':(/shelter/i.test(equipo)?'Shelter':(mfg==='Singsun'?'Tracker':'Shelter'));
    const etd=_toDate(r[C.etd]);
    const blDate=_toDate(r[C.bl]);   /* si la columna BL trae fecha se usa; si trae número de BL, el zarpe es el ETD */
    const embarcado=st==='shipped'||st==='shipping';
    equipos.push({
      _i:idx++, ordenId, derrame, fila:i+1,
      proj:(''+(r[C.proj]||'-')).replace(/[\r\n]+/g,' ').trim(),
      st:st||'prod', stRaw:stRaw==null?'':(''+stRaw).trim(), dudoso:!st,
      mfg, tipo,
      cliente:(''+(r[C.empresa]||'Por asignar')).trim()||'Por asignar',
      qty:_qtyC(r[C.qty]).n, qtyRaw:_qtyC(r[C.qty]).txt, sinoManual:null,
      mfgAmt:Math.round(cupoMonto),
      cupoMonto:Math.round(cupoMonto), cupoPagado:Math.round(cupoPagado), cupoSaldo:Math.round(cupoSaldo),
      otrosMonto:Math.round(otrosMonto), otrosPagado:Math.round(otrosPagado), otrosSaldo:Math.round(otrosSaldo),
      otrosDesglose:null,
      totalChina:Math.round(totalMonto), totalPagado:Math.round(totalPagado), totalSaldo:Math.round(totalSaldo),
      antTot, antPaid, antPend, antPaid0:antPaid, antPend0:antPend, antFuente:'porcentaje', antStatus:null, pagosChina:null, bloqueDet:null,
      balPaid:cupoSaldo<=0.5,
      bl:embarcado?(blDate||etd||null):null,
      etd:etd||null, eta:_toDate(r[C.eta])||null, prodFin:_toDate(r[C.prodFin])||null,
      blNo:(r[C.bl]&&!blDate)?(''+r[C.bl]).trim():null, telex:r[C.telex]?(''+r[C.telex]).trim():null,
      integ, nota:'', pctOverride:null, lector:'v2',
    });
  }
  /* ---- Tabla "PAGOS PRIORITARIOS": las fechas límite que pone Andrés, por pedido ---- */
  const prioridad=[];
  for(let i=finTabla;i<rows.length;i++){
    const r=rows[i]||[];
    const id=r[0]==null?'':(''+r[0]).replace(/[\r\n]+/g,' ').trim();
    if(!id||/^id_ped/i.test(id)) continue;
    const saldo=_numC(r[3]); if(saldo==null) continue;
    const lim=_toDate(r[4]);
    prioridad.push({key:_poKey(id), idRaw:id, equipo:(''+(r[1]||'')).trim(), proj:(''+(r[2]||'')).trim(), saldo, limite:lim});
  }
  /* la fecha límite de Andrés manda sobre la estimación BL + plazo */
  const porPri={}; prioridad.forEach(x=>{ if(x.limite) porPri[x.key]=porPri[x.key]||x; });
  equipos.forEach(e=>{ const x=porPri[_poKey(e.derrame)];
    if(x){ e.limitePago=x.limite; e.limiteFuente='order report'; e.saldoPrioridad=x.saldo; } });
  const totals={Singsun:0, Eaglerise:0}, totalsU={Singsun:0, Eaglerise:0}, totalsM={Singsun:0, Eaglerise:0};
  equipos.forEach(function(e){if(totals[e.mfg]!=null){totals[e.mfg]+=(+e.cupoSaldo||0);totalsU[e.mfg]+=(+e.totalSaldo||0);totalsM[e.mfg]+=(+e.cupoMonto||0);}});
  return {equipos, ordenes:Object.keys(ordSet), totals, totalsU, totalsM, prioridad, avisos, sourceHoja:'ORDER REPORT'};
}

/* ---- Carga principal: el DETAILED ---- */
function cargarDetailed(wb,nombre){
  const det=parseDetailed(wb);
  if(!det||det.error){ wizError(det&&det.error?det.error:'Ese archivo no tiene hoja <b>Summary</b>: no parece el detailed.'); return false; }
  if(!det.orden.length){ wizError('La hoja Summary no trajo ningún pedido (la columna PO salió vacía).'); return false; }
  const sino=parseSinosureViejo(wb);
  const p=equiposDesdeDetailed(det, sino);
  if(!p.equipos.length){ wizError('Leí la hoja Summary pero ningún pedido quedó vivo (todos sin saldo y fuera de la hoja Sinosure).'); return false; }
  /* BL y telex de la hoja Simplified Summary */
  const simp=parseSimplificado(wb);
  p.equipos.forEach(e=>{const x=simp[_poKey(e.derrame)]; if(x){e.blNo=x.blNo;e.telex=x.telex;}});
  WIZ.work=p.equipos; WIZ.totals=p.totals; WIZ.totalsU=p.totalsU; WIZ.totalsM=p.totalsM;
  WIZ.omitidos=p.omitidos; WIZ.agregados=p.agregados; WIZ.avisos=[]; WIZ.detNombre=nombre||'detailed';
  WIZ.orNombre=''; WIZ.prioridad=[];
  WIZ.prev=prevDe();
  WIZ.concilia=sino?aplicarSinosure(WIZ.work, det, sino):null;
  WIZ.loaded=true; validateWiz(); renderWiz();
  const sc=WIZ.concilia?WIZ.concilia.sinConfirmar.length:0;
  toast('Leído del detailed · '+p.equipos.length+' pedidos vivos'+(p.omitidos.length?' · '+p.omitidos.length+' cerrados omitidos':'')+(sc?' · '+sc+' sin cupo asignado':''));
  return true;
}
/* ---- Enriquecer (opcional) con el ORDER REPORT: solo el cliente y las fechas límite ---- */
function cruzarOrderReport(wb,nombre){
  if(!WIZ.work){toast('Primero carga el detailed');return false;}
  const p=parseReportV2(wb);
  if(!p){ toast('Ese archivo no tiene hoja "ORDER REPORT".'); return false; }
  if(p.error){ toast(p.error); return false; }
  const por={}; p.equipos.forEach(e=>{por[_poKey(e.derrame)]=e;});
  let nCli=0,nLim=0; const difs=[];
  WIZ.work.forEach(w=>{
    const o=por[_poKey(w.derrame)]; if(!o) return;
    if(o.cliente && o.cliente!=='Por asignar' && !w._cliCustom){ if(w.cliente!==o.cliente) nCli++; w.cliente=o.cliente; }
    if(o.limitePago){ w.limitePago=o.limitePago; w.limiteFuente='ORDER REPORT · pagos prioritarios'; nLim++; }
    if(!w.proj && o.proj && o.proj!=='-') w.proj=o.proj;
    const dM=Math.abs((+o.cupoMonto||0)-(+w.cupoMonto||0));
    if(dM>2) difs.push({derrame:w.derrame, or:+o.cupoMonto||0, det:+w.cupoMonto||0});
  });
  const sobran=p.equipos.filter(o=>!WIZ.work.some(w=>_poKey(w.derrame)===_poKey(o.derrame))).map(o=>o.derrame);
  WIZ.orNombre=nombre||'ORDER REPORT'; WIZ.orDifs=difs; WIZ.orSobran=sobran;
  validateWiz(); renderWiz();
  toast('ORDER REPORT cruzado · '+nCli+' cliente(s) · '+nLim+' fecha(s) límite'+(difs.length?' · '+difs.length+' monto(s) distintos':''));
  return true;
}

function kOf(x){return x.mfg+'|'+_poKey(x.derrame)+_poVarK(x.derrame);}
function prevDe(){const m={};EQ.forEach(e=>{const k=kOf(e);const p=m[k]||(m[k]={exists:true,st:e.st,cupoMonto:0,cupoSaldo:0,saldoReal:0,totalSaldo:0,mfg:e.mfg,cliente:e.cliente,proj:e.proj,legacy:false});
  p.cupoMonto+=(+(e.cupoMonto!=null?e.cupoMonto:e.mfgAmt)||0);p.cupoSaldo+=consumoEq(e,e.mfg);
  /* cupoSaldo guarda el CONSUMO de cupo, que no es el saldo. Para comparar contra el
     archivo nuevo hace falta el saldo de verdad, o un pedido en modo "monto completo"
     parece haber cambiado cuando lo único distinto es cómo lo contamos. */
  p.saldoReal+=(+e.cupoSaldo||0);
  p.totalSaldo+=(+e.totalSaldo||0);if(e.lector!=='v2')p.legacy=true;});return m;}
function wizGo(s){WIZ.step=s;renderWiz();}
function W(i){return WIZ.work.find(w=>w._i==i);}
function setW(i,f,val){const w=W(i);if(!w)return;
  if(f==='cupoMonto'||f==='cupoSaldo'){const n=parseFloat(val);w[f]=isNaN(n)?'':n;if(f==='cupoMonto')w.mfgAmt=w.cupoMonto;
    if(f==='cupoSaldo'&&w.cupoSaldo!==''){w.totalSaldo=Math.round((+w.cupoSaldo||0)+(+w.otrosSaldo||0));w.balPaid=w.cupoSaldo<=0.5;w.antPend=Math.min(+w.antPend||0,+w.cupoSaldo||0);}
    w._editado=true;}
  else if(f==='bl'||f==='etd'){w[f]=val?new Date(val+'T00:00:00'):null;}
  else if(f==='sinoManual'){w.sinoManual=(val==='si'||val==='no')?val:null;}
  else if(f==='antPaid'){w.antPaid=(val==='si');w.antFuente='manual';w.antPend=w.antPaid?0:Math.min(+w.cupoSaldo||0,(+w.antPend>0?+w.antPend:(+w.antTot||0)));}
  else w[f]=val;
  validateWiz();updateWizFoot();}

const isoW=d=>{try{return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}catch(e){return '';}};

/* ¿El saldo de este pedido entra al cupo Sinosure?  Por defecto manda la hoja de Andrés;
   aquí puedes forzarlo a mano para los pedidos que él todavía no cargó (p. ej. PO#16). */
function sinoSel(w){
  const m=(WIZ.concilia&&WIZ.concilia.sinoPorDerrame)||null;
  const hoja=m?m[kOf(w)]:null;
  const auto=hoja!=null?('Hoja · '+fmtUSDs(hoja)):(m?'Hoja · no lo lista':'Sin hoja Sinosure');
  const opts=[['','Lo que diga la hoja'],['si','Sí entra al cupo'],['no','No entra al cupo']];
  const v=w.sinoManual||'';
  const cls=v==='si'?'sinosi':(v==='no'?'sinono':'');
  return `<select class="we ${cls}" title="Por defecto manda la hoja Sinosure del detailed" onchange="setW(${w._i},'sinoManual',this.value);renderWizEditBody()">`
    +opts.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')
    +`</select><small style="display:block;font-size:10px;color:var(--ink3)">${auto}</small>`;
}
function wizFlag(w){const p=WIZ.prev[kOf(w)];
  if(w.sinoManual==='si')return{t:'chg',txt:'Marcado a mano: SÍ entra al cupo Sinosure aunque la hoja no lo liste'};
  if(w.sinoManual==='no')return{t:'chg',txt:'Marcado a mano: NO entra al cupo Sinosure'};
  const sc=WIZ.concilia&&WIZ.concilia.sinConfirmar.find(x=>x.derrame===w.derrame);
  if(sc)return{t:'exc',txt:'No está en la hoja Sinosure: decide en la columna Cupo si entra o no'};
  const nuevo=!p||!p.exists;
  if(!(''+w.proj).trim())return{t:'exc',txt:'Sin proyecto: el detailed no lo trae'};
  if(w.dudoso)return{t:'exc',txt:'Estado no reconocido: '+(w.stRaw||'vacío')};
  if(w.qty>1)return{t:'chg',txt:w.qty+(w.qtyRaw?' ('+w.qtyRaw+')':'')+' en una sola fila: pártelo con ⇔ si cada equipo va a un proyecto distinto'};
  if(w.cliente==='Por asignar')return{t:'chg',txt:'Falta asignarle el cliente'};
  if(nuevo)return{t:'nuevo',txt:'Nuevo en este corte'};
  if(w.st==='confirm')return{t:'chg',txt:'Por confirmar'};
  return{t:'ok',txt:'Sin novedad'};}

const _MONEY=['mfgAmt','cupoMonto','cupoPagado','cupoSaldo','otrosMonto','otrosPagado','otrosSaldo','totalChina','totalPagado','totalSaldo','antTot','antPend','antPend0'];
function splitRow(i){const w=W(i);if(!w)return;const n=Math.max(w.qty||2,2);const parts=parseProjects(w.proj,n);const suf=['A','B','C','D','E','F','G','H'];const base=w.derrame||('X-'+i);
  const gid='sp'+Date.now()+'-'+Math.floor(Math.random()*1000);
  const orig=JSON.parse(JSON.stringify(w));['bl','etd','eta','prodFin'].forEach(k=>{if(w[k])orig[k]=w[k];});
  /* todos los montos se reparten por partes iguales; la última parte absorbe el redondeo */
  const nuevos=parts.map((p,k)=>{const x={...w,derrame:base+suf[k],proj:p||('Orden '+base+suf[k]),qty:1,_splitGroup:gid,_splitOrig:k===0?orig:null};
    _MONEY.forEach(f=>{const v=+w[f]||0;const q=Math.round(v/n);x[f]=(k===n-1)?Math.round(v-q*(n-1)):q;});
    if(w.otrosDesglose)x.otrosDesglose=w.otrosDesglose.map(d=>({...d,monto:d.monto/n,pagado:d.pagado/n,saldo:d.saldo/n}));
    if(w.pagosChina)x.pagosChina=w.pagosChina.map(d=>({...d,monto:Math.round(d.monto/n)}));
    return x;});
  const idx=WIZ.work.indexOf(w);WIZ.work.splice(idx,1,...nuevos);WIZ.work.forEach((x,j)=>x._i=j);validateWiz();renderWiz();}
function unSplit(gid){
  const items=WIZ.work.filter(w=>w._splitGroup===gid);if(!items.length)return;
  const first=items.find(w=>w._splitOrig)||items[0];const orig=first._splitOrig;
  const merged=orig?{...orig}:{...first};delete merged._splitGroup;delete merged._splitOrig;
  if(!orig){_MONEY.forEach(f=>{merged[f]=items.reduce((s,x)=>s+(+x[f]||0),0);});merged.qty=items.length;}
  const idx=WIZ.work.indexOf(first);
  WIZ.work=WIZ.work.filter(w=>w._splitGroup!==gid);
  WIZ.work.splice(idx,0,merged);WIZ.work.forEach((x,j)=>x._i=j);validateWiz();renderWiz();
}

function _cambiosW(w){const p=WIZ.prev[kOf(w)];const out=[];
  if(!p||!p.exists){out.push({tipo:'nuevo',susp:false,det:'Aparece por primera vez'});return out;}
  if(p.st!==w.st){const retro=RANK[w.st]<RANK[p.st];out.push({tipo:'estado',susp:retro,reason:'retroceso de estado',det:`${STAGE[p.st]} → <b>${STAGE[w.st]}</b>`});}
  if(!p.legacy && Math.abs(p.cupoMonto-(+w.cupoMonto||0))>1){const jump=p.cupoMonto>0&&Math.abs(w.cupoMonto-p.cupoMonto)/p.cupoMonto>0.4;out.push({tipo:'monto',susp:jump,reason:'salto de magnitud',det:`monto cupo ${fmtUSDs(p.cupoMonto)} → <b>${fmtUSDs(w.cupoMonto)}</b>`});}
  const pSaldo=(p.saldoReal!=null?p.saldoReal:p.cupoSaldo);
  if(Math.abs(pSaldo-(+w.cupoSaldo||0))>1){const sube=(+w.cupoSaldo||0)>pSaldo+1&&!p.legacy;out.push({tipo:'saldo',susp:sube,reason:'el saldo con China subió',det:`saldo cupo ${fmtUSDs(pSaldo)} → <b>${fmtUSDs(w.cupoSaldo)}</b>${p.legacy?' <small>(el anterior venía de una versión vieja del lector)</small>':''}`});}
  if(p.mfg!==w.mfg)out.push({tipo:'fabricante',susp:true,reason:'cambio de fabricante',det:`${p.mfg} → <b>${w.mfg}</b>`});
  return out;}

  const line=(mfg,a)=>{const cupo=CUPO[mfg],d=cupo-a;return `<div class="rl-line"><span>${mfg}</span><span class="num">cupo Sinosure comprometido ${fmtUSDs(a)} · ${d<0?`<b style="color:var(--danger)">sobregirado ${fmtUSDs(-d)}</b>`:`disponible ${fmtUSDs(d)}`} · saldo total a China ${fmtUSDs(tot(mfg,'totalSaldo'))}</span></div>`;};
  const nSC=WIZ.concilia?(WIZ.concilia.sinConfirmar||[]).length:0;
  const sinCli=WIZ.work.filter(w=>w.cliente==='Por asignar').length;
  document.getElementById('reconBody').innerHTML=`<div class="wizhint">Esto es lo que se va a cargar. ${susp?`<b style="color:var(--danger)">Quedan ${susp} sospechoso(s)</b> — devuélvete si no los revisaste.`:'Sin sospechosos pendientes.'}
        ${nSC?`<br><b style="color:var(--dato-debo)">${nSC} pedido(s) sin cupo asignado</b> en la hoja Sinosure: se cargan pero no consumen cupo.`:''}
    ${sinCli?`<br><b style="color:var(--dato-debo)">${sinCli} pedido(s) sin cliente</b>: asígnalos en el paso 2 o carga el ORDER REPORT. Los que ya tenían cliente lo conservan.`:''}
    <br>Se conservan tus facturas, pagos registrados, precios de venta, logística y BL puestos a mano.</div>
    <div class="rep-grid"><div class="rep-card"><div class="rep-k">${WIZ.work.length}</div><div class="rep-l">pedidos</div></div><div class="rep-card"><div class="rep-k">${nuevos}</div><div class="rep-l">nuevos</div></div><div class="rep-card"><div class="rep-k">${cambios}</div><div class="rep-l">con cambios</div></div><div class="rep-card"><div class="rep-k" style="color:${susp?'var(--danger)':'inherit'}">${susp}</div><div class="rep-l">sospechosos</div></div></div>
    <div class="rep-sec">Cupo que quedaría al cargar</div>${line('Singsun',cS)}${line('Eaglerise',cE)}
    <div class="cfgnote2">El cupo sale de la hoja Sinosure del detailed, pedido por pedido.</div>`;
}
/* Campos que pones tú (no vienen del order report): se conservan de un corte al siguiente */
const _CARRY_NUM=['precioVenta','logisticaFlete','logisticaCobertura','logPagado','antClientePagado','balClientePagado'];
const _CARRY_BOOL=['logPaid','antClientePaid','balClientePaid'];
const eqKey=e=>kOf(e)+'|'+_txt(e.proj);
function wizApprove(){
  /* 1) índice de lo que ya estaba cargado, para no perder nada manual */
  const prevBy={}, prevByDer={};
  EQ.forEach(e=>{prevBy[eqKey(e)]=e;(prevByDer[kOf(e)]=prevByDer[kOf(e)]||[]).push(e);});
  /* los pagos guardan la llave del equipo (no solo su posición, que cambia al recargar) */
  PAGOS.forEach(p=>(p.aps||[]).forEach(a=>{const i=a.ieq!=null?a.ieq:a.eqI;if(!a.ek&&i!=null&&EQ[i])a.ek=eqKey(EQ[i]);}));
  /* pagos a China ya registrados: el corte nuevo de Andrés ya los trae en N/O → quedan absorbidos */
  PAGOS.forEach(p=>{if(p.tipo==='out'&&!p.rev)p.absorbido=true;});
  const heredar=(e)=>{
    let src=prevBy[eqKey(e)]?[prevBy[eqKey(e)]]:(prevByDer[kOf(e)]||[]);
    if(!src.length) return;
    /* el detailed no trae el cliente: se conserva el que ya le habías asignado */
    if(!e.cliente||e.cliente==='Por asignar'){
      const c=src.find(x=>x.cliente&&x.cliente!=='Por asignar');
      if(c){e.cliente=c.cliente; if(c._cliCustom)e._cliCustom=true;}
    }
    if(!(''+(e.proj||'')).trim()){ const pr=src.find(x=>(''+(x.proj||'')).trim()&&!/^Pedido\s/.test(x.proj)); if(pr)e.proj=pr.proj; }
    _CARRY_NUM.forEach(f=>{const v=src.reduce((s,x)=>s+(+x[f]||0),0);if(v)e[f]=v;});
    _CARRY_BOOL.forEach(f=>{if(src.every(x=>x[f]))e[f]=true;});
    const man=src.find(x=>x.blManual&&x.bl); if(man){e.bl=new Date(man.bl);e.blManual=true;}
    if(!e.blNo){const bn=src.find(x=>x.blNo);if(bn)e.blNo=bn.blNo;}
    /* si decidiste a mano que un pedido entra (o no) al cupo Sinosure, la decisión se queda */
    if(!e.sinoManual){const sm=src.find(x=>x.sinoManual);if(sm)e.sinoManual=sm.sinoManual;}
  };
  const byOrd={};WIZ.work.forEach(w=>{(byOrd[w.ordenId]=byOrd[w.ordenId]||{id:w.ordenId,mfg:w.mfg,cliente:w.cliente||'Por asignar'}).eq=(byOrd[w.ordenId].eq||[]).concat(w);});
  ORD=Object.values(byOrd).map(o=>({id:o.id,mfg:o.mfg,cliente:(function(){const cs={};o.eq.forEach(w=>{const c=w.cliente||"Por asignar";cs[c]=(cs[c]||0)+1;});return Object.entries(cs).sort((a,b)=>b[1]-a[1])[0][0];})(),entidad:'Solenium',equipos:o.eq.map(w=>{
    const M=+w.cupoMonto||0, O=+w.cupoSaldo||0;
    const antTot=Math.round(M*(CONFIG[w.mfg]?CONFIG[w.mfg].antPct:0.1));
    /* el saldo O (ORDER REPORT) se reparte: anticipo pendiente según el detailed, el resto es balance */
    const antSaldo=w.antPaid?0:Math.min(O,(+w.antPend>0?+w.antPend:antTot));
    const e={proj:w.proj,tipo:w.tipo||(w.mfg==='Singsun'?'Tracker':'Shelter'),mfg:w.mfg,ordenId:w.ordenId,cliente:w.cliente||o.cliente,st:w.st,
      mfgAmt:M,antTot,balTot:M-antTot,antSaldo,balSaldo:Math.max(0,O-antSaldo),antPaid:!!w.antPaid,balPaid:O<=0.5,
      cupoMonto:M,cupoPagado:+w.cupoPagado||0,cupoSaldo:O,cupoSaldo0:O,
      otrosMonto:+w.otrosMonto||0,otrosPagado:+w.otrosPagado||0,otrosSaldo:+w.otrosSaldo||0,otrosDesglose:w.otrosDesglose||null,
      totalChina:+w.totalChina||0,totalPagado:+w.totalPagado||0,totalSaldo:(w.totalSaldo!=null&&w.totalSaldo!=='')?+w.totalSaldo:O+(+w.otrosSaldo||0),
      antFuente:w.antFuente||'porcentaje',antStatus:w.antStatus||null,pagosChina:w.pagosChina||null,bloqueDet:w.bloqueDet||null,integ:w.integ||[],
      derrame:w.derrame,bl:w.bl,etd:w.etd,eta:w.eta||null,prodFin:w.prodFin||null,nota:w.nota,pctOverride:null,
      blNo:w.blNo||null,telex:w.telex||null,qty:w.qty||1,qtyRaw:w.qtyRaw||'',sinoManual:w.sinoManual||null,lector:'v2',corte:(WIZ.corte||new Date()),
      limitePago:w.limitePago||null,limiteFuente:w.limiteFuente||null,saldoPrioridad:w.saldoPrioridad||null};
    heredar(e);
    if(isShipped(e)&&e.bl)e.vence=addD(e.bl,CONFIG[e.mfg].dias);if(!isShipped(e)&&e.etd&&!e.eta)e.eta=addD(e.etd,35);return e;})}));
  EQ=ORD.flatMap(o=>o.equipos);EQ.forEach((e,i)=>e._i=i);
  /* re-apuntar los pagos de clientes a los equipos nuevos por llave */
  const ix={};EQ.forEach(e=>{ix[eqKey(e)]=e._i;});
  PAGOS.forEach(p=>(p.aps||[]).forEach(a=>{if(!a.ek)return;const n=ix[a.ek];if(a.ieq!=null)a.ieq=(n!=null?n:-1);if(a.eqI!=null)a.eqI=(n!=null?n:-1);}));
  [...new Set(ORD.map(o=>o.cliente))].forEach(c=>{if(!CLI[c])CLI[c]={term:60,fifo:false};});CLIENTES=Object.keys(CLI);
  syncFlags();
  const nEqPrev=(HIST.length?HIST[HIST.length-1].nEq:0);
  pushHistoria(nEqPrev);
  HIST[HIST.length-1].snapPrev=_prevSnap||null;
  HIST[HIST.length-1].fuente=(WIZ.orNombre||'ORDER REPORT')+(WIZ.concilia?' + '+(WIZ.detNombre||'detailed'):'');
  /* resumen del cruce, para el tablero y las alertas de datos */
  CONCILIA = WIZ.concilia ? {
    ts:new Date(), det:WIZ.detNombre||'', or:WIZ.orNombre||'',
    sino:WIZ.concilia.sino?{cupos:WIZ.concilia.sino.cupos, cuposPorEntidad:WIZ.concilia.sino.cuposPorEntidad,
      totalSingsun:WIZ.concilia.sino.totalSingsun, totalEagle:WIZ.concilia.sino.totalEagle,
      dispSingsun:WIZ.concilia.sino.dispSingsun, dispEagle:WIZ.concilia.sino.dispEagle}:null,
    sinoPorDerrame:WIZ.concilia.sinoPorDerrame||{}, sinoDetalle:WIZ.concilia.sinoDetalle||{},
    sinoDup:WIZ.concilia.duplicados||[], sinoDupPorDerrame:WIZ.concilia.sinoDupPorDerrame||{},
    sinoSueltosL:WIZ.concilia.sueltos||[], sinConfirmar:WIZ.concilia.sinConfirmar||[],
    filas:WIZ.concilia.filas||[], omitidos:WIZ.omitidos||[], agregados:WIZ.agregados||[],
    orDifs:WIZ.orDifs||[], ranuras:WIZ.concilia.ranuras, posicional:WIZ.concilia.posicional
  } : (CONCILIA?{...CONCILIA, viejo:true, tsNuevo:new Date()}:null);
  /* El techo del cupo es TUYO: se pone en Ajustes y ninguna carga lo pisa.
     La hoja Sinosure del detailed solo se guarda para poder compararla. */
  closeRecon();toast('ORDER REPORT cargado'+(WIZ.concilia?' y cruzado con el detailed':'')+' · facturas, pagos y precios conservados');
  refreshAll();renderLedger();renderHistCargas();
  if(typeof saveToServer==='function')saveToServer();
}
function closeRecon(){document.getElementById('reconScrim').classList.remove('on');}

let tt;function toast(m){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3600);}





</script>
