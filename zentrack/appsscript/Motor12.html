<script>

/* ===================================================================
   v2.2 · SALIDAS
   ¿Cuánto cuesta que salga y llegue lo que quieren? Un renglón por
   pedido que no ha llegado (en el mar, listo para zarpar, en producción)
   con: anticipo pendiente, componentes, contenedores, flete (tarifa por
   contenedor + % de Magnum), aduana y transporte al llegar. Aparte, lo
   vencido que frena los zarpes (balances vencidos, por pedido) y lo de
   Magnum según la regla de días a una fecha. Abajo: cuándo se paga cada
   cosa, lo que hay que pedirle a Sole (China, Magnum, logística) contra
   cualquier versión de su plan, y lo que falta por confirmar.
   Reglas de logística en REGLAS.logistica (Ajustes › Reglas o aquí).
   Llave nueva: SALIDAS = {sel, cont, magFecha, magDias, magSeguro,
   margen, comparar, sem}. "Llevar a Planes" crea una versión borrador
   en el plan del cliente con lo que hay que pedir.
   =================================================================== */
var SALIDAS={sel:{},cont:{},magFecha:'',magDias:null,magSeguro:false,margen:false,comparar:'',sem:1,cli:''};
function _v2SalCli(){ if(SALIDAS.cli==='*') return null; if(SALIDAS.cli) return SALIDAS.cli; const i=_ecClientes().find(c=>esInterno(c)); return i||null; }
function _v2SalItems(){
  const L=_v2Log(), venc=_v2VencEq(), out=[], cli=_v2SalCli(), ok=e=>!cli||(e.cliente||'Por asignar')===cli;
  EQ.forEach(e=>{ const col=_v2Col(e); if(col==='col'||!ok(e)) return;
    const k=kOf(e), q=+e.qty||1, def=e.mfg==='Singsun'?{c20:0,c40:(+L.c40t||3)*q,cfr:0}:{c20:q/(+L.c20s||2),c40:0,cfr:0}, c=Object.assign({},def,SALIDAS.cont[k]||{});
    const llega=e.eta?new Date(e.eta):(e.etd?addD(new Date(e.etd),35):null);
    out.push({k,e,g:col,ant:+e.antSaldo||0,comp:+e.otrosSaldo||0,venc:0,c20:+c.c20||0,c40:+c.c40||0,cfr:+c.cfr||0,llega,est:!e.eta});
  });
  const G={}; EQ.filter(ok).forEach(e=>{ const v=venc[kOf(e)]; if(!(v>0.5)) return; const b=e.mfg+'|'+_v2Base(e)+'|'+(e.cliente||''); (G[b]=G[b]||{b:_v2Base(e),mfg:e.mfg,v:0,p:new Set()}).v+=v; G[b].p.add(e.proj||''); });
  Object.keys(G).forEach(b=>out.push({k:'v:'+b,e:null,g:'venc',nombre:G[b].b+' · '+(G[b].mfg==='Singsun'?'Nexus':'Eaglerise'),proj:[...G[b].p].filter(Boolean).join(', '),ant:0,comp:0,venc:G[b].v,c20:0,c40:0,cfr:0,llega:null}));
  return out;
}
function _v2SalOn(it){ const s=SALIDAS.sel[it.k]; return s==null?(it.g==='mar'||it.g==='listo'):!!s; }
function _v2SalCalc(it){
  const L=_v2Log(), T=_p14Trm(), cont=it.c20+it.c40+it.cfr;
  const adu=it.c20*(+L.a20||0)+it.c40*(+L.a40||0)+it.cfr*(+L.aFR||0), tr=cont*(+L.tr||0);
  const falta=(it.c20>0&&!(+L.f20>0))||(it.c40>0&&!(+L.f40>0))||(it.cfr>0&&!(+L.fFR>0));
  const flete=cont>0?(falta?null:(it.c20*L.f20+it.c40*L.f40+it.cfr*(+L.fFR||0))*(1+(+L.fee||0)/100)):0;
  return {adu,tr,flete,falta,china:it.ant+it.comp+it.venc,total:it.ant+it.comp+it.venc+adu+(flete||0)+tr/T};
}
function _v2SalMag(){
  const dias=SALIDAS.magDias!=null?+SALIDAS.magDias:((REGLAS&&REGLAS.magnum&&REGLAS.magnum.dias)||30);
  const f=_p14D(SALIDAS.magFecha)||addD(_p14Lun(TODAY),11), fs=cxpActivas('magnum');
  const llega=fs.filter(x=>{ const v=_p14D(x.vence); return v&&days(v,f)>=dias; }), casi=fs.filter(x=>{ const v=_p14D(x.vence); const d=v?days(v,f):-1; return d>=dias-5&&d<dias; });
  const S=l=>l.reduce((a,x)=>a+(x.moneda==='COP'?x.saldo:x.saldo*_p14Trm()),0);
  return {f,dias,n:llega.length,cop:S(llega),nCasi:casi.length,copCasi:S(casi),hay:fs.length>0};
}

  const ctxt=[c20?(Math.round(c20*10)/10)+' × 20GP':'',c40?c40+' × 40HQ':'',cfr?cfr+' FR':''].filter(Boolean).join(' · ');
  const tar=(k,t)=>'<label class="v2-fld" style="flex-direction:row;align-items:center;gap:6px">'+t+'<input class="v2-in v2-num" style="width:96px;text-align:right" value="'+(L[k]>0?n(L[k]):'')+'" placeholder="falta" onchange="v2Regla(\''+k+'\',this.value)"></label>';

    const fech=e?(it.g==='mar'?(it.llega?'llega '+fd(it.llega)+(it.est?' (estimado)':''):'sin fecha'):(it.g==='listo'?(e.etd?'zarpa '+fd(new Date(e.etd)):'sin ETD'):(e.prodFin?'termina '+fd(new Date(e.prodFin)):'sin fecha'))):'';

      +'<span class="v2-lbl">Flete por contenedor</span>'+tar('f20','20GP')+tar('f40','40HQ')+tar('fFR','Flat rack')+'</div>'

  const W=_v2Semanas(), semI=Math.max(0,Math.min(W.length-1,+SALIDAS.sem||0)), lab=i=>i===0?'Esta semana':'Semana '+_p14F(W[i]);

  const lleg={}; on.filter(x=>x.c20+x.c40+x.cfr>0).forEach(x=>{ const d=x.llega?_p14Lun(x.llega):null, k=d?_p14Iso(d):'zz'; const o=(lleg[k]=lleg[k]||{d,nom:new Set(),usd:0,cop:0,falta:false}); o.nom.add(x.e?_v2Base(x.e):x.nombre); o.usd+=x.adu+(x.flete||0); o.cop+=x.tr; if(x.flete===null) o.falta=true; });

  const dif=(a,b,cop)=>{ const d=a-b; return '<span class="'+(d>=0?'v2-ok':'v2-mal')+'"><b>'+(d>=0?'sobran ':'faltan ')+(cop?mM(Math.abs(d)):n(Math.abs(d)))+'</b></span>'; };

function _v2SalListo(){ guardar4(); renderSalidas(); }
function v2SalSel(k,on){ SALIDAS.sel[k]=!!on; _v2SalListo(); }
function v2SalGrupo(g,on){ _v2SalItems().filter(x=>x.g===g).forEach(x=>{ SALIDAS.sel[x.k]=!!on; }); _v2SalListo(); }
function v2SalCont(k,campo,v){ const n=_ecNum(v,0); const o=SALIDAS.cont[k]=SALIDAS.cont[k]||{}; if(n==null) delete o[campo]; else o[campo]=Math.max(0,n); if(!Object.keys(o).length) delete SALIDAS.cont[k]; _v2SalListo(); }
