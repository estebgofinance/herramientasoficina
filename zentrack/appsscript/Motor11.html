<script>

/* ===================================================================
   v2.0 · ESTRUCTURA NUEVA
   Pestañas: Tablero · Caja · Planes · Salidas · Cuentas · Pedidos y, al
   final, Ajustes. Sinosure y Precios siguen como vistas (navTo las abre)
   pero se entran desde Pedidos: "Cupo Sinosure" es la vista de Sinosure
   con el mapa del cupo que antes estaba en el Tablero.
   - Un solo botón "Cargar archivo": reconoce el detailed y el ORDER
     REPORT, el estado de cuenta de Magnum (Excel o PDF), TIBA, Finkargo
     y los datos preparados (.json), y abre el flujo de cada uno.
   - Ajustes en tres bloques: Reglas · Historial de cargas · Avanzado.
   - Pedidos: vista "Por estado" (producción → listo → mar → Colombia).
   - Cuentas: una sola lista con lo que te deben y lo que debes.
   - Corrección (Siliana, 29-oct): si lo que Andrés pone en "pagos
     prioritarios" es solo el anticipo, su fecha límite no se le pone al
     balance; el balance vence BL (o ETD) + plazo del fabricante.
   Sin llaves nuevas en esta sección.
   =================================================================== */
var V2={pdf:'todos',plSel:null,plPanel:null,plDir:'todos',plNuevo:false,plVerC:{},sinExcl:false};
/* ---- el anticipo y el balance no comparten la fecha de "pagos prioritarios" ---- */
function _v2SoloAnticipo(e){ if(!(e&&e.limitePago&&e.saldoPrioridad!=null&&(+e.antSaldo||0)>0.5)) return false; const pr=+e.saldoPrioridad;
  if(Math.abs(pr-(+e.antSaldo))<=2) return true;
  /* v2.4: en un derrame (CFM 3-4A, 3-4B) Andrés escribe el anticipo de todo el pedido */
  const b=_v2Base(e); if(b===''+(e.derrame||e.ordenId||'')) return false;
  const g=(EQ||[]).filter(x=>x.mfg===e.mfg&&_v2Base(x)===b); return g.length>1&&Math.abs(pr-g.reduce((a,x)=>a+(+x.antSaldo||0),0))<=2; }
function _v2LimBal(e){ const d=(CONFIG[e.mfg]&&CONFIG[e.mfg].dias)||60; if(isShipped(e)&&e.bl) return addD(new Date(e.bl),d); if(e.etd) return addD(new Date(e.etd),d); return null; }
const _pagosPendAntes20=pagosPend;
pagosPend=function(){ return _pagosPendAntes20.apply(this,arguments).map(p=>{ if(p.tipo!=='balance'||!_v2SoloAnticipo(p.eq)) return p;
  const f=_v2LimBal(p.eq); return Object.assign({},p,{fecha:f||(p.eq.etd?new Date(p.eq.etd):TODAY)}); }).sort((a,b)=>a.fecha-b.fecha); };
const _cjPagosAntes20=cjPagos;
cjPagos=function(){ return _cjPagosAntes20.apply(this,arguments).map(p=>(p.tipo==='balance'&&p.e&&_v2SoloAnticipo(p.e))?Object.assign({},p,{fecha:_v2LimBal(p.e)}):p); };

/* ---- un solo botón para cargar: reconoce el archivo ---- */
function v2Cargar(){ const i=document.getElementById('v2File'); if(i) i.click(); }
async function _v2Tipo(f){
  const n=(f&&f.name||'').toLowerCase();
  if(/\.json$/.test(n)) return 'datos';
  if(/\.pdf$/.test(n)){ try{ const t=(await _pdfLineas(f)).join(' '); if(/MAGNUM/i.test(t)) return 'magnum'; if(/FINKARGO|Valor Adeudado/i.test(t)) return 'finkargo'; }catch(e){ console.warn(e); } return '?'; }
  if(/\.xlsx?$/.test(n)){ try{ const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array',bookSheets:true}), S=wb.SheetNames||[];
      if(S.some(s=>/^\s*Summary\s*$/i.test(s)||/ORDER REPORT/i.test(s))) return 'reporte';
      if(S.some(s=>/SOA/i.test(s))) return 'tiba';
      if(S.some(s=>_magEmp(s))) return 'magnum'; }catch(e){ console.warn(e); } }
  return '?';
}
function _v2Pasar(id,files){ const inp=document.getElementById(id); if(!inp) return false; const dt=new DataTransfer(); files.forEach(f=>dt.items.add(f)); inp.files=dt.files; inp.dispatchEvent(new Event('change',{bubbles:true})); return true; }
async function v2CargarArchivos(inp){
  const fs=[...((inp&&inp.files)||[])]; try{ inp.value=''; }catch(e){} if(!fs.length) return;
  const g={reporte:[],magnum:[],tiba:[],finkargo:[],datos:[],'?':[]};
  for(const f of fs) g[await _v2Tipo(f)].push(f);
  if(g['?'].length) toast('No reconozco: '+esc4(g['?'].map(f=>f.name).join(', ')));
  if(g.datos.length){ navTo('config'); await pkCargar({files:[g.datos[0]]}); }
  if(g.finkargo.length){ navTo('clientes'); ecLado('debo'); await fkCargarPdf({files:[g.finkargo[0]]}); }
  if(g.tiba.length){ navTo('clientes'); ecLado('debo'); await cxpCargar('tiba',{files:[g.tiba[0]]}); }
  if(g.magnum.length){ navTo('clientes'); ecLado('debo'); await cxpCargar('magnum',{files:[g.magnum[0]]}); }
  if(g.reporte.length){ verifyOpen(); setTimeout(()=>_v2Pasar('reportFile',g.reporte),80); }
  return g;
}

/* ---- Pedidos: por estado, order report, fichas y cupo Sinosure ---- */
function _v2Base(e){ return (''+(e.derrame||e.ordenId||'')).replace(/([0-9])[A-P]$/,'$1'); }
function _v2Col(e){ const eta=e.eta?new Date(e.eta):null, bl=e.bl?new Date(e.bl):null;
  if(e.st==='shipped'||e.st==='shipping'){ if(eta) return eta<TODAY?'col':'mar'; if(bl&&days(bl,TODAY)>40) return 'col'; return 'mar'; }
  if(e.st==='finished'||e.st==='booked') return 'listo'; return 'prod'; }
function _v2VencEq(){ const v={}; cjPagos().forEach(p=>{ if(p.tipo==='balance'&&p.e&&p.fecha&&p.fecha<TODAY){ const k=kOf(p.e); v[k]=(v[k]||0)+p.monto; } }); return v; }
function _v2PdNav(act){
  const n=(CONCILIA&&typeof snConciliar==='function')?snConciliar().filter(x=>x.pend).length:0;
  const b=(k,t,fn)=>'<button class="'+(act===k?'on':'')+'" onclick="'+fn+'">'+t+'</button>';
  return '<div class="v2-top"><h2>Pedidos</h2><div class="v2-seg">'+b('estado','Por estado',"pdVista('estado')")+b('or','Order report',"pdVista('or')")+b('maestro','Fichas',"pdVista('maestro')")
    +b('cupo','Cupo Sinosure'+(n?' <span class="v2-chip ya">'+n+'</span>':''),"navTo('sinosure')")+'</div><span class="v2-sp"></span>'
    +'<span class="v2-mut" style="font-size:14px">'+(CONCILIA&&CONCILIA.ts?'Order report '+fmtD(new Date(CONCILIA.ts))+' · ':'')+EQ.length+' pedidos</span></div>';
}
function _v2PdEstado(){
  const venc=_v2VencEq(), F=V2.pdf;
  const pend=e=>(+e.antSaldo||0)+(+e.otrosSaldo||0)+(venc[kOf(e)]||0)>0.5;
  const ok=e=>F==='todos'||(F==='int'&&esInterno(e.cliente))||(F==='pagar'&&pend(e))||(F==='trk'&&e.mfg==='Singsun')||(F==='shl'&&e.mfg==='Eaglerise');
  const G={}; EQ.filter(ok).forEach(e=>{ const c=_v2Col(e), k=c+'|'+e.mfg+'|'+_v2Base(e); (G[k]=G[k]||{c,l:[]}).l.push(e); });
  const fd=d=>d?_p14F(new Date(d)):'';
  const fecha=(c,e)=>c==='prod'?(e.prodFin?'termina '+fd(e.prodFin):'sin fecha'):(c==='listo'?(e.etd?'zarpa '+fd(e.etd):'sin ETD'):(c==='mar'?(e.eta?'llega '+fd(e.eta):(e.etd?'zarpó '+fd(e.etd):'')):(e.eta?'llegó '+fd(e.eta):'')));
  const card=g=>{ const l=g.l, e=l[0], q=l.reduce((a,x)=>a+(+x.qty||1),0), ant=l.reduce((a,x)=>a+(+x.antSaldo||0),0), comp=l.reduce((a,x)=>a+(+x.otrosSaldo||0),0), ve=l.reduce((a,x)=>a+(venc[kOf(x)]||0),0);
    const proy=[...new Set(l.map(x=>x.proj).filter(Boolean))].join(', '), cli=[...new Set(l.map(x=>x.cliente||'Por asignar'))].join(', ');
    const chips=(ve>0.5?'<span class="v2-chip mal">Vencido '+fmtUSDs(ve)+'</span>':'')+(ant>0.5?'<span class="v2-chip ya">Falta anticipo '+fmtUSDs(ant)+'</span>':'')+(comp>0.5?'<span class="v2-chip ya">Componentes '+fmtUSDs(comp)+'</span>':'');
    return '<div class="v2-cardp" onclick="maIrPedido(\''+_maQ(kOf(e))+'\');pdVista(\'maestro\')"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">'+esc4(_v2Base(e))+' · '+q+' '+(e.mfg==='Singsun'?(q===1?'tracker':'trackers'):(q===1?'shelter':'shelters'))+'</b><span class="v2-mut" style="font-size:13px">'+esc4(fecha(g.c,e))+'</span></div>'
      +'<div style="font-size:14.5px;line-height:1.35">'+esc4(proy||'—')+'</div><div class="v2-mut" style="font-size:13px">'+esc4(cli)+'</div>'+(chips?'<div style="display:flex;flex-wrap:wrap;gap:5px">'+chips+'</div>':'')+'</div>'; };
  const cols=[['prod','En producción'],['listo','Lista para zarpar'],['mar','En el mar'],['col','En Colombia']];
  const fb=(k,t)=>'<button class="'+(F===k?'on dk':'dk')+'" onclick="V2.pdf=\''+k+'\';renderLedger()">'+t+'</button>';
  return '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px"><div class="v2-seg">'+fb('todos','Todos')+fb('int','Cliente del grupo')+fb('pagar','Con algo por pagar')+fb('trk','Trackers')+fb('shl','Shelters')+'</div></div>'
    +'<div class="v2-wrap"><div class="v2-board">'+cols.map(([c,t])=>{ const gs=Object.keys(G).filter(k=>G[k].c===c).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(k=>G[k]);
      const n=gs.reduce((a,g)=>a+g.l.length,0);
      return '<section class="v2-col" data-col="'+c+'"><h3><span>'+t+'</span><span class="v2-mut">'+n+'</span></h3>'+gs.map(card).join('')+'</section>'; }).join('')+'</div></div>';
}
pdVista=function(v){ PDV=(v==='maestro'||v==='or')?v:'estado'; renderLedger(); };
const _renderLedgerAntes20=renderLedger;
renderLedger=function(){
  const pv=PDV; if(PDV==='estado') PDV='or';
  let r; try{ r=_renderLedgerAntes20.apply(this,arguments); } finally { PDV=pv; }
  try{
    const v=document.getElementById('v-pedidos'), m=document.getElementById('maestro'), or=document.getElementById('orReport'), top=document.getElementById('pdTop'); if(!v||!m) return r;
    let es=document.getElementById('pdEstado'); if(!es){ es=document.createElement('div'); es.id='pdEstado'; v.insertBefore(es,m); }
    if(top) top.innerHTML=_v2PdNav(PDV);
    es.style.display=PDV==='estado'?'':'none'; if(or) or.style.display=PDV==='or'?'':'none'; m.classList.toggle('p15-oculto',PDV!=='maestro');
    if(PDV==='estado') es.innerHTML=EQ.length?_v2PdEstado():'<div class="ec8-vacio">Carga el detailed y el order report con <b>Cargar archivo</b>.</div>';
  }catch(err){ console.warn(err); }
  return r;
};
/* Cupo Sinosure: la vista de Sinosure dentro de Pedidos, con el mapa del cupo */
let _v2Mapa=null;
function _v2MapaNodo(){
  if(_v2Mapa) return _v2Mapa;
  const seg=document.getElementById('tmModeSeg'), cols=document.querySelector('#v-hoy .cupo-cols'), ley=document.getElementById('tmLegend'); if(!seg||!cols) return null;
  const d=document.createElement('div'); d.className='v2-mapa v2-card'; d.style.padding='16px'; d.innerHTML='<h3 style="margin:0 0 10px;font-size:17px">Mapa del cupo, pedido por pedido</h3>';
  d.appendChild(seg); d.appendChild(cols); if(ley) d.appendChild(ley); _v2Mapa=d; return d;
}
const _pintarSinoAntes20=pintarSino;
pintarSino=function(){
  const r=_pintarSinoAntes20.apply(this,arguments);
  try{ const v=document.getElementById('v-sinosure'); if(v){ const h=v.querySelector(':scope>.v2-top'); if(h) h.remove();
      const t=document.createElement('div'); t.innerHTML=_v2PdNav('cupo'); v.insertBefore(t.firstChild,v.firstChild);
      const m=_v2MapaNodo(); if(m) v.appendChild(m); } }catch(err){ console.warn(err); }
  return r;
};

/* ---- Ajustes en tres bloques ---- */
function _v2Log(){ if(!REGLAS) REGLAS=_reglas0();
  REGLAS.logistica=Object.assign({a20:11000,a40:9000,aFR:11000,tr:3000000,f20:null,f40:null,fFR:null,fee:10,c20s:2,c40t:3},REGLAS.logistica||{}); return REGLAS.logistica; }
function v2Regla(campo,v){
  if(!REGLAS) REGLAS=_reglas0(); const n=_ecNum(v,0);
  if(campo==='colchon') REGLAS.colchon=n==null?21500:n;
  else if(campo==='magnum'||campo==='tiba'){ REGLAS[campo]=REGLAS[campo]||{tipo:'maxMora'}; REGLAS[campo].tipo='maxMora'; REGLAS[campo].dias=n==null?30:Math.max(0,Math.round(n)); }
  else { const L=_v2Log(); L[campo]=n==null?(['f20','f40','fFR'].indexOf(campo)>=0?null:L[campo]):n; }
  guardar4(); _p14Repintar(); try{ const s=document.getElementById('v-salidas'); if(s&&s.classList.contains('on')) renderSalidas(); }catch(e){}
  try{ const c=document.getElementById('v-config'); if(c&&c.classList.contains('on')) _v2CfgGrupos(); }catch(e){}
}
function _v2CfgReglasHTML(){
  const L=_v2Log(), R=REGLAS||_reglas0(), dm=a=>(R[a]&&R[a].dias!=null)?R[a].dias:30;
  const f=(campo,t,val,ph)=>'<label class="v2-fld">'+t+'<input class="v2-in v2-num" style="text-align:right" value="'+(val==null?'':fmtUSDs(val))+'" placeholder="'+(ph||'')+'" onchange="v2Regla(\''+campo+'\',this.value)"></label>';
  return '<div class="cfgsec">Caja y pagos</div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:760px">'
      +f('colchon','Colchón de caja · US$',R.colchon||21500)+f('magnum','Magnum · máx. días vencida',dm('magnum'))+f('tiba','TIBA · máx. días vencida',dm('tiba'))+'</div>'
    +'<div class="cfgsec">Logística por contenedor</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:980px">'
      +f('a20','Aduana 20GP · US$',L.a20)+f('a40','Aduana 40HQ · US$',L.a40)+f('aFR','Aduana flat rack · US$',L.aFR)+f('tr','Transporte · COP',L.tr)
      +f('f20','Flete 20GP · US$',L.f20,'falta')+f('f40','Flete 40HQ · US$',L.f40,'falta')+f('fFR','Flete flat rack · US$',L.fFR,'falta')+f('fee','Magnum sobre flete · %',L.fee)
      +f('c20s','Shelters por 20GP',L.c20s)+f('c40t','40HQ por tracker',L.c40t)+'</div>';
}
function _v2CfgGrupos(){
  const v=document.getElementById('v-config'); if(!v) return;
  const mk=(id,tit,det)=>{ let b=document.getElementById(id); if(!b){ b=document.createElement(det?'details':'section'); b.id=id; b.className='v2-cfgb'; b.innerHTML=det?'<summary>'+tit+'</summary>':'<h3>'+tit+'</h3>'; } return b; };
  const R=mk('cfgV2Reglas','Reglas'), H=mk('cfgV2Hist','Historial de cargas'), A=mk('cfgV2Avz','Avanzado',true);
  const titulo=v.querySelector(':scope>h2.title');
  let g=null;
  [...v.children].filter(c=>c!==R&&c!==H&&c!==A&&c!==titulo).forEach(c=>{
    if(c.id==='rosAjustes'){ H.appendChild(c); return; }
    if(c.id==='pkBox'){ A.appendChild(c); return; }
    if(c.classList.contains('cfgsec')){ const t=c.textContent||''; g=/Cargas del ORDER REPORT|Historial/i.test(t)?H:(/Cupo Sinosure|Clientes y plazos/i.test(t)?R:A); g.appendChild(c); return; }
    if(!g){ if(c.classList.contains('sub')){ c.style.display='none'; return; } if(c.classList.contains('p16-pk')){ A.appendChild(c); return; } R.appendChild(c); return; }
    g.appendChild(c);
  });
  if(titulo&&v.firstChild!==titulo) v.insertBefore(titulo,v.firstChild);
  v.appendChild(R); v.appendChild(H); v.appendChild(A);
  const pk=document.getElementById('pkBox'); if(pk&&pk.parentNode!==A) A.insertBefore(pk,A.children[1]||null);
  let x=document.getElementById('cfgV2Mias'); if(!x){ x=document.createElement('div'); x.id='cfgV2Mias'; }
  if(x.parentNode!==R||R.children[1]!==x) R.insertBefore(x,R.children[1]||null);
  x.innerHTML=_v2CfgReglasHTML();
}
const _cfgAntes20=renderConfig;
renderConfig=function(){ const r=_cfgAntes20.apply(this,arguments); try{ _v2CfgGrupos(); }catch(err){ console.warn('v2 ajustes',err); } return r; };

/* ---- Cuentas: lo que te deben y lo que debes, en una sola lista ---- */
function _v2Acreedores(){
  const t=_p14Trm(), K=EQ.length?cjCajones():null, S=l=>l.reduce((a,x)=>a+x.monto,0);
  const chV=K?S(K.C.atras.concat(K.C.reciente,K.C.ya).filter(p=>p.tipo!=='tercero')):0, chT=EQ.length?puenteTot(null).debo:0;
  const cx=a=>{ const fs=cxpActivas(a); if(!fs.length) return null; const cop=fs.filter(f=>f.moneda==='COP').reduce((x,f)=>x+f.saldo,0), usd=fs.filter(f=>f.moneda==='USD').reduce((x,f)=>x+f.saldo,0);
    const ve=fs.filter(f=>(_p14D(f.vence)||TODAY)<TODAY).reduce((x,f)=>x+_cxpUSD(f),0); return {cop,usd,ve}; };
  const M=cx('magnum'), T=cx('tiba'), ter=typeof cjPagosTerceros==='function'?cjPagosTerceros():[], fk=ter.filter(p=>/Finkargo/i.test(p.quien||p.concepto||''));
  const prox=fk.filter(p=>p.fecha).sort((a,b)=>a.fecha-b.fecha)[0];
  const mes=(GASTOS||[]).filter(g=>g.periodicidad==='mensual'&&!g.porIdentificar).reduce((a,g)=>a+(_gCOP(g)||0),0);
  const mon=x=>[x.usd?'US$ '+fmtUSDs(x.usd):'',x.cop?'COP '+_copM(x.cop):''].filter(Boolean).join(' + ');
  return [
    {k:'china',n:'China',tot:'US$ '+fmtUSDs(chT),sub:fmtUSDs(chV)+' vencido',mal:chV>0.5},
    {k:'magnum',n:'Magnum',tot:M?mon(M):'sin cargar',sub:M?(M.ve>0.5?'COP '+_copM(M.ve*t)+' vencido':'al día'):'—',mal:!!(M&&M.ve>0.5)},
    {k:'tiba',n:'TIBA',tot:T?mon(T):'sin cargar',sub:T?(T.ve>0.5?fmtUSDs(T.ve)+' vencido':'al día'):'—',mal:!!(T&&T.ve>0.5)},
    {k:'finkargo',n:'Finkargo',tot:'US$ '+fmtUSDs(S(fk)),sub:prox?'próxima '+_p14F(prox.fecha)+' · '+fmtUSDs(prox.monto):'—',mal:false},
    {k:'fijos',n:'Fijos e impuestos',tot:'≈ COP '+_copM(mes)+'/mes',sub:'nómina, arriendo, DIAN',mal:false}];
}
function _v2ListaCuentas(lado){

    +(lado==='debo'?cl.map(x=>'<a href="#" onclick="ecLado(\'me\');selCliData(\''+_maQ(x.c)+'\');return false"'+(sel===x.c?' class="on"':'')+'><span class="t"><span>'+esc4(x.c)+'</span><span class="v2-num">'+fmtUSDs(x.t.saldo)+'</span></span><span class="s '+(x.t.vencido>0.5?'v2-mal':'v2-ok')+'">'+(x.t.vencido>0.5?fmtUSDs(x.t.vencido)+' vencido':'al día')+'</span></a>').join(''):'')

    +_v2Acreedores().map(a=>'<a href="#" class="v2-acr'+(lado==='debo'&&P14.acre===a.k?' on':'')+'" onclick="ecLado(\'debo\');P14.acre=\''+a.k+'\';renderPorPagar();return false"><span class="t"><span>'+a.n+'</span><span class="v2-num">'+esc4(a.tot)+'</span></span><span class="s '+(a.mal?'v2-mal':'v2-mut')+'">'+esc4(a.sub)+'</span></a>').join('')+'</div>';

const _renderClientesAntes20=renderClientes;

const _renderPorPagarAntes20=renderPorPagar;

      const d=document.createElement('div'); d.className='v2-lc'; d.innerHTML=_v2ListaCuentas('debo')+_v2ListaDebo('debo'); pp.insertBefore(d,pp.firstChild); } }catch(err){ console.warn(err); }
  return r;
};

/* ---- arranque: nombres, pestañas y lo que se pinta al entrar ---- */
(function v2Init(){
  try{
    PDV='estado';
