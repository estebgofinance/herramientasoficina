<script>

/* ============ EDITAR CLIENTE (panel modal) ============ */
function renderClientes(){
  const list=document.getElementById('clList');
  // clientes reales: los que tienen equipos asignados o facturas
  const activos=[...new Set([...CLIENTES,...EQ.map(e=>e.cliente),...FACT.map(f=>f.cliente)])].filter(c=>c&&c!=='Por asignar');
  const porAsignar=EQ.filter(e=>e.cliente==='Por asignar').length;
  if(!activos.length&&!porAsignar){list.innerHTML='<div style="color:var(--ink3);font-size:13px;padding:14px">Sin clientes asignados. Al cargar el order report, asigna cada orden a su cliente.</div>';document.getElementById('clDetail').innerHTML='';return;}
  const items=activos.map((c,i)=>{const s=saldoCliente(c),m=moraCliente(c),eqs=equiposCliente(c).length,facs=FACT.filter(f=>f.cliente===c).length;
    return `<div class="cl-item ${i===0?'on':''}" onclick="selCli('${c}',this)"><div><div class="cn">${c}<button class="clidel" title="Eliminar cliente" onclick="event.stopPropagation();delCliente('${c}')">×</button></div><div class="cm">${facs} factura(s)${eqs>facs?` · ${eqs-facs} por facturar`:''}</div></div><div class="cbal"><b>${fmtCOPs(s)}</b>${m>0?`<small>${fmtCOPs(m)} en mora</small>`:''}</div></div>`;});
  if(porAsignar)items.push(`<div class="cl-item pend" onclick="selCli('Por asignar',this)"><div><div class="cn">Por asignar</div><div class="cm">${porAsignar} equipo(s) sin cliente</div></div><div class="cbal"><small style="color:var(--danger)">asignar</small></div></div>`);
  list.innerHTML=items.join('');
  selCliData(activos[0]||'Por asignar');
}
function selCli(c,el){document.querySelectorAll('.cl-item').forEach(x=>x.classList.remove('on'));el.classList.add('on');selCliData(c);}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const HW=91; // 13 semanas
/* ================= PAGOS ================= */
let pagoTipo='in';
function renderPagos(){
  document.querySelectorAll('#pagoTipoSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#pagoTipoSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');pagoTipo=b.dataset.t;pagoForm();});
  pagoForm();renderHist();
}
function pagoForm(){
  const fecha=`<label>Fecha <input type="date" id="pfFecha" value="${iso(TODAY)}"></label>`;
  const who=`<label>Quién <select id="pfWho"><option>Esteban</option><option>Luisa</option><option>Gerente</option></select></label>`;
  if(pagoTipo==='in'){
    document.getElementById('pagoForm').innerHTML=`
      <div class="pf">
        <label>Cliente <select id="pfCli" onchange="document.getElementById('pfProp').innerHTML=''">${CLIENTES.map(c=>`<option>${c}</option>`).join('')}</select></label>
        <label>Moneda del pago <select id="pfMon" onchange="pfMonToggle()"><option value="COP">COP (pesos)</option><option value="USD">USD (dólares)</option></select></label>
        <label>Monto recibido <input id="pfMonto" type="number" placeholder="0"></label>
        <label id="pfTrmWrap" style="display:none">TRM del día del pago <input id="pfTrm" type="number" value="4050"></label>
        ${fecha}${who}
        <button class="prbtn" onclick="proponerIn()">Proponer reparto</button>
      </div>
      <div id="pfProp"></div>`;
  } else {
    document.getElementById('pagoForm').innerHTML=`
      <div class="pf">
        <label>Receptor <select id="pfMfg" onchange="document.getElementById('pfProp').innerHTML=''"><option value="Singsun">Nexus (trackers)</option><option value="Eaglerise">Eaglerise (shelters)</option></select></label>
        <label>Monto pagado (USD) <input id="pfUsd" type="number" placeholder="0"></label>
        ${fecha}
        <button class="prbtn" onclick="proponerOut()">Proponer reparto</button>
      </div>
      <div id="pfProp"></div>`;
  }
}
function pfMonToggle(){document.getElementById('pfTrmWrap').style.display=document.getElementById('pfMon').value==='USD'?'':'none';}
function propRows(items,total,cli){
  let pool=cli==='__manual'?0:total; const pre=items.map(it=>{const m=Math.min(pool,it.saldo);pool-=m;return Math.round(m);});
  return `<div class="prop">
    <div class="prop-h"><span>Aplicar contra</span><span>Saldo</span><span>Aplicar</span></div>
    ${items.map((it,i)=>`<div class="prop-r"><span class="pl">${it.label}</span><span class="ps num">${fmtUSDs(it.saldo)}</span><input class="pi" data-key="${it.key}" type="number" value="${pre[i]}" oninput="propSum()"></div>`).join('')}
    <div class="prop-f"><span id="propRem"></span><button class="prbtn ok" onclick="confirmarPago()">Confirmar pago</button></div>
  </div>`;
}
function propSum(){const inps=[...document.querySelectorAll('.pi')];const sum=inps.reduce((s,i)=>s+(+i.value||0),0);const tot=window._propTot||0;const rem=tot-sum;const cur=window._propCur;const inUSD=cur==='out'||cur==='in-int';const f=n=>inUSD?('US$ '+fmtUSDs(n)):fmtCOPs(n);const el=document.getElementById('propRem');if(el)el.innerHTML=`Repartido <b class="num">${f(sum)}</b> de ${f(tot)} · ${rem>=0?'queda':'te pasas'} <b class="num" style="color:${rem<0?'var(--danger)':'var(--ink)'}">${f(Math.abs(rem))}</b>`;}
function proponerIn(){
  const cli=document.getElementById('pfCli').value, mon=document.getElementById('pfMon').value, monto=+document.getElementById('pfMonto').value||0, trm=+document.getElementById('pfTrm').value||TRM;
  const interno=esInterno(cli);
  window._propCli=cli;
  if(interno){
    /* CLIENTE INTERNO (Solenium) — aplicar contra hitos de equipos, en USD (verdad del negocio interno) */
    const montoUsd = mon==='USD'? monto : (monto/trm);
    const hs=hitosCliInterno(cli).sort((a,b)=>(a.fecha||9e15)-(b.fecha||9e15));
    const items=hs.map(h=>{
      const kind=h.tipo==='anticipo'?'ant':(h.tipo==='balance'?'bal':'log');
      const iconos={anticipo:'⏱',balance:'📦',logistica:'🚢'};
      const lbl=(iconos[h.tipo]||'')+' '+h.eq.derrame+' · '+h.lbl+(h.vencido?' <span style="color:var(--z-red);font-weight:600">VENCIDO</span>':(h.fecha?' <small style="color:var(--ink3)">vence '+fmtD(h.fecha)+'</small>':''));
      return {key:'I:'+h.eq._i+':'+kind, label:lbl, saldo:h.pend};
    });
    window._propTot=montoUsd; window._propCur='in-int';
    if(!items.length){
      document.getElementById('pfProp').innerHTML='<div class="prop-note" style="color:var(--ink2)">'+cli+' no tiene hitos pendientes. Verifica precios de venta o marca del anticipo/balance/logística en Editar cliente.</div>';
      return;
    }
    document.getElementById('pfProp').innerHTML=`<div class="prop-note"><b>${cli}</b> es cliente interno del grupo. Aplicando en <b>USD</b> contra los hitos pendientes.<br>${mon==='USD'?`Pago USD <b>${fmtUSDs(monto)}</b>.`:`Pago COP ${fmtCOP(monto)} → <b>US$ ${fmtUSDs(montoUsd)}</b> a TRM ${trm}.`}</div>`+propRowsUsd(items,montoUsd,esFIFO(cli)?cli:'__manual');
    propSum();
    return;
  }
  /* CLIENTE EXTERNO — igual que antes */
  const cop = mon==='USD'? Math.round(monto*trm) : monto;
  const fs=carteraCliente(cli).filter(f=>f.saldo>0);
  const items=fs.map(f=>({key:'F:'+f.num,label:f.num+' · '+((f.eqRefs||[]).join(',')||'sin vincular'),saldo:f.saldo}));
  window._propTot=cop; window._propCur='in';
  document.getElementById('pfProp').innerHTML=`<div class="prop-note">${mon==='USD'?`Pago en USD ${fmtUSDs(monto)} → <b>${fmtCOP(cop)}</b> a TRM ${trm}. Se aplica en COP.`:`Pago en COP: <b>${fmtCOP(cop)}</b>.`}</div>`+propRows(items,cop,esFIFO(cli)?cli:'__manual');
  propSum();
}

/* Variante de propRows para USD (usada por clientes internos) */
function propRowsUsd(items,total,cli){
  let pool=cli==='__manual'?0:total; const pre=items.map(it=>{const m=Math.min(pool,it.saldo);pool-=m;return Math.round(m*100)/100;});
  return `<div class="prop">
    <div class="prop-h"><span>Aplicar contra</span><span>Saldo USD</span><span>Aplicar USD</span></div>
    ${items.map((it,i)=>`<div class="prop-r"><span class="pl">${it.label}</span><span class="ps num">${fmtUSDs(it.saldo)}</span><input class="pi" data-key="${it.key}" type="number" step="0.01" value="${pre[i]}" oninput="propSum()"></div>`).join('')}
    <div class="prop-f"><span id="propRem"></span><button class="prbtn ok" onclick="confirmarPago()">Confirmar pago</button></div>
  </div>`;
}
function proponerOut(){
  const mfg=document.getElementById('pfMfg').value, usd=+document.getElementById('pfUsd').value||0;
  const obl=[];EQ.filter(e=>e.mfg===mfg).forEach(e=>{if(e.balSaldo>0)obl.push({key:'B:'+e._i,label:e.proj+' · balance ('+e.ordenId+')',saldo:e.balSaldo,d:e.vence||e.etd||TODAY});if(e.antSaldo>0)obl.push({key:'A:'+e._i,label:e.proj+' · anticipo ('+e.ordenId+')',saldo:e.antSaldo,d:e.prodFin||e.etd||TODAY});});
  obl.sort((a,b)=>a.d-b.d);
  window._propTot=usd; window._propCur='out';
  document.getElementById('pfProp').innerHTML=propRows(obl,usd,'china');
  propSum();
}
function confirmarPago(){
  const inps=[...document.querySelectorAll('.pi')].filter(i=>(+i.value||0)>0);
  if(!inps.length){toast('No hay nada repartido');return;}
  const fecha=new Date((document.getElementById('pfFecha').value||iso(TODAY))+'T00:00:00');
  const cur=window._propCur;
  if(cur==='in-int'){
    /* CLIENTE INTERNO — aplicaciones a hitos por equipo (en USD) */
    const cli=document.getElementById('pfCli').value, mon=document.getElementById('pfMon').value, monto=+document.getElementById('pfMonto').value||0, trm=+document.getElementById('pfTrm').value||TRM;
    const who=document.getElementById('pfWho').value;
    const aps=inps.map(i=>{
      const parts=i.dataset.key.split(':'); /* I:eqI:kind */
      return {ieq:+parts[1], ek:EQ[+parts[1]]?eqKey(EQ[+parts[1]]):null, kind:parts[2], monto:+i.value};
    });
    const usdTot=aps.reduce((s,a)=>s+a.monto,0);
    registrarPago({tipo:'in',cliente:cli,mon,monto,trm,usd:usdTot,fecha,quien:who,aps,interno:true});
    toast(`Pago de <b>${cli}</b> por US$ ${fmtUSDs(usdTot)} aplicado a ${aps.length} hito(s)`);
  } else if(cur==='in'){
    const cli=document.getElementById('pfCli').value, mon=document.getElementById('pfMon').value, monto=+document.getElementById('pfMonto').value||0, trm=+document.getElementById('pfTrm').value||TRM;
    const cop = mon==='USD'? Math.round(monto*trm):monto;
    const who=document.getElementById('pfWho').value;
    const aps=inps.map(i=>({ref:i.dataset.key.slice(2),monto:+i.value}));
    registrarPago({tipo:'in',cliente:cli,cop,mon,trm,fecha,quien:who,aps});
    toast(`Pago de <b>${cli}</b> por ${mon==='USD'?fmtUSD(monto):fmtCOP(cop)} registrado y aplicado`);
  } else {
    const mfg=document.getElementById('pfMfg').value, usd=+document.getElementById('pfUsd').value||0;
    const aps=inps.map(i=>{const n=+i.dataset.key.slice(2);return {eqI:n,ek:EQ[n]?eqKey(EQ[n]):null,kind:i.dataset.key[0]==='A'?'ant':'bal',monto:+i.value};});
    registrarPago({tipo:'out',mfg,receptor:CONFIG[mfg].receptor,usd,fecha,aps});
    toast(`Pago a ${CONFIG[mfg].receptor} por ${fmtUSDs(usd)} registrado · cupo actualizado`);
  }
  refreshAll();
}

function renderHist(){
  document.getElementById('pagoHist').innerHTML=PAGOS.slice().reverse().map(p=>{
    let monto,quien,meta;
    if(p.tipo==='in'&&p.interno){
      monto='US$ '+fmtUSDs(p.usd||0);
      quien=p.cliente+' <span class="tag-oblig" style="margin-left:6px">interno</span>';
      meta=`${p.aps.length} hito(s) de equipos · ${p.mon||'USD'} · registró ${p.quien}`;
    }else if(p.tipo==='in'){
      monto=p.mon==='USD'?'US$ '+fmtUSDs(p.cop/p.trm):fmtCOPs(p.cop);
      quien=p.cliente;
      meta=`${p.aps.length} factura(s) · ${p.mon||'COP'}${p.mon==='USD'?' @ TRM '+p.trm:''} · registró ${p.quien}`;
    }else{
      monto='US$ '+fmtUSDs(p.usd);
      quien=(p.receptor||p.mfg);
      meta=`${p.aps.length} aplicación(es) a ${p.receptor||p.mfg}`;
    }
    return `<div class="hrow ${p.rev?'rev':''}">
      <div class="hd">${fmtD(p.fecha)}</div>
      <div class="hm"><span class="htag ${p.tipo}">${p.tipo==='in'?'Entra':'Sale'}</span> ${quien}<small>${meta}${p.rev?' · REVERSADO':''}</small></div>
      <div class="hv">${monto}</div>
      <div class="hx">${p.rev?'':`<button onclick="doReverse(${p.id})">Reversar</button>`}</div>
    </div>`;}).join('')||'<div style="color:var(--ink3);font-size:13px">Sin pagos registrados</div>';
}
function doReverse(id){reversePago(id);toast('Pago reversado · saldos restaurados');refreshAll();}
function refreshAll(){syncFlags();renderHoy();renderPagos();renderClientes();renderConfig();}

/* ================= COMMAND / RECON / TOAST ================= */
/* ================= BUSCADOR ================= */
(function(){const cmd=document.getElementById('cmd');if(!cmd)return;
  cmd.addEventListener('input',()=>runSearch(cmd.value));
  cmd.addEventListener('focus',()=>{if(cmd.value)runSearch(cmd.value);});
  document.addEventListener('click',e=>{if(!e.target.closest('.cmd'))document.getElementById('cmdResults').innerHTML='';});
})();
function navTo(v){const b=document.querySelector('nav.tabs button[data-v="'+v+'"]');if(b)b.click();}
function srClose(){document.getElementById('cmdResults').innerHTML='';document.getElementById('cmd').value='';}
function srOrder(id){srClose();openPanel(id);}
function srClient(c){srClose();navTo('clientes');selCliData(c);const items=[...document.querySelectorAll('.cl-item')];items.forEach(x=>x.classList.remove('on'));const idx=CLIENTES.indexOf(c);if(items[idx])items[idx].classList.add('on');}
function runSearch(q){
  q=(q||'').trim().toLowerCase();const box=document.getElementById('cmdResults');if(!box)return;
  if(!q){box.innerHTML='';return;}
  const ords=ORD.filter(o=>('orden '+o.id).includes(q)||o.id.toLowerCase().includes(q)).slice(0,5);
  const seen=new Set();const projs=EQ.filter(e=>{const p=projOf(e);if(!p||!p.toLowerCase().includes(q))return false;if(seen.has(p))return false;seen.add(p);return true;}).slice(0,6);
  const clis=CLIENTES.filter(c=>c.toLowerCase().includes(q)).slice(0,4);
  let html='';
  if(ords.length)html+=`<div class="sr-h">Órdenes</div>`+ords.map(o=>`<div class="sr" onclick="srOrder('${o.id}')"><b>Orden ${o.id}</b><span>${o.cliente} · ${o.equipos.length} equipos · ${o.mfg==='Singsun'?'trackers':'shelters'}</span></div>`).join('');
  if(projs.length)html+=`<div class="sr-h">Proyectos</div>`+projs.map(e=>`<div class="sr" onclick="srOrder('${e.ordenId}')"><b>${e.proj}</b><span>orden ${e.ordenId}${e.derrame?' · derrame '+e.derrame:''} · ${STAGE[e.st]}</span></div>`).join('');
  if(clis.length)html+=`<div class="sr-h">Clientes</div>`+clis.map(c=>`<div class="sr" onclick="srClient('${c}')"><b>${c}</b><span>ver estado de cuenta</span></div>`).join('');
  box.innerHTML=html||`<div class="sr none">Sin resultados para "${q}"</div>`;
}




/* ================= ASISTENTE DE CARGA (lee tu order report real) ================= */
/* ---- lector del .xlsx ---- */
const _STMAP=[['under confirmation','confirm'],['in production','prod'],['production finished','finished'],['shelters testing','finished'],['shipment booked','booked'],['arranging shipment','booked'],['shipping','shipping'],['shipped','shipped']];
const _mapSt=s=>{s=(''+(s||'')).toLowerCase().trim();for(const[k,v]of _STMAP)if(s.indexOf(k)>=0)return v;return null;};

const _toDate=v=>{if(v==null||v==='')return null;if(v&&typeof v==='object'&&typeof v.getTime==='function'){const t=v.getTime();return isNaN(t)?null:new Date(t);}const s=(''+v).trim();if(!/^\d{4}-\d{2}-\d{2}/.test(s))return null;const d=new Date(s);return isNaN(d)?null:d;};
function parseProjects(desc,n){desc=(''+(desc||'')).trim();if(!desc||/^Orden\s/.test(desc))return Array(n).fill('');
  const chunks=desc.split(/\s*,\s*/),parts=[];
  chunks.forEach(c=>{const m=c.match(/^(.+?)\s+(\d+(?:\/\d+)+)$/);if(m){const base=m[1].trim();m[2].split('/').forEach(nn=>parts.push(base+' '+nn));}else parts.push(c);});
  while(parts.length<n)parts.push('');return parts;}

/* ====================================================================
   MOTOR DE LECTURA v0.18
   1. ORDER REPORT (hoja nueva, una fila por pedido) = ESQUELETO Y MONTOS.
      Todo número que se muestra sale de aquí:  M N O (cupo) · P Q R (otros) · S T U (total).
   2. DETAILED (hoja Summary) = se lee el BLOQUE COMPLETO de cada pedido:
      la fila del fabricante con TODOS sus pagos (DP1, DP2, Balance 1, Balance 2…)
      y las filas de proveedores de otros componentes debajo. De ahí sale:
        - qué pagos están Paid y cuáles Pending (el último pago pendiente es el saldo),
        - cuánto del saldo es anticipo y cuánto es balance,
        - el desglose por proveedor de los otros componentes.
   3. VALIDACIÓN: el bloque del detailed se suma y se compara contra N, O, P, Q, R, y
      la hoja Sinosure contra U. El detailed NUNCA cambia un monto del ORDER REPORT:
      si no cuadra, se marca para revisar.
   ==================================================================== */
const _sheet=(wb,name)=>{const t=name.toLowerCase().replace(/\s+/g,' ').trim();const n=wb.SheetNames.find(s=>s.toLowerCase().replace(/\s+/g,' ').trim()===t);return n?wb.Sheets[n]:null;};
/* Llave de pedido: "PO#7-2"→"7-2", "Pedido 7.2"→"7-2", "PO CFM3-2 INGEV2"→"CFM3-2",
   "PO12 SOLARIS INGEV"→"12", "PO#10\nINGEV1\nMARIANGOLA"→"10", "CFM 2.3"→"CFM2-3" */
function _poKey(s){
  s=(''+(s==null?'':s)).toUpperCase().replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim();
  const m=s.match(/^(?:PO|PEDIDO|ORDEN)?\s*#?\s*(CFM)?\s*#?\s*(\d+)\s*(?:[.\-]\s*(\d+))?\s*([A-Z])?(?![\w.])/);
  if(!m||!m[2]) return s.replace(/\s+/g,'');
  return (m[1]||'')+m[2]+(m[3]?'-'+m[3]:'')+(m[4]||'');
}
/* Un pedido vive en el par fabricante+llave: el PO#7-2 de Singsun (tracker) y el PO#7-2 de
   Eaglerise (shelter viejo) son dos pedidos distintos y no se pueden mezclar. */
const _bKey=(mfg,k)=>(mfg||'?')+'|'+k;
const _stPago=v=>{const s=(''+(v==null?'':v)).toLowerCase().trim();if(!s)return null;
  if(/^(paid|pagad[oa]|done|ok)$/.test(s))return 'paid';
  if(/pend|unpaid|paying|partial|parcial|due|por pagar/.test(s))return 'pending';
  if(/^paid/.test(s))return 'paid';
  return null;};
const _numC=v=>{if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;if(_esFecha(v))return null;const s=(''+v).replace(/[$,\s]|USD/gi,'');if(!/^-?\d+(\.\d+)?$/.test(s))return null;return +s;};
/* La columna "Quantity" del Summary viene escrita a mano: "3 trackers", "1 Pilot shelter",
   "6 units 1100/13.8 oil shelters", "2 shelters", "Spare parts".  Sacamos el número de
   adelante y guardamos el texto tal cual para poder mostrarlo.  Sin número → 1. */
const _qtyC=v=>{
  if(v==null||v==='')return {n:1,txt:''};
  if(typeof v==='number')return {n:(isFinite(v)&&v>=1)?Math.round(v):1,txt:''};
  if(_esFecha(v))return {n:1,txt:''};
  const s=(''+v).replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim();
  const m=s.match(/^(\d+(?:[.,]\d+)?)(?:\s|$)/);
  if(!m)return {n:1,txt:s};
  const n=Math.round(+String(m[1]).replace(',','.'));
  return {n:(isFinite(n)&&n>=1)?n:1, txt:s};
};
const _txt=v=>(''+(v==null?'':v)).toLowerCase().replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim();
/* ---------- Hoja Summary del detailed → un bloque por pedido, con su fila de fabricante
   (todos sus pagos: DP1, DP2, Balance 1, Balance 2) y las filas de otros componentes debajo ---------- */
function parseDetailed(wb){
  const ws=_sheet(wb,'Summary'); if(!ws) return null;
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,cellDates:true,defval:null});
  let hr=-1;
  for(let i=0;i<Math.min(rows.length,20);i++){const r=(rows[i]||[]).map(_txt);if(r.indexOf('po')>=0||r.indexOf('po#')>=0){hr=i;break;}}
  if(hr<0) return {error:'No encontré la fila de encabezados (celda "PO") en la hoja Summary del detailed.'};
  const H0=rows[hr-1]||[], H1=rows[hr]||[];
  const ncol=Math.max(H0.length,H1.length,...rows.slice(hr,hr+80).map(r=>(r||[]).length));
  const t0=c=>_txt(H0[c]), t1=c=>_txt(H1[c]), colTxt=c=>[t0(c),t1(c)].filter(Boolean).join(' | ');
  const iPO=H1.map(_txt).findIndex(x=>x==='po'||x==='po#');
  /* columna del fabricante/proveedor, su monto propio, y el monto total del pedido (Eaglerise
     no trae "Manufacturer amount": su valor vive en "Total amount") */
  let iComp=-1,iAmt=-1,iTot=-1;
  const ID={};
  for(let c=0;c<ncol;c++){const t=colTxt(c);
    if(iComp<0 && /(manufacturer|supplier|component|proveedor|fabricante|vendor)/.test(t) && !/amount|monto|status|payment|pago/.test(t)) iComp=c;
    if(iTot<0 && /^total amount|monto total|valor total/.test(t)) iTot=c;
    /* identidad del pedido, para poder armarlo todo desde aquí */
    if(ID.prod==null && /^product$|^producto$|^equipo$/.test(t)) ID.prod=c;
    if(ID.desc==null && /product description|descripci/.test(t)) ID.desc=c;
    if(ID.qty==null && /^quantity|^cantidad/.test(t)) ID.qty=c;
    if(ID.st==null && /^status$|^estado$/.test(t)) ID.st=c;
    if(ID.prodFin==null && /production completion|fin de producci/.test(t)) ID.prodFin=c;
    if(ID.etd==null && /^etd/.test(t)) ID.etd=c;
    if(ID.bl==null && /^atd|bl date|fecha bl/.test(t)) ID.bl=c;
    if(ID.eta==null && /^eta/.test(t)) ID.eta=c;
  }
  if(iComp>=0){for(let c=iComp+1;c<Math.min(ncol,iComp+4);c++){const t=colTxt(c);if(/amount|monto|value|valor/.test(t)&&!/payment|status|paid/.test(t)){iAmt=c;break;}}}
  let posicional=false;
  if(iComp<0){iComp=15;posicional=true;} if(iAmt<0){iAmt=iComp+1;} if(iTot<0)iTot=iComp-1;
  /* Ranuras de pago: cada columna después del monto es fecha/monto/%/estado de algún pago.
     Arranca una ranura nueva cuando la fila de grupo trae título, o cuando llega otra fecha.
     Una columna cuyo rol ya está ocupado (p. ej. "Paid amount" acumulado) se ignora. */
  const slots=[]; let cur=null;
  const rolDe=t=>/status|estado/.test(t)?'st':(/date|fecha/.test(t)?'fecha':(/%|percent|porcentaje/.test(t)?'pct':(/amount|monto|value|valor/.test(t)?'amt':null)));
  const tipoDe=t=>/(down\s*payment|anticipo|\bdp\b)/.test(t)?'anticipo':'balance';
  for(let c=iAmt+1;c<ncol;c++){
    const g=t0(c), t=colTxt(c), rol=rolDe(t);
    const esPago=/(down\s*payment|anticipo|\bdp\b|balance|saldo)/.test(t);
    if(!esPago && !g){ if(!rol) cur=null; continue; }        /* columna ajena (remarks, etc.) */
    const nueva = (g && (!cur||cur.grupo!==g)) || (!cur) || (rol==='fecha' && cur.fecha!=null);
    if(nueva){
      const base=(g||t1(c).replace(/\s*(date|fecha|amount|monto|status|estado|percentage|%|\(usd\)).*/,'')).trim();
      cur={grupo:g||base, tipo:tipoDe(t), lbl:(base||('Pago '+(slots.length+1))).replace(/\s+/g,' ').trim(), amt:null,st:null,fecha:null,pct:null};
      slots.push(cur);
    }
    if(rol && cur[rol]==null) cur[rol]=c;
  }
  let ranuras=slots.filter(s=>s.st!=null||s.amt!=null);
  if(ranuras.filter(s=>s.st!=null).length<2){
    posicional=true;   /* encabezados no reconocidos: posiciones del detailed conocido */
    ranuras=[{lbl:'Down payment 1',tipo:'anticipo',fecha:17,amt:18,pct:19,st:20},{lbl:'Down payment 2',tipo:'anticipo',fecha:21,amt:22,pct:23,st:24},
             {lbl:'Balance payment 1',tipo:'balance',fecha:25,amt:26,pct:27,st:28},{lbl:'Balance payment 2',tipo:'balance',fecha:29,amt:30,pct:31,st:33}];
  }
  const colPO=iPO>=0?iPO:1;
  const bloques={}; const orden=[]; let b=null;
  const cerrar=()=>{if(!b)return;
    const fab=b.lineas.filter(l=>l.esFab), prov=b.lineas.filter(l=>!l.esFab);
    const S=(arr,f)=>arr.reduce((s,x)=>s+(+x[f]||0),0);
    b.mfg=b.mfg||'?';
    b.fab={monto:S(fab,'monto'),pagado:S(fab,'pagado'),pendiente:S(fab,'pendiente'),antPend:S(fab,'antPend'),antPagado:S(fab,'antPagado'),sinEstado:fab.some(l=>l.sinEstado)};
    b.otros={monto:S(prov,'monto'),pagado:S(prov,'pagado'),pendiente:S(prov,'pendiente'),
      proveedores:prov.map(l=>({nombre:l.nombre,monto:l.monto,pagado:l.pagado,saldo:l.pendiente,pagos:l.pagos,montoInferido:l.montoInferido}))};
    const pf=fab.flatMap(l=>l.pagos).filter(p=>p.monto>0.5), pfx=pf.filter(p=>!p.implicito);
    b.ultimoPago=pfx.length?pfx[pfx.length-1]:(pf.length?pf[pf.length-1]:null);
    b.sinProgramar=pf.filter(p=>p.implicito).reduce((s,p)=>s+p.monto,0);
    const dps=fab.flatMap(l=>l.pagos).filter(p=>p.tipo==='anticipo'&&(p.monto>0.5||p.estado));
    b.antStatus=dps.some(p=>p.estado==='pending')?'pending':(dps.some(p=>p.estado==='paid')?'paid':'unknown');
    const k=_bKey(b.mfg,b.key);
    if(!bloques[k]){bloques[k]=[];orden.push(k);}
    bloques[k].push(b); b=null;};
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]||[];
    const txtPO=r[colPO]==null?'':(''+r[colPO]).trim();
    if(txtPO && !/\d/.test(txtPO)){cerrar();continue;}       /* título de sección o fila de totales */
    if(txtPO){cerrar();
      const gi=c=>(c==null?null:r[c]);
      b={key:_poKey(txtPO),poRaw:txtPO.replace(/[\r\n]+/g,' ').replace(/\s+/g,' '),fila:i+1,lineas:[],mfg:null,
         id:{prod:gi(ID.prod),desc:gi(ID.desc),qty:gi(ID.qty),st:gi(ID.st),
             prodFin:gi(ID.prodFin),etd:gi(ID.etd),bl:gi(ID.bl),eta:gi(ID.eta),total:gi(iTot)}};}
    if(!b) continue;
    const nombre=(''+(r[iComp]==null?'':r[iComp])).replace(/[\r\n]+/g,' ').trim();
    const propio=_numC(r[iAmt]), total=_numC(r[iTot]);
    if(!nombre && propio==null && total==null) continue;
    if(/^(sub)?total/i.test(nombre)) continue;
    if(!nombre && b.lineas.length>0) continue;
    const esFab=/singsun|eagle/i.test(nombre)||(!nombre&&b.lineas.length===0);
    if(esFab&&!b.mfg) b.mfg=/eagle/i.test(nombre)?'Eaglerise':'Singsun';
    /* monto de la línea: el propio del componente; si no lo trae (Eaglerise) el total del pedido */
    let mTot=propio!=null?propio:(esFab&&total!=null?total:0);
    const pagos=ranuras.map(s=>{
      const m=s.amt!=null?_numC(r[s.amt]):null, est=s.st!=null?_stPago(r[s.st]):null;
      const f=s.fecha!=null?r[s.fecha]:null; let pc=s.pct!=null?_numC(r[s.pct]):null; if(pc!=null&&pc>1)pc=pc/100;
      return {slot:s.lbl,tipo:s.tipo,monto:m,pct:pc,estado:est,fecha:_esFecha(f)?new Date(f.getTime()):null};
    }).filter(p=>(p.monto!=null&&p.monto!==0)||p.estado);
    /* pago con estado pero sin monto escrito: por su %, o lo que falte de la línea */
    const antPctL=CONFIG[b.mfg]?CONFIG[b.mfg].antPct:0.1;
    let acum=pagos.reduce((s,p)=>s+((p.monto>0)?p.monto:0),0);
    pagos.forEach(p=>{ if(p.estado && !(p.monto>0)){
      let v = p.pct!=null ? p.pct*mTot : (p.tipo==='anticipo'&&esFab ? antPctL*mTot : mTot-acum);
      v=Math.max(0,Math.round(v*100)/100); p.monto=v; p.montoInferido=true; acum+=v; }});
    /* línea sin monto propio (Andrés escribe "-") pero con pagos: el monto es la suma de sus pagos */
    let montoInferido=false;
    if(mTot<0.5 && acum>0.5){ mTot=acum; montoInferido=true; }
    /* Andrés a veces deja el estado en blanco o en "-" aunque la plata ya salió. Los pagos van en
       orden: si un pago con monto no tiene estado y DESPUÉS hay otro pago con estado, el de antes
       ya se hizo. Se marca pagado y se avisa que fue inferido. */
    for(let k=0;k<pagos.length;k++){
      if(pagos[k].estado||!(pagos[k].monto>0.5)) continue;
      if(pagos.slice(k+1).some(q=>q.estado)){ pagos[k].estado='paid'; pagos[k].estadoInferido=true; }
    }
    let pagado=0,pendiente=0,antPend=0,antPagado=0,sinEstado=false;
    pagos.forEach(p=>{
      if(p.estado==='paid'){pagado+=p.monto||0;if(p.tipo==='anticipo')antPagado+=p.monto||0;}
      else if(p.estado==='pending'){pendiente+=p.monto||0;if(p.tipo==='anticipo')antPend+=p.monto||0;}
      else if(p.monto>0.5){sinEstado=true;}
    });
    /* Si todos los pagos anotados están Paid, el pedido está pagado aunque el monto de la
       línea sea mayor: son órdenes viejas donde Andrés no cuadró el total. No se inventa deuda. */
    const conEstado=pagos.filter(p=>p.estado), hayPend=pagos.some(p=>p.estado==='pending');
    const faltante=Math.round((mTot-pagado-pendiente)*100)/100;
    let descuadre=0;
    if(faltante>0.5){
      if(hayPend || !conEstado.length){ pendiente+=faltante; pagos.push({slot:'Sin programar',tipo:'balance',monto:faltante,estado:'pending',implicito:true}); }
      else descuadre=faltante;          /* todo pagado: el monto de la línea no cuadra con sus pagos */
    }
    b.lineas.push({fila:i+1,nombre:nombre||'(sin nombre)',esFab,monto:mTot,montoInferido,pagos,pagado,pendiente,antPend,antPagado,sinEstado,descuadre});
  }
  cerrar();
  return {bloques,orden,ranuras:ranuras.map(s=>s.lbl),posicional,cols:{po:colPO,comp:iComp,amt:iAmt,tot:iTot},ID};
}

/* ---------- Hoja Sinosure del detailed: EL ORQUESTADOR DEL CUPO ----------
   Cada renglón de "Consumo" es una fórmula que apunta a una celda del Summary
   (=Summary!AA102, =Summary!S104, =Summary!Q45…). Se leen las fórmulas y no las
   etiquetas: la etiqueta la escribe Andrés a mano y se repite o se equivoca, la
   fórmula dice exactamente de qué pedido y de qué pago sale cada dólar.
   La columna referenciada dice qué está contando:
     S / W  → anticipo (down payment) pendiente
     AA / AE → balance del pedido
     Q      → el monto completo del fabricante
     O      → el costo total del pedido  */
const _SINO_QUE={S:'anticipo (DP1)',W:'anticipo (DP2)',AA:'balance',AE:'balance',Q:'monto del fabricante',O:'costo total del pedido'};
function parseSinosureViejo(wb){
  const ws=_sheet(wb,'Sinosure'); if(!ws) return null;
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const cupos={Singsun:0, Eaglerise:0}, cuposPorEntidad={Singsun:{}, Eaglerise:{}};
  let totalSingsun=null,totalEagle=null,dispSingsun=null,dispEagle=null,zona='cupos';
  const entradas=[];
  const cel=(r,c)=>ws[XLSX.utils.encode_cell({r:r,c:c})]||null;
  const refDe=(r,c)=>{const k=cel(r,c); if(!k||!k.f) return null;
    const m=(''+k.f).match(/^\s*=?\s*'?([^'!]+)'?!\$?([A-Z]{1,3})\$?(\d+)\s*$/);
    return m?{hoja:m[1],col:m[2],fila:+m[3],addr:m[2]+m[3]}:null;};
  for(let r=0;r<rows.length;r++){
    const fila=rows[r]||[], label=_txt(fila[0]);
    if(label.indexOf('consumo total')>=0){ totalSingsun=_numC(fila[1]); totalEagle=_numC(fila[4]); continue; }
    if(label.indexOf('cupo disponible')>=0){ dispSingsun=_numC(fila[1]); dispEagle=_numC(fila[4]); continue; }
    if(label==='consumo'){ zona='consumo'; continue; }
    if(zona==='cupos'){
      if(/solenium|zentrack/.test(label)){
        if(_numC(fila[1])!=null){cupos.Singsun+=_numC(fila[1]);cuposPorEntidad.Singsun[(''+fila[0]).trim()]=_numC(fila[1]);}
        if(_numC(fila[4])!=null){cupos.Eaglerise+=_numC(fila[4]);cuposPorEntidad.Eaglerise[(''+(fila[3]||fila[0])).trim()]=_numC(fila[4]);}
      }
      continue;
    }
    [[0,1,'Singsun'],[3,4,'Eaglerise']].forEach(([cl,cv,lado])=>{
      const etq=fila[cl], val=_numC(fila[cv]);
      if(etq==null||(''+etq).trim()===''||val==null) return;
      entradas.push({lado, etiqueta:(''+etq).replace(/[\r\n]+/g,' ').trim(), valor:val,
        celda:XLSX.utils.encode_cell({r:r,c:cv}), ref:refDe(r,cv)});
    });
  }
  /* dos renglones que apuntan a la MISMA celda del Summary cuentan la misma plata dos veces */
  const vistos={};
  entradas.forEach(e=>{
    if(!e.ref) return;
    const k=e.lado+'|'+e.ref.hoja+'!'+e.ref.addr;
    if(vistos[k]){ e.duplicado=vistos[k]; } else vistos[k]=e.celda;
  });
  return {entradas, cupos, cuposPorEntidad, totalSingsun, totalEagle, dispSingsun, dispEagle,
    conFormula:entradas.filter(e=>e.ref).length, sinFormula:entradas.filter(e=>!e.ref).length};
}
