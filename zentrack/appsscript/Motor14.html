     al aprobar, "Ver en Planes".

     todo el pedido; si cuadra con la suma de los anticipos de las partes,
     su fecha no se le pone al balance (CFM 3-4 salía vencido).
   Sin llaves nuevas: las versiones de PLANES ganan "ref".

const _PK24N={magnum:'Magnum',tiba:'TIBA'};
function _pk24Sum(fs){ const t={}; (fs||[]).forEach(f=>{ const m=f.moneda||'COP'; t[m]=(t[m]||0)+(+f.saldo||0); });
  return Object.keys(t).map(m=>(m==='USD'?'US$ ':m+' ')+fmtUSDs(t[m])).join(' y '); }
function _pk24Viejo(a,r){ const ant=CXP&&CXP[a]; return !!(ant&&ant.corte&&r&&r.corte&&ant.corte>=r.corte); }

  if(!r||!(r.facturas||[]).length) return n+' · estado de cuenta sin facturas: no se carga';
  if(_pk24Viejo(a,r)) return n+' · estado de cuenta del '+_v3F(r.corte)+': ya tienes '+(ant.corte===r.corte?'ese corte':'uno más nuevo ('+_v3F(ant.corte)+')')+', no se toca';
  const df=cxpDiff(ant,r);
  return n+' · estado de cuenta del '+_v3F(r.corte)+' · '+r.facturas.length+' facturas · '+_pk24Sum(r.facturas)
    +(ant&&ant.corte?' · contra el del '+_v3F(ant.corte)+': '+df.nuevas.length+' nuevas, '+df.yaNo.length+' ya no están, '+df.cambian.length+' cambian':' · antes no estaba cargado'); }
function _pk24CxpAplicar(a,r0){ if(!(a in _PK24N)||!r0||!(r0.facturas||[]).length||_pk24Viejo(a,r0)) return false;

  /* igual que cxpAprobar: el cupo solo lo trae el PDF y los anticipos solo el Excel */
  if(r.cupo==null&&ant&&ant.cupo!=null){ r.cupo=ant.cupo; r.sobrecupo=ant.sobrecupo; r.cupoCorte=ant.cupoCorte||ant.corte; } else if(r.cupo!=null) r.cupoCorte=r.corte;
  if(r.anticipos==null) r.anticipos=(ant&&ant.anticipos)||[];
  CXP[a]=Object.assign(r,{cambios:cxpDiff(ant,r),cargado:_p14Iso(TODAY)}); return true; }
const _pk24Regla=r=>r&&r.tipo==='maxMora'?'máx. '+(r.dias==null?30:r.dias)+' días vencida':'al vencer';
function _pk24MioTxt(M){ const g={};
  Object.keys(M||{}).forEach(k=>{ const a=k.split(':')[0], o=M[k]||{}, cur=CXPMIO[k]||{}, q=(g[a]=g[a]||{quita:0,pone:0});

  if(x.ref&&p&&(p.versiones||[]).some(v=>v.ref===x.ref)) return c.n+' · "'+(x.nombre||'Versión')+'" ya estaba: no se repite';

function _pk24PlanAplicar(x){ const c=_v3Cp(x.cp); if(!c) return null; const p=_v3PlanDe(c); p.versiones=p.versiones||[];

const _pkLeerAntes24=pkLeer;

      if(CXPMIO[k]&&!Object.keys(CXPMIO[k]).length) delete CXPMIO[k]; if(Object.keys(s).length) limpio[k]=s; });
    d.CXPMIO=limpio; }
  (d.PLANES_V||[]).forEach(x=>{ try{ if(_pk24PlanAplicar(x)&&!ir) ir=x.cp; }catch(err){ console.warn(err); } });
  const r=_pkAplicarAntes24.apply(this,arguments);
  if(PKPREV&&PKPREV.hecho){ PKPREV.ir=ir||((d.PLANES_V||[])[0]||{}).cp||null; _pkPintar(); }
  return r; };

/* ===================================================================
   v2.6 · CAPA 1 ORDENADA: SISTEMA VISUAL, TABLERO, CAJA Y PLANES

function _z26Css(){ try{ [...document.styleSheets].forEach(ss=>{ let L; try{ L=ss.cssRules; }catch(e){ return; }
