<script>

/* =============== PESTAÑA SINOSURE ===============
   La hoja de Andrés tal como se ve en el detailed, celda por celda, con el
   pedido al que apunta cada fórmula al lado. Más las tres decisiones que
   de verdad se toman con ella: si cabe el próximo pedido, cuándo se libera
   cupo, y qué hacer con lo que está en el aire. */

/* Reconstruye los renglones de la hoja a partir de lo que ya quedó guardado:
   cada línea de sinoDetalle es una celda de la hoja apuntando a un pedido. */
function hojaSino(){
  const C=CONCILIA; if(!C) return [];
  const porCelda={};
  Object.entries(C.sinoDetalle||{}).forEach(([clave,lineas])=>{
    (lineas||[]).forEach(l=>{
      const r=porCelda[l.celda]||(porCelda[l.celda]={celda:l.celda,etiqueta:l.etiqueta,
        total:l.total,ref:l.ref,que:l.que,claves:[],conjunto:l.conjunto});
      if(r.claves.indexOf(clave)<0) r.claves.push(clave);
    });
  });
  (C.sinoDup||[]).forEach(d=>{porCelda[d.celda]={celda:d.celda,etiqueta:d.etiqueta,total:d.valor,
    ref:d.ref,que:'',claves:[],dup:true,yaEn:d.yaEn,lado:d.lado,derrames:d.derrames||[]};});
  (C.sinoSueltosL||[]).forEach(s=>{porCelda[s.celda]={celda:s.celda,etiqueta:s.etiqueta,total:s.valor,
    ref:null,que:'',claves:[],suelto:true,lado:s.lado};});
  const filas=Object.values(porCelda).map(r=>{
    const col=(r.celda.match(/^[A-Z]+/)||['B'])[0], fil=+((r.celda.match(/\d+$/)||[0])[0]);
    r.col=col; r.fil=fil; r.lado=r.lado||(col==='B'?'Singsun':'Eaglerise');
    r.eqs=r.claves.map(k=>EQ.find(e=>kOf(e)===k)).filter(Boolean);
    return r;
  }).sort((a,b)=>a.fil-b.fil||a.col.localeCompare(b.col));

  /* Andrés parte algunos pedidos en DOS renglones: uno por el anticipo y otro
     por el balance (CFM 3.4 está en E10 y en E14). Comparar renglón contra
     renglón marcaría las dos mitades como errores. La comparación se hace
     contra el pedido completo, que es lo que sinoPorDerrame ya suma. */
  const mapa=(C.sinoPorDerrame||{});
  const hermanas={};
  filas.forEach(r=>{ if(r.dup||r.suelto) return;
    r.claves.forEach(k=>{ (hermanas[k]=hermanas[k]||[]).push(r.celda); }); });
  filas.forEach(r=>{
    if(r.dup||r.suelto){ r.mio=0; r.dif=0; r.cuadra=true; return; }
    r.hojaPed=r.claves.reduce((s,k)=>s+(mapa[k]||0),0);
    r.mio=r.eqs.reduce((s,e)=>s+consumoEq(e,e.mfg),0);
    r.dif=Math.round((r.mio-r.hojaPed)*100)/100;
    r.cuadra=Math.abs(r.dif)<=2;
    /* las otras celdas del mismo pedido, para poder decirlo en la fila */
    const otras=[...new Set(r.claves.flatMap(k=>hermanas[k]||[]))].filter(c=>c!==r.celda);
    r.hermanas=otras;
  });
  return filas;
}
/* los pedidos vivos que la hoja no lista: no son renglones, pero sí plata */
const fueraDeHoja=mfg=>EQ.filter(e=>e.mfg===mfg&&(+e.cupoSaldo||0)>0.5
  &&((CONCILIA&&CONCILIA.sinoPorDerrame)||{})[kOf(e)]==null);

/* ---- la hoja, con el formato del Excel ---- */
const money=n=>{const v=+n||0, s=v<0?'-':'';
  return s+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
let SNSIM={Singsun:'',Eaglerise:''};
let SNAB={};                               /* qué renglones están abiertos */
function abrirSino(celda){SNAB[celda]=!SNAB[celda];pintarSino();}

function pintarSino(){
  const cont=document.getElementById('v-sinosure'); if(!cont) return;
  if(!EQ.length||!CONCILIA||!CONCILIA.sino){
    cont.innerHTML=`<div class="g4em"><h3>Sin la hoja Sinosure</h3>
      <p>Esta pestaña reproduce tu hoja <b>Sinosure</b> tal como la ves en el detailed.
         Carga el detailed y vuelve.</p>
      <button class="btn" onclick="verifyOpen()">Cargar datos</button></div>`;
    return;
  }
  const filas=hojaSino(), S=CONCILIA.sino;
  const ents=[...new Set([...Object.keys((S.cuposPorEntidad||{}).Singsun||{}),
                          ...Object.keys((S.cuposPorEntidad||{}).Eaglerise||{})])];

  const bloque=(mfg,titulo)=>{
    const fs=filas.filter(r=>r.lado===mfg);
    const ce=(S.cuposPorEntidad||{})[mfg]||{};
    const techo=+S.cupos[mfg]||0;
    const total=mfg==='Singsun'?S.totalSingsun:S.totalEagle;
    const disp=mfg==='Singsun'?S.dispSingsun:S.dispEagle;
    const mio=EQ.filter(e=>e.mfg===mfg).reduce((s,e)=>s+consumoEq(e,e.mfg),0);
    const fuera=fueraDeHoja(mfg);
    return `<table class="hoja">
      <tr class="h"><td class="l">${mfg==='Singsun'?'Cupos':''}</td><td class="v">${titulo}</td></tr>
      ${ents.map(k=>`<tr><td class="l">${esc4(k)}</td>
        <td class="v">${ce[k]!=null?money(ce[k]):''}</td></tr>`).join('')}
      <tr class="sub"><td class="l"></td><td class="v b">${money(techo)}</td></tr>
      <tr class="esp"><td colspan="2"></td></tr>
      <tr class="h"><td class="l b">${mfg==='Singsun'?'Consumo':''}</td><td class="v"></td></tr>
      ${fs.map(r=>renglonSino(r)).join('')}
      ${fuera.length?`<tr class="esp"><td colspan="2"></td></tr>
        ${fuera.map(e=>`<tr class="falta" title="No está en la hoja de Andrés">
          <td class="l">${esc4(e.derrame)} <span class="pen">falta en la hoja</span></td>
          <td class="v">${money(consumoEq(e,mfg,'andres'))}</td></tr>`).join('')}`:''}
      <tr class="esp"><td colspan="2"></td></tr>
      <tr class="tot"><td class="l b">${mfg==='Singsun'?'Consumo total':''}</td>
        <td class="v b">${money(total)}</td></tr>
      ${Math.abs(mio-total)>2?`<tr class="nota"><td class="l"></td>
        <td class="v">el motor cuenta ${money(mio)}</td></tr>`:''}
      <tr class="esp"><td colspan="2"></td></tr>
      <tr class="tot"><td class="l b">${mfg==='Singsun'?'Cupo disponible':''}</td>
        <td class="v b ${disp<0?'neg':''}">${money(disp)}</td></tr>
    </table>`;
  };

  const nd=filas.filter(r=>r.dup||r.suelto||!r.cuadra).length
          +fueraDeHoja('Singsun').length+fueraDeHoja('Eaglerise').length;
  cont.innerHTML=`
    <div class="sec" style="display:flex;align-items:baseline;gap:12px;margin-bottom:4px">
      <h2 style="font-size:16px;font-weight:600">Hoja Sinosure</h2>
      <div style="font-size:12.5px;color:var(--ink2)">
        ${nd?`<b style="color:var(--dato-debo)">${nd} renglón(es) por revisar</b> · ábrelos para ver qué pedidos los componen`
            :'todo conciliado · abre cualquier renglón para ver qué pedidos lo componen'}</div>
      <div style="flex:1"></div>
      <button class="btn" onclick="abrirTodoSino()">${Object.values(SNAB).some(Boolean)?'Cerrar todo':'Abrir todo'}</button>
      <button class="btn" onclick="exportarSino()">Copiar</button>
    </div>
    <div class="hojawrap">${bloque('Singsun','Singsun')}${bloque('Eaglerise','Eagle')}</div>
    <div class="snsims">
      ${['Singsun','Eaglerise'].map(m=>`<div class="snsim">
        <label>¿Me cabe un pedido ${m==='Singsun'?'Singsun':'Eagle'} de</label>
        <input type="number" placeholder="0" value="${SNSIM[m]}" oninput="SNSIM['${m}']=this.value;simSino('${m}')">
        <label>USD?</label><span id="sim${m}" class="simr">${simTexto(m)}</span></div>`).join('')}
    </div>
    ${timelineSino()}`;
}

/* un renglón de la hoja, abatible */
function renglonSino(r){
  const ab=!!SNAB[r.celda];
  const marca=r.dup?'<span class="pen avi">repite '+esc4(r.yaEn)+'</span>'
    :r.suelto?'<span class="pen mal">sin pedido</span>'
    :!r.cuadra?'<span class="pen mal">revisar</span>':'';
  return `<tr class="cons ${ab?'ab':''} ${r.dup?'dupr':r.suelto?'suelr':!r.cuadra?'difr':''}"
      onclick="abrirSino('${esc4(r.celda)}')">
      <td class="l"><span class="chev">${ab?'▾':'▸'}</span>${esc4(r.etiqueta)} ${marca}</td>
      <td class="v">${money(r.total)}</td></tr>
    ${ab?`<tr class="det"><td colspan="2">${detalleSino(r)}</td></tr>`:''}`;
}
function detalleSino(r){
  const meta=`<div class="dmeta">${esc4(r.celda)} · ${esc4(r.ref||'escrito a mano')}${r.que?' · '+esc4(r.que):''}
    ${r.hermanas&&r.hermanas.length?` · se suma con ${r.hermanas.map(esc4).join(', ')}
      para dar <b>${money(r.hojaPed)}</b> del pedido`:''}</div>`;
  if(r.dup) return meta+`<div class="dav">Este renglón apunta a la misma celda que <b>${esc4(r.yaEn)}</b>,
    así que contaría dos veces los mismos ${money(r.total)}.
    Hoy <b>${CONFIG.contarDupSino?'sí':'no'}</b> suma ·
    <a href="#" onclick="event.stopPropagation();setDupSino('${CONFIG.contarDupSino?'no':'si'}');pintarSino();return false">cambiarlo</a></div>`;
  if(r.suelto) return meta+`<div class="dav">Este renglón no cae en ningún pedido del detailed.
    Puede ser una etiqueta que Andrés escribió distinto, o un pedido que ya no existe.</div>`;
  if(!r.eqs.length) return meta+`<div class="dav">No se encontró el pedido al que apunta.</div>`;
  const tot=r.eqs.reduce((s,e)=>s+(+e.cupoMonto||0),0);
  return meta+`<table class="dt"><thead><tr>
      <th>Pedido</th><th>Proyecto</th><th>Estado</th>
      <th class="r">Monto fáb.</th><th class="r">Saldo fáb.</th><th class="r">De este renglón</th>
    </tr></thead><tbody>
    ${r.eqs.map(e=>{
      const parte=r.eqs.length>1?(tot?r.total*((+e.cupoMonto||0)/tot):r.total/r.eqs.length):r.total;
      return `<tr onclick="event.stopPropagation();openPanel('${e.ordenId}')">
        <td><b>${esc4(e.derrame)}</b></td><td>${esc4(projOf(e)||'—')}</td>
        <td><span class="g4tag">${STAGE[e.st]||'—'}</span></td>
        <td class="r">${money(+e.cupoMonto||0)}</td>
        <td class="r">${money(+e.cupoSaldo||0)}</td>
        <td class="r"><b>${money(parte)}</b></td></tr>`;}).join('')}
    </tbody></table>
    ${!r.cuadra?`<div class="dav">La hoja le asigna <b>${money(r.hojaPed)}</b> a
      ${r.eqs.map(e=>esc4(e.derrame)).join(', ')}, y el motor cuenta <b>${money(r.mio)}</b>
      (${r.dif>0?'+':''}${money(r.dif)}).</div>`:''}`;
}
function abrirTodoSino(){
  const hay=Object.values(SNAB).some(Boolean);
  SNAB={}; if(!hay) hojaSino().forEach(r=>SNAB[r.celda]=true);
  pintarSino();
}

/* --- ¿me cabe? --- */
function simTexto(mfg){
  const v=+SNSIM[mfg]||0;
  const techo=+CUPO[mfg]||0, usado=EQ.filter(e=>e.mfg===mfg).reduce((s,e)=>s+consumoEq(e,e.mfg),0);
  const libre=techo-usado;
  if(!v) return `te quedan <b>${fmtUSDs(libre)}</b>`;
  const queda=libre-v;
  if(queda>=0) return `<b style="color:var(--ok)">sí cabe</b> · quedarías con ${fmtUSDs(queda)}`;
  /* qué tendrías que girar primero para que quepa */
  const cand=EQ.filter(e=>e.mfg===mfg&&consumoEq(e,e.mfg)>0)
    .map(e=>({e,libera:consumoEq(e,e.mfg),saldo:+e.cupoSaldo||0,
              f:e.limitePago?new Date(e.limitePago):null}))
    .sort((a,b)=>b.libera-a.libera);
  let falta=-queda, girar=0, cuales=[];
  for(const c of cand){ if(falta<=0) break; cuales.push(c); girar+=c.saldo; falta-=c.libera; }
  return `<b style="color:var(--danger)">no cabe por ${fmtUSDs(-queda)}</b>`+
    (cuales.length?` · girando ${fmtUSDs(girar)} de ${cuales.map(c=>esc4(c.e.derrame)).join(', ')} sí cabría`:'');
}
function simSino(mfg){const el=document.getElementById('sim'+mfg); if(el) el.innerHTML=simTexto(mfg);}

/* --- cuándo se libera cupo --- */
function timelineSino(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const items=EQ.filter(e=>e.limitePago&&consumoEq(e,e.mfg)>0.5)
    .map(e=>({e,f:new Date(e.limitePago),libera:consumoEq(e,e.mfg),girar:+e.cupoSaldo||0}))
    .sort((a,b)=>a.f-b.f);
  if(!items.length) return '';
  const acum={Singsun:0,Eaglerise:0};
  const libre=m=>(+CUPO[m]||0)-EQ.filter(e=>e.mfg===m).reduce((s,e)=>s+consumoEq(e,e.mfg),0);
  const base={Singsun:libre('Singsun'),Eaglerise:libre('Eaglerise')};
  return `<div class="sec" style="display:flex;align-items:baseline;gap:12px;margin:30px 0 10px">
      <h2 style="font-size:16px;font-weight:600">Cuándo se te libera cupo</h2>
      <div style="font-size:12.5px;color:var(--ink2)">el cupo se suelta el día que gires el saldo de cada pedido</div></div>
    <div class="tblwrap"><table class="g4t"><thead><tr>
      <th>Fecha límite</th><th>Pedido</th><th>Fabricante</th>
      <th class="r">Tienes que girar</th><th class="r">Se libera</th><th class="r">Cupo libre después</th>
    </tr></thead><tbody>
      ${items.map(it=>{
        acum[it.e.mfg]+=it.libera;
        const d=Math.round((it.f-hoy)/86400000);
        return `<tr>
          <td>${fmtD(it.f)}<div class="snm" style="${d<0?'color:var(--danger);font-weight:600':''}">${
            d<0?`vencida hace ${-d} d`:d===0?'es hoy':`en ${d} días`}</div></td>
          <td><b>${esc4(it.e.derrame)}</b><div class="snm">${esc4(projOf(it.e)||'')}</div></td>
          <td>${it.e.mfg}</td>
          <td class="r">${fmtUSDs(it.girar)}</td>
          <td class="r">${fmtUSDs(it.libera)}</td>
          <td class="r"><b>${fmtUSDs(base[it.e.mfg]+acum[it.e.mfg])}</b></td></tr>`;}).join('')}
    </tbody></table></div>`;
}

/* El cuadro que le puedes mandar al dueño del detailed */
function exportarSino(){
  const filas=hojaSino();
  const l=['Celda\tLo que dice la hoja\tValor\tFórmula\tPedido\tLo que cuento yo\tDesfase\tObservación'];
  filas.forEach(r=>l.push([r.celda,r.etiqueta,Math.round(r.total),r.ref||'sin fórmula',
    r.eqs.map(e=>e.derrame).join(' + ')||'—',
    r.dup||r.suelto?'':Math.round(r.mio), r.dup||r.suelto?'':(r.cuadra?0:Math.round(r.dif)),
    r.dup?('repite '+r.yaEn+': cuenta dos veces la misma celda'):
    r.suelto?'no cae en ningún pedido':
    ((r.hermanas&&r.hermanas.length?'con '+r.hermanas.join(', ')+' suma '+Math.round(r.hojaPed)+' · ':'')
      +(r.cuadra?'ok':'no cuadra'))].join('\t')));
  ['Singsun','Eaglerise'].forEach(m=>fueraDeHoja(m).forEach(e=>
    l.push(['—',e.derrame,Math.round(consumoEq(e,m,'andres')),'','','','','falta en la hoja'])));
  const txt=l.join('\n');
  const ta=document.createElement('textarea'); ta.value=txt;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  toast(ok?`Copiada la hoja con <b>${filas.length}</b> renglón(es) y su mapeo · pégala en un correo`
          :'No se pudo copiar solo · está en la consola del navegador');
  if(!ok) console.log(txt);
}

/* --- las pestañas nuevas se pintan al entrar --- */
document.querySelectorAll('nav.tabs button[data-v="precios"],nav.tabs button[data-v="sinosure"]')
  .forEach(b=>b.addEventListener('click',()=>{ b.dataset.v==='precios'?pintarPrecios():pintarSino(); }));



/* =============== NO DEJAR DOS PRECIOS PELEANDO ===============
   En "Editar cliente" hay una casilla de precio por pedido. Si ese pedido
   ya está en un grupo, el grupo manda y lo que se escriba ahí no se usa.
   En vez de ignorarlo en silencio, se bloquea la casilla y se dice dónde
   está el precio de verdad. */
if(typeof renderEditCliente==='function'){
  const _recOrig=renderEditCliente;
  renderEditCliente=function(){
    _recOrig.apply(this,arguments);
    try{ marcarPreciosDeGrupo(); }catch(e){}
  };
}
function marcarPreciosDeGrupo(){
  document.querySelectorAll('#editCliBody input.ec-num, .ec-tbl input.ec-num').forEach(inp=>{
    const oc=inp.getAttribute('onchange')||'';
    if(oc.indexOf("'precioVenta'")<0) return;
    const m=oc.match(/setEqField\((\d+)/); if(!m) return;
    const e=EQ[+m[1]]; if(!e) return;
    const g=gpDeEq(e); if(!g) return;
    const td=inp.parentElement; if(!td||td.dataset.gp) return;
    td.dataset.gp='1';
    td.innerHTML=`<div style="font-variant-numeric:tabular-nums;font-weight:600">${fmtUSDs(gpParte(g,e))}</div>
      <small style="display:block;font-size:10px;color:var(--ink3);line-height:1.35">
        del grupo <b>${esc4(g.nombre||'sin nombre')}</b><br>
        <a href="#" onclick="navTo('precios');GSEL='${g.id}';pintarPrecios();return false"
           style="color:var(--accent)">editarlo ahí</a></small>`;
  });
}

/* =============== LISTA DE PEDIDOS: PRECIO Y SELECCIÓN DIRECTOS ===============
   La lista mostraba solo la orden madre y había que abrir un panel para ver
   los pedidos. Ahora cada orden se abre ahí mismo, con el precio editable en
   la fila y una casilla para escoger los que van juntos en una factura. */
let LSEL=new Set();          /* derrames escogidos */
let LAB=new Set();           /* órdenes abiertas */

if(typeof renderLedger==='function'){
  renderLedger=function(){
    const cont=document.getElementById('ledger'); if(!cont) return;
    let os=ORD.slice();
    if(typeof filtP!=='undefined'){
      if(filtP==='Tracker')os=os.filter(o=>o.mfg==='Singsun');
      else if(filtP==='Shelter')os=os.filter(o=>o.mfg==='Eaglerise');
      else if(filtP==='vencida')os=os.filter(o=>o.equipos.some(isOver));
      else if(filtP==='pipeline')os=os.filter(o=>o.equipos.some(e=>!isShipped(e)));
      else if(filtP==='sinprecio')os=os.filter(o=>o.equipos.some(e=>!(precioVenta(e)>0)));
      else if(filtP==='sincupo')os=os.filter(o=>o.equipos.some(e=>e.mfg&&(+e.cupoSaldo||0)>0.5
        && !e.sinoManual && ((CONCILIA&&CONCILIA.sinoPorDerrame)||{})[kOf(e)]==null));
    }
    cont.innerHTML=os.map(o=>{
      const comp=o.equipos.reduce((s,e)=>s+consumoEq(e,o.mfg),0);
      const balPend=o.equipos.filter(e=>isShipped(e)).reduce((s,e)=>s+(+e.balSaldo||0),0);
      const over=o.equipos.some(isOver);
      const cnt={};o.equipos.forEach(e=>cnt[e.st]=(cnt[e.st]||0)+1);
      const resumen=Object.entries(cnt).map(([k,v])=>`${v} ${STAGE[k].toLowerCase()}`).join(' · ');
      const ab=LAB.has(o.id);
      const todos=o.equipos.every(e=>LSEL.has(e.derrame));
      const algunos=!todos&&o.equipos.some(e=>LSEL.has(e.derrame));
      const sinP=o.equipos.filter(e=>!(precioVenta(e)>0)).length;
      return `<tr class="row ord ${ab?'ab':''}" onclick="abrirOrden('${o.id}')">
        <td><input type="checkbox" class="lchk" ${todos?'checked':''} ${algunos?'data-ind="1"':''}
              onclick="event.stopPropagation();selOrden('${o.id}',this.checked)">
            <span class="chev">${ab?'▾':'▸'}</span><span class="pid">Orden ${o.id}</span></td>
        <td>${esc4(o.cliente)}<div class="stage" style="color:var(--ink3);font-size:12px">${
          (function(){const n=nEquipos(o.equipos),t=o.mfg==='Singsun'?'tracker':'shelter';
            return n+' '+t+(n===1?'':'s')+(n!==o.equipos.length?' en '+o.equipos.length+' pedidos':'');})()}
          ${sinP?`<span class="g4tag avi" style="margin-left:6px">${sinP} sin precio</span>`:''}</div></td>
        <td><span class="stage">${resumen}</span></td>
        <td class="r">${fmtUSD(comp)}</td>
        <td class="r">${balPend>0?fmtUSD(balPend):'<span style="color:var(--ink3)">—</span>'}${
          over?' <span style="background:var(--danger-soft);color:var(--danger);font-size:10px;padding:1px 6px;border-radius:4px">vencido</span>':''}</td>
      </tr>${ab?`<tr class="subrow"><td colspan="5">${tablaPedidos(o)}</td></tr>`:''}`;
    }).join('');
    barraSel();
  };
}
function tablaPedidos(o){
  return `<table class="ptab"><thead><tr>
      <th style="width:30px"></th><th>Pedido</th><th>Proyecto</th><th>Estado</th>
      <th class="r">Saldo cupo</th>

/* 1) EL PRECIO DE GRUPO NO LLEGABA AL ESTADO DE CUENTA.
   Seis sitios del motor leen e.precioVenta directo (la tabla de "estimado ·
   pendiente facturar", los totales del cliente, la marca de "sin precio"…)
   y se saltaban el grupo, así que todo seguía diciendo "definir".
   En vez de parchar seis lecturas, el grupo escribe su parte en el pedido:
   el grupo manda, y el campo de siempre queda sincronizado. */
function sincronizarPrecios(){
  let n=0;
  GPRE.forEach(g=>{
    gpEquipos(g).forEach(e=>{
      const parte=gpParte(g,e);
      if(Math.abs((+e.precioVenta||0)-parte)>0.005){ e.precioVenta=parte; n++; }
    });
  });
  return n;
}

/* ===================================================================
   CAPA SINOSURE MANUAL (v1.1)
   Lo de Sinosure es TUYO. El motor ya no decide:
     · una carga nueva solo puede AGREGAR pedidos a la bandeja de "sin
       clasificar"; lo que ya clasificaste no se toca NUNCA;
     · el techo se pone en Ajustes y ninguna carga lo pisa;
     · la hoja Sinosure del detailed, si la cargas, queda guardada solo
       para poder compararla al lado — nunca como fuente.
   Se engancha reasignando funciones que ya existen, sin tocar lo de antes.
   =================================================================== */
let SINO={ped:{},sembrado:false};

/* Cada pedido tiene un modo. Eso son las palancas:
     'saldo' → consume lo que todavía le debes a la fábrica (se libera al pagar)
     'monto' → consume el pedido completo mientras siga vivo
     'fijo'  → el número que tú escribas, menos lo que hayas girado desde entonces
     'fuera' → no entra al cupo
     null    → sin clasificar, está en la bandeja y no consume */
const SINO_MODOS=[['saldo','Saldo por pagar'],['monto','Monto completo'],['fijo','Monto fijo'],['fuera','No entra']];
const sinoReg=e=>SINO.ped[kOf(e)]||null;

/* ---- DERRAMES (v1.4.1) ----
   La hoja Sinosure de Andrés habla del pedido completo (7-2), nunca de sus partes
   (7-2A, 7-2B). Antes cada parte necesitaba su propia clasificación, nadie se la
   daba, y todo pedido derramado consumía 0. Ahora una parte sin decisión propia
   HEREDA la de su pedido completo, repartida por su monto. */
const _reDer=/^(.*\d)([A-P])$/;
const _claveDe=(mfg,der)=>kOf({mfg:mfg,derrame:der});
/* Encuentra los derrames de una lista: partes A, B, C… seguidas, sin el pedido entero al lado. */
function _gruposDerrame(lista){
  const g={}, hay={};
  lista.forEach(function(e){ hay[e.mfg+'|'+e.derrame]=true; });
  lista.forEach(function(e){
    const m=(''+(e.derrame||'')).match(_reDer); if(!m) return;
    if(hay[e.mfg+'|'+m[1]]) return;
    const k=e.mfg+'|'+m[1];
    (g[k]=g[k]||{mfg:e.mfg,base:m[1],partes:[]}).partes.push(e);
  });
  Object.keys(g).forEach(function(k){
    const ps=g[k].partes.sort(function(a,b){return (''+a.derrame).localeCompare(''+b.derrame);});
    const letras=ps.map(function(x){return (''+x.derrame).slice(-1);}).join('');
    if(ps.length<2||'ABCDEFGHIJKLMNOP'.indexOf(letras)!==0) delete g[k]; else g[k].partes=ps;
  });
  return g;
}
function _marcarDerrames(lista){
  const g=_gruposDerrame(lista);
  Object.keys(g).forEach(function(k){ g[k].partes.forEach(function(x){ x.splitDe=g[k].base; }); });
  return g;
}
/* La decisión que manda sobre un pedido: la suya, o la de su pedido completo. */
function sinoRegEf(e){
  const own=SINO.ped[kOf(e)];
  if(own&&own.modo) return {r:own,share:1,heredado:false};
  if(e&&e.splitDe){
    const pr=SINO.ped[_claveDe(e.mfg,e.splitDe)];
    if(pr&&pr.modo){
      const sib=EQ.filter(function(x){return x.mfg===e.mfg&&x.splitDe===e.splitDe;});
      const tot=sib.reduce(function(a,x){return a+(+x.cupoMonto||0);},0);
      return {r:pr,share:tot?(+e.cupoMonto||0)/tot:1/Math.max(1,sib.length),heredado:true};
    }
  }
  return null;
}
function sinoSet(clave,campo,valor){
  const r=SINO.ped[clave]||(SINO.ped[clave]={modo:null,fijo:0,nota:'',sug:null});
  r[campo]=(campo==='fijo')?(+valor||0):valor;
  /* lo decidiste tú: ninguna carga lo vuelve a tocar */
  if(campo==='modo'||campo==='fijo') r.mio=true;
  if(campo==='modo'&&valor==='fijo'&&!(+r.fijo>0)){
    const e=EQ.find(function(x){return kOf(x)===clave;}); if(e) r.fijo=Math.round(+e.cupoSaldo||0);
  }
}
function sinoSug(e){
  const ef=sinoRegEf(e), r=ef?ef.r:sinoReg(e);
  if(!r||r.sug==null) return null;
  return Math.round(r.sug*(ef?ef.share:1));
}

/* ---- el consumo sale de TU decisión (o de la propuesta, si no has decidido) ---- */
const _consumoAnterior=consumoEq;
consumoEq=function(e,mfg,regla){
  const ef=sinoRegEf(e);
  if(!ef||ef.r.modo==='fuera') return 0;
  const r=ef.r;
  const O=(e.cupoSaldo!=null)?(+e.cupoSaldo||0):((e.antSaldo||0)+(e.balSaldo||0));
  const M=(e.cupoMonto!=null)?(+e.cupoMonto||0):(+e.mfgAmt||0);
  /* "monto fijo" es una decisión explícita y manda sobre todo, incluso si el
     pedido figura pagado. En una parte de un derrame, le toca su proporción. */
  if(r.modo==='fijo'){
    const girado=Math.max(0,(+e.cupoSaldo0||0)-O);
    return Math.max(0,(+r.fijo||0)*ef.share-girado);
  }
  if(O<=0.5) return 0;
  if(r.modo==='monto') return M;
  return O;
};

/* Qué propondría la hoja de Andrés para un pedido con este saldo (O) y monto (M). */
function _sinoPropuesta(O,M,d){
  if(d==null) return null;
  const v=Math.round(d);
  if(Math.abs(v-O)<=2) return {modo:'saldo',fijo:0};
  if(Math.abs(v-M)<=2) return {modo:'monto',fijo:0};
  return {modo:'fijo',fijo:v};
}
/* ---- cada carga ----
   · lo que decidiste tú (mio) no se toca nunca;
   · lo que está "sin clasificar" se PROPONE desde la hoja de Andrés, como la primera vez;
   · lo ya clasificado no se re-propone: se mueve solo con los pagos;
   · solo lo que la hoja no lista (el PO#16) queda en la bandeja.
   Antes, un pedido nuevo entraba siempre "sin clasificar" y consumía 0 hasta que
   alguien lo tocara: por eso cada carga pedía más mano. */
function sinoMerge(){
  const hoja=(CONCILIA&&CONCILIA.sinoPorDerrame)||{};
  const g=_marcarDerrames(EQ);
  let pendientesNuevos=0;
  const proponer=function(k,O,M,manual,embarcado){
    const d=hoja[k];
    let r=SINO.ped[k]; const esNuevo=!r;
    if(!r) r=SINO.ped[k]={modo:null,fijo:0,nota:'',sug:null};
    if(d!=null) r.sug=Math.round(d);
    /* solo se propone donde no hay nada decidido: lo ya clasificado (por ti o por la
       primera propuesta) se queda, y se mueve solo con los pagos del archivo */
    if(r.mio||r.modo) return;
    let p=_sinoPropuesta(O,M,d);
    if(manual==='no') p={modo:'fuera',fijo:0};
    else if(!p&&manual==='si') p={modo:embarcado?'saldo':'monto',fijo:0};
    if(p){ r.modo=p.modo; r.fijo=p.fijo; }
    if(esNuevo&&!r.modo) pendientesNuevos++;
  };
  /* el pedido completo de cada derrame: la hoja lo lista por él, no por sus partes */
  Object.keys(g).forEach(function(k){
    const x=g[k];
    const O=x.partes.reduce(function(a,e){return a+(+e.cupoSaldo||0);},0);
    const M=x.partes.reduce(function(a,e){return a+(+e.cupoMonto||e.mfgAmt||0);},0);
    proponer(_claveDe(x.mfg,x.base),Math.round(O),Math.round(M),x.partes[0].sinoManual,isShipped(x.partes[0]));
  });
  EQ.forEach(function(e){
    if(e.splitDe) return;
    proponer(kOf(e),Math.round(+e.cupoSaldo||0),Math.round(+e.cupoMonto||e.mfgAmt||0),e.sinoManual,isShipped(e));
  });
  SINO.sembrado=true;
  return pendientesNuevos;
}
function sinoSembrar(){ return sinoMerge(); }
const sinoPendientes=()=>EQ.filter(function(e){return !sinoRegEf(e);});

/* ---- que SINO viva en la Hoja junto con todo lo demás ---- */
const _serAntesSino=serializeState;
serializeState=function(){
  const o=JSON.parse(_serAntesSino.apply(this,arguments));

  return JSON.stringify(o);
};
const _appAntesSino=applyState;
applyState=function(s){

     clasificación se respeta como tuyo; lo que quedó "sin clasificar" se vuelve a proponer */
  Object.keys(SINO.ped).forEach(function(k){ const r=SINO.ped[k]; if(r&&r.mio===undefined) r.mio=!!r.modo; });
  sinoMerge();
};

/* ---- después de aprobar una carga, los pedidos nuevos entran a la bandeja ---- */

/* ===================================================================
   ARREGLO DEL FOCO EN LA PESTAÑA PRECIOS
   El problema: gpSet() llamaba a refreshAll() en cada tecla, y refreshAll
   está enganchado para repintar Precios. O sea que al escribir una letra se
   reconstruía la pestaña entera y el input donde estabas escribiendo dejaba
   de existir: por eso te sacaba y tocaba volver a hacer clic. Encima mandaba
   un guardado a la Hoja por cada tecla.
   La solución: mientras escribes solo se toca el estado y se refrescan los
   números a mano, sin repintar. El repintado y el guardado ocurren cuando
   sales del campo o medio segundo después de la última tecla.
   =================================================================== */
let _gpT=null;
function _gpGuardarLuego(){
  clearTimeout(_gpT);
  _gpT=setTimeout(function(){ guardar4(); },600);
}
/* refresca solo los números que dependen del grupo, sin tocar el DOM donde se escribe */
function _gpNums(id){
  const g=gpDe(id); if(!g) return;
  document.querySelectorAll('[data-gpnum="'+id+'"]').forEach(function(n){
    const e=EQ.find(function(x){return x.derrame===n.getAttribute('data-gpeq');});
    if(e) n.textContent=fmtUSDs(gpParte(g,e));
  });
  const t=document.querySelector('[data-gptot="'+id+'"]');
  if(t) t.textContent=fmtUSDs(+g.total||0);
}
const _gpSetAntes=gpSet;
gpSet=function(id,f,v,recarga){
  /* los campos de texto y el total se escriben letra por letra: no repintar */
  if(!recarga && (f==='nombre'||f==='nota'||f==='total')){
    const g=gpDe(id); if(!g) return;
    g[f]=(f==='total')?(+v||0):v;
    if(f==='total'){ _gpNums(id); sincronizarPrecios(); }
    _gpGuardarLuego();
    return;
  }
  return _gpSetAntes.apply(this,arguments);
};
const _gpParteSetAntes=(typeof gpParteSet==='function')?gpParteSet:null;
if(_gpParteSetAntes){
  gpParteSet=function(id,derrame,v){
    const g=gpDe(id); if(!g) return;
    g.partes=g.partes||{}; g.partes[derrame]=(+v||0);
    sincronizarPrecios(); _gpNums(id); _gpGuardarLuego();
  };
}
/* al salir del campo sí se repinta todo, una sola vez */
document.addEventListener('blur',function(ev){
  const t=ev.target;
  /* solo los campos de la vista de grupos; la tabla de precios y clientes guarda con onchange */
  if(!t||!t.closest||!t.closest('#v-precios .pc-adv')) return;

/* el buscador de la pestaña ya no necesita el parche de setTimeout */
const _pintarAntesFoco=pintarPrecios;
pintarPrecios=function(){

  const id=a&&a.closest&&a.closest('#v-precios')?a.getAttribute('data-foco'):null;
  _pintarAntesFoco.apply(this,arguments);

  }

/* ===================================================================
   TABLERO · PRÓXIMOS A VENCER
   Una sola tabla, ordenada por fecha, que junta las dos cosas que
   importan: lo que hay que girarle a China y cuánto cupo de Sinosure
   te libera ese giro. Reemplaza el bloque de texto que había abajo.
   =================================================================== */
let VENC_TODOS=false;
function vencFilas(){
  const hoy=TODAY.getTime(), DIA=864e5;
  return EQ.map(function(e){
    const saldo=(+e.cupoSaldo||0)+(+e.otrosSaldo||0);
    if(saldo<=0.5) return null;
    const f=e.limitePago||e.vence||null;
    const dias=f?Math.round((new Date(f).getTime()-hoy)/DIA):null;
    return {e:e, saldo:saldo, cupoSaldo:+e.cupoSaldo||0, fecha:f, dias:dias,
            libera:consumoEq(e,e.mfg), antFalta:(!e.antPaid&&(+e.antSaldo||0)>0.5)?(+e.antSaldo||0):0};
  }).filter(Boolean).sort(function(a,b){
    if(a.fecha&&b.fecha) return new Date(a.fecha)-new Date(b.fecha);
    if(a.fecha) return -1; if(b.fecha) return 1;
    return b.saldo-a.saldo;
  });
}

    +'</div>'

    + filas.map(cel).join('')
    +'</tbody></table>'

const _refAntesVenc=refreshAll;
refreshAll=function(){ _refAntesVenc.apply(this,arguments); try{renderVenc();}catch(e){} };

/* ===================================================================
   PESTAÑA SINOSURE · DERROTERO
   Se acabó el listado de mil renglones. Ahora:
     · arriba, el techo de cada fabricante, EDITABLE por ti;
     · la bandeja de los pedidos que todavía no has clasificado;
     · y el derrotero: una fila por orden madre, plegada. La abres y ahí
       sí están sus pedidos, cada uno con su palanca.
   =================================================================== */
let SNAB2={};                       /* qué órdenes están abiertas */
let SNVER='todo';                   /* filtro: todo | dentro | fuera | pend */
let SNCMP=false;                    /* mostrar la columna "Andrés dice" */

function snToggle(id){ SNAB2[id]=!SNAB2[id]; pintarSino(); }
function snFiltro(f){ SNVER=f; pintarSino(); }
function snCmp(){ SNCMP=!SNCMP; pintarSino(); }
function snSet(clave,campo,valor){ sinoSet(clave,campo,valor); refreshAll(); renderLedger(); guardar4(); }
/* un monto fijo escrito en una parte es una decisión propia de esa parte */
function snFijo(clave,v){ sinoSet(clave,'modo','fijo'); sinoSet(clave,'fijo',v); refreshAll(); renderLedger(); guardar4(); }
/* poner toda una orden en el mismo modo, de un golpe */
function snOrden(ordenId,mfg,modo){
  EQ.forEach(function(e){ if(e.ordenId===ordenId&&e.mfg===mfg) sinoSet(kOf(e),'modo',modo); });
  refreshAll(); renderLedger(); guardar4();
}
function snTecho(mfg,v){ CUPO[mfg]=Math.max(0,+v||0); refreshAll(); renderLedger(); guardar4(); }

function _snGrupos(mfg){
  const porOrd={};
  EQ.filter(function(e){return e.mfg===mfg;}).forEach(function(e){
    (porOrd[e.ordenId]=porOrd[e.ordenId]||[]).push(e);
  });
  return Object.keys(porOrd).sort().map(function(id){
    const eqs=porOrd[id];
    const cons=eqs.reduce(function(a,e){return a+consumoEq(e,mfg);},0);
    const saldo=eqs.reduce(function(a,e){return a+(+e.cupoSaldo||0);},0);
    const pend=eqs.filter(function(e){return !sinoRegEf(e);}).length;
    const fuera=eqs.filter(function(e){var f=sinoRegEf(e);return f&&f.r.modo==='fuera';}).length;
    const sug=eqs.reduce(function(a,e){var v=sinoSug(e);return a+(v||0);},0);
    return {id:id,mfg:mfg,eqs:eqs,cons:cons,saldo:saldo,pend:pend,fuera:fuera,sug:sug};
  }).filter(function(g){
    if(SNVER==='pend')   return g.pend>0;
    if(SNVER==='dentro') return g.cons>0;
    if(SNVER==='fuera')  return g.fuera>0;
    return true;
  });
}

function _snFilaEq(e){
  const k=kOf(e), ef=sinoRegEf(e), own=SINO.ped[k]||{modo:null,fijo:0,nota:'',sug:null};
  const r=ef?{modo:ef.r.modo,fijo:Math.round((+ef.r.fijo||0)*ef.share),nota:own.nota,sug:sinoSug(e)}:own;
  const cons=consumoEq(e,e.mfg);
  const sel='<select class="sn-sel '+(r.modo==='fuera'?'off':r.modo?'on':'pend')+'" '
    +'onchange="snSet(\''+k+'\',\'modo\',this.value)">'
    +'<option value="">Sin clasificar</option>'
    +SINO_MODOS.map(function(m){return '<option value="'+m[0]+'"'+(r.modo===m[0]?' selected':'')+'>'+m[1]+'</option>';}).join('')
    +'</select>';
  const fijo=r.modo==='fijo'
    ? '<input class="sn-fijo" type="number" step="1" value="'+(+r.fijo||0)+'" data-foco="fj-'+k+'" '
      +'onchange="snFijo(\''+k+'\',this.value)">'
    : '';
  const dif=(SNCMP&&r.sug!=null&&Math.abs(r.sug-cons)>2)
    ? '<small class="sn-dif">'+(r.sug>cons?'+':'')+fmtUSDs(r.sug-cons)+'</small>' : '';
  return '<tr class="sn-eq'+(!r.modo?' sn-p':'')+'">'
    +'<td class="sn-po">'+(e.derrame||'')+(ef&&ef.heredado?'<small class="sn-her">de la orden '+e.splitDe+'</small>':'')+'</td>'
    +'<td class="sn-pr">'+(nombreEq(e)||'')+'</td>'
    +'<td class="sn-n">'+fmtUSDs(+e.cupoSaldo||0)+'</td>'
    +'<td class="sn-m">'+sel+fijo+'</td>'
    +'<td class="sn-n"><b>'+(cons>0?fmtUSDs(cons):'—')+'</b></td>'
    +(SNCMP?'<td class="sn-n sn-sug">'+(r.sug!=null?fmtUSDs(r.sug):'—')+dif+'</td>':'')
    +'<td class="sn-no"><input class="sn-nota" value="'+esc4(r.nota||'')+'" placeholder="nota" '
      +'data-foco="nt-'+k+'" onchange="snSet(\''+k+'\',\'nota\',this.value)"></td>'
    +'</tr>';
}

function _snBloque(mfg,titulo){
  const techo=+CUPO[mfg]||0, usado=cargaViva(mfg), disp=techo-usado;
  const pct=techo>0?Math.min(100,Math.round(usado/techo*100)):0;
  const gs=_snGrupos(mfg);
  const filas=gs.map(function(g){
    const ab=!!SNAB2[mfg+'|'+g.id];
    const est=g.pend?'<span class="sn-chip pend">'+g.pend+' sin clasificar</span>'
      :g.cons>0?'<span class="sn-chip on">en el cupo</span>'
      :'<span class="sn-chip off">fuera</span>';
    return '<tbody class="sn-g'+(ab?' ab':'')+'">'
      +'<tr class="sn-h" onclick="snToggle(\''+mfg+'|'+g.id+'\')">'
      +'<td class="sn-ar">'+(ab?'▾':'▸')+'</td>'
      +'<td class="sn-on"><b>Orden '+g.id+'</b><small>'+g.eqs.length+' pedido(s)</small></td>'
      +'<td class="sn-n">'+fmtUSDs(g.saldo)+'</td>'
      +'<td class="sn-e">'+est+'</td>'
      +'<td class="sn-n"><b>'+fmtUSDs(g.cons)+'</b></td>'
      +(SNCMP?'<td class="sn-n sn-sug">'+(g.sug?fmtUSDs(g.sug):'—')+'</td>':'')
      +'<td class="sn-b" onclick="event.stopPropagation()">'
        +'<button class="sn-mini" title="Toda la orden al saldo por pagar" onclick="snOrden(\''+g.id+'\',\''+mfg+'\',\'saldo\')">saldo</button>'
        +'<button class="sn-mini" title="Toda la orden al monto completo" onclick="snOrden(\''+g.id+'\',\''+mfg+'\',\'monto\')">monto</button>'
        +'<button class="sn-mini off" title="Sacar toda la orden del cupo" onclick="snOrden(\''+g.id+'\',\''+mfg+'\',\'fuera\')">fuera</button>'
      +'</td></tr>'
      + (ab?g.eqs.map(_snFilaEq).join(''):'')
      +'</tbody>';
  }).join('');
  return '<div class="sn-col">'
    +'<div class="sn-card'+(disp<0?' mal':'')+'">'
      +'<div class="sn-t">'+titulo+'</div>'
      +'<div class="sn-techo">Tu cupo <input type="number" step="1000" value="'+techo+'" data-foco="tc-'+mfg+'" onchange="snTecho(\''+mfg+'\',this.value)"></div>'
      +'<div class="sn-bar"><i style="width:'+pct+'%" class="'+(disp<0?'mal':'')+'"></i></div>'
      +'<div class="sn-r"><span>Usado</span><b>'+fmtUSDs(usado)+'</b></div>'
      +'<div class="sn-r"><span>'+(disp<0?'Sobregirado':'Disponible')+'</span><b class="'+(disp<0?'mal':'ok')+'">'+fmtUSDs(Math.abs(disp))+'</b></div>'
    +'</div>'
    +'<table class="sn">'
      +'<thead><tr><th></th><th>Orden</th><th class="sn-n">Saldo China</th><th>Estado</th>'
      +'<th class="sn-n">Consume</th>'+(SNCMP?'<th class="sn-n">Andrés dice</th>':'')+'<th></th></tr></thead>'
      +(filas||'<tbody><tr><td colspan="7" class="sn-vacio">Nada en este filtro</td></tr></tbody>')
    +'</table></div>';
}

pintarSino=function(){
  const cont=document.getElementById('v-sinosure'); if(!cont) return;
  const pend=sinoPendientes();
  const hayHoja=!!(CONCILIA&&CONCILIA.sinoPorDerrame&&Object.keys(CONCILIA.sinoPorDerrame).length);
  cont.innerHTML=''
    +'<div class="sn-top">'
      +'<h2 class="title" style="margin:0">Sinosure</h2>'
      +'<div class="sn-sp"></div>'
      +'<div class="seg sn-f">'
        +['todo|Todo','pend|Sin clasificar','dentro|En el cupo','fuera|Fuera'].map(function(x){
          var a=x.split('|');
          return '<button class="'+(SNVER===a[0]?'on':'')+'" onclick="snFiltro(\''+a[0]+'\')">'+a[1]+'</button>';}).join('')
      +'</div>'
      +(hayHoja?'<button class="vz-b" onclick="snCmp()">'+(SNCMP?'Ocultar':'Comparar con')+' la hoja de Andrés</button>':'')
    +'</div>'
    +'<div class="sn-sub">La cifra que vale es la de la hoja Sinosure del detailed. Cada pedido tiene su palanca; '
      +'lo que cambies a mano se queda, y aquí arriba te avisa si algo ya no coincide con la hoja.</div>'
    +_snDifHTML()
    +(pend.length
      ? '<div class="sn-band"><b>'+pend.length+' pedido(s) sin clasificar</b> · no están consumiendo cupo hasta que les digas qué son: '
        +pend.slice(0,12).map(function(e){return '<span class="sn-bp">'+(e.derrame||'')+' · '+fmtUSDs(+e.cupoSaldo||0)+'</span>';}).join('')
        +(pend.length>12?' <span class="sn-bp">+'+(pend.length-12)+' más</span>':'')
        +'</div>'
      : '')
    +'<div class="sn-cols">'+_snBloque('Singsun','Trackers · Singsun')+_snBloque('Eaglerise','Shelters · Eaglerise')+'</div>';
};

/* ===================================================================
   1) QUE DERRAMAR UN PEDIDO NO ME MANDE AL PRINCIPIO DE LA LISTA
   splitRow() llama a renderWiz(), que reconstruye #reconBody entero.
   El rescate de scroll que ya existía dentro de renderWizEditBody leía
   un #wizEditBody recién creado, así que siempre encontraba 0.
   Ahora el scroll se guarda ANTES de que el DOM viejo desaparezca.
   =================================================================== */
let _WIZSC=0;
function _wizScGuarda(){
  const sc=document.querySelector('#wizEditBody .vscroll');
  if(sc) _WIZSC=sc.scrollTop;
}
function _wizScPone(){
  const sc=document.querySelector('#wizEditBody .vscroll');
  if(sc&&_WIZSC) sc.scrollTop=_WIZSC;
}
const _rwEditAntes=renderWizEdit;
renderWizEdit=function(){ _wizScGuarda(); _rwEditAntes.apply(this,arguments); _wizScPone(); };
const _rwBodyAntes=renderWizEditBody;
renderWizEditBody=function(){ _wizScGuarda(); _rwBodyAntes.apply(this,arguments); _wizScPone(); };
/* al derramar o unir, además dejamos la fila tocada a la vista */
function _wizVerFila(derrame){
  setTimeout(function(){
    const t=document.querySelector('#wizEditBody [data-der="'+derrame+'"]');
    if(t&&t.scrollIntoView) t.scrollIntoView({block:'center'});
  },0);
}
const _splitAntes=splitRow;
splitRow=function(i){ const w=W(i); const d=w?w.derrame:null; _wizScGuarda(); _splitAntes.apply(this,arguments); if(d)_wizVerFila(d+'A'); };
const _unSplitAntes=unSplit;
unSplit=function(gid){ _wizScGuarda(); _unSplitAntes.apply(this,arguments); };
const _delAntes=(typeof deleteRow==='function')?deleteRow:null;
if(_delAntes) deleteRow=function(){ _wizScGuarda(); _delAntes.apply(this,arguments); };

/* ===================================================================
   2) PASO "COMPARAR": SOLO LOS PEDIDOS QUE CAMBIARON
   Antes era una fila por CADA CAMBIO, así que 30 pedidos daban 69 filas
   y no se entendía nada. Ahora es una fila por PEDIDO, y solo salen los
   que tienen algo distinto frente a lo que ya tenías cargado. Además se
   detectan los que DESAPARECIERON del archivo nuevo, que antes no se
   reportaban en ninguna parte.
   =================================================================== */
let WDIF='cambios';
function wdifFiltro(f){ WDIF=f; renderWizDiff(); }
function _wizDesaparecidos(){
  const hay={}; (WIZ.work||[]).forEach(function(w){ hay[kOf(w)]=true; });
  const out=[];
  Object.keys(WIZ.prev||{}).forEach(function(k){
    const p=WIZ.prev[k];
    if(!p||!p.exists||hay[k]) return;
    out.push({clave:k,p:p});
  });
  return out;
}
renderWizDiff=function(){
  /* una entrada por pedido, con TODOS sus cambios adentro */
  const porPed=[];
  (WIZ.work||[]).forEach(function(w){
    const cs=_cambiosW(w);
    if(!cs.length) return;
    porPed.push({w:w, cambios:cs,
      nuevo:cs.some(function(c){return c.tipo==='nuevo';}),
      susp:cs.some(function(c){return c.susp;})});
  });
  const idos=_wizDesaparecidos();
  const nuevos=porPed.filter(function(x){return x.nuevo;});
  const cambiados=porPed.filter(function(x){return !x.nuevo;});
  const susp=porPed.filter(function(x){return x.susp;});
  const total=(WIZ.work||[]).length;

  let lista;
  if(WDIF==='nuevos') lista=nuevos;
  else if(WDIF==='susp') lista=susp;
  else if(WDIF==='idos') lista=[];
  else lista=cambiados.concat(nuevos);
  lista=lista.slice().sort(function(a,b){return (b.susp?1:0)-(a.susp?1:0);});

  const tag={nuevo:'Nuevo',estado:'Estado',monto:'Monto',saldo:'Saldo',fabricante:'Fabricante'};
  const ajuste=function(w,c){
    if(c.tipo==='monto')  return '<input class="we num" type="number" value="'+w.cupoMonto+'" onchange="setW('+w._i+',\'cupoMonto\',this.value);renderWizDiff()">';
    if(c.tipo==='saldo')  return '<input class="we num" type="number" value="'+w.cupoSaldo+'" onchange="setW('+w._i+',\'cupoSaldo\',this.value);renderWizDiff()">';
    if(c.tipo==='estado') return stageSel(w._i,w.st);
    return '';
  };
  const fila=function(x){
    const w=x.w;
    const cs=x.cambios.map(function(c){
      return '<div class="wd-c">'
        +'<span class="vtag '+(c.susp?'exc':(c.tipo==='nuevo'?'nuevo':'chg'))+'">'+(tag[c.tipo]||c.tipo)+'</span>'
        +'<span class="wd-d">'+c.det+'</span>'
        +(c.susp?'<span class="wd-w">⚠ '+c.reason+'</span>':'')
        +'<span class="wd-aj">'+ajuste(w,c)+'</span></div>';
    }).join('');
    return '<tr class="'+(x.susp?'v-exc':(x.nuevo?'v-nuevo':''))+'">'
      +'<td class="wd-po"><b>'+(w.derrame||w.ordenId)+'</b><small>orden '+w.ordenId+' · '+(w.mfg==='Singsun'?'tracker':'shelter')+'</small></td>'
      +'<td class="wd-pr">'+(/^Orden\s/.test(w.proj||'')?'<span style="color:var(--ink3)">(sin proyecto)</span>':(w.proj||''))+'</td>'
      +'<td class="wd-cs">'+cs+'</td></tr>';
  };
  const filaIda=function(x){
    const p=x.p;
    return '<tr class="v-exc"><td class="wd-po"><b>'+x.clave.split('|')[1]+'</b><small>'+(p.mfg==='Singsun'?'tracker':'shelter')+'</small></td>'
      +'<td class="wd-pr">'+(p.proj||'<span style="color:var(--ink3)">(sin proyecto)</span>')+'</td>'
      +'<td class="wd-cs"><div class="wd-c"><span class="vtag exc">Desapareció</span>'
      +'<span class="wd-d">estaba cargado con saldo <b>'+fmtUSDs(p.saldoReal!=null?p.saldoReal:(p.cupoSaldo||0))+'</b> y no viene en este archivo</span>'
      +'<span class="wd-w">⚠ si apruebas, se va de la herramienta</span></div></td></tr>';
  };

  const chip=function(f,txt,n){
    return '<button class="chip '+(WDIF===f?'on':'')+'" onclick="wdifFiltro(\''+f+'\')">'+txt+(n!=null?' <b>'+n+'</b>':'')+'</button>';
  };
  const cuerpo = WDIF==='idos'
    ? (idos.length?idos.map(filaIda).join(''):'<tr><td colspan="3" class="wd-vacio">Ninguno desapareció</td></tr>')
    : (lista.length?lista.map(fila).join(''):'<tr><td colspan="3" class="wd-vacio">Ningún pedido cambió frente a lo que ya tenías</td></tr>');

  document.getElementById('reconBody').innerHTML=''
    +'<div class="wizhint">De los <b>'+total+'</b> pedidos del archivo, <b>'+porPed.length+'</b> traen algo distinto a lo que ya tenías cargado. '
      +'Los demás llegaron iguales y no hay nada que mirar.'
      +(susp.length?' <b style="color:var(--danger)">'+susp.length+' con algo raro</b> — suelen ser typos de Andrés.':'')
      +'</div>'
    +'<div class="filters wd-f">'
      + chip('cambios','Con cambios',cambiados.length+nuevos.length)
      + chip('susp','Sospechosos',susp.length)
      + chip('nuevos','Nuevos',nuevos.length)
      + chip('idos','Desaparecidos',idos.length)
    +'</div>'
    +'<div class="vscroll"><table class="vtable wd"><thead><tr>'
      +'<th>Pedido</th><th>Proyecto</th><th>Qué cambió</th>'
    +'</tr></thead><tbody>'+cuerpo+'</tbody></table></div>';
};

</script>
