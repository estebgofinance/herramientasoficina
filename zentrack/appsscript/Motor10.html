<script>

/* ===================================================================
   v1.17 · ESTADO DE CUENTA EN PDF Y EXCEL, MÁS CLAROS
   PDF: resumen arriba (saldo, vencido, próximos 30 días, sin fecha y lo
   pagado), "Lo que vence, fecha a fecha", los pedidos por grupos
   (Shelters, Trackers, Otros productos, Otros cargos) con las cuotas
   anidadas, cada cargo de Finkargo como ficha con su préstamo, los pagos
   recibidos (los aplicados a cada pedido más los abonos sueltos) y un
   pie con la fecha de corte y el número de página.
   Excel (ExcelJS, se carga solo al exportar): hoja "Estado de cuenta"
   con grupos, subtotales con fórmula, cuotas plegables, filtros y
   encabezado fijo; hoja "Fecha a fecha" con acumulado; hoja "Abonos".
   Si ExcelJS no carga, baja el Excel sencillo de antes.
   Solo cambia cómo se exporta; no toca datos ni el estado guardado.
   =================================================================== */
function _ecPdfHTML(c){
  const {filas}=ecFilas(c), t=ecTotales(c), interno=esInterno(c), H=x=>esc4(x==null?'':x);
  const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fl=d=>d?d.getDate()+' de '+M[d.getMonth()]+' de '+d.getFullYear():'';
  const fc=d=>d?String(d.getDate()).padStart(2,'0')+'-'+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]+'-'+String(d.getFullYear()).slice(2):'—';
  const n2=v=>Math.abs(v)<0.005?'—':_ec2(v);

  const en30=addD(TODAY,30); let p30=0, sinf=0;
  filas.forEach(f=>{ if(f.cuotas) f.cuotas.forEach(q=>{ if(q.saldo>0.005){ if(!q.vence) sinf+=q.saldo; else if(q.vence>=TODAY&&q.vence<=en30) p30+=q.saldo; } });
    else if(f.saldo>0.005){ if(!f.vence) sinf+=f.saldo; else if(f.vence>=TODAY&&f.vence<=en30) p30+=f.saldo; } });
  const pct=t.valor>0?Math.min(100,t.abonado/t.valor*100):0;
  /* grupos */
  const grupo=f=>f.tipo==='eq'?(f.e&&f.e.mfg==='Singsun'?'Trackers':(f.e&&f.e.mfg==='Eaglerise'?'Shelters':'Equipos')):(f.x&&f.x.tipo==='cargo'?'Otros cargos':'Otros productos');
  const orden=['Shelters','Trackers','Equipos','Otros productos','Otros cargos'], G={};
  filas.forEach(f=>(G[grupo(f)]=G[grupo(f)]||[]).push(f));
  const sub=l=>l.reduce((a,f)=>({valor:a.valor+f.valor,abonado:a.abonado+f.abonado,saldo:a.saldo+Math.max(0,f.saldo),venc:a.venc+(f.vencido||0)}),{valor:0,abonado:0,saldo:0,venc:0});
  const filaEq=f=>{ let h='<tr class="p'+(f.saldo<=0.005?' pag':'')+'"><td><b>'+H(f.pedido)+'</b>'+(f.tipo==='x'&&f.equipo?'<small>'+H(f.equipo)+'</small>':'')+'</td><td>'+H(f.proyecto)+(f.sinfac?' <span class="tag">sin facturar</span>':'')+'</td><td>'+(f.etd?fc(new Date(f.etd)):'—')+'</td>'

    if(f.cuotas&&f.cuotas.length) h+=f.cuotas.map((q,i)=>'<tr class="q'+(i===f.cuotas.length-1?' ult':'')+(q.saldo<=0.005?' pag':'')+'"><td colspan="2"><span class="ram">'+(i===f.cuotas.length-1?'└':'├')+'</span>'+H(q.q.concepto||('Cuota '+(i+1)))+'</td><td>'+fc(q.vence)+'</td>'
      +'<td class="r">'+n2(q.monto)+'</td><td class="r">'+n2(q.abonado)+'</td><td class="r">'+n2(Math.max(0,q.saldo))+'</td><td>'+est(q.saldo,q.vence,q.mora)+'</td></tr>').join('');
    return h; };
  const juntar=l=>{ const out=[], idx={}; l.forEach(f=>{ if(f.tipo!=='x'||f.cuotas){ out.push(f); return; }
      const k=[f.pedido,f.equipo,f.valor,f.abonado,f.vence?f.vence.getTime():'',f.mora].join('|');

      else { const g=out[idx[k]]; g._n++; g._proys.push(f.proyecto); g.valor+=f.valor; g.abonado+=f.abonado; g.saldo+=f.saldo; g.vencido=(g.vencido||0)+(f.vencido||0); } });
    return out.map(f=>f._n>1?Object.assign(f,{proyecto:f._n+' unidades: '+f._proys.join(', ')}):f); };
  const tabla=(nom,l0,corto)=>{ const l=juntar(l0), s=sub(l0);

      +(f.cuotas&&f.cuotas.length?f.cuotas.map(q=>'<tr'+(q.saldo<=0.005?' class="pag"':'')+'><td>'+H(q.q.concepto||'')+'</td><td>'+fc(q.vence)+'</td><td class="r">'+n2(q.monto)+'</td><td class="r">'+n2(q.abonado)+'</td><td class="r">'+n2(Math.max(0,q.saldo))+'</td><td>'+est(q.saldo,q.vence,q.mora)+'</td></tr>').join('')

        +E.fechas.slice(0,7).map(x=>{ ac+=x.v; return '<div class="it"><b>'+fc(x.d)+'</b><span>'+_ec2(x.v)+'</span><small>acumulado '+_ec2(ac)+'</small></div>'; }).join('')
        +(E.fechas.length>7?'<div class="it g"><b>Después</b><span>'+_ec2(E.fechas.slice(7).reduce((a,x)=>a+x.v,0))+'</span><small>'+(E.fechas.length-7)+' fechas más</small></div>':'')+'</div>'

    const venc=fs.filter(x=>x[0]<TODAY).reduce((a,x)=>a+x[1],0), g={}; fs.filter(x=>x[0]>=TODAY).forEach(([d,v])=>{ const k=_p14Iso(d); g[k]=(g[k]||0)+v; });
    const ks=Object.keys(g).sort(); let ac=venc;
    viene='<section class="viene"><h2>Lo que vence, fecha a fecha</h2><div class="tl">'+(venc>0.5?'<div class="it rojo"><b>Vencido hoy</b><span>'+_ec2(venc)+'</span><small>acumulado '+_ec2(ac)+'</small></div>':'')
      +ks.slice(0,7).map(k=>{ ac+=g[k]; return '<div class="it"><b>'+fc(_p14D(k))+'</b><span>'+_ec2(g[k])+'</span><small>acumulado '+_ec2(ac)+'</small></div>'; }).join('')
      +(ks.length>7?'<div class="it g"><b>Después</b><span>'+_ec2(ks.slice(7).reduce((a,k)=>a+g[k],0))+'</span><small>'+(ks.length-7)+' fechas más</small></div>':'')

  const abonos=(ECA||[]).filter(a=>a.cliente===c).sort((a,b)=>(''+b.fecha).localeCompare(''+a.fecha));
  const directo=t.abonado-abonos.reduce((a,x)=>a+(+x.usd||0),0);
  const css='@page{size:letter;margin:14mm 13mm 16mm;@bottom-left{content:"Zentrack S.A.S · Estado de cuenta de '+H(c).replace(/"/g,'')+' · corte '+fc(TODAY)+'";font:8pt Archivo,Arial,sans-serif;color:#8a8f95}@bottom-right{content:"Página " counter(page) " de " counter(pages);font:8pt Archivo,Arial,sans-serif;color:#8a8f95}}'
    +'*{box-sizing:border-box}body{font-family:Archivo,Arial,sans-serif;font-size:9.5pt;color:#17181A;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-variant-numeric:tabular-nums}'
    +'.cab{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #17181A;padding-bottom:10px}.marca{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13pt;letter-spacing:.02em}.marca i{width:11px;height:11px;background:#FD9C10;border-radius:2px;display:block}'
    +'.cab .der{text-align:right}.cab h1{margin:0;font-size:18pt;line-height:1.1}.cab .cli{font-size:12pt;font-weight:600;margin-top:2px}.cab small{display:block;color:#565B61;font-size:8.5pt;margin-top:3px}'

    +'.box.n .v{font-size:15pt;font-weight:700}.box .v.mal{color:#B3261E}'
    +'.bar{height:4px;background:#EEF0F2;border-radius:2px;margin:10px 0 3px;overflow:hidden}.bar i{display:block;height:100%;background:#2E6E5A}.barl{font-size:8pt;color:#565B61;display:flex;justify-content:space-between}'
    +'h2{font-size:11pt;margin:0}.gh,.viene h2{break-after:avoid;page-break-after:avoid}tbody tr:first-child{break-before:avoid}.ficha,.grupo .gh+table thead{break-inside:avoid}section{margin-top:20px}.gh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #17181A;padding-bottom:4px;margin-bottom:2px}.gh span{font-size:8.5pt;color:#565B61}'
    +'table{width:100%;border-collapse:collapse}th{font-size:7.8pt;color:#8a8f95;font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid #E4E6E9}td{padding:3.5px 6px;border-bottom:1px solid #F3F4F5;vertical-align:top}td b{font-weight:600}.r{text-align:right}tr{break-inside:avoid}'

    +'.ram{color:#A2A7AD;margin:0 6px 0 4px;font-family:monospace}tr.pag td{color:#8a8f95}tr.st td{font-weight:600;border-top:1px solid #CDD1D6;border-bottom:0}'
    +'.pl{display:inline-block;font-size:7.5pt;padding:1px 7px;border-radius:9px;white-space:nowrap}.pl.mal{background:#FBE4E2;color:#B3261E}.es{font-size:8pt;color:#3A3D41;white-space:nowrap}.es.ok{color:#2E6E5A}.es.gr{color:#A2A7AD}.tag{font-size:7pt;background:#FDF1DC;color:#7A4A00;padding:1px 5px;border-radius:6px}.mal{color:#B3261E}'
    +'.viene .tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));margin-top:6px}.viene .it{border-top:2px solid #9CC3B4;padding:5px 6px 0 0}.viene .it.rojo{border-color:#B3261E}.viene .it.g{border-color:#D5D8DC}.viene .it b{font-size:8pt;display:block}.viene .it span{font-size:10pt;font-weight:600;display:block}.viene .it small{font-size:7.5pt;color:#565B61}.nt{font-size:8pt;color:#565B61;margin:6px 0 0}'
    +'.ficha{border-left:2px solid #CDD1D6;padding:4px 0 4px 12px;margin-top:10px;break-inside:avoid}.fh{display:flex;justify-content:space-between;gap:10px;font-size:10pt}.fd{font-size:8.5pt;color:#3A3D41;margin:4px 0 6px;line-height:1.4}.fd span{display:block;color:#565B61;margin-top:2px}'

  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Estado de cuenta '+H(c)+' '+_ecISO(TODAY)+'</title>'

ecPDF=function(c){
  const w=window.open('','_blank');
  if(!w){ toast('El navegador bloqueó la ventana. Usa el botón Excel.'); return; }
  w.document.write(_ecPdfHTML(c)); w.document.close();
  setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} },700);
};

/* ---- el Excel del estado de cuenta: con formato, grupos, cuotas plegables y hojas aparte ---- */
const _EXCELJS_URL='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
function _cargarExcelJS(){ return new Promise((ok,mal)=>{ if(window.ExcelJS) return ok(window.ExcelJS);
  const s=document.createElement('script'); s.src=_EXCELJS_URL; s.onload=()=>window.ExcelJS?ok(window.ExcelJS):mal(new Error('ExcelJS no cargó')); s.onerror=()=>mal(new Error('No se pudo cargar ExcelJS')); document.head.appendChild(s); }); }
function _ecLibro(c,ExcelJS){

  const NUM='#,##0.00;[Red]-#,##0.00;"—"', FECHA='dd-mmm-yy', fuente={name:'Arial',size:10};
  const dt=d=>d?new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())):null;
  const estado=(saldo,vence,mora)=>saldo<=0.005?'Pagado':(mora>0?'Vencido · '+mora+' d':(vence?'Por vencer':'Sin fecha'));
  const grupo=f=>f.tipo==='eq'?(f.e&&f.e.mfg==='Singsun'?'Trackers':(f.e&&f.e.mfg==='Eaglerise'?'Shelters':'Equipos')):(f.x&&f.x.tipo==='cargo'?'Otros cargos':'Otros productos');

   (Andrés lo quitó del detailed y del order report del 23-oct) y sale de la
   herramienta; lo que Solenium tenía abonado en esos pedidos pasa a lo que le
   vence primero, como "Registrar abono". Opcional: sacar 7-6 a 7-9 del cupo
   Sinosure, como la hoja de Andrés.
   Nada se aplica solo: un aviso arriba muestra el cambio y se aplica con un
   clic. Queda en Ajustes con "Deshacer".
   No hay llaves nuevas: el registro, con lo necesario para deshacer, va en
   CONFIG.cambios[id].
   =================================================================== */
const ROS_ID='enexa-rosario-2026-10-27';
let _rosOculto=false, _rosSino=false;
const _rosCopia=x=>x==null?null:JSON.parse(JSON.stringify(x));
const _rosEq=d=>EQ.find(e=>e.mfg==='Singsun'&&e.derrame===d)||null;
const _rosEnexa=()=>Object.keys(CLI).find(c=>/enexa/i.test(c))||'Enexa S.A.S';
const _rosHecho=()=>!!(CONFIG.cambios&&CONFIG.cambios[ROS_ID]);
const _rosBase=e=>{ const m=(''+(e.derrame||'')).match(_reDer); return m?_claveDe(e.mfg,m[1]):null; };
/* lo abonado en una línea del estado de cuenta (fila o cuotas) */
function _rosAbonado(k){
  const r=ECP[k]; if(!r) return 0;
  return Math.round((r.cuotas?r.cuotas.reduce((a,q)=>a+(+q.abonado||0),0):(+r.abonado||0))*100)/100;
}
function _rosPlan(){
  if(_rosHecho()) return null;
  const enx=_rosEnexa();
  const doce=EQ.filter(e=>e.mfg==='Singsun'&&/^12-[12]/.test(''+e.derrame))
    .sort((a,b)=>(''+a.derrame).localeCompare(''+b.derrame,undefined,{numeric:true}));
  const fuentes=doce.filter(e=>e.cliente===enx);
  const mov=[];
  [['7-6','El Rosario 1'],['7-7','El Rosario 2']].forEach(([d,nom],i)=>{
    const e=_rosEq(d); if(e&&e.cliente!==enx) mov.push({e,nom,src:fuentes[i]||null}); });
  const e3=_rosEq('7-3A'), ren=(e3&&e3.cliente===enx&&e3.proj!=='El Rosario 3')?e3:null;
  if(!mov.length&&!doce.length&&!ren) return null;
  const usadas=new Set(mov.filter(m=>m.src).map(m=>kOf(m.src)));
  /* lo abonado que se queda sin línea: lo de Solenium en 7-6/7-7 y lo del PO 12 que no pasa a El Rosario */
  const salen=[...mov.map(m=>m.e),...doce.filter(e=>!usadas.has(kOf(e)))];
  const fuera=new Set([...mov.map(m=>kOf(m.e)),...doce.map(kOf)]);
  const abonos=[];
  salen.forEach(e=>{
    const k=kOf(e), tot=_rosAbonado(k); if(!(tot>0.005)) return;
    const partes=[]; let enEca=0;
    (ECA||[]).forEach(a=>(a.aplicado||[]).forEach((p,j)=>{ if(p.k===k){ partes.push({id:a.id,j,monto:+p.monto||0}); enEca+=+p.monto||0; } }));
    abonos.push({k,cliente:e.cliente,nom:e.derrame+(e.proj?' '+e.proj:''),total:tot,partes,
      directo:Math.max(0,Math.round((tot-enEca)*100)/100)});
  });
  return {enx,mov,ren,doce,fuera,abonos};
}
/* reparte montos sobre lo que le vence primero al cliente, sin las líneas que salen */
function _rosReparto(c,montos,fuera){
  const us=_ecUnidades(c).filter(u=>!fuera.has(u.k)).map(u=>({k:u.k,i:u.i,saldo:Math.round(u.saldo*100)/100}));
  let ult=null;
  return montos.map(m=>{
    let resto=Math.round(m*100)/100; const out=[];
    us.forEach(u=>{ if(resto<=0.005||u.saldo<=0.005) return; const x=Math.min(resto,u.saldo);
      out.push({k:u.k,i:u.i,monto:Math.round(x*100)/100}); u.saldo=Math.round((u.saldo-x)*100)/100; resto=Math.round((resto-x)*100)/100; ult=u; });
    if(resto>0.005){ /* sobra: queda a favor, como en "Registrar abono" */
      const f=ecFilas(c).filas.find(x=>!fuera.has(x.k));
      const d=ult||us[0]||(f?{k:f.k,i:f.cuotas?0:-1}:null);
      if(d) out.push({k:d.k,i:d.i,monto:resto});
    }
    return out;
  });
}
function _rosDestinos(p){
  const porCli={}, res=[];
  p.abonos.forEach(ab=>{ (porCli[ab.cliente]=porCli[ab.cliente]||[]).push(ab); });
  Object.keys(porCli).forEach(c=>{
    const lista=[];
    porCli[c].forEach(ab=>{ ab.partes.forEach(pt=>lista.push({ab,pt,monto:pt.monto})); if(ab.directo>0.005) lista.push({ab,pt:null,monto:ab.directo}); });
    const rep=_rosReparto(c,lista.map(x=>x.monto),p.fuera);
    lista.forEach((x,i)=>res.push({ab:x.ab,pt:x.pt,dest:rep[i]}));
  });
  return res;
}
function _rosNombre(k){
  const e=EQ.find(x=>kOf(x)===k); if(e) return e.derrame+(e.proj?' '+e.proj:'');
  const x=(ECX||[]).find(y=>y.id===k); return x?((x.pedido||'')+' '+(x.proyecto||'')).trim():k;
}
function _rosDestTxt(ds){
  const m={}, orden=[]; ds.forEach(d=>{ if(!(d.k in m)){ m[d.k]=0; orden.push(d.k); } m[d.k]+=d.monto; });
  return orden.map(k=>'<b>'+esc4(_rosNombre(k))+'</b> '+_ec2(m[k])).join(' · ');
}
function rosAplicar(){
  const p=_rosPlan(); if(!p) return;
  const sino=_rosSino, reparto=_rosDestinos(p);   /* antes de mover nada */
  const S={eq:{},quitados:[],MIO:{proj:{},cli:{},split:{}},COBRO:{},COSTO:{},ECP:{},ECA:{},SINO:{},GPRE:_rosCopia(GPRE),PAGOS:[]};
  const guardaK=k=>{
    ['proj','cli','split'].forEach(m=>{ if(!(k in S.MIO[m])) S.MIO[m][k]=_rosCopia((MIO[m]||{})[k]); });
    if(!(k in S.COBRO)) S.COBRO[k]=_rosCopia(COBRO[k]);
    if(!(k in S.COSTO)) S.COSTO[k]=_rosCopia(COSTO[k]);
    if(!(k in S.ECP)) S.ECP[k]=_rosCopia(ECP[k]);
  };
  const guardaEcp=k=>{ if(!(k in S.ECP)) S.ECP[k]=_rosCopia(ECP[k]); };
  const guardaEca=id=>{ const a=ECA.find(x=>x.id===id); if(a&&!(id in S.ECA)) S.ECA[id]=_rosCopia(a.aplicado); };
  const resumen=[], ekViejo=new Map();
  [...p.mov.map(m=>m.e),...(p.ren?[p.ren]:[])].forEach(e=>{ const k=kOf(e); ekViejo.set(e,eqKey(e));
    S.eq[k]={cliente:e.cliente,proj:e.proj,precioVenta:e.precioVenta,_cliCustom:!!e._cliCustom}; guardaK(k); });
  /* 1) 7-6 y 7-7 pasan a Enexa con el precio y las cuotas de La Elvira 1 y 2 */
  p.mov.forEach(m=>{
    const e=m.e, k=kOf(e), antes=e.derrame+(e.proj?' '+e.proj:'')+' ('+(e.cliente||'')+')';
    _pcAsignar(e,p.enx); e.proj=m.nom; MIO.proj[k]=m.nom;
    if(m.src){
      const ks=kOf(m.src); guardaK(ks);
      e.precioVenta=Math.round(precioVenta(m.src)*100)/100;
      if(ECP[ks]) ECP[k]=_rosCopia(ECP[ks]); else delete ECP[k];
      if(COBRO[ks]) COBRO[k]=_rosCopia(COBRO[ks]); else delete COBRO[k];
      (ECA||[]).forEach(a=>(a.aplicado||[]).forEach(pp=>{ if(pp.k===ks){ guardaEca(a.id); pp.k=k; } }));
      resumen.push(esc4(antes)+' → <b>'+m.nom+'</b> · '+esc4(p.enx)+' · '+_ec2(e.precioVenta)+', con el precio y las cuotas de '+esc4(m.src.derrame+' '+(m.src.proj||'')));
    }else{
      e.precioVenta=0; delete ECP[k]; delete COBRO[k];
      resumen.push(esc4(antes)+' → <b>'+m.nom+'</b> · '+esc4(p.enx)+' · sin precio: pónselo en Pedidos');
    }
  });
  if(p.ren){ const e=p.ren, k=kOf(e), antes=e.proj||''; e.proj='El Rosario 3'; MIO.proj[k]=e.proj;
    resumen.push(esc4(e.derrame+' '+antes)+' → <b>El Rosario 3</b>, mismo precio y cuotas'); }
  /* 2) el PO 12 de trackers sale de la herramienta */
  if(p.doce.length){
    const tocadas=new Set();
    p.doce.forEach(e=>{
      const k=kOf(e), kb=_rosBase(e); guardaK(k); if(kb) guardaK(kb);
      const o=ORD.find(x=>x.id===e.ordenId&&x.mfg===e.mfg);
      S.quitados.push({orden:o?{id:o.id,mfg:o.mfg,cliente:o.cliente,entidad:o.entidad}:{id:e.ordenId,mfg:e.mfg,cliente:e.cliente,entidad:'Solenium'},
        e:_rosCopia(Object.assign({},e,{_i:undefined}))});
      _pcSacarDeGrupos(e,false);
      if(o){ o.equipos=o.equipos.filter(x=>x!==e); tocadas.add(o); }
      ['proj','cli','split'].forEach(m=>{ if(MIO[m]){ delete MIO[m][k]; if(kb) delete MIO[m][kb]; } });
      delete COBRO[k]; delete COSTO[k]; delete ECP[k];
      if(kb){ delete COBRO[kb]; delete COSTO[kb]; }
    });
    tocadas.forEach(o=>{ if(!o.equipos.length){ const i=ORD.indexOf(o); if(i>=0) ORD.splice(i,1); } });
    resumen.push('Sale el PO 12 de trackers ('+p.doce.map(e=>esc4(e.derrame+(e.proj?' '+e.proj:''))).join(', ')+'): ya no existe en China.');
  }
  EQ=ORD.flatMap(o=>o.equipos); EQ.forEach((e,i)=>e._i=i);
  /* los pagos viejos (PAGOS) apuntan por llave + nombre: se re-apuntan */
  ekViejo.forEach((viejo,e)=>{ const nuevo=eqKey(e); if(viejo===nuevo) return;
    PAGOS.forEach(pg=>(pg.aps||[]).forEach((a,j)=>{ if(a.ek===viejo){ S.PAGOS.push({id:pg.id,j,ek:viejo}); a.ek=nuevo; } })); });
  const ix={}; EQ.forEach(e=>{ ix[eqKey(e)]=e._i; });
  PAGOS.forEach(pg=>(pg.aps||[]).forEach(a=>{ if(!a.ek) return; const n=ix[a.ek];
    if(a.ieq!=null) a.ieq=(n!=null?n:-1); if(a.eqI!=null) a.eqI=(n!=null?n:-1); }));
  _pcRecalcOrdenes();
  /* 3) lo abonado que se quedó sin línea pasa a lo que le vence primero al mismo cliente */
  const porEca={};
  reparto.forEach(r=>{
    r.dest.forEach(d=>{ guardaEcp(d.k); _ecSumar(d.k,d.i,d.monto); });
    if(r.pt){ guardaEca(r.pt.id); (porEca[r.pt.id]=porEca[r.pt.id]||[]).push({j:r.pt.j,dest:r.dest}); }
  });
  Object.keys(porEca).forEach(id=>{ const a=ECA.find(x=>x.id===id); if(!a) return;
    porEca[id].sort((x,y)=>y.j-x.j).forEach(x=>{ a.aplicado.splice(x.j,1,...x.dest.map(d=>({k:d.k,i:d.i,monto:d.monto}))); }); });
  p.abonos.forEach(ab=>{ const ds=reparto.filter(r=>r.ab===ab).flatMap(r=>r.dest);
    resumen.push('Lo abonado por '+esc4(ab.cliente)+' en '+esc4(ab.nom)+' ('+_ec2(ab.total)+') pasa a '+_rosDestTxt(ds)); });
  /* 4) opcional: 7-6 a 7-9 fuera del cupo, como la hoja de Andrés */
  if(sino){
    ['7-6','7-7','7-8','7-9'].forEach(d=>{ const k=_claveDe('Singsun',d); if(!(k in S.SINO)) S.SINO[k]=_rosCopia(SINO.ped[k]);
      sinoSet(k,'modo','fuera'); sinoSet(k,'nota','Fuera de Sinosure, como la hoja de Andrés del 23-oct'); });
    resumen.push('Sinosure: 7-6, 7-7, 7-8 y 7-9 quedan en "No entra", como la hoja de Andrés.');
  }
  CONFIG.cambios=CONFIG.cambios||{};
  CONFIG.cambios[ROS_ID]={aplicado:new Date().toISOString(),resumen,deshacer:S};
  syncFlags(); if(typeof sincronizarPrecios==='function') sincronizarPrecios();
  refreshAll(); renderLedger(); guardar4();
  toast('Listo: Enexa queda con El Rosario 1, 2 y 3. Se puede deshacer en Ajustes.');
}
function rosDeshacer(){
  const c=CONFIG.cambios&&CONFIG.cambios[ROS_ID]; if(!c||!c.deshacer) return;
  if(!confirm('¿Deshacer el cambio de Enexa (El Rosario 1, 2 y 3)?\n\nLos pedidos, precios, cuotas y abonos vuelven a como estaban antes. Si después registraste abonos en esos pedidos, revísalos.')) return;
  const S=c.deshacer, pon=(obj,k,v)=>{ if(v==null) delete obj[k]; else obj[k]=v; };
  const vuelta=[];
  (S.quitados||[]).forEach(q=>{
    let o=ORD.find(x=>x.id===q.orden.id&&x.mfg===q.orden.mfg);
    if(!o){ o={id:q.orden.id,mfg:q.orden.mfg,cliente:q.orden.cliente,entidad:q.orden.entidad||'Solenium',equipos:[]}; ORD.push(o); }
    if(!o.equipos.some(x=>kOf(x)===kOf(q.e))){ o.equipos.push(q.e); vuelta.push(q.e); }
  });
  hydrateDates({ORD:[{equipos:vuelta}]});
  EQ=ORD.flatMap(o=>o.equipos); EQ.forEach((e,i)=>e._i=i);
  Object.keys(S.eq||{}).forEach(k=>{ const e=EQ.find(x=>kOf(x)===k); if(!e) return; const v=S.eq[k];
    e.cliente=v.cliente; e.proj=v.proj; e.precioVenta=v.precioVenta; if(v._cliCustom) e._cliCustom=true; else delete e._cliCustom; });
  ['proj','cli','split'].forEach(m=>{ MIO[m]=MIO[m]||{}; const g=(S.MIO||{})[m]||{}; Object.keys(g).forEach(k=>pon(MIO[m],k,g[k])); });
  Object.keys(S.COBRO||{}).forEach(k=>pon(COBRO,k,S.COBRO[k]));
  Object.keys(S.COSTO||{}).forEach(k=>pon(COSTO,k,S.COSTO[k]));
  Object.keys(S.ECP||{}).forEach(k=>pon(ECP,k,S.ECP[k]));
  Object.keys(S.ECA||{}).forEach(id=>{ const a=ECA.find(x=>x.id===id); if(a) a.aplicado=S.ECA[id]; });
  Object.keys(S.SINO||{}).forEach(k=>pon(SINO.ped,k,S.SINO[k]));
  if(Array.isArray(S.GPRE)){ GPRE.length=0; S.GPRE.forEach(g=>GPRE.push(g)); }
  (S.PAGOS||[]).forEach(x=>{ const pg=PAGOS.find(y=>y.id===x.id); if(pg&&pg.aps&&pg.aps[x.j]) pg.aps[x.j].ek=x.ek; });
  const ix={}; EQ.forEach(e=>{ ix[eqKey(e)]=e._i; });
  PAGOS.forEach(pg=>(pg.aps||[]).forEach(a=>{ if(!a.ek) return; const n=ix[a.ek];
    if(a.ieq!=null) a.ieq=(n!=null?n:-1); if(a.eqI!=null) a.eqI=(n!=null?n:-1); }));
  _pcRecalcOrdenes();
  delete CONFIG.cambios[ROS_ID];
  _rosOculto=true;   /* en esta sesión no vuelve a salir el aviso */
  syncFlags(); if(typeof sincronizarPrecios==='function') sincronizarPrecios();
  refreshAll(); renderLedger(); guardar4();
  toast('Cambio deshecho: todo volvió a como estaba.');
}
function _rosAvisoHTML(p){
  const li=[];
  p.mov.forEach(m=>{ const r=m.src?ECP[kOf(m.src)]:null;
    li.push('<b>'+esc4(m.e.derrame)+'</b> '+esc4(m.e.proj||'')+' ('+esc4(m.e.cliente||'')+') → <b>'+m.nom+'</b> · '+esc4(p.enx)
      +(m.src?' · '+_ec2(precioVenta(m.src))+(r&&r.cuotas?' en '+r.cuotas.length+' cuotas':'')+', lo que tenía '+esc4(m.src.derrame+' '+(m.src.proj||'')):' · sin precio (pónselo después)')); });
  if(p.ren) li.push('<b>'+esc4(p.ren.derrame)+'</b> '+esc4(p.ren.proj||'')+' → <b>El Rosario 3</b>, mismo precio y cuotas');
  if(p.doce.length) li.push('Sale el PO 12 de trackers: '+p.doce.map(e=>'<b>'+esc4(e.derrame)+'</b> '+esc4(e.proj||'')).join(', ')+'. Andrés lo quitó del detailed y del order report del 23-oct.');
  const rep=_rosDestinos(p);
  p.abonos.forEach(ab=>{ const ds=rep.filter(r=>r.ab===ab).flatMap(r=>r.dest);
    li.push('Lo abonado por '+esc4(ab.cliente)+' en '+esc4(ab.nom)+' (<b>'+_ec2(ab.total)+'</b>) pasa a lo que le vence primero: '+_rosDestTxt(ds)); });
  return '<h3>Cambio que aprobaste el 27-oct: trackers de Enexa</h3><ul>'+li.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
    +'<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px"><input type="checkbox" id="rosSino"'+(_rosSino?' checked':'')+' onchange="_rosSino=this.checked">'
    +' Sinosure: sacar también 7-6, 7-7, 7-8 y 7-9 del cupo, como la hoja de Andrés (opcional)</label>'
    +'<div class="p16-pie"><button class="ec8-b" style="background:var(--ink);color:#fff;border-color:var(--ink)" onclick="rosAplicar()">Aplicar</button>'
    +'<button class="ec8-b" onclick="_rosOculto=true;_rosPintar()">Ahora no</button><small>Se puede deshacer después en Ajustes.</small></div>';
}
function _rosPintar(){
  const main=document.querySelector('main'); if(!main) return;
  let d=document.getElementById('rosAviso');
  const p=_rosOculto?null:_rosPlan();
  if(!p){ if(d) d.remove(); return; }
  if(!d){ d=document.createElement('div'); d.id='rosAviso'; d.className='p16-pk'; d.style.borderLeft='4px solid var(--dato-debo)'; main.insertBefore(d,main.firstChild); }
  d.innerHTML=_rosAvisoHTML(p);
}
function _rosAjustes(){
  const v=document.getElementById('v-config'); if(!v) return;
  let d=document.getElementById('rosAjustes'); const c=CONFIG.cambios&&CONFIG.cambios[ROS_ID];
  if(!c){ if(d) d.remove(); return; }
  if(!d){ d=document.createElement('div'); d.id='rosAjustes'; d.className='p16-pk'; v.insertBefore(d,v.firstChild); }
  d.innerHTML='<h3>Cambio aplicado el '+_ecFmtD(new Date(c.aplicado))+': trackers de Enexa (El Rosario 1, 2 y 3)</h3><ul>'
    +(c.resumen||[]).map(x=>'<li>'+x+'</li>').join('')+'</ul>'
    +'<div class="p16-pie"><button class="ec8-b" onclick="rosDeshacer()">Deshacer este cambio</button></div>';
}
const _refreshAntes1172=refreshAll;
refreshAll=function(){
  const r=_refreshAntes1172.apply(this,arguments);
  try{ _rosPintar(); }catch(err){ console.error('v1.17.2 aviso',err); }
  return r;
};
/* v1.17.3: al abrir, loadFromServer pinta pantalla por pantalla (no llama refreshAll):
   renderConfig sí se llama, así que el aviso también se pinta desde aquí */
const _cfgAntes1172=renderConfig;
renderConfig=function(){
  const r=_cfgAntes1172.apply(this,arguments);
  try{ _rosAjustes(); _rosPintar(); }catch(err){ console.error('v1.17.2 ajustes',err); }
  return r;
};

</script>
