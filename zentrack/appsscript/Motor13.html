<script>

/* ===================================================================
   v2.3 · PLANES SEMANA A SEMANA Y CAJA LIMPIA
   Esteban aprobó el prototipo "Planes Zentrack" (5-nov-2026) y la Caja
   limpia del lienzo v2 (tablero "2b").
   - Planes, dos vistas. "Semana a semana": Atrasado + 12 semanas en
     columnas; cada pago es una ficha que se arrastra a otra semana o se
     abre para cambiar monto y semana. Lo que se calcula solo (fechas de
     Andrés, regla de Magnum y TIBA, cuotas de un contrato) lleva candado.
     "Cronograma por contraparte": versiones como pestañas, fecha y monto
     exactos por pago, "Repartir un monto", "Cuotas iguales" y, en China,
     qué pedidos paga cada giro (el más vencido primero).
   - Contrapartes: cliente del grupo (versión "a" = PROM), clientes
     externos (base = cuotas del estado de cuenta), Eaglerise, Nexus y
     componentes (base = fechas de Andrés, versión "a" = PLANCHINA),
     Magnum y TIBA (base = regla de días) y Finkargo y otros cargos
     (base = cuotas). "Negociar" crea una versión editable desde la base.
   - China en la Caja con plan: los giros del plan pagan los pedidos en
     orden (vencido primero, luego por fecha); lo que vence y el plan no
     cubre sale en su fecha; lo vencido que el plan no cubre no sale y se
     ve como "vencido sin plan".
   - Real: lo girado de verdad va por giro en PLANES.real[id] y la Caja
     cuenta solo lo que falta. Lo recibido de un cliente sale de sus
     abonos (ECA): esta semana descuenta sus promesas.
   - Las versiones de pagos (China, Magnum, TIBA, otros) solo cuentan en
     "Con mi plan de pagos"; las de cobros cuentan en las dos vistas.
   - Caja: solo lee. 4 indicadores, saldo al cierre contra el colchón y
     tabla plegable con la fuente de cada fila (lleva a Planes).
   - Magnum y TIBA, factura por factura, se deciden en Cuentas › Debo.
   Sin llaves nuevas: PLANES gana "real" y planes para externos, Magnum,
   TIBA y otros; las líneas de PLANES ganan "id"; PROM gana "dest".
   =================================================================== */
var V3={vista:'sem',dir:'todos',sel:null,add:null,addCp:'',addM:'',cp:null,ver:null,tool:null,tp:{monto:'',a:'0',b:'3',k:'1',v:'4'},drag:null,borrar:null};
var _V3PROV={eagle:'Eaglerise',nexus:'Nexus · Singsun',comp:'Componentes'};
var _V3DEST=[['','—'],['china','China · equipos'],['magnum','Magnum'],['nac','Nacional']];
const _V3LOCK='<svg class="v3-lock" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="se calcula solo"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>';
const _V3XI='<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>';
const _V3FL='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 2.5L7.5 6 4 9.5"/></svg>';
let _V3NN=0;
function _v3Nid(){ return 'l'+Date.now().toString(36)+'-'+(++_V3NN); }
function _v3n(v){ return Math.abs(v)<0.5?'—':(v<0?'−':'')+fmtUSDs(Math.abs(v)); }
function _v3k(v){ if(Math.abs(v)<0.5) return '—'; const a=Math.abs(v)/1000; return (v<0?'−':'')+(a>=100?Math.round(a):Math.round(a*10)/10)+'k'; }
function _v3F(f){ const d=f instanceof Date?f:_p14D(f); return d?_p14F(d):'—'; }
function _v3L0(){ return _p14Lun(TODAY); }
function _v3W(){ const L0=_v3L0(), W=[]; for(let i=0;i<12;i++) W.push(addD(L0,7*i)); return W; }
function _v3Lab(i){ if(i<0) return 'Atrasado'; if(i===0) return 'Esta semana'; const d=addD(_v3L0(),7*i); return d.getDate()+' '+_p14Mes[d.getMonth()]; }
/* -1 = antes de este lunes; 0 = esta semana; 1… las siguientes */
function _v3Wk(f){ const d=f instanceof Date?f:_p14D(f); if(!d) return null; const L0=_v3L0(); if(d<L0) return -1; return Math.floor(days(L0,_p14Lun(d))/7); }
function _v3FechaSem(i){ const d=addD(_v3L0(),7*i+3); return _p14Iso(d<TODAY?TODAY:d); }
/* llevar una fecha a la semana i, el mismo día de la semana */
function _v3Mover(f,i){ const d=_p14D(f)||TODAY, off=(d.getDay()+6)%7; let n=addD(_v3L0(),7*i+off); if(i===0&&n<TODAY) n=TODAY; return _p14Iso(n); }
function _v3Num(s){ return Math.max(0,_ecNum(s,0)||0); }
function _v3Real(){ if(!PLANES.real||typeof PLANES.real!=='object') PLANES.real={}; return PLANES.real; }
function _v3EsNeg(p){ if(!p) return false; if(p.dir==='cobro') return esInterno(p.cp); return !!(_V3PROV||{})[p.prov]; }
function _v3SigId(p){ const usadas=(_v3EsNeg(p)?['a']:[]).concat((p.versiones||[]).map(v=>v.id)); for(let c=97;c<123;c++){ const id=String.fromCharCode(c); if(usadas.indexOf(id)<0) return id; } return 'v'+Date.now().toString(36); }

/* ---- lo que se debe a China, pago por pago, con una llave estable ---- */
function _v3Claves(l){ const seen={}; return l.map(p=>{ let key=kOf(p.e)+'|'+p.tipo; seen[key]=(seen[key]||0)+1; if(seen[key]>1) key+='|'+seen[key]; return {key,p}; }); }
function _v3Deudas(prov,todos){
  return _v3Claves(todos||cjPagos()).filter(x=>x.p.tipo!=='tercero'&&_pcProvDe(x.p.quien)===prov&&+x.p.monto>0.005).map(({key,p})=>{
    const f=p.tipo==='otros'?null:(p.fecha?_p14D(p.fecha):null), venc=p.tipo==='otros'||!!(f&&f<TODAY);
    return {key,ped:p.e.derrame||p.e.ordenId||'',proy:p.e.proj||'',tipo:p.concepto,m:+p.monto,f,venc,sinf:!f&&p.tipo!=='otros'};
  }).sort((a,b)=>{ const r=x=>x.venc?0:(x.f?1:2); if(r(a)!==r(b)) return r(a)-r(b); return (a.f?+a.f:0)-(b.f?+b.f:0); });
}
/* cada giro paga los pedidos en orden: lo más vencido primero */
function _v3Fifo(D,L){
  const R=(D||[]).map(d=>({d,rest:d.m,por:[]})), cub={};
  L.forEach((l,i)=>{ let m=l.m; const lst=[];
    for(const r of R){ if(m<0.005) break; if(r.rest<0.005) continue; const t=Math.min(m,r.rest); r.rest-=t; m-=t; r.por.push('#'+(i+1)+' '+_v3F(l.f)); lst.push({r,t,full:r.rest<0.5}); }
    cub[l.id]={lst,sobra:m}; });
  return {R,cub};
}
function _v3BaseChina(D){
  const v=D.filter(x=>x.venc).reduce((a,x)=>a+x.m,0), out=[];
  if(v>0.5) out.push({id:'b|venc',f:_p14Iso(TODAY),m:v,c:'Vencido a hoy',sint:true});
  D.filter(x=>!x.venc&&x.f).forEach(x=>out.push({id:'b|'+x.key,f:_p14Iso(x.f),m:x.m,c:(x.ped+' · '+x.tipo)}));
  return out;
}
function _v3BaseCxp(acre){
  const g={}; cxpActivas(acre).filter(f=>!(CXPMIO[_mioK(acre,f)]||{}).fuera).forEach(f=>{ const d=cxpFecha(acre,f,'pago'), iso=d?_p14Iso(d):''; if(!iso) return;
    const o=(g[iso]=g[iso]||{m:0,n:0}); o.m+=_cxpUSD(f); o.n++; });
  return Object.keys(g).sort().map(iso=>({id:'b|'+iso,f:iso,m:g[iso].m,c:g[iso].n+' factura'+(g[iso].n===1?'':'s'),n:g[iso].n}));
}
function _v3CuotasCli(c){
  const fs=ecFilas(c).filas;
  return _ecUnidades(c).map((u,i)=>{ const f=fs.find(x=>x.k===u.k), d=u.vence?_p14D(u.vence):null;
    return {id:'b|'+i,f:d?_p14Iso(d):'',m:+u.saldo||0,c:f?[f.pedido,f.proyecto].filter(Boolean).join(' · '):'Cuota'}; }).filter(l=>l.m>0.5);
}

/* ---- las contrapartes, con su base, sus versiones y lo que cuenta en la Caja ---- */
function _v3Cps(){
  _v2PlanesBase(); _v3Real();
  const out=[], P=id=>_v2Plan(id), ex=PLANES.excl||{}, cl=_ecClientes();
  const internos=cl.filter(c=>esInterno(c)); (PROM||[]).forEach(x=>{ if(esInterno(x.cliente)&&internos.indexOf(x.cliente)<0) internos.push(x.cliente); });
  internos.forEach(c=>{ const p=P('cobro:'+c); out.push({id:'cobro:'+c,n:c,dir:'c',tipo:'Negociado',p,base:null,baseT:'',act:(p&&p.activa)||'a',enCaja:!p||p.enCaja!==false}); });
  cl.filter(c=>!esInterno(c)).forEach(c=>{ const p=P('cobro:'+c), b=_v3CuotasCli(c); if(!b.length&&!(p&&(p.versiones||[]).length)) return;
    out.push({id:'cobro:'+c,n:c,dir:'c',tipo:'Contrato',p,base:b,baseT:'Cuotas del contrato',act:(p&&p.activa)||'base',enCaja:!ex['cli:'+c]&&(!p||p.enCaja!==false),exK:'cli:'+c}); });
  const todos=EQ.length?cjPagos():[];
  Object.keys(_V3PROV).forEach(k=>{ const p=P('pago:'+k), D=EQ.length?_v3Deudas(k,todos):[];
    out.push({id:'pago:'+k,n:_V3PROV[k],dir:'p',tipo:'Negociado',prov:k,p,deudas:D,base:_v3BaseChina(D),baseT:'Fechas de Andrés',act:(p&&p.activa)||'a',enCaja:!p||p.enCaja!==false}); });
  [['magnum','Magnum'],['tiba','TIBA']].forEach(([k,n])=>{ const p=P('pago:'+k); if(!cxpActivas(k).length&&!(p&&(p.versiones||[]).length)) return;
    out.push({id:'pago:'+k,n,dir:'p',tipo:'Regla',prov:k,p,base:_v3BaseCxp(k),baseT:'Regla · máx. '+((REGLAS&&REGLAS[k]&&REGLAS[k].dias)||30)+' días',act:(p&&p.activa)||'base',enCaja:!ex[k]&&(!p||p.enCaja!==false),exK:k}); });
  const ter=(typeof cjPagosTerceros==='function')?cjPagosTerceros():[], po=P('pago:otros');
  if(ter.length||(po&&(po.versiones||[]).length)) out.push({id:'pago:otros',n:'Finkargo y otros cargos',dir:'p',tipo:'Contrato',prov:'otros',p:po,
    base:ter.filter(t=>t.fecha).map((t,i)=>({id:'b|'+i,f:_p14Iso(t.fecha<TODAY?TODAY:t.fecha),m:+t.monto||0,c:t.concepto})),baseT:'Cuotas del contrato',act:(po&&po.activa)||'base',enCaja:!ex.otros&&(!po||po.enCaja!==false),exK:'otros'});
  out.forEach(c=>{ if(c.act!=='base'&&!_v3VerExiste(c,c.act)) c.act=c.tipo==='Negociado'?'a':'base'; });
  return out;
}
function _v3VerExiste(c,vid){ if(vid==='base') return !!c.base||c.tipo==='Negociado'; if(vid==='a'&&c.tipo==='Negociado') return true; const p=c.p||_v2Plan(c.id); return !!(p&&(p.versiones||[]).some(v=>v.id===vid)); }
function _v3Cp(id){ return _v3Cps().find(c=>c.id===id)||null; }
function _v3Vers(c){
  const p=c.p||_v2Plan(c.id), L=[];
  if(c.base) L.push({id:'base',t:c.tipo==='Negociado'?'Fechas de Andrés':'Base',sub:c.tipo==='Negociado'?'se calcula sola':(c.baseT||'se calcula sola')});
  if(c.tipo==='Negociado') L.push({id:'a',t:'a · '+(c.dir==='c'?'Promesas':'Plan de giros'),sub:c.dir==='c'?'promesas de pago':'tu plan de giros'});
  ((p&&p.versiones)||[]).forEach(v=>L.push({id:v.id,t:v.id+' · '+(v.nombre||'Versión'),sub:(v.fecha?_v3F(v.fecha)+' · ':'')+(v.estado||'borrador')}));
  return L;
}
/* líneas de una versión: [{id,f,m,c}] */
function _v3Lin(c,vid){
  if(vid==='base') return (c.base||[]).map(l=>Object.assign({},l));
  if(vid==='a'&&c.tipo==='Negociado'){
    if(c.dir==='c') return (PROM||[]).filter(x=>x.cliente===c.n).map(x=>({id:x.id,f:x.fecha||'',m:+x.monto||0,c:x.dest||'',cump:!!x.cumplida}));
    const out=[]; Object.keys(PLANCHINA||{}).forEach(iso=>{ const v=_pcVal(iso)[c.prov]; if(v!=null&&v!=='') out.push({id:'pc|'+iso+'|'+c.prov,f:iso,m:+v||0,c:''}); }); return out;
  }
  const p=c.p||_v2Plan(c.id), v=p&&(p.versiones||[]).find(x=>x.id===vid); if(!v) return [];
  return v.lineas.map(l=>{ if(!l.id) l.id=_v3Nid(); return {id:l.id,f:l.fecha||l.sem||'',m:+l.monto||0,c:l.dest||''}; });
}
/* lo que cuenta: la versión activa (la base de un plan negociado no trae pagos: es "sin plan") */
function _v3Act(c){ if(!c.enCaja) return []; if(c.act==='base') return c.tipo==='Negociado'?[]:(c.base||[]); return _v3Lin(c,c.act).filter(l=>!l.cump); }
const _v3PorF=(a,b)=>(a.f||'9')<(b.f||'9')?-1:((a.f||'9')>(b.f||'9')?1:0);

/* ---- escribir: la versión "a" va a PLANCHINA o a PROM; las demás, a PLANES ---- */
function _v3PlanDe(c){ let p=_v2Plan(c.id); if(p) return p;
  p={id:c.id,cp:c.n,dir:c.dir==='c'?'cobro':'pago',activa:c.tipo==='Negociado'?'a':'base',enCaja:true,versiones:[]}; if(c.prov) p.prov=c.prov; PLANES.planes.push(p); return p; }
function _v3PcSet(iso,prov,m){ const o=Object.assign({},_pcVal(iso)); if(m==null) delete o[prov]; else o[prov]=Math.round(m*100)/100; if(Object.keys(o).length) PLANCHINA[iso]=o; else delete PLANCHINA[iso]; }
function _v3LinSet(c,vid,id,campo,val){
  const R=_v3Real();
  if(vid==='a'&&c.tipo==='Negociado'){
    if(c.dir==='c'){ const x=PROM.find(y=>y.id===id); if(!x) return; if(campo==='m') x.monto=Math.round(val*100)/100; else if(campo==='f'){ if(val) x.fecha=val; } else if(campo==='c') x.dest=val; return; }
    const ps=id.split('|'), iso=ps[1], prov=ps[2], cur=+_pcVal(iso)[prov]||0;
    if(campo==='m') _v3PcSet(iso,prov,val);
    else if(campo==='f'&&val&&val!==iso){ _v3PcSet(iso,prov,null); _v3PcSet(val,prov,(+_pcVal(val)[prov]||0)+cur); const nid='pc|'+val+'|'+prov; if(R[id]!=null){ R[nid]=(+R[nid]||0)+(+R[id]||0); delete R[id]; } }
    return;
  }
  const p=_v3PlanDe(c), v=(p.versiones||[]).find(x=>x.id===vid), l=v&&v.lineas.find(y=>y.id===id); if(!l) return;
  if(campo==='m') l.monto=Math.round(val*100)/100;
  else if(campo==='f'){ if(val){ l.fecha=val; const d=_p14D(val); l.sem=d?_p14Iso(_p14Lun(d)):val; } }
  else if(campo==='c') l.dest=val;
}
function _v3LinAdd(c,vid,f,m,dest){
  if(vid==='a'&&c.tipo==='Negociado'){
    if(c.dir==='c'){ const id=_v2Nuevo(); PROM.push({id,cliente:c.n,fecha:f,monto:Math.round(m*100)/100,nota:'',cumplida:false,dest:dest||''}); return id; }
    _v3PcSet(f,c.prov,(+_pcVal(f)[c.prov]||0)+m); return 'pc|'+f+'|'+c.prov;
  }
  const p=_v3PlanDe(c), v=(p.versiones||[]).find(x=>x.id===vid); if(!v) return null; const d=_p14D(f), id=_v3Nid();
  v.lineas.push({id,sem:d?_p14Iso(_p14Lun(d)):f,fecha:f,monto:Math.round(m*100)/100,dest:dest||(c.dir==='p'&&_V3PROV[c.prov]?'china':'')}); return id;
}
function _v3LinDel(c,vid,id){
  if(vid==='a'&&c.tipo==='Negociado'){ if(c.dir==='c') PROM=PROM.filter(x=>x.id!==id); else { const ps=id.split('|'); _v3PcSet(ps[1],ps[2],null); } }
  else { const p=_v2Plan(c.id), v=p&&(p.versiones||[]).find(x=>x.id===vid); if(v) v.lineas=v.lineas.filter(l=>l.id!==id); }
  delete _v3Real()[id];
}
/* versión nueva a partir de otra (o de la base) */
function v3Negociar(cpId,desde){
  const c=_v3Cp(cpId); if(!c) return null; const p=_v3PlanDe(c), vid=_v3SigId(p);
  const src=_v3Lin(c,desde||'base').filter(l=>!l.cump&&l.m>0.005);
  const v={id:vid,nombre:'Nueva versión',fecha:_p14Iso(TODAY),origen:'Zentrack',estado:'borrador',lineas:src.map(l=>{ const f=l.sint||!l.f?_p14Iso(TODAY):l.f, d=_p14D(f);
    return {id:_v3Nid(),sem:d?_p14Iso(_p14Lun(d)):f,fecha:f,monto:Math.round(l.m*100)/100,dest:(l.c&&_V3DEST.some(x=>x[0]===l.c))?l.c:(c.dir==='p'&&_V3PROV[c.prov]?'china':'')}; })};
  p.versiones=p.versiones||[]; p.versiones.push(v);
  V3.vista='cp'; V3.cp=cpId; V3.ver=vid; V3.sel=null; V3.tool=null; _v3Listo(); return v;
}
function v3Activar(cpId,vid){ const c=_v3Cp(cpId); if(!c) return; const p=_v3PlanDe(c); v2PlActivar(p.id,vid); }
function v3EnCaja(cpId,on){ const c=_v3Cp(cpId); if(!c) return; const p=_v2Plan(cpId); if(p) p.enCaja=!!on;
  if(c.exK){ if(on) delete PLANES.excl[c.exK]; else PLANES.excl[c.exK]=true; } else if(!p&&!on){ _v3PlanDe(c).enCaja=false; }
  _v3Listo(); }
function v3Abrir(cpId,vid){ V3.vista='cp'; V3.cp=cpId; V3.ver=vid||null; V3.sel=null; V3.tool=null; navTo('planes'); renderPlanes(); }
function _v3Listo(){ _v2Listo(); }

/* ---- lo recibido de un cliente esta semana (sus abonos) ---- */
function _v3RecSem(c){ const L0=_v3L0(), fin=addD(L0,7); return (ECA||[]).filter(a=>a.cliente===c).filter(a=>{ const d=_ecFecha(a.fecha); return d&&d>=L0&&d<fin; }).reduce((s,a)=>s+(+a.usd||0),0); }

/* ---- la Caja usa los planes activos ---- */
const _p14CalcAntes23=p14Calc;
p14Calc=function(modo){
  modo=modo||P14.modo; const plan=modo==='pago';
  const C=_v3Cps(), ex=PLANES.excl||{}, R=_v3Real(), pend=l=>Math.max(0,l.m-(+R[l.id]||0));
  const sPC=PLANCHINA, sPR=PROM, sCx=cxpActivas, sCo=cjCobros, sT=cjPagosTerceros, sPg=cjPagos;
  /* China: lo que falta de cada giro del plan, y lo que el plan ya cubre de lo que vence */
  const pc={}, cub={};
  Object.keys(sPC||{}).forEach(iso=>{ const v=_pcVal(iso), o={}; if(v.sin!=null) o.sin=v.sin; if(v.fuera!=null) o.fuera=v.fuera; if(Object.keys(o).length) pc[iso]=o; });
  C.filter(c=>c.dir==='p'&&_V3PROV[c.prov]).forEach(c=>{ const L=_v3Act(c).filter(l=>l.m>0.005&&l.f).sort(_v3PorF); if(!L.length) return;
    L.forEach(l=>{ const x=pend(l); if(x<0.005) return; const o=(pc[l.f]=pc[l.f]||{}); o[c.prov]=Math.round(((+o[c.prov]||0)+x)*100)/100; });
    _v3Fifo(c.deudas,L).R.forEach(r=>{ if(!r.d.venc&&r.d.m-r.rest>0.005) cub[r.d.key]=(cub[r.d.key]||0)+(r.d.m-r.rest); }); });
  /* clientes del grupo: la versión activa; esta semana, menos lo ya recibido */
  const prom=[];
  C.filter(c=>c.dir==='c'&&c.tipo==='Negociado').forEach(c=>{ let rec=_v3RecSem(c.n);
    _v3Act(c).filter(l=>l.m>0.005).sort(_v3PorF).forEach(l=>{ let m=l.m; if(_v3Wk(l.f)===0&&rec>0.005){ const t=Math.min(m,rec); m-=t; rec-=t; }
      if(m>0.005) prom.push({id:l.id,cliente:c.n,fecha:l.f,monto:m,nota:'',cumplida:false}); }); });
  /* clientes externos con una versión negociada */
  const cobV={}; C.filter(c=>c.dir==='c'&&c.tipo==='Contrato').forEach(c=>{ if(!c.enCaja) cobV[c.n]=[]; else if(c.act!=='base') cobV[c.n]=_v3Act(c).filter(l=>l.m>0.005).map(l=>({cliente:c.n,monto:l.m,fecha:_p14D(l.f),pedido:'Plan '+c.act,proyecto:''})); });

  let mi=0; X.cierre.forEach((v,i)=>{ if(v<X.cierre[mi]) mi=i; }); const minV=X.cierre[mi], bajo=X.cierre.filter(v=>v<col).length, fin=X.cierre[N-1];

  const u=_saldoUlt()||{cuentas:{}}, hoy=_p14Iso(TODAY);
  const top='<div class="v2-top"><h2>Caja</h2><div class="v2-seg" role="group" aria-label="Qué cuento">'+seg('vista','minimo','Solo lo que vence')+seg('vista','plan','Con mi plan de pagos')+'</div>'
    +'<div class="v2-seg" role="group" aria-label="Moneda">'+seg('mon','usd','USD',1)+seg('mon','cop','COP',1)+'</div><span class="v2-sp"></span>'
    +'<button class="v2-b" onclick="v3Banco()" aria-expanded="'+!!P14.banco+'"><span class="v2-mut" style="font-weight:500">Bancos hoy</span> <span class="v2-num">'+Fu(X.s0)+'</span><span class="v2-mut" style="font-weight:500;font-size:13px">'+(u.fecha?(u.fecha===hoy?'hoy':_v3F(u.fecha)):'sin registrar')+'</span></button>'
    +'<button class="v2-b" onclick="v2CajaExportar()">Exportar</button></div>';
  const banco=P14.banco?'<section class="v2-card v3-banco">'+_P14_CUENTAS.map(([k,n,m])=>'<label class="v2-fld">'+n+' · '+m+'<input class="v2-in v2-num" style="text-align:right" data-foco="sal-'+k+'" value="'+(u.cuentas&&u.cuentas[k]!=null?fmtUSDs(u.cuentas[k]):'')+'" placeholder="0" onchange="saldoSet(\''+k+'\',this.value)"></label>').join('')
    +'<label class="v2-fld">TRM<input class="v2-in v2-num" style="text-align:right" data-foco="sal-trm" value="'+(u.trm?u.trm:'')+'" placeholder="'+_p14Trm()+'" onchange="saldoSet(\'trm\',this.value)"></label><button class="v2-b neg" onclick="v3Banco(false)">Listo</button></section>':'';
  const KP=(t,v,s,cls)=>'<div class="v2-k '+(cls||'')+'"><p class="v2-lbl">'+t+'</p><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';
  const kpis='<div class="v3-ck">'+KP('Mínimo',Fu(minV),'semana '+_p14F(X.W[mi]),minV<0?'mal':(minV<col?'ya':'ok'))
    +KP('Semanas bajo el colchón',bajo+' de '+N,'colchón '+Fu(col),bajo?'mal':'ok')
    +KP('Falta para el colchón',Fu(Math.max(0,col-minV)),'colchón − mínimo',col-minV>0.5?'mal':'ok')
    +KP('Saldo en '+N+' semanas',Fu(fin),'entra '+K(S(ent))+' · sale '+K(S(sal)),fin<0?'mal':'')+'</div>';
  const graf='<section class="v2-card v3-graf"><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:16px"><h3>Saldo al cierre de cada semana</h3><span class="v2-mut" style="font-size:13px">'+(P14.mon==='cop'?'COP':'US$')+'</span><span class="v2-sp"></span>'+_v3LeyGraf(col)+'</div>'
    +_v3GrafSaldo(X.cierre,col,X.W.map((w,i)=>lab(i)))+'</section>';
  /* tabla */
  const C=(X.v3&&X.v3.cps)||[], cpOf=id=>C.find(c=>c.id===id);
  const fte=(id,t)=>'<button class="v3-fte" onclick="event.stopPropagation();v3Abrir(\''+_maQ(id)+'\')" title="Ver en Planes">'+esc4(t)+'</button>';
  const verT=c=>!c?'':(!c.enCaja?'fuera':((c.tipo==='Negociado'&&!_v3Act(c).length)?'sin plan':c.act==='base'?(c.tipo==='Negociado'?'sin plan':(c.tipo==='Regla'?'regla '+((REGLAS&&REGLAS[c.prov]&&REGLAS[c.prov].dias)||30)+' d':'cuotas')):'plan '+c.act));
  const det=P14.det;
  const celdas=(arr,signo,fila)=>arr.map((v,i)=>{ const on=det&&det.fila===fila&&det.i===i, hay=fila&&Math.abs(v)>0.5&&R[fila]&&R[fila].it[i]&&R[fila].it[i].length;
    return '<td class="'+(on?'on ':'')+(hay?'clic':'')+'"'+(hay?' onclick="p14Det(\''+fila+'\','+i+')"':'')+' style="color:'+(Math.abs(v)<0.5?'var(--ink3)':(signo>0?'#245747':'#8E1E17'))+'">'+(Math.abs(v)>0.5?K(signo*v):'—')+'</td>'; }).join('');
  const fila=(t,arr,signo,o)=>{ o=o||{}; const tg=o.tg?'<button class="v3-tg" onclick="v3CajaTg(\''+o.tg+'\')" aria-expanded="'+!!ab[o.tg]+'">'+_V3FL+t+'</button>':t;
    return '<tr class="'+(o.cls||'')+'"><td style="padding-left:'+(o.s||14)+'px">'+tg+(o.fte||'')+'</td>'+celdas(arr,signo,o.fila)+'<td style="font-weight:700;color:'+(signo>0?'#245747':'#8E1E17')+'">'+(Math.abs(S(arr))>0.5?K(signo*S(arr)):'—')+'</td></tr>'; };
  const saldoF=(t,arr)=>'<tr class="sal"><td style="padding-left:14px">'+t+'</td>'+arr.map(v=>'<td style="color:'+(v<0?'#B3261E':(v<col?'#7A4A00':'#245747'))+'">'+K(v)+'</td>').join('')+'<td></td></tr>';
  let rows=saldoF('Saldo al empezar',X.ini)+fila('Entra',ent,1,{tg:'entra',cls:'g'});
  if(ab.entra){ const cli=(X.v3&&X.v3.cli)||{}; Object.keys(cli).sort((a,b)=>S(cli[b])-S(cli[a])).forEach(n=>{ const c=cpOf('cobro:'+n); rows+=fila(esc4(n),cli[n],1,{s:36,fila:esInterno(n)?'sole':'ext',fte:c?fte(c.id,verT(c)):''}); }); }
  rows+=fila('Sale',sal,-1,{tg:'sale',cls:'g'});
  if(ab.sale){
    rows+=fila('China',R.china.v,-1,{s:36,tg:'china',fila:'china'});
    if(ab.china){ const nat=X.W.map((w,i)=>['eagle','nexus','comp'].reduce((a,k)=>a+((X.natProv[k]||[])[i]||0),0)), resto=X.W.map((w,i)=>R.china.v[i]-nat[i]-['eagle','nexus','comp'].reduce((a,k)=>a+((X.chPlan[k]||[])[i]||0),0));
      if(V!=='minimo') ['eagle','nexus','comp'].forEach(k=>{ const c=cpOf('pago:'+k); rows+=fila(esc4(_V3PROV[k]),X.chPlan[k]||new Array(N).fill(0),-1,{s:62,fte:c?fte(c.id,verT(c)):''}); });
      rows+=fila(V==='minimo'?'Vence · fecha de Andrés':'Vence y el plan no cubre',nat,-1,{s:62});
      if(resto.some(v=>Math.abs(v)>0.5)) rows+=fila('Sin asignar y girado con Finkargo',resto,-1,{s:62}); }
    const cm=cpOf('pago:magnum'), ct=cpOf('pago:tiba'), co=cpOf('pago:otros');
    rows+=fila('Magnum',R.mag.v,-1,{s:36,fila:'mag',fte:cm?fte(cm.id,verT(cm)):''})+fila('TIBA',R.tiba.v,-1,{s:36,fila:'tiba',fte:ct?fte(ct.id,verT(ct)):''});
    if(R.otros.v.some(v=>v>0.5)||co) rows+=fila('Finkargo y otros cargos',R.otros.v,-1,{s:36,fila:'otros',fte:co?fte(co.id,verT(co)):''});
    rows+=fila('Nómina y fijos',R.fij.v,-1,{s:36,fila:'fij'})+fila('Impuestos y 4x1000',R.imp.v,-1,{s:36,fila:'imp'}); }
  rows+=saldoF('Saldo al cerrar',X.cierre);
  const tabla='<section class="v2-card" style="overflow-x:auto;margin-bottom:14px"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 14px 8px"><h3 style="margin:0;font-size:17px">Semana a semana</h3><span class="v2-mut" style="font-size:13px">'+(P14.mon==='cop'?'COP en millones':'US$ en miles')+'</span><span class="v2-sp"></span>'
    +'<button class="v2-b" onclick="v3CajaTodo()">'+(ab.entra&&ab.sale&&ab.china?'Cerrar todo':'Abrir todo')+'</button></div>'
    +'<table class="v3-ct p15-t"><thead><tr><th>Concepto</th>'+X.W.map((w,i)=>'<th'+(i===0?' style="color:#7A4A00"':'')+'>'+lab(i)+'</th>').join('')+'<th>'+N+' sem</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
  let detH='';
  if(det&&R[det.fila]){ const it=R[det.fila].it[det.i]||[], nom={ext:'Clientes externos',sole:'Cliente del grupo',china:'China',mag:'Magnum',tiba:'TIBA',otros:'Finkargo y otros cargos',fij:'Nómina y fijos',imp:'Impuestos y 4x1000'}[det.fila]||'';
    detH='<section class="v2-drawer"><div class="v2-sec" style="padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><p class="v2-lbl" style="margin:0">Detalle · '+nom+' · '+lab(det.i)+'</p><span class="v2-sp"></span>'
      +((det.fila==='mag'||det.fila==='tiba')?'<a href="#" class="v2-b" onclick="P14.acre=\''+(det.fila==='mag'?'magnum':'tiba')+'\';navTo(\'porpagar\');return false">Decidir factura por factura en Cuentas › Debo</a>':'')
      +'<a href="#" class="v2-b" onclick="p14Det(\''+det.fila+'\','+det.i+');return false">Cerrar</a></div><div class="v2-wrap"><table class="v2-t"><tbody>'
      +it.slice().sort((a,b)=>b.usd-a.usd).map(x=>'<tr><td>'+esc4(x.txt)+'</td><td class="r"><b>'+Fu(x.usd)+'</b></td></tr>').join('')+'</tbody></table></div></section>'; }
  return top+banco+kpis+graf+tabla+detH;
};

/* ---- Cuentas: el plan del cliente del grupo, en una línea ---- */
function _v3PlanResumenHTML(c){
  const cp=_v3Cp('cobro:'+c); if(!cp) return '';
  const vers=_v3Vers(cp), v=vers.find(x=>x.id===cp.act)||vers[0], L=_v3Act(cp), W12=addD(_v3L0(),84);
  const t12=L.filter(l=>{ const d=_p14D(l.f); return d&&d>=TODAY&&d<W12; }).reduce((a,l)=>a+l.m,0);
  const p=_v2Plan(cp.id), q=p?_v2Cumpl(p,cp.act):{plan:0,rec:0};
  return '<div class="ec8-sec">Plan de pagos · '+esc4(c)+'<span>'+esc4(cp.enCaja?(v?v.t:'—')+' · en la Caja':'fuera de la Caja')+'</span>'
    +'<button class="ec8-b" onclick="v3Abrir(\''+_maQ(cp.id)+'\')">Abrir en Planes</button></div>'
    +'<div class="v2-kpis k5" style="margin:10px 0">'
    +'<div class="v2-k"><p class="v2-lbl">Próximas 12 semanas</p><div class="v">'+_v3n(t12)+'</div><div class="s">'+L.filter(l=>{ const d=_p14D(l.f); return d&&d>=TODAY; }).length+' pagos con fecha</div></div>'
    +'<div class="v2-k '+(q.plan-q.rec>0.5?'mal':'ok')+'"><p class="v2-lbl">Vencido sin recibir</p><div class="v">'+_v3n(Math.max(0,q.plan-q.rec))+'</div><div class="s">'+(q.desde?'desde '+_p14F(q.desde):'—')+'</div></div>'
    +'<div class="v2-k '+(q.plan>0.5&&q.rec<q.plan?'mal':'ok')+'"><p class="v2-lbl">Cumplimiento</p><div class="v">'+(q.plan>0.5?Math.round(q.rec/q.plan*100)+' %':'—')+'</div><div class="s">'+_v3n(q.rec)+' / '+_v3n(q.plan)+'</div></div>'
    +'<div class="v2-k ya"><p class="v2-lbl">Esta semana</p><div class="v">'+_v3n(L.filter(l=>_v3Wk(l.f)===0).reduce((a,l)=>a+l.m,0))+'</div><div class="s">recibido '+_v3n(_v3RecSem(c))+'</div></div>'
    +'<div class="v2-k"><p class="v2-lbl">Versiones</p><div class="v">'+vers.length+'</div><div class="s">'+esc4(vers.map(x=>x.id).join(' · '))+'</div></div></div>';
}
_promHTML=function(c){ try{ return _v3PlanResumenHTML(c); }catch(err){ console.warn(err); return ''; } };

/* ---- Cuentas › Debo › China: lo que debes por proveedor y su plan (se hace en Planes) ---- */
function _v3ChinaProvHTML(){
  const C=_v3Fichas().C.filter(c=>c.dir==='p'&&_V3PROV[c.prov]); let tv=0,tf=0,tp=0,ts=0;
  const fil=C.map(c=>{ const D=c.deudas||[], v=D.filter(d=>d.venc).reduce((a,d)=>a+d.m,0), f=D.filter(d=>!d.venc&&d.f&&_v3Wk(d.f)<12).reduce((a,d)=>a+d.m,0), pl=_v3Act(c).reduce((a,l)=>a+l.m,0), s=c.sinPlan||0, vt=_v3Vers(c).find(x=>x.id===c.act);
    tv+=v; tf+=f; tp+=pl; ts+=s;
    return '<tr><td><b>'+esc4(c.n)+'</b></td><td class="r mal">'+fmtUSDs(v)+'</td><td class="r">'+(f>0.5?fmtUSDs(f):'—')+'</td><td class="r">'+(pl>0.5?fmtUSDs(pl):'—')+'</td>'
      +'<td><a href="#" onclick="v3Abrir(\''+_maQ(c.id)+'\');return false">'+esc4(!c.enCaja?'fuera de la Caja':(c.act==='base'?'sin plan':(vt?vt.t:c.act)))+'</a></td><td class="r"><b class="'+(s>0.5?'mal':'')+'">'+(s>0.5?fmtUSDs(s):'—')+'</b></td></tr>'; }).join('');
  return '<div class="p14-card"><div class="p14-ph"><h4>Por proveedor</h4><a href="#" onclick="v3Abrir(\'pago:eagle\');return false">Ver los cronogramas en Planes</a></div>'
    +'<div class="ec8-wrap"><table class="ec8 p14-ft"><thead><tr><th>Proveedor</th><th class="r">Vencido</th><th class="r">Vence en 12 semanas</th><th class="r">En tu plan</th><th>Versión en la Caja</th><th class="r">Vencido sin plan</th></tr></thead><tbody>'+fil
    +'<tr class="tot"><td>Total</td><td class="r">'+fmtUSDs(tv)+'</td><td class="r">'+fmtUSDs(tf)+'</td><td class="r">'+fmtUSDs(tp)+'</td><td></td><td class="r">'+fmtUSDs(ts)+'</td></tr></tbody></table></div></div>';
}
