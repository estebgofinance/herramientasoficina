<script>

/* ================= POR PAGAR ================= */
function _p14Edad(fs){ const b=[0,0,0,0]; fs.forEach(f=>{ const v=_p14D(f.vence), d=v?days(v,TODAY):0, x=_cxpUSD(f); b[d<=0?0:(d<=30?1:(d<=60?2:3))]+=x; }); return b; }
function _p14Acre(){

  const chV=K?S(K.C.atras.concat(K.C.reciente,K.C.ya).filter(p=>p.tipo!=='tercero')):0, chT=EQ.length?puenteTot(null).debo:0;

    +(venc!=null?'<div class="p14-age"><i style="width:'+Math.min(100,venc[0]*100).toFixed(0)+'%;background:#B3261E"></i><i style="width:'+Math.min(100,venc[1]*100).toFixed(0)+'%;background:#C87A00"></i></div>':'')
    +'<div class="s"><span>'+izq+'</span><span class="mut">'+der+'</span></div></a>';
  const cx=acre=>{ const fs=cxpActivas(acre); if(!fs.length) return null; const tot=fs.reduce((a,f)=>a+_cxpUSD(f),0), r=REGLAS[acre]||{}, b=_p14Edad(fs);
    const pasan=r.tipo==='maxMora'?fs.filter(f=>days(_p14D(f.vence)||TODAY,TODAY)>(+r.dias||0)).reduce((a,f)=>a+_cxpUSD(f),0):0;
    return {fs,tot,b,pasan,r}; };
  const M=cx('magnum'), T=cx('tiba');
  const copTot=fs=>fs.filter(f=>f.moneda==='COP').reduce((a,f)=>a+f.saldo,0), usdTot=fs=>fs.filter(f=>f.moneda==='USD').reduce((a,f)=>a+f.saldo,0);
  const rTxt=r=>r&&r.tipo==='maxMora'?'máx. '+r.dias+' días':'al vencer';
  const mesFij=(GASTOS||[]).filter(g=>g.periodicidad==='mensual'&&!g.porIdentificar).reduce((a,g)=>a+(_gCOP(g)||0),0);
  const venceFij=(GASTOS||[]).filter(g=>{ const f=gastoFechas(g,TODAY); return f.length&&f[0]<TODAY&&_gCOP(g)!=null; });
  return card('china','China','US$ '+fmtUSDs(chT),chT?[chV/chT,0]:null,'<span class="mal">'+fmtUSDs(chV)+' vencido</span>','plan: lo escribes tú')
    +card('magnum','Magnum',M?'COP '+_copM(copTot(M.fs)):'sin cargar',M?[M.pasan/M.tot,(M.b[1]+M.b[2]+M.b[3]-M.pasan)/M.tot]:null,M?(M.pasan>0.5?'<span class="mal">'+_copM(M.pasan*t)+' pasan de '+M.r.dias+' d</span>':'<span class="ok">dentro de la regla</span>'):'carga su estado de cuenta',rTxt(REGLAS.magnum))
    +card('tiba','TIBA',T?(usdTot(T.fs)?'US$ '+fmtUSDs(usdTot(T.fs)):'')+(copTot(T.fs)?(usdTot(T.fs)?' + ':'')+'COP '+_copM(copTot(T.fs)):''):'sin cargar',T?[T.pasan/T.tot,(T.b[1]+T.b[2]+T.b[3]-T.pasan)/T.tot]:null,
        T?(T.b[1]+T.b[2]+T.b[3]>0.5?'<span class="mal">'+fmtUSDs(T.b[1]+T.b[2]+T.b[3])+' USD vencido</span>':'<span class="ok">al día</span>'):'carga su extracto',rTxt(REGLAS.tiba))
    +card('fijos','Fijos e impuestos','≈ COP '+_copM(mesFij)+'/mes',null,venceFij.length?'<span class="mal">'+esc4(venceFij.map(g=>g.rubro).join(', '))+' pendiente</span>':'<span class="ok">al día</span>','al vencer')
    +'<div class="p14-ac dash">Comercial · próxima versión</div>';
}
function _p14Prev(acre){
  const p=P14.prev; if(!p||p.acre!==acre) return '';
  if(p.error) return '<div class="p14-alert">No cargué el archivo: '+esc4(p.error)+' <button class="ec8-b" onclick="cxpCancelar()">Cerrar</button></div>';
  const r=p.r, d=p.diff, tot=m=>r.facturas.filter(f=>f.moneda===m).reduce((a,f)=>a+f.saldo,0);
  return '<div class="p14-prev"><b>Revisa antes de aprobar · '+esc4(r.archivo||'')+'</b> · corte '+_p14F(_p14D(r.corte))+' · '+r.facturas.length+' facturas'
    +(tot('COP')?' · COP '+_cop(tot('COP')):'')+(tot('USD')?' · US$ '+_ec2(tot('USD')):'')
    +((r.anticipos||[]).length?' · anticipos sin facturar COP '+_cop(r.anticipos.filter(a=>a.sinFacturar).reduce((a,x)=>a+x.valor,0)):'')
    +_p14Cambios(d,true)
    +'<div class="p14-acc"><button class="ec8-b on" onclick="cxpAprobar()">Aprobar carga</button><button class="ec8-b" onclick="cxpCancelar()">Cancelar</button><small class="mut">Aprobar reemplaza las facturas; tus fechas planeadas, marcas de pagada y reglas se conservan.</small></div></div>';
}
function _p14Cambios(d,prev){
  if(!d) return ''; if(!d.desde) return '<div class="p14-camb">'+(prev?'':'<b>Qué cambió</b>')+'<div class="mut">Es la primera carga de este acreedor: todavía no hay con qué comparar.</div></div>';
  const mon=f=>(f.moneda==='USD'?'US$ '+_ec2(f.saldo):_cop(f.saldo));
  const l=[].concat(d.yaNo.map(f=>'<div><span class="pl pl-ok">Ya no está</span> '+esc4(f.id)+' · '+esc4(f.empresa)+' · '+mon(f)+' → ¿pagada?</div>'),
    d.nuevas.map(f=>'<div><span class="pl pl-ya">Nueva</span> '+esc4(f.id)+' · '+esc4(f.empresa)+(f.pedido?' · '+esc4(f.pedido):'')+' · '+mon(f)+' · vence '+_p14F(_p14D(f.vence))+'</div>'),
    d.cambian.map(x=>'<div><span class="pl pl-n">Cambió</span> '+esc4(x.f.id)+' · '+esc4(x.f.empresa)+' · antes '+_cop(x.antes)+' → '+mon(x.f)+'</div>'));
  return '<div class="p14-camb">'+(prev?'':'<b>Qué cambió desde el estado anterior'+(d.desde?' ('+_p14F(_p14D(d.desde))+')':'')+'</b>')+(l.length?l.join(''):'<div class="mut">Sin cambios en las facturas.</div>')+'</div>';
}
function _p14PanelCxp(acre){

  const w0=cxpSemana(acre,0,'pago'), vC=venc.filter(f=>f.moneda==='COP').reduce((a,f)=>a+f.saldo,0), vU=venc.filter(f=>f.moneda==='USD').reduce((a,f)=>a+f.saldo,0);
  const K_=(l,v,cls,sub,dark)=>'<div class="ec8-k'+(dark?' p14-dark':'')+'"><div class="l">'+l+'</div><div class="v '+(cls||'')+'">'+v+'</div><small>'+sub+'</small></div>';
  h+='<div class="ma-kpis">'+K_('Le debes',dual(tot('COP'),tot('USD')),'','≈ US$ '+fmtUSDs(fs.reduce((a,f)=>a+_cxpUSD(f),0)),true)
    +K_('Pagar esta semana',dual(w0.cop,w0.usd),'mal','como pago · '+(r.tipo==='maxMora'?'máx. '+r.dias+' días':'al vencer'))
    +K_('Vencido',dual(vC,vU),'ya',venc.length+' factura'+(venc.length===1?'':'s'))
    +K_('Anticipos a tu favor',ant.length?'COP '+_cop(ant.reduce((a,x)=>a+x.valor,0)):'—','ok',ant.length?ant.length+' sin facturar (aduanas)':'no hay')+'</div>';
  const b=_p14Edad(fs), bt=b.reduce((a,x)=>a+x,0)||1, bl=['Corriente','1 a 30 días','31 a 60 días','más de 60'], bc=['#DCEFE7','#F5D49A','#E8908A','#B3261E'];
  h+='<div class="p14-edad"><div>'+b.map((x,i)=>x>0.5?'<i style="width:'+(x/bt*100).toFixed(1)+'%;background:'+bc[i]+'"></i>':'').join('')+'</div><small>'+b.map((x,i)=>x>0.5?'<span'+(i>=2?' class="mal"':'')+'>'+bl[i]+' '+(acre==='magnum'?_copM(x*t):'US$ '+fmtUSDs(x))+'</span>':'').join('')+'</small></div>';
  if(C.cupo){ const deb=C.sobrecupo!=null?C.sobrecupo+C.cupo:C.totalArchivo; h+='<div class="p14-alert">'+nom+' te dio un cupo de '+_copM(C.cupo)+' y vas en '+_copM(deb)+' (corte '+_p14F(_p14D(C.cupoCorte||C.corte))+'): '+fmtUSDs((deb-C.cupo)/C.cupo*100)+' % sobre el cupo. Si se cansan, frenan despachos.</div>'; }
  h+='</div><div class="p14-card"><h4>Cómo le pagas</h4><div class="ec9-seg" style="margin-top:8px"><button class="'+(r.tipo==='maxMora'?'on':'')+'" onclick="reglaSet(\''+acre+'\',\'tipo\',\'maxMora\')">Máximo días de mora</button><button class="'+(r.tipo==='alVencer'?'on':'')+'" onclick="reglaSet(\''+acre+'\',\'tipo\',\'alVencer\')">Al vencer</button></div>'
    +(r.tipo==='maxMora'?'<div class="p14-regla">Ninguna factura pasa de <input class="ec8-in" id="regla-dias-'+acre+'" style="width:56px;text-align:center" value="'+(r.dias==null?30:r.dias)+'" onchange="reglaSet(\''+acre+'\',\'dias\',this.value)"> días vencida. Lo que ya pasó, sale esta semana.</div>':'<div class="p14-regla">Cada factura se paga el día que vence. Lo vencido, esta semana.</div>')
    +'<small class="mut">Orden de prioridad: la fecha que pongas a mano en una factura → esta regla → la fecha de vencimiento.</small></div>';
  const filas=fs.map(f=>({f,d:cxpFecha(acre,f,'pago')})).sort((a,b)=>a.d-b.d), L0=_p14Lun(TODAY);
  h+='<div class="p14-card np"><div class="p14-ph" style="padding:0 16px"><div><h4>Facturas</h4><small class="mut">hoy '+_p14F(TODAY)+' · ordenadas por fecha de pago planeada</small></div><div style="display:flex;flex-wrap:wrap;gap:8px"><button class="v2-b" onclick="v2CxpRegla(\''+acre+'\',null)">Aplicar regla a todas</button><button class="v2-b" onclick="v2CxpYa(\''+acre+'\')">Todo lo vencido esta semana</button></div></div><div class="ec8-wrap" style="border:0"><table class="ec8 p14-ft"><thead><tr><th>Factura</th><th>Empresa</th><th>Para qué</th><th>Vence</th><th>Estado</th><th class="r">Saldo</th><th>Pago planeado</th><th>En la Caja</th><th></th></tr></thead><tbody>'
    +filas.map(({f,d})=>{ const v=_p14D(f.vence), mora=v?days(v,TODAY):0, m=CXPMIO[_mioK(acre,f)]||{}, lim=r.tipo==='maxMora'?(+r.dias||0):0;
      const est=mora>0?'<span class="pl '+(mora>lim?'pl-mal':'pl-ya')+'">Vencida · '+mora+' d</span>':(mora===0?'<span class="pl pl-ya">Vence hoy</span>':'<span class="pl pl-g">en '+(-mora)+' d</span>');
      const esta=Math.floor(days(L0,_p14Lun(d))/7)===0;
      return '<tr><td><b>'+esc4(f.id)+'</b></td><td class="mut">'+esc4(f.empresa)+'</td><td>'+esc4(f.pedido||f.centroCosto||'—')+'</td><td>'+_p14F(v)+'</td><td>'+est+'</td>'
        +'<td class="r">'+(f.moneda==='USD'?'US$ '+_ec2(f.saldo):_cop(f.saldo))+'</td>'
        +'<td><span class="'+(esta?'mal':'')+'"><b>'+(esta?'Esta semana':_p14F(d))+'</b></span> <input type="date" class="ec8-in d p14-fd" value="'+esc4(m.planFecha||'')+'" title="Fecha a mano: manda sobre la regla" onchange="cxpPlan(\''+acre+'\',\''+_maQ(f.id)+'\',this.value)">'+(m.planFecha?'<span class="pl pl-n">a mano</span>':'')+'</td>'
        +'<td><label class="ec13-chk" title="Sin marcar: no sale en la Caja, pero la sigues debiendo"><input type="checkbox" '+(m.fuera?'':'checked')+' onchange="v2CxpFuera(\''+acre+'\',\''+_maQ(f.id)+'\',!this.checked)" aria-label="En la Caja"></label></td>'
        +'<td><label class="ec13-chk" title="Ya la pagaste: sale de la Caja"><input type="checkbox" onchange="cxpPagada(\''+acre+'\',\''+_maQ(f.id)+'\',this.checked)"> pagada</label></td></tr>'; }).join('')
    +'</tbody></table></div>';
  const pag=((C.facturas)||[]).filter(f=>(CXPMIO[_mioK(acre,f)]||{}).pagada);
  if(pag.length) h+='<div class="p14-pag"><small class="mut">Marcadas como pagadas (no salen en la Caja): '+pag.map(f=>'<label class="ec13-chk"><input type="checkbox" checked onchange="cxpPagada(\''+acre+'\',\''+_maQ(f.id)+'\',this.checked)"> '+esc4(f.id)+'</label>').join(' ')+'</small></div>';
  h+='</div>';
  if(C.cambios) h+='<div class="p14-card">'+_p14Cambios(C.cambios,false)+'</div>';
  return h;
}
function _p14PanelChina(){ return ''; }   /* v1.15 la reemplaza */

  const hoy=TODAY, meses=[1,2,3,4].map(k=>new Date(hoy.getFullYear(),hoy.getMonth()+k,1)), tot=meses.map(d=>gastosMes(d.getFullYear(),d.getMonth()+1)), mx=tot.indexOf(Math.max(...tot));

  h+='<div class="p14-card np"><div class="ec8-wrap" style="border:0"><table class="ec8 p14-ft p14-g"><thead><tr><th>Rubro</th><th>Grupo</th><th class="r">Monto COP</th><th>Cada cuánto</th><th>Día</th><th>Próximo pago</th><th>Nota</th><th></th></tr></thead><tbody>'

          +'<td class="r"><input class="ec8-in'+(g.monto==null?' p14-in':'')+'" style="width:120px" data-foco="gm-'+esc4(g.id)+'" value="'+(g.monto==null?'':fmtUSDs(g.monto))+'" placeholder="escríbelo tú" onchange="gastoSet(\''+q+'\',\'monto\',this.value)"></td>'
          +'<td><select class="ec8-in" style="width:120px;text-align:left" onchange="gastoSet(\''+q+'\',\'periodicidad\',this.value)">'+per.map(p=>'<option value="'+p+'"'+(g.periodicidad===p?' selected':'')+'>'+perT[p]+'</option>').join('')+'</select></td>'

function renderPorPagar(){
  const v=document.getElementById('v-porpagar'); if(!v) return;
  let panel='';
  try{ panel=P14.acre==='china'?_p14PanelChina():(P14.acre==='fijos'?_p14PanelFijos():_p14PanelCxp(P14.acre)); }catch(err){ console.warn(err); panel='<div class="ec8-vacio">Error: '+esc4(err.message)+'</div>'; }
  v.innerHTML='<div class="ma-top"><div><h2 class="title">Por pagar</h2><div class="sub" style="margin-bottom:0">Todo lo que le debes a cada acreedor y la regla con la que decides pagarle. El archivo trae las facturas; la regla y las fechas planeadas son tuyas.</div></div></div>'
    +'<div class="p14-pp"><aside class="p14-acr">'+_p14Acre()+'</aside><div class="p14-panel">'+panel+'</div></div>';
}
document.querySelectorAll('nav.tabs button[data-v="porpagar"]').forEach(b=>b.addEventListener('click',()=>renderPorPagar()));
const _refAntes14=refreshAll;

/* ---- guardar y recuperar ---- */
const _serAntes14=serializeState;
serializeState=function(){ const o=JSON.parse(_serAntes14.apply(this,arguments)); Object.assign(o,{SALDOS,CXP,CXPMIO,REGLAS,PLANCHINA,GASTOS}); return JSON.stringify(o); };
const _appAntes14=applyState;
applyState=function(s){ _appAntes14.apply(this,arguments);
  SALDOS=(s&&s.SALDOS&&Array.isArray(s.SALDOS.hist))?s.SALDOS:{hist:[]};
  CXP=(s&&s.CXP&&typeof s.CXP==='object')?s.CXP:{};
  CXPMIO=(s&&s.CXPMIO&&typeof s.CXPMIO==='object')?s.CXPMIO:{};
  REGLAS=Object.assign(_reglas0(),(s&&s.REGLAS)||{});
  PLANCHINA=(s&&s.PLANCHINA&&typeof s.PLANCHINA==='object')?s.PLANCHINA:{};
  GASTOS=(s&&Array.isArray(s.GASTOS))?s.GASTOS:_gastos0();   /* la primera vez trae los rubros precargados */
};
if(!REGLAS) REGLAS=_reglas0();
if(!GASTOS) GASTOS=_gastos0();

/* ===================================================================
   v1.15 · LEGIBLE Y POR PREGUNTA
   Pestañas: Tablero · Caja · Estados de cuenta · Pedidos · Sinosure · Ajustes.
   - Tablero: cómo estoy hoy (4 números y totales), el cupo Sinosure en
     barras y, debajo, el treemap de siempre. Sin listados ni alertas.
   - Caja: botones por pregunta (Ingresos, Egresos, ¿Me alcanza para
     todo?, Con mi plan de pagos, Solo lo que vence, Máximo a China),
     cada uno con su respuesta en una frase; y "¿Me alcanza para…?".
   - Estados de cuenta: Me deben (los de clientes, con "lo que te va a
     entrar, fecha a fecha") y Debo (lo que antes era Por pagar).
   - Pedidos: el ORDER REPORT como tabla; "Con mis decisiones" es el

function fkLeerLineas(L){

  const g=/Fecha de Giro:\s*(\d{1,2})\s+de\s+(\w+)\s+del?\s+(\d{4})/i.exec(t);
  const fecha=g&&mes[g[2].toLowerCase()]!=null?_p14Iso(new Date(+g[3],mes[g[2].toLowerCase()],+g[1])):'';
  const capital=tras(/Valor del Instrumento de Pago:[\s\S]*?USD\s*\$([\d,.]+)/);
