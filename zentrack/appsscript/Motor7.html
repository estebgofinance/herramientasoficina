<script>

/* ===================================================================
   v1.8 · ESTADO DE CUENTA EN TABLA
   Cada cliente tiene una tabla como el estado de cuenta que se le manda:
   pedido, equipo, proyecto, ETD, valor, abonado, saldo, vence y mora.
   - Valor = el precio de Precios. Sin precio o en "Especial" no aparece.
   - Abonado y Vence se escriben en la tabla. Vence sale solo como
     ETD + plazo del cliente; si se cambia, manda lo escrito.
   - Un pedido se puede partir en cuotas (monto o %, fecha y abono propios)
     para los acuerdos de pago con cada cliente.
   - Líneas sueltas para lo que no viene de China (estaciones, fletes…).
   - "Cargar facturas" se esconde; FACT y PAGOS se quedan guardados.
   Llaves nuevas del estado: ECP = {kOf: {abonado, vence, nota, cuotas:[…]}},
   ECX = [{id, cliente, pedido, equipo, proyecto, etd, valor, abonado, vence, nota}].
   =================================================================== */
var ECP={}, ECX=[], ECSEL=null;
const _ec2=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const _ecISO=d=>{ if(!d) return ''; const x=(d instanceof Date)?d:new Date(d); if(isNaN(x)) return '';
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const _ecFecha=s=>{ if(!s) return null; if(s instanceof Date) return s; const m=(''+s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const _ecFmtD=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'';
/* "1,234.5", "1234.5" o "5%" (del valor) */
function _ecNum(v,base){
  const s=(''+(v==null?'':v)).trim().replace(/\s/g,''); if(s==='') return null;
  if(/%$/.test(s)){ const p=parseFloat(s.replace(',','.')); return isFinite(p)?Math.round((+base||0)*p)/100:null; }
  const mx=s.replace(/,/g,'').match(/^([\d.]+)[x*×]([\d.]+)$/i);   /* cantidad x precio unitario, ej. 12x6608 */
  if(mx){ const a=+mx[1], b=+mx[2]; return (isFinite(a)&&isFinite(b))?Math.round(a*b*100)/100:null; }
  const n=parseFloat(s.replace(/,/g,'')); return isFinite(n)?Math.round(n*100)/100:null;
}
const _ecPlazo=c=>(CLI[c]&&+CLI[c].term>0)?+CLI[c].term:60;
const _ecQ=k=>(''+k).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

/* ---- las filas del estado de cuenta de un cliente ---- */
function ecFilas(c){
  const out=[], sinPrecio=[];
  EQ.filter(e=>e.cliente===c&&cobroModo(e)!=='especial').forEach(e=>{
    const valor=Math.round(precioVenta(e)*100)/100;
    if(!(valor>0)){ sinPrecio.push(e); return; }
    const k=kOf(e), r=ECP[k]||{};
    const auto=e.etd?addD(e.etd,_ecPlazo(c)):null;
    out.push({tipo:'eq', k, e, pedido:e.derrame||e.ordenId, equipo:e.mfg==='Singsun'?'Tracker':(e.mfg==='Eaglerise'?'Shelter':(e.tipo||'')),
      proyecto:e.proj||'', etd:e.etd||null, valor, reg:r, autoVence:auto, sinfac:cobroModo(e)==='sinfac'});
  });
  ECX.filter(x=>x.cliente===c).forEach(x=>{
    const auto=x.etd?addD(_ecFecha(x.etd),_ecPlazo(c)):null;
    out.push({tipo:'x', k:x.id, x, pedido:x.pedido||'', equipo:x.equipo||'', proyecto:x.proyecto||'', etd:_ecFecha(x.etd),
      valor:+x.valor||0, reg:x, autoVence:auto});
  });
  out.forEach(f=>{
    const cu=(f.reg.cuotas||[]);
    if(cu.length){
      f.cuotas=cu.map((q,i)=>{ const v=_ecFecha(q.vence), ab=+q.abonado||0, m=+q.monto||0, sal=m-ab;
        return {i, q, monto:m, abonado:ab, saldo:sal, vence:v, mora:(sal>0.005&&v&&v<TODAY)?days(v,TODAY):0}; });
      f.abonado=f.cuotas.reduce((a,q)=>a+q.abonado,0);
      f.sumaCuotas=f.cuotas.reduce((a,q)=>a+q.monto,0);
      const pend=f.cuotas.filter(q=>q.saldo>0.005&&q.vence).sort((a,b)=>a.vence-b.vence)[0];
      f.vence=pend?pend.vence:null;
      f.vencido=f.cuotas.filter(q=>q.mora>0).reduce((a,q)=>a+q.saldo,0);
      f.mora=Math.max(0,...f.cuotas.map(q=>q.mora));
    }else{
      f.abonado=+f.reg.abonado||0;
      f.vence=_ecFecha(f.reg.vence)||f.autoVence;
      const sal=f.valor-f.abonado;
      f.mora=(sal>0.005&&f.vence&&f.vence<TODAY)?days(f.vence,TODAY):0;
      f.vencido=f.mora>0?sal:0;
    }
    f.saldo=f.valor-f.abonado;
  });
  out.sort((a,b)=>{ const va=a.vence?a.vence.getTime():9e15, vb=b.vence?b.vence.getTime():9e15;
    return (b.mora-a.mora)||(va-vb)||(''+a.pedido).localeCompare(''+b.pedido,undefined,{numeric:true}); });
  return {filas:out, sinPrecio};
}
function ecTotales(c){
  const {filas}=ecFilas(c);
  const t={valor:0,abonado:0,saldo:0,vencido:0,favor:0,n:filas.length};
  filas.forEach(f=>{ t.valor+=f.valor; t.abonado+=f.abonado; if(f.saldo>0)t.saldo+=f.saldo; else t.favor+=-f.saldo; t.vencido+=f.vencido; });
  return t;
}

/* ---- lo que se escribe en la tabla ---- */
function _ecReg(k){ if(/^ecx/.test(k)) return ECX.find(x=>x.id===k)||null; return ECP[k]||(ECP[k]={}); }
function _ecListo(){ guardar4(); refreshAll(); }
function ecSet(k,campo,v){
  const r=_ecReg(k); if(!r) return;
  const f=(ecFilas(ECSEL).filas.find(x=>x.k===k))||{};
  if(campo==='abonado'||campo==='valor'){ const n=_ecNum(v,f.valor); if(n==null) delete r[campo]; else r[campo]=n; }
  else if(campo==='vence'||campo==='etd'){ if(v) r[campo]=v; else delete r[campo]; }
  else r[campo]=(''+v).trim();
  _ecListo();
}
/* v1.8.2 · las fechas se guardan al instante, pero la pantalla se repinta al salir del campo.
   Antes se repintaba con el primer valor "válido" (año 0002 mientras se escribía 2026) y el
   campo perdía el foco, así que la fecha no quedaba. */
function ecFechaCambio(el,k,i,campo){
  const v=el.value;
  if(v&&+v.slice(0,4)<2000) return;            /* año a medio escribir */
  const r=_ecReg(k); if(!r) return;
  if(i>=0){ if(!r.cuotas||!r.cuotas[i]) return; r.cuotas[i][campo]=v; }
  else{ if(v) r[campo]=v; else delete r[campo]; }
  guardar4();
  _ecFechaSucia=true;                           /* se repinta al salir del campo (ecFechaSalir) */
}
let _ecFechaSucia=false;
function ecFechaSalir(){ if(!_ecFechaSucia) return; _ecFechaSucia=false; setTimeout(refreshAll,0); }
function ecCuotas(k){
  const r=_ecReg(k); if(!r) return;
  const f=(ecFilas(ECSEL).filas.find(x=>x.k===k))||{};
  const v=f.valor||0, ab=+r.abonado||0, fe=r.vence||_ecISO(f.autoVence);
  r.cuotas=[{concepto:'Cuota 1',monto:Math.round(v*50)/100,vence:fe,abonado:Math.min(ab,Math.round(v*50)/100)},
            {concepto:'Cuota 2',monto:Math.round((v-Math.round(v*50)/100)*100)/100,vence:fe,abonado:Math.max(0,ab-Math.round(v*50)/100)}];
  delete r.abonado; delete r.vence;
  _ecListo();
}
function ecCuotaAdd(k){ const r=_ecReg(k); if(!r||!r.cuotas) return; r.cuotas.push({concepto:'Cuota '+(r.cuotas.length+1),monto:0,vence:'',abonado:0}); _ecListo(); }
function ecCuotaSet(k,i,campo,v){
  const r=_ecReg(k); if(!r||!r.cuotas||!r.cuotas[i]) return;
  const f=(ecFilas(ECSEL).filas.find(x=>x.k===k))||{};
  if(campo==='monto'||campo==='abonado'){ const n=_ecNum(v,f.valor); r.cuotas[i][campo]=n==null?0:n; }
  else r.cuotas[i][campo]=(''+v).trim();
  _ecListo();
}
function ecCuotaDel(k,i){
  const r=_ecReg(k); if(!r||!r.cuotas) return;
  r.cuotas.splice(i,1);
  if(!r.cuotas.length){ delete r.cuotas; }
  else if(r.cuotas.length===1){ const q=r.cuotas[0]; r.abonado=+q.abonado||0; if(q.vence) r.vence=q.vence; delete r.cuotas; }
  _ecListo();
}
function ecLineaAdd(c){
  const id='ecx'+((typeof _gidNuevo==='function')?_gidNuevo().replace(/^sp/,''):Date.now().toString(36));
  ECX.push({id, cliente:c, pedido:'', equipo:'', proyecto:'', etd:'', valor:0, abonado:0, vence:'', nota:''});
  _ecListo();
}
function ecLineaDel(id){
  const x=ECX.find(y=>y.id===id); if(!x) return;
  if(!confirm('¿Borrar la línea "'+(x.pedido||'')+' '+(x.proyecto||'')+'"?')) return;
  ECX=ECX.filter(y=>y.id!==id); _ecListo();
}
function ecPlazo(c,v){ const n=Math.round(+v); if(!(n>=0)) return; if(!CLI[c]) CLI[c]={term:n,fifo:false}; CLI[c].term=n; _ecListo(); }

/* ---- la pantalla ---- */
function _ecCeldaNum(k,campo,val,extra){
  return '<input class="ec8-in'+(extra||'')+'" value="'+(val?_ec2(val):'')+'" placeholder="0.00" data-foco="ec-'+campo+'-'+esc4(k)+'"'
    +' title="Escribe el monto, o un porcentaje del valor (ej. 5%)" onchange="ecSet(\''+esc4(_ecQ(k))+'\',\''+campo+'\',this.value)">';
}
function _ecHTML(c){
  const {filas,sinPrecio}=ecFilas(c), t=ecTotales(c), plazo=_ecPlazo(c), interno=esInterno(c);
  const fila=f=>{
    const kq=esc4(_ecQ(f.k)), x=f.tipo==='x';
    const cls=f.mora>0?'mora':(f.saldo<=0.005?'pagado':'');
    const txt=(campo,val,ph)=>'<input class="ec8-in t" value="'+esc4(val||'')+'" placeholder="'+ph+'" data-foco="ec-'+campo+'-'+esc4(f.k)+'" onchange="ecSet(\''+kq+'\',\''+campo+'\',this.value)">';
    const venceCelda=f.cuotas
      ? (f.vence?_ecFmtD(f.vence):'—')
      : '<input type="date" class="ec8-in d'+(f.reg.vence?'':' auto')+'" value="'+_ecISO(f.vence)+'" data-foco="ec-vence-'+esc4(f.k)+'"'
        +' title="'+(f.reg.vence?'Fecha puesta a mano':'Automática: ETD + '+plazo+' días')+'" onblur="ecFechaSalir()" onchange="ecFechaCambio(this,\''+kq+'\',-1,\'vence\')">'
        +(f.reg.vence&&!x?'<a href="#" class="ec8-aviso" onclick="event.preventDefault();ecSet(\''+kq+'\',\'vence\',\'\')">automática</a>':'');
    let h='<tr class="'+cls+'">'
      +'<td>'+(x?txt('pedido',f.pedido,'referencia')+txt('equipo',f.equipo,'producto'):'<b>'+esc4(f.pedido)+'</b><small>'+esc4(f.equipo)+'</small>')+'</td>'
      +'<td>'+(x?txt('proyecto',f.proyecto,'proyecto'):esc4(f.proyecto)+(f.sinfac?'<span class="ec8-tag">sin facturar</span>':''))+'</td>'
      +'<td>'+(x?'<input type="date" class="ec8-in d" value="'+_ecISO(f.etd)+'" onblur="ecFechaSalir()" onchange="ecFechaCambio(this,\''+kq+'\',-1,\'etd\')">':(f.etd?_ecFmtD(f.etd):'<span style="color:var(--ink3)">Pendiente</span>'))+'</td>'
      +'<td class="r">'+(x?_ecCeldaNum(f.k,'valor',f.valor):_ec2(f.valor))+'</td>'
      +'<td class="r">'+(f.cuotas?_ec2(f.abonado):_ecCeldaNum(f.k,'abonado',f.abonado))+'</td>'
      +'<td class="r">'+(f.saldo<-0.005?'<span class="ec8-favor">'+_ec2(-f.saldo)+' a favor</span>':_ec2(Math.max(0,f.saldo)))+'</td>'
      +'<td>'+venceCelda+'</td>'
      +'<td class="r">'+(f.mora>0?'<span class="ec8-mora">'+f.mora+'</span>':(f.vence||f.cuotas?'0':'<span style="color:var(--ink3)">—</span>'))+'</td>'
      +'<td style="white-space:nowrap">'+(f.cuotas
          ?'<button class="ec8-b" onclick="ecCuotaAdd(\''+kq+'\')">+ cuota</button>'
          :'<button class="ec8-b" title="Partir en cuotas con su propia fecha y abono" onclick="ecCuotas(\''+kq+'\')">cuotas</button>')
        +(x?'<button class="ec8-x" title="Borrar línea" onclick="ecLineaDel(\''+kq+'\')">×</button>':'')+'</td></tr>';
    if(f.cuotas){
      f.cuotas.forEach(q=>{
        const qi=q.i, ccls=q.mora>0?'mora':(q.saldo<=0.005?'pagado':'');
        h+='<tr class="cuota '+ccls+'"><td colspan="2"><input class="ec8-in t" value="'+esc4(q.q.concepto||'')+'" placeholder="concepto" data-foco="ecq-c-'+qi+'-'+esc4(f.k)+'" onchange="ecCuotaSet(\''+kq+'\','+qi+',\'concepto\',this.value)"></td>'
          +'<td></td>'
          +'<td class="r"><input class="ec8-in" value="'+(q.monto?_ec2(q.monto):'')+'" placeholder="monto o %" data-foco="ecq-m-'+qi+'-'+esc4(f.k)+'" onchange="ecCuotaSet(\''+kq+'\','+qi+',\'monto\',this.value)"></td>'
          +'<td class="r"><input class="ec8-in" value="'+(q.abonado?_ec2(q.abonado):'')+'" placeholder="0.00" data-foco="ecq-a-'+qi+'-'+esc4(f.k)+'" onchange="ecCuotaSet(\''+kq+'\','+qi+',\'abonado\',this.value)"></td>'
          +'<td class="r">'+(q.saldo<-0.005?'<span class="ec8-favor">'+_ec2(-q.saldo)+' a favor</span>':_ec2(Math.max(0,q.saldo)))+'</td>'
          +'<td><input type="date" class="ec8-in d" value="'+esc4(q.q.vence||'')+'" onblur="ecFechaSalir()" onchange="ecFechaCambio(this,\''+kq+'\','+qi+',\'vence\')"></td>'
          +'<td class="r">'+(q.mora>0?'<span class="ec8-mora">'+q.mora+'</span>':(q.vence?'0':'—'))+'</td>'
          +'<td><button class="ec8-x" title="Quitar cuota" onclick="ecCuotaDel(\''+kq+'\','+qi+')">×</button></td></tr>';
      });
      if(Math.abs(f.sumaCuotas-f.valor)>0.01)
        h+='<tr class="cuota"><td colspan="9" class="ec8-aviso">Las cuotas suman '+_ec2(f.sumaCuotas)+' y el valor es '+_ec2(f.valor)+' (diferencia '+_ec2(f.valor-f.sumaCuotas)+')</td></tr>';
    }
    return h;
  };
  return '<div class="ec8-top"><div><div class="ec8-name">'+esc4(c)+'</div>'
      +'<div class="ec8-meta">'+(interno?'<span class="ec-tag-int">Cliente del grupo</span> · ':'')+'Estado de cuenta · corte '+_ecFmtD(TODAY)+' · USD · Plazo '
      +'<input value="'+plazo+'" onchange="ecPlazo(\''+esc4(_ecQ(c))+'\',this.value)" title="Días desde el ETD"> días desde ETD</div></div>'
    +'<div class="ec8-sp"></div>'
    +'<button class="ec8-b" onclick="ecLineaAdd(\''+esc4(_ecQ(c))+'\')">+ producto</button>'
    +'<button class="ec8-b" onclick="ecExcel(\''+esc4(_ecQ(c))+'\')">Excel</button>'
    +'<button class="ec8-b" onclick="ecPDF(\''+esc4(_ecQ(c))+'\')">PDF</button></div>'
    +'<div class="ec8-kpis">'
      +'<div class="ec8-k"><div class="l">Valor</div><div class="v">'+_ec2(t.valor)+'</div></div>'
      +'<div class="ec8-k"><div class="l">Abonado</div><div class="v ok">'+_ec2(t.abonado)+'</div></div>'
      +'<div class="ec8-k"><div class="l">Saldo pendiente</div><div class="v">'+_ec2(t.saldo)+'</div></div>'
      +'<div class="ec8-k"><div class="l">Vencido</div><div class="v '+(t.vencido>0.005?'mal':'')+'">'+_ec2(t.vencido)+'</div></div>'
      +(t.favor>0.005?'<div class="ec8-k"><div class="l">A favor del cliente</div><div class="v ok">'+_ec2(t.favor)+'</div></div>':'')
    +'</div>'
    +(function(){
      /* v1.8.3: los equipos que vienen de China arriba; lo que se vende aparte (inversores, estaciones…) en su propia sección */
      const fe=filas.filter(f=>f.tipo==='eq'), fx=filas.filter(f=>f.tipo==='x');
      const sub=(fs,txt)=>{ const v=fs.reduce((a,f)=>a+f.valor,0), ab=fs.reduce((a,f)=>a+f.abonado,0), sa=fs.reduce((a,f)=>a+Math.max(0,f.saldo),0);
        return '<tr class="tot"><td colspan="3">'+txt+'</td><td class="r">'+_ec2(v)+'</td><td class="r">'+_ec2(ab)+'</td><td class="r">'+_ec2(sa)+'</td><td colspan="3"></td></tr>'; };
      const cab=(c1,c3)=>'<thead><tr><th>'+c1+'</th><th>Proyecto</th><th>'+c3+'</th><th class="r">Valor</th><th class="r">Abonado</th><th class="r">Saldo</th><th>Vence</th><th class="r">Mora (días)</th><th></th></tr></thead>';
      return '<div class="ec8-sec">Equipos (trackers y shelters de China)</div>'
        +'<div class="ec8-wrap vscroll"><table class="ec8">'+cab('Pedido','ETD')+'<tbody>'
        +(fe.length?fe.map(fila).join('')+sub(fe,'Subtotal equipos'):'<tr><td colspan="9" style="color:var(--ink3);padding:14px">Ningún pedido de China con precio para este cliente. Ponle precio en la pestaña Precios.</td></tr>')
        +'</tbody></table></div>'
        +'<div class="ec8-sec">Otros productos · no vienen de China <span>no tocan la deuda con China ni el cupo Sinosure</span>'
          +'<button class="ec8-b" onclick="ecLineaAdd(\''+esc4(_ecQ(c))+'\')">+ producto</button></div>'
        +(fx.length?'<div class="ec8-wrap vscroll"><table class="ec8">'+cab('Referencia / producto','Entrega')+'<tbody>'+fx.map(fila).join('')+sub(fx,'Subtotal otros productos')+'</tbody></table></div>'
          :'<div class="ec8-vacio">Nada todavía. Con <b>+ producto</b> agregas lo que le vendas aparte (inversores, estaciones, fletes…). En Valor puedes escribir cantidad x precio, ej. 12x6608.</div>')
        +(fe.length&&fx.length?'<div class="ec8-gran">Total cliente: valor '+_ec2(t.valor)+' · abonado '+_ec2(t.abonado)+' · <b>saldo '+_ec2(t.saldo)+'</b></div>':'');
    })()
    +'<div class="ec8-pie">Vence = ETD + '+plazo+' días, salvo que pongas otra fecha. Sin ETD no corre mora. En Abonado y en las cuotas puedes escribir un monto o un porcentaje (ej. 5%).'
      +(sinPrecio.length?'<br><b>Sin precio, no aparecen:</b> '+sinPrecio.map(e=>esc4(e.derrame)+(e.proj?' ('+esc4(e.proj)+')':'')).join(', ')+'. Ponles precio en Precios.':'')+'</div>';
}

/* ---- lista de clientes y detalle ---- */
function _ecClientes(){
  return [...new Set([...Object.keys(CLI),...EQ.map(e=>e.cliente),...ECX.map(x=>x.cliente)])]
    .filter(c=>c&&c!=='Por asignar')
    .filter(c=>EQ.some(e=>e.cliente===c)||ECX.some(x=>x.cliente===c)||(CLI[c]&&CLI[c].interno));
}
renderClientes=_conLugar(function(){
  const list=document.getElementById('clList'), det=document.getElementById('clDetail'); if(!list||!det) return;
  const cs=_ecClientes().map(c=>({c,t:ecTotales(c)})).sort((a,b)=>b.t.saldo-a.t.saldo);
  const porAsignar=EQ.filter(e=>e.cliente==='Por asignar').length;
  if(!cs.length&&!porAsignar){ list.innerHTML='<div style="color:var(--ink3);font-size:13px;padding:14px">Sin clientes todavía.</div>'; det.innerHTML=''; return; }
  if(!ECSEL||!cs.some(x=>x.c===ECSEL)) ECSEL=cs.length?cs[0].c:null;
  list.innerHTML=cs.map(x=>'<div class="cl-item'+(x.c===ECSEL?' on':'')+'" onclick="selCli(\''+esc4(_ecQ(x.c))+'\',this)">'
      +'<div><div class="cn">'+esc4(x.c)+'</div><div class="cm">'+x.t.n+' línea(s)'+(x.t.vencido>0.005?' · <span style="color:var(--danger)">'+_ec2(x.t.vencido)+' vencido</span>':'')+'</div></div>'
      +'<div class="cbal"><b>'+_ec2(x.t.saldo)+'</b></div></div>').join('')
    +(porAsignar?'<div class="cl-item pend" onclick="navTo(\'precios\')"><div><div class="cn">Por asignar</div><div class="cm">'+porAsignar+' pedido(s) sin cliente</div></div><div class="cbal"><small style="color:var(--danger)">asignar</small></div></div>':'');
  selCliData(ECSEL);
});
selCliData=function(c){
  ECSEL=c; const det=document.getElementById('clDetail'); if(!det) return;
  if(!c){ det.innerHTML=''; return; }
  const a=document.activeElement, foco=a&&a.closest&&a.closest('#clDetail')?a.getAttribute('data-foco'):null;
  det.innerHTML=_ecHTML(c);
  if(foco){ const n=[...det.querySelectorAll('[data-foco]')].find(x=>x.getAttribute('data-foco')===foco); if(n&&n.focus) n.focus(); }
};

/* ---- v1.8.1 · registrar un abono: queda con fecha, se reparte solo y se puede deshacer ----
   ECA = [{id, cliente, fecha, usd, cop, trm, nota, aplicado:[{k, i, monto}]}]  (i = cuota, -1 = la fila) */
var ECA=[];
function _ecUnidades(c,soloK){
  const out=[];
  ecFilas(c).filas.forEach(f=>{
    if(soloK&&f.k!==soloK) return;
    if(f.cuotas) f.cuotas.forEach(q=>{ if(q.saldo>0.005) out.push({k:f.k,i:q.i,saldo:q.saldo,vence:q.vence,mora:q.mora}); });
    else if(f.saldo>0.005) out.push({k:f.k,i:-1,saldo:f.saldo,vence:f.vence,mora:f.mora});
  });
  /* lo más vencido primero; lo que no tiene fecha, al final */
  return out.sort((a,b)=>(b.mora-a.mora)||((a.vence?a.vence.getTime():9e15)-(b.vence?b.vence.getTime():9e15)));
}
function _ecSumar(k,i,m){
  const r=_ecReg(k); if(!r) return;
  if(i>=0&&r.cuotas&&r.cuotas[i]) r.cuotas[i].abonado=Math.round(((+r.cuotas[i].abonado||0)+m)*100)/100;
  else r.abonado=Math.round(((+r.abonado||0)+m)*100)/100;
}
function ecAbonoAplicar(c,a,soloK){
  let resto=Math.round(a.usd*100)/100; a.aplicado=[];
  _ecUnidades(c,soloK).forEach(u=>{ if(resto<=0.005) return; const m=Math.min(resto,Math.round(u.saldo*100)/100);
    _ecSumar(u.k,u.i,m); a.aplicado.push({k:u.k,i:u.i,monto:m}); resto=Math.round((resto-m)*100)/100; });
  if(resto>0.005){ /* sobra: queda a favor en la última línea tocada, o en la primera del cliente */
    const ult=a.aplicado[a.aplicado.length-1]||(()=>{const f=ecFilas(c).filas[0];return f?{k:f.k,i:f.cuotas?0:-1}:null;})();
    if(ult){ _ecSumar(ult.k,ult.i,resto); a.aplicado.push({k:ult.k,i:ult.i,monto:resto}); }
  }
  return a;
}

}
