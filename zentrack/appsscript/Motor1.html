/* Cómo se cuenta el cupo Sinosure que consume un pedido. Tres reglas, porque los archivos
   no usan una sola:
     'saldo'  → el saldo por pagar al fabricante (columna O). Es el 90% del tracker o el 80%
                del shelter una vez pagado el anticipo.
     'monto'  → el monto completo del pedido (columna M) mientras el pedido siga vivo.
     'andres' → como lo arma Andrés en la hoja Sinosure: monto completo mientras está en
                fábrica, y saldo por pagar cuando ya embarcó.  */
const CUPO_REGLAS={
  sinosure:'Lo que declara la hoja Sinosure de Andrés, pedido por pedido',
  saldo:'Saldo por pagar al fabricante (col. O)',
  monto:'Monto completo del pedido (col. M)',
  andres:'Al estilo de Andrés, calculado del ORDER REPORT (monto en fábrica · saldo si ya embarcó)'};
/* Lo que la hoja Sinosure le asigna a un pedido, menos los giros a China que hayas
   registrado después del corte (la hoja es una foto del día que Andrés la armó). */
function sinoDeclarado(e){
  const m=(CONCILIA&&CONCILIA.sinoPorDerrame)||null;
  if(!m) return null;
  const k=kOf(e);
  if(m[k]==null) return null;
  let base=m[k];
  /* si quieres cuadrar exacto con el archivo de Andrés, se vuelven a sumar los
     renglones que repiten una celda ya contada */
  if(CONFIG.contarDupSino) base+=(CONCILIA.sinoDupPorDerrame&&CONCILIA.sinoDupPorDerrame[k])||0;
  const girado=Math.max(0,(+e.cupoSaldo0||0)-(+e.cupoSaldo||0));
  return Math.max(0,base-girado);
}

/* Pedidos vivos que la hoja Sinosure todavía no lista: no cuentan en el consumo declarado,
   pero son plata que va a caer al cupo apenas Andrés los cargue. */
function sinCargarAlCupo(mfg){
  const m=(CONCILIA&&CONCILIA.sinoPorDerrame)||null; if(!m) return [];
  return EQ.filter(e=>e.mfg===mfg&&(+e.cupoSaldo||0)>0.5&&m[kOf(e)]==null&&!e.sinoManual)
           .map(e=>({e,monto:consumoEq(e,mfg,'andres')})).filter(x=>x.monto>0.5)
           .sort((a,b)=>b.monto-a.monto);
}
/* Pedidos donde tú decidiste a mano si entran o no al cupo, pasando por encima de la hoja */
function sinoDecididos(mfg){
  return EQ.filter(e=>e.mfg===mfg&&e.sinoManual)
           .map(e=>({e,manual:e.sinoManual,monto:consumoEq(e,mfg)}));
}
/* Marcar/desmarcar un pedido: 'si' entra al cupo, 'no' no entra, '' vuelve a la hoja */
function setSinoManual(derrame,mfg,val){
  const v=(val==='si'||val==='no')?val:null;
  EQ.forEach(e=>{ if(e.derrame===derrame&&e.mfg===mfg) e.sinoManual=v; });

      :v==='no'?'<b>'+derrame+'</b> queda fuera del cupo Sinosure (decisión manual)'
      :'<b>'+derrame+'</b> vuelve a lo que diga la hoja Sinosure');
}

// consumo de cupo de un equipo = saldo del cupo Sinosure, LEÍDO del order report (col 14)
function consumoEq(e,mfg,regla){
  mfg=mfg||e.mfg;
  if(RANK[e.st] < RANK[CONFIG[mfg].reserveFrom]) return 0;    // aún no reserva según la regla
  if(e.sinoManual==='no') return 0;        // marcado a mano: este pedido NO entra al cupo
  if(e.pctOverride!=null) return (+e.cupoMonto||e.mfgAmt||0)*e.pctOverride;   // excepción manual
  const O=(e.cupoSaldo!=null)?(+e.cupoSaldo||0):((e.antSaldo||0)+(e.balSaldo||0));
  const M=(e.cupoMonto!=null)?(+e.cupoMonto||0):(+e.mfgAmt||0);
  if(O<=0.5) return 0;                                         // pagado del todo: libera el cupo
  let r=regla||CONFIG.cupoRegla||'sinosure';
  if(r==='sinosure'){
    const d=sinoDeclarado(e);
    if(d!=null) return d;
    /* marcado a mano como "sí entra": la hoja todavía no lo lista, pero lo contamos
       como lo contaría Andrés (monto en fábrica, saldo si ya embarcó) */
    if(e.sinoManual==='si') r='andres';
    /* sin hoja Sinosure cargada no hay nada que declarar: se cae al cálculo del ORDER REPORT */
    else if(!(CONCILIA&&CONCILIA.sinoPorDerrame)) r='andres';
    else return 0;                    /* Andrés todavía no lo carga al cupo */
  }
  if(r==='monto') return M;
  if(r==='andres') return isShipped(e)?O:M;
  return O;
}

let ORD=[]; // órdenes
function O(id,mfg,cliente,entidad,equipos){

  });
  const o={id,mfg,cliente,entidad,equipos}; ORD.push(o); return o;
}

/* ================================================================
   PUENTE DE CAJA — por pedido: lo que YO le debo a China contra lo que
   el CLIENTE me debe a mí por ese mismo pedido. Es el mismo pedido visto
   de los dos lados; el neto es lo que ese pedido le hace a mi caja.
   ================================================================ */
/* Lo que le debo a China por un pedido, partido en sus dos cuentas */
function deboChina(e){
  const cupo=(+e.cupoSaldo||0);                       /* al fabricante (col. O) — lo cubre Sinosure */
  const otros=(+e.otrosSaldo||0);                     /* a Jingwei, Restar, Wenzhong, Qiyuan (col. R) — fuera del cupo */
  const receptor=CONFIG[e.mfg]?CONFIG[e.mfg].receptor:e.mfg;
  return {cupo,otros,total:cupo+otros,receptor};
}
/* Fecha límite del pedido: la que puso Andrés en PAGOS PRIORITARIOS manda;
   si no la trae, se estima con el BL y el plazo del fabricante. */
function limiteChina(e){
  if(e.limitePago) return {fecha:e.limitePago, fuente:e.limiteFuente||'del archivo'};
  if(isShipped(e)&&e.bl) return {fecha:addD(e.bl,CONFIG[e.mfg].dias), fuente:'BL + '+CONFIG[e.mfg].dias+' días'};
  if(e.etd) return {fecha:addD(e.etd,CONFIG[e.mfg].dias), fuente:'ETD + '+CONFIG[e.mfg].dias+' días (estimado)'};
  return {fecha:null, fuente:null};
}
/* Lo que me debe el cliente por ese pedido: hitos del cliente interno, o los
   hitos pendientes de las facturas del cliente externo vinculadas al pedido. */
function meDebenEq(e){
  if(esInterno(e.cliente)) return hitosEqInterno(e).map(h=>({lbl:h.lbl,monto:h.pend,fecha:h.fecha,vencido:h.vencido,estimado:!(+e.precioVenta>0)}));
  const out=[];
  FACT.filter(f=>f.cliente===e.cliente&&(f.eqRefs||[]).indexOf(e.derrame)>=0).forEach(f=>{
    hitosResueltos(f).forEach(h=>{ if(h.pend>0.01) out.push({lbl:f.num+' · '+h.etiq,monto:h.pend,fecha:h.fecha,vencido:h.fecha&&h.fecha<TODAY,estimado:false}); });
  });
  return out;
}
function puenteEq(e,evs){
  const debo=deboChina(e), lim=limiteChina(e);
  const mios=(evs||pagosPend()).filter(p=>p.eq===e);
  const venc=mios.filter(p=>p.fecha<TODAY).reduce((s,p)=>s+p.monto,0);
  const cobros=meDebenEq(e), entra=cobros.reduce((s,h)=>s+h.monto,0);
  const prox=cobros.filter(h=>h.fecha).sort((a,b)=>a.fecha-b.fecha)[0];
  return {e, debo, limite:lim.fecha, limiteFuente:lim.fuente, eventos:mios, vencidoMonto:venc,
    vencido:venc>0.5,
    dias:lim.fecha?days(TODAY,lim.fecha):null,
    cobros, entra, cobroProx:prox?prox.fecha:null, neto:entra-debo.total,
    sinPrecio:esInterno(e.cliente)&&!(+e.precioVenta>0)};
}
function puente(){ const evs=pagosPend(); return EQ.map(e=>puenteEq(e,evs)).filter(p=>p.debo.total>0.5||p.entra>0.5); }
/* Totales del puente dentro de una ventana de días (null = todo) */
function puenteTot(dias){
  const lim=dias==null?null:addD(TODAY,dias);
  let debo=0,cupo=0,otros=0,entra=0,vencido=0,vencidoCobro=0,sinPrecio=0;
  puente().forEach(p=>{
    const dentro = lim==null || (p.limite && p.limite<=lim);
    if(dentro){debo+=p.debo.cupo;cupo+=p.debo.cupo;}
    /* los otros componentes se le pagan a Jingwei, Restar y compañía apenas se monta el pedido:
       no tienen plazo, se deben ya, así que entran en cualquier ventana */
    debo+=p.debo.otros; otros+=p.debo.otros;
    vencido+=p.vencidoMonto;
    if(p.sinPrecio) sinPrecio++;
    p.cobros.forEach(h=>{ const d=lim==null||(h.fecha&&h.fecha<=lim); if(d)entra+=h.monto; if(h.vencido)vencidoCobro+=h.monto; });
  });
  return {debo,cupo,otros,entra,vencido,vencidoCobro,sinPrecio,neto:entra-debo};
}

/* ---- Conciliación del cupo contra la hoja Sinosure de Andrés ---- */

function cupoConcilia(mfg){
  const eqs=EQ.filter(e=>e.mfg===mfg);
  const por=r=>eqs.reduce((s,e)=>s+consumoEq(e,mfg,r),0);
  const decl=CONCILIA&&CONCILIA.sino?(mfg==='Singsun'?CONCILIA.sino.totalSingsun:CONCILIA.sino.totalEagle):null;
  const reglas={saldo:por('saldo'),monto:por('monto'),andres:por('andres')};
  let mejor=null,mejorD=Infinity;
  if(decl!=null) Object.keys(reglas).forEach(r=>{const d=Math.abs(reglas[r]-decl);if(d<mejorD){mejorD=d;mejor=r;}});
  return {usado:por(), reglas, declarado:decl, mejor, difMejor:decl==null?null:mejorD,
    cupo:CUPO[mfg], techoDeclarado:CONCILIA&&CONCILIA.sino?CONCILIA.sino.cupos[mfg]:null};
}

/* ---- derivaciones de cupo ---- */
function cargaViva(mfg){ return EQ.filter(e=>e.mfg===mfg).reduce((s,e)=>s+consumoEq(e,mfg),0); }
function disponible(mfg){ return CUPO[mfg]-cargaViva(mfg); }

/* ---- facturas / cartera (por derrame embarcado) ---- */
// factura COP del derrame = valor de venta ≈ (mfgAmt/cobertura) * TRM * margen
const MARGEN=1.28;
function derrames(){ // agrupa equipos embarcados por derrame
  const m={};
  EQ.filter(e=>isShipped(e)&&e.derrame).forEach(e=>{(m[e.derrame]=m[e.derrame]||{id:e.derrame,ordenId:e.ordenId,cliente:e.cliente,mfg:e.mfg,bl:e.bl,eq:[]}).eq.push(e);});
  return Object.values(m);
}
// clientes: cada uno con su plazo (días que le transmitimos) y su regla de aplicación
const CLI_DEF={Solenium:{term:55,fifo:true}};   // Solenium reparte FIFO; se le transmiten 55 días (nos guardamos gávela)
let CLI={};
[...new Set(ORD.map(o=>o.cliente))].forEach(c=>{CLI[c]=CLI_DEF[c]||{term:60,fifo:false};});
let CLIENTES=Object.keys(CLI);
function addCliente(name,term,fifo,interno){name=(name||'').trim();if(!name||CLI[name])return false;CLI[name]={term:+term||60,fifo:!!fifo,interno:!!interno};CLIENTES=Object.keys(CLI);return true;}
function esInterno(cli){return CLI[cli]&&CLI[cli].interno;}
const esFIFO=cli=>!!(CLI[cli]&&CLI[cli].fifo);
// cada factura fija SU propia TRM el día que se emite; el COP es la verdad contable, el USD = COP/TRM de esa factura
// ============ FACTURAS (v0.6 — USD-first, con líneas y cronograma) ============
// Estructura de cada factura:
// { num, cliente, nit, fecha:Date, plazo:días, trmRef, lineas:[{cod,desc,usd,pass}], hitos:[{etiq,pct,trigger,desc,fecha:Date,pagado:0}], eqRefs:[derrame], proj }
let FACT=[];
function totalFac(f){ return (f.lineas||[]).reduce((s,l)=>s+(+l.usd||0),0); }

function pagadoFac(f){ return (f.hitos||[]).reduce((s,h)=>s+(+h.pagado||0),0); }
function saldoFac(f){ return totalFac(f)-pagadoFac(f); }
function fechaHito(h, blDate){
  if(h.trigger==='confirm') return h.fecha||new Date();
  if(h.trigger==='despacho') return h.fecha||blDate||null;
  const m=(h.trigger||'').match(/^bl\+(\d+)d$/);
  if(m && blDate) return addD(blDate, +m[1]);
  return h.fecha||null;
}
// resuelve las fechas de los hitos de una factura (mezclando triggers con el BL del primer equipo vinculado)
function hitosResueltos(f){
  const bl=(f.eqRefs||[]).map(d=>{const eq=EQ.find(e=>e.derrame===d);return eq&&eq.bl;}).filter(Boolean).sort((a,b)=>a-b)[0]||null;
  return (f.hitos||[]).map(h=>{const fec=fechaHito(h,bl);const pend=(+f.total||totalFac(f))*(h.pct/100)-(h.pagado||0);
    return {...h, fecha:fec, monto:(totalFac(f)*(h.pct/100)), pend:Math.max(0,pend), bl};});
}
/* ============ MOTOR CLIENTE INTERNO (Solenium: espejo de China a precio de venta) ============ */
function pctAnticipoCliente(mfg){ return mfg==='Singsun'?0.10:0.20; }
function pctBalanceCliente(mfg){ return 1-pctAnticipoCliente(mfg); }
function precioVenta(e){ return +e.precioVenta||0; }
function anticipoCli(e){ return precioVenta(e)*pctAnticipoCliente(e.mfg); }
function balanceCli(e){ return precioVenta(e)*pctBalanceCliente(e.mfg); }
function logisticaTotal(e){ return (+e.logisticaFlete||0)+(+e.logisticaCobertura||0); }

/* Genera los hitos que Solenium debe pagar por CADA equipo del order report.
   Regla confirmada por Esteban (TARJETA):
   - Anticipo: cobrable DESDE que el equipo aparece en el order report (independiente de China).
   - Balance: cobrable cuando el equipo tiene BL, mismo plazo que Zentrack tiene con China.
   - Logística (flete+cobertura estimada a mano): cobrable cuando el equipo tiene BL. */
function hitosEqInterno(e){
  const hs=[]; const pv=precioVenta(e); if(pv<=0) return hs;
  /* Anticipo — aparece mientras haya pendiente (checkbox 'paid' fuerza pagado=monto) */
  const antMonto=anticipoCli(e);
  if(antMonto>0){
    const pagado=e.antClientePaid?antMonto:(+e.antClientePagado||0);
    const pend=Math.max(0,antMonto-pagado);
    if(pend>0.01) hs.push({tipo:'anticipo', monto:antMonto, pagado, pend, fecha:TODAY, vencido:true, eq:e, lbl:'Anticipo '+Math.round(pctAnticipoCliente(e.mfg)*100)+'%'});
  }
  /* Balance — aparece cuando hay BL y pendiente > 0 */
  const balMonto=balanceCli(e);
  if(balMonto>0 && e.bl){
    const dias=CONFIG[e.mfg]?CONFIG[e.mfg].dias:60;
    const venceBal=addD(e.bl,dias);
    const pagado=e.balClientePaid?balMonto:(+e.balClientePagado||0);
    const pend=Math.max(0,balMonto-pagado);
    if(pend>0.01) hs.push({tipo:'balance', monto:balMonto, pagado, pend, fecha:venceBal, vencido:venceBal<TODAY, eq:e, lbl:'Balance '+Math.round(pctBalanceCliente(e.mfg)*100)+'%'});
  }
  /* Logística — aparece cuando hay BL y pendiente > 0 */
  const logMonto=logisticaTotal(e);
  if(logMonto>0 && e.bl){
    const venceLog=addD(e.bl,+CONFIG.logDias||30);
    const pagado=e.logPaid?logMonto:(+e.logPagado||0);
    const pend=Math.max(0,logMonto-pagado);
    if(pend>0.01) hs.push({tipo:'logistica', monto:logMonto, pagado, pend, fecha:venceLog, vencido:venceLog<TODAY, eq:e, lbl:'Logística (flete + cobertura)'});
  }
  return hs;
}
function hitosCliInterno(cli){
  return EQ.filter(e=>e.cliente===cli).flatMap(e=>hitosEqInterno(e)).filter(h=>h.pend>0.01);
}

/* Pago mínimo necesario — dos motores según el tipo de cliente. */
function pagoMinCliente(cli){
  const ventana=+CONFIG.pagoMinDias||15;
  const lim=addD(TODAY,ventana);
  if(esInterno(cli)){
    /* Interno: TODOS los anticipos no pagados + balances/logística vencidos o próximos + otros componentes pendientes */
    const hs=hitosCliInterno(cli);
    const anticip=hs.filter(h=>h.tipo==='anticipo').reduce((s,h)=>s+h.pend,0);
    const otrosVent=hs.filter(h=>h.tipo!=='anticipo' && h.fecha && h.fecha<=lim).reduce((s,h)=>s+h.pend,0);
    /* Otros componentes (proveedores externos) — obligatorio, se paga de inmediato al montar pedido */
    const otrosComp=equiposCliente(cli).filter(e=>e.mfg==='Singsun').reduce((s,e)=>s+(+e.otrosSaldo||0),0);
    return {total:anticip+otrosVent+otrosComp, anticipo:anticip, otrosComp:otrosComp, vencido:hs.filter(h=>h.tipo!=='anticipo' && h.vencido).reduce((s,h)=>s+h.pend,0), proximo:hs.filter(h=>h.tipo!=='anticipo' && !h.vencido && h.fecha && h.fecha<=lim).reduce((s,h)=>s+h.pend,0)};
  }
  /* Externo: hitos de la factura, vencidos + próximos en ventana */
  let venc=0, prox=0;
  FACT.filter(f=>f.cliente===cli).forEach(f=>{
    hitosResueltos(f).forEach(h=>{
      if(h.pend<=0 || !h.fecha) return;
      if(h.fecha<TODAY) venc+=h.pend;
      else if(h.fecha<=lim) prox+=h.pend;
    });
  });
  return {total:venc+prox, vencido:venc, proximo:prox, anticipo:0};
}

function saldoCliente(cli){ return FACT.filter(f=>f.cliente===cli).reduce((s,f)=>s+saldoFac(f),0); } // USD (verdad)


function moraCliente(cli){
  return FACT.filter(f=>f.cliente===cli).reduce((s,f)=>{
    hitosResueltos(f).forEach(h=>{ if(h.pend>0 && h.fecha && h.fecha<TODAY) s+=h.pend; });
    return s;
  },0);
}
function carteraCliente(cli){
  return FACT.filter(f=>f.cliente===cli).sort((a,b)=>a.fecha-b.fecha).map(f=>{
    const hr=hitosResueltos(f);const proxHito=hr.filter(h=>h.pend>0).sort((a,b)=>(a.fecha||9e15)-(b.fecha||9e15))[0];
    return {...f, hitosR:hr, total:totalFac(f), saldo:saldoFac(f), pagado:pagadoFac(f), proximo:proxHito};
  });
}

function applyPago(p){p.aps.forEach(a=>{
  if(p.tipo==='in'){
    /* Pago a HITO INTERNO (Solenium) */
    if(a.ieq!=null){
      const e=EQ[a.ieq]; if(!e) return;
      const fld=a.kind==='ant'?'antClientePagado':(a.kind==='bal'?'balClientePagado':'logPagado');
      e[fld]=(+e[fld]||0)+a.monto;
      return;
    }
    /* Pago a FACTURA (externo) */
    const f=FACT.find(x=>x.num===a.ref);if(!f)return;
    let rem=a.monto;
    const hs=hitosResueltos(f).filter(h=>h.pend>0).sort((x,y)=>(x.fecha||9e15)-(y.fecha||9e15));
    for(const hr of hs){if(rem<=0)break;const hitoOrig=f.hitos.find(h=>h.etiq===hr.etiq);if(!hitoOrig)continue;const apl=Math.min(rem,hr.pend);hitoOrig.pagado=(hitoOrig.pagado||0)+apl;rem-=apl;}
  }else{
    /* Pago a CHINA */
    const e=EQ[a.eqI];if(e){const apl=Math.min(a.monto,a.kind==='ant'?e.antSaldo:e.balSaldo);a.apl=apl;
      if(a.kind==='ant')e.antSaldo=Math.max(0,e.antSaldo-apl);else e.balSaldo=Math.max(0,e.balSaldo-apl);
      if(e.cupoSaldo!=null){e.cupoSaldo=Math.max(0,e.cupoSaldo-apl);e.cupoPagado=(+e.cupoPagado||0)+apl;e.totalSaldo=Math.max(0,(+e.totalSaldo||0)-apl);e.totalPagado=(+e.totalPagado||0)+apl;}}
  }
});if(p.tipo==='out')syncFlags();}
function reversePago(id){const p=PAGOS.find(x=>x.id===id);if(!p||p.rev)return;p.aps.forEach(a=>{
  if(p.tipo==='in'){
    if(a.ieq!=null){
      const e=EQ[a.ieq]; if(!e) return;
      const fld=a.kind==='ant'?'antClientePagado':(a.kind==='bal'?'balClientePagado':'logPagado');
      e[fld]=Math.max(0,(+e[fld]||0)-a.monto);
      return;
    }
    const f=FACT.find(x=>x.num===a.ref);if(!f)return;
    let rem=a.monto;
    const hs=(f.hitos||[]).slice().reverse();
    for(const h of hs){if(rem<=0)break;const dev=Math.min(rem,h.pagado||0);h.pagado=(h.pagado||0)-dev;rem-=dev;}
  }else{
    if(p.absorbido) return;   /* ya reflejado en un corte posterior del order report: no se toca el saldo */
    const e=EQ[a.eqI];if(e){const apl=a.apl!=null?a.apl:a.monto;if(a.kind==='ant')e.antSaldo+=apl;else e.balSaldo+=apl;
      if(e.cupoSaldo!=null){e.cupoSaldo+=apl;e.cupoPagado=Math.max(0,(+e.cupoPagado||0)-apl);e.totalSaldo=(+e.totalSaldo||0)+apl;e.totalPagado=Math.max(0,(+e.totalPagado||0)-apl);}}
  }
});p.rev=true;if(p.tipo==='out')syncFlags();}
function registrarPago(p){p.id=PID++;p.ts=new Date();PAGOS.push(p);applyPago(p);}

/* ---- LO QUE LE DEBO A CHINA Y CUÁNDO — una sola definición para todo el sistema ----
   Por cada pedido: el anticipo que falte, el balance del cupo y los otros componentes.
   anticipo + balance = saldo del cupo (col. O); + otros componentes = saldo total a China (col. U). */
function pagosPend(){
  const ev=[];
  EQ.forEach(e=>{
    const lim=limiteChina(e).fecha;
    const ant=+e.antSaldo||0, bal=+e.balSaldo||0, otros=+e.otrosSaldo||0;
    if(ant>0.5) ev.push({tipo:e.mfg==='Singsun'?'nexus':'eagle',mfg:e.mfg,
      fecha:(RANK[e.st]>=RANK.finished?(e.prodFin||e.etd||TODAY):(e.prodFin||e.etd||lim||TODAY)),monto:ant,eq:e});
    if(bal>0.5) ev.push({tipo:'balance',mfg:e.mfg,fecha:lim||e.etd||TODAY,monto:bal,eq:e});
    if(otros>0.5) ev.push({tipo:'otros',mfg:e.mfg,fecha:TODAY,monto:otros,eq:e});
  });
  return ev.sort((a,b)=>a.fecha-b.fecha);
}

function squarify(items,x0,y0,w0,h0){
  const total=items.reduce((s,i)=>s+i.value,0)||1;
  const sc=items.map(i=>({...i,area:i.value/total*(w0*h0)})).sort((a,b)=>b.area-a.area);
  const out=[];
  const worst=(row,len)=>{const s=row.reduce((a,b)=>a+b.area,0);const mx=Math.max(...row.map(r=>r.area));const mn=Math.min(...row.map(r=>r.area));return Math.max((len*len*mx)/(s*s),(s*s)/(len*len*mn));};
  (function place(ch,x,y,w,h){if(!ch.length)return;const len=Math.min(w,h);let row=[],i=0;
    while(i<ch.length){const nr=row.concat(ch[i]);if(row.length===0||worst(nr,len)<=worst(row,len)){row=nr;i++;}else break;}
    const ra=row.reduce((a,b)=>a+b.area,0),th=ra/len;let off=0;
    if(w>=h){row.forEach(c=>{const ch2=c.area/th;out.push({...c,x,y:y+off,w:th,h:ch2});off+=ch2;});place(ch.slice(row.length),x+th,y,w-th,h);}
    else{row.forEach(c=>{const cw=c.area/th;out.push({...c,x:x+off,y,w:cw,h:th});off+=cw;});place(ch.slice(row.length),x,y+th,w,h-th);}
  })(sc,x0,y0,w0,h0);
  return out;
}
const NS='http://www.w3.org/2000/svg';

function clip(s,w){const m=Math.floor((w-14)/6.3);return s.length>m?s.slice(0,Math.max(1,m-1))+'…':s;}

function drawTreemap(mfg){
  const svg=document.getElementById('tm'+mfg);svg.innerHTML='';
  const eqs=EQ.filter(e=>e.mfg===mfg&&consumoEq(e,mfg)>0);
  const groups={};
  eqs.forEach(e=>{
    let key,glabel;
    if(tmMode==='orden'){key='O:'+e.ordenId;glabel='Orden '+e.ordenId;}
    else{const p=projOf(e);key=p?('P:'+p):'__sin';glabel=p||'Sin proyecto asignado';}
    (groups[key]=groups[key]||{key,glabel,eq:[]}).eq.push(e);
  });
  const arr=Object.values(groups).map(g=>({...g,kind:'group',value:g.eq.reduce((s,e)=>s+consumoEq(e,mfg),0)}));
  const committed=arr.reduce((s,g)=>s+g.value,0),cupo=CUPO[mfg];
  const L1=arr.slice();
  if(committed<=cupo)L1.push({kind:'avail',value:cupo-committed});else L1.push({kind:'over',value:committed-cupo});
  squarify(L1,0,0,560,300).forEach(g=>{
    if(g.kind!=='group'){
      const gp=2,x=g.x+gp,y=g.y+gp,w=g.w-2*gp,hh=g.h-2*gp,av=g.kind==='avail',grp=mk('g',{});
      grp.appendChild(mk('rect',{x,y,width:w,height:hh,fill:av?'#E7F1EC':'#F3DBD8',stroke:av?'#B7D4C9':'#E3B4AE','stroke-width':1,rx:2}));
      if(w>60&&hh>28){grp.appendChild(tx(x+9,y+19,av?'Disponible':'Sobrecupo',av?'#2E6E5A':'#B3261E',11.5,600));if(hh>42)grp.appendChild(tx(x+9,y+35,fmtUSDs(g.value),av?'#2E6E5A':'#B3261E',11,600,.95));}
      tip(grp,`<b>${av?'Cupo disponible':'Sobrecupo — comprometido por encima del cupo'}</b><br><span class="num">${fmtUSD(g.value)}</span>`);
      svg.appendChild(grp);return;
    }
    // contenedor visible del grupo (orden o proyecto)
    const og=3.5,gx=g.x+og,gy=g.y+og,gw=Math.max(0,g.w-2*og),gh=Math.max(0,g.h-2*og);
    svg.appendChild(mk('rect',{x:gx,y:gy,width:gw,height:gh,fill:'#FBFBFC',stroke:'#C4C8CE','stroke-width':1,rx:3}));
    const showHead=gh>36&&gw>66, headH=showHead?16:0;
    if(showHead) svg.appendChild(tx(gx+7,gy+12,clip(g.glabel,gw-8),'#6A6E73',10.5,700));
    const ix=gx+4,iy=gy+headH+2,iw=Math.max(0,gw-8),ih=Math.max(0,gh-headH-6);
    const single=g.eq.length===1;
    squarify(g.eq.map(e=>({e,value:consumoEq(e,mfg)})),ix,iy,iw,ih).forEach(u=>{
      const p=1.4,x=u.x+p,y=u.y+p,w=Math.max(0,u.w-2*p),h=Math.max(0,u.h-2*p),e=u.e;
      const grp=mk('g',{});
      grp.appendChild(mk('rect',{x,y,width:w,height:h,fill:eqColor(e),rx:1.5}));
      if(!e.antPaid&&w>10) grp.appendChild(mk('rect',{x,y,width:w,height:Math.min(3,h),fill:'#FD9C10'}));
      const tc=eqTextDark(e)?'#17181A':'#fff';
      const label = tmMode==='orden' ? e.proj : (projOf(e)||('Orden '+e.ordenId+(e.derrame?' · '+e.derrame:'')));
      const showLbl = !(showHead&&single);           // si el header ya dice el nombre y es único, no repetir
      if(w>52&&h>24){ let yy=y+16; if(showLbl){grp.appendChild(tx(x+7,yy,clip(label,w),tc,10.5,600));yy+=15;} grp.appendChild(tx(x+7,yy,fmtUSDs(u.value),tc,10,500,.85)); }
      grp.style.cursor='pointer';grp.addEventListener('click',()=>openPanel(e.ordenId));
      const proj=projOf(e);
      tip(grp,`<b>${proj||'Sin proyecto asignado'}</b><br>Orden ${e.ordenId}${e.derrame?' · derrame '+e.derrame:''} · ${e.cliente}<br>${STAGE[e.st]}${e.antPaid?'':' · <span style="color:#ffcf8f">falta anticipo</span>'}<br>Consume <span class="num">${fmtUSD(u.value)}</span>${isOver(e)?'<br><span style="color:#ff9a92">balance vencido</span>':''}`);
      svg.appendChild(grp);
    });
  });
  const pct=committed/cupo*100, disp=cupo-committed;
  document.getElementById('cap'+mfg).innerHTML = (disp>=0
    ? `<b>${fmtUSD(disp)}</b> disponibles · ${pct.toFixed(0)}% del cupo usado (${fmtUSDs(cupo)})`
    : `<b class="capover">Sobregirado ${fmtUSDs(-disp)}</b> · ${pct.toFixed(0)}% del cupo (${fmtUSDs(cupo)}) · sin disponible`)
    + notaSinCargar(mfg);
}

/* ---------- Conciliación del cupo con la hoja Sinosure de Andrés ---------- */
/* Aviso bajo cada treemap: pedidos vivos que la hoja Sinosure todavía no carga */
function notaSinCargar(mfg){
  let out='';
  const pend=sinCargarAlCupo(mfg);
  if(pend.length){const sp=pend.reduce((s,x)=>s+x.monto,0);
    out+=` · <b style="color:var(--dato-debo)">no dibujado: ${fmtUSDs(sp)}</b> en ${pend.length} pedido(s) que Andrés aún no carga a la hoja Sinosure (${pend.map(x=>x.e.derrame+' '+fmtUSDs(x.monto)).join(', ')}). Decide pedido por pedido en el panel de la orden.`;}
  /* lo que tú decidiste a mano, para que no quede escondido */
  const dec=sinoDecididos(mfg);
  if(dec.length){
    const si=dec.filter(d=>d.manual==='si'), no=dec.filter(d=>d.manual==='no');
    const part=[];
    if(si.length) part.push(`entran a mano ${si.map(d=>d.e.derrame+' '+fmtUSDs(d.monto)).join(', ')}`);
    if(no.length) part.push(`excluidos a mano ${no.map(d=>d.e.derrame+' '+fmtUSDs(+d.e.cupoSaldo||0)).join(', ')}`);
    out+=` · <b>decisión tuya:</b> ${part.join(' · ')}`;
  }
  return out;
}

/* Control por pedido: ¿su saldo entra al cupo Sinosure?  La hoja de Andrés es el default;
   esto es para los pedidos que él todavía no ha cargado, como el PO#16. */
function sinoCtl(e){
  if(!e.derrame) return '';
  const m=(CONCILIA&&CONCILIA.sinoPorDerrame)||null;
  const hoja=m?m[kOf(e)]:null;
  const v=e.sinoManual||'';
  const cls=v==='si'?'sinosi':(v==='no'?'sinono':'');
  const nota=v?'a mano':(hoja!=null?'de la hoja':(m?'la hoja no lo lista':'sin hoja'));
  const opts=[['','hoja'],['si','sí entra'],['no','no entra']];
  return `<div class="sinorow"><b title="${nota}">Sinosure</b><select class="${cls}" title="¿El saldo de este pedido entra al cupo Sinosure? Hoy: ${nota}" onchange="setSinoManual('${(''+e.derrame).replace(/'/g,"")}','${e.mfg}',this.value)">`
    +opts.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')+`</select></div>`;
}

      <div class="ec-sum-card"><div class="l">${interno?'Comprometido':'Facturado'}</div><div class="v">US$ ${fmtUSDs(interno?eqsInt.reduce((s,h)=>s+h.monto,0)+eqsInt.reduce((s,h)=>s+h.pagado,0):usdFacT)}</div>${!interno?`<div class="lc">${rows.length} factura(s)</div>`:`<div class="lc">${eqs.length} equipo(s)</div>`}</div>
      <div class="ec-sum-card"><div class="l">Cobrado</div><div class="v cok">US$ ${fmtUSDs(interno?eqsInt.reduce((s,h)=>s+h.pagado,0):usdPag)}</div></div>
      <div class="ec-sum-card"><div class="l">Saldo real</div><div class="v ${(interno?eqsInt.reduce((s,h)=>s+h.pend,0):usdSal)>0.01?'cwarn':''}">US$ ${fmtUSDs(interno?eqsInt.reduce((s,h)=>s+h.pend,0):usdSal)}</div>${mora>0.01?`<div class="lc" style="color:var(--z-red)">Mora US$ ${fmtUSDs(mora)}</div>`:''}</div>
      ${df?`<div class="ec-sum-card"><div class="l">Desfase de financiación</div><div class="v" style="color:${df.neto>30?'var(--z-red)':(df.neto>0?'var(--z-orange)':'var(--z-green)')}">${df.neto>0?'+':''}${Math.round(df.neto)}d</div><div class="lc">cliente ${Math.round(df.plazoCliente)}d · China ${Math.round(df.plazoChina)}d</div></div>`:''}
    </div>

    ${interno?`
    <div class="ec-block">
      <div class="ec-block-h"><span class="ec-block-t">Necesidades de pago por equipo</span><small>Motor: espejo de China valorado a precio de venta que Zentrack le pactó con ${c}.</small></div>
      ${eqsInt.length?`<table class="ec-tabla int"><thead><tr>
        <th class="l">Equipo</th><th class="l">Concepto</th><th class="r">Monto USD</th><th class="c">Fecha</th><th class="r">Saldo USD</th>
      </tr></thead><tbody>
      ${eqsInt.sort((a,b)=>(a.fecha||9e15)-(b.fecha||9e15)).map(h=>`<tr class="${h.vencido?'late':''} ${h.tipo}">
        <td class="l"><b>${h.eq.derrame||'—'}</b><small>${nombreEq(h.eq)} · ${h.eq.mfg}${h.eq.blNo?` · BL ${h.eq.blNo}`:''}</small></td>
        <td class="l">${h.lbl}${h.tipo==='balance'?`<small>${CONFIG[h.eq.mfg].dias}d desde BL ${fmtD(h.eq.bl)}</small>`:''}${h.tipo==='logistica'?`<small>${CONFIG.logDias||30}d desde BL</small>`:''}${h.tipo==='anticipo'?'<small>cobrable ya · pedido existe</small>':''}</td>
        <td class="r">US$ ${fmtUSDs(h.monto)}</td>
        <td class="c">${h.tipo==='anticipo'?'<span class="tag-oblig">obligatorio</span>':(h.fecha?fmtD(h.fecha):'—')}${h.vencido&&h.tipo!=='anticipo'?` <small style="color:var(--z-red)">${days(h.fecha,TODAY)}d</small>`:''}</td>
        <td class="r"><b>US$ ${fmtUSDs(h.pend)}</b></td>
      </tr>`).join('')}
      </tbody></table>`:'<div class="ec-empty">Sin necesidades de pago activas. Todos los equipos están al día o aún no tienen precio de venta cargado.</div>'}
    </div>`:''}

    ${(interno && otrosTotal>0.5)?`
    <div class="ec-block otros-comp">
      <div class="ec-block-h">
        <span class="ec-block-t">Otros componentes · sub-cuenta fuera de Sinosure</span>
        <small>Compras a proveedores externos (Jingwei, Restar, HCC…) que no cubre el cupo. Se pagan de inmediato al montar el pedido, con cargo al anticipo del 10% del tracker.</small>
      </div>
      <div class="oc-alert">
        <div class="oc-alert-ic">⚠</div>
        <div class="oc-alert-tx">Este cliente tiene <b>US$ ${fmtUSDs(otrosTotal)}</b> pendiente con proveedores externos en ${eqsOtros.length} tracker(s). Mientras esto no se pague, el anticipo de esos trackers no está realmente cubierto.</div>
      </div>
      <table class="ec-tabla"><thead><tr>
        <th class="l">Proveedor</th><th class="l">Trackers</th><th class="r">Saldo pendiente USD</th>
      </tr></thead><tbody>
      ${Object.keys(otrosPorProv).sort((a,b)=>otrosPorProv[b].total-otrosPorProv[a].total).map(nombre=>{
        const p=otrosPorProv[nombre];
        return `<tr>
          <td class="l"><b>${nombre}</b></td>
          <td class="l" style="font-size:12px;color:var(--ink2)">${p.eq.map(x=>x.d).join(', ')}</td>
          <td class="r"><b>US$ ${fmtUSDs(p.total)}</b></td>
        </tr>`;
      }).join('')}
      <tr class="oc-tot"><td class="l"><b>Total otros componentes</b></td><td></td><td class="r"><b>US$ ${fmtUSDs(otrosTotal)}</b></td></tr>
      </tbody></table>
    </div>`:''}

    ${rows.length?`
    <div class="ec-block">
      <div class="ec-block-h"><span class="ec-block-t">Facturas emitidas</span><small>${rows.length} factura(s) cargadas a este cliente</small></div>
      ${rows.map(f=>{
        const lineas=(f.lineas||[]).map(l=>`<tr class="lin ${l.pass?'pass':''}"><td class="l">${l.desc}${l.pass?' <span class="pill-pass">pass-through</span>':''}</td><td class="r">US$ ${fmtUSDs(l.usd)}</td></tr>`).join('');
        const hitos=(f.hitosR||[]).map(hh=>{const done=hh.pend<=0.01;const late=!done&&hh.fecha&&hh.fecha<TODAY;
          return `<tr class="${done?'done':''} ${late?'late':''}"><td class="l">${hh.etiq}<small>${hh.pct}% · ${hh.desc||''}</small></td><td class="r">US$ ${fmtUSDs(hh.monto)}</td><td class="c">${hh.fecha?fmtD(hh.fecha):'—'}</td><td class="r">${done?'<b class="ok">pagado</b>':'US$ '+fmtUSDs(hh.pend)+(late?` <small style="color:var(--z-red)">${days(hh.fecha,TODAY)}d</small>`:'')}</td></tr>`;}).join('');
        const eqR=(f.eqRefs||[]).map(d=>{const e=EQ.find(x=>x.derrame===d);return e?`${e.proj} <small>${d}</small>`:d;}).join(' · ')||'<span style="color:var(--z-red)">sin vincular</span>';
        return `<div class="ec-fac">
          <div class="ec-fac-h"><div class="ec-fac-num">Factura ${f.num}</div><div class="ec-fac-meta">${fmtD(f.fecha)} · plazo ${f.plazo}d · TRM ${f.trmRef}</div><div class="ec-fac-tot">US$ ${fmtUSDs(f.total)}<small>saldo US$ ${fmtUSDs(f.saldo)}</small></div></div>
          <div class="ec-fac-eq">Vinculada a: <b>${eqR}</b></div>
          <div class="ec-fac-cols">
            <div class="ec-fac-col"><div class="ec-fac-t">Líneas</div><table class="ec-mini"><tbody>${lineas}<tr class="tot"><td class="l">Total factura</td><td class="r">US$ ${fmtUSDs(f.total)}</td></tr></tbody></table></div>
            <div class="ec-fac-col"><div class="ec-fac-t">Cronograma de cobro</div><table class="ec-mini"><thead><tr><th class="l">Hito</th><th class="r">Monto</th><th class="c">Fecha</th><th class="r">Saldo</th></tr></thead><tbody>${hitos}</tbody></table></div>
          </div>
        </div>`;}).join('')}
    </div>`:''}

    ${(!interno && eqSinFac.length)?`
    <div class="ec-block estimado">
      <div class="ec-block-h"><span class="ec-block-t">Estimado · pendiente facturar</span><small>Precio de venta acordado + logística estimada. Este monto NO cuenta en el pago mínimo hasta que se cargue la factura formal.</small></div>
      <table class="ec-tabla"><thead><tr><th class="l">Equipo</th><th class="l">Estado</th><th class="r">Precio venta</th><th class="r">Flete</th><th class="r">Cobertura</th><th class="r">Total estimado</th></tr></thead><tbody>
      ${eqSinFac.map(e=>{const pv=+e.precioVenta||0, fl=+e.logisticaFlete||0, cv=+e.logisticaCobertura||0, tot=pv+fl+cv;
        return `<tr class="est"><td class="l"><b>${e.derrame||'—'}</b><small>${e.proj}</small></td><td class="l">${STAGE[e.st]}<small>${e.mfg}</small></td><td class="r">${pv>0?'US$ '+fmtUSDs(pv):'<span class="ec-need">definir</span>'}</td><td class="r">${fl>0?'US$ '+fmtUSDs(fl):'—'}</td><td class="r">${cv>0?'US$ '+fmtUSDs(cv):'—'}</td><td class="r"><b>${tot>0?'US$ '+fmtUSDs(tot):'—'}</b></td></tr>`;}).join('')}
      </tbody></table>
      <div class="ec-est-cta">Estos valores son provisionales. Al cargar la factura formal, el estimado se reemplaza con el monto real y se muestra el delta.</div>
    </div>`:''}
  `;
}


</script>
